          python3 tools/validate_deda_makani_100337.py
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/deda_place_engagement_bar.dart
          flutter test test/deda_place_engagement_bar_test.dart test/deda_makani_100337_test.dart
