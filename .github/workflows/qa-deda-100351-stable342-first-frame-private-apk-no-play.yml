          assert len(matches)==1, 'SAFE_STOP: original signed Play bundle build command missing or duplicated'
          original=lines[matches[0]]
          apk_command=original.replace('flutter build appbundle --release --build-number=100340 ',
              'flutter build apk --release --build-number=100351 ',1)
          assert apk_command.count('DEDA_SERVER_AUTOMATIONS_LIVE=false')==1
          assert apk_command.count('DEDA_OWNER_PLACE_LOGO_UPLOADS_LIVE=false')==1
          lines[matches[0]] = (
              'python3 tools/stage_deda_royal_hero_2026_10_17.py && '
              'python3 tools/stage_deda_royal_avatars_step1_2026_10_17.py && '
              'python3 tools/stage_deda_point7_compact_ids_100342.py && '
              'python3 tools/stage_deda_100351_startup_rescue.py && '
              'dart format lib/main.dart && '
              'flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart && '
              'flutter test test/deda_royal_avatar_choice_100341_test.dart test/deda_profile_visible_diamonds_test.dart test/deda_point7_compact_ids_100342_test.dart test/deda_100351_startup_rescue_test.dart && '
              'grep -q DEDA_ROYAL_PROFILE_HERO_LAYOUT_ONLY_2026_10_17 lib/main.dart && '
              'grep -q DEDA_ROYAL_THREE_AVATARS_STEP1_2026_10_17 lib/main.dart && '
              + apk_command + ' || { echo "SAFE_STOP: royal avatar test or private APK build failed" >&2; exit 1; }'
          )
          f.write_text('\n'.join(lines)+'\n')
          assert 'flutter build appbundle --release --build-number=100340 ' not in f.read_text()
          print('SAFE: private signed APK only, same accepted defines, no Play or Firebase deployment')
          PRIVATE_PROFILE_QA
