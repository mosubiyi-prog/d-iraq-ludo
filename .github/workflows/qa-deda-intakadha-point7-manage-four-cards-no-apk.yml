name: DEDA «إنت كدها» Point 7 - Four cards in Manage identifiers - NO APK
on:
  push:
    branches:
      - deda-intakadha-ids-cards-stage1-2026-10-18
    paths:
      - '.github/workflows/qa-deda-intakadha-point7-manage-four-cards-no-apk.yml'
      - 'tools/stage_deda_intakadha_point7_four_cards_id_management_2026_10_18.py'
      - 'test/test_deda_intakadha_point7_four_card_management_2026_10_18.py'
      - 'test/deda_intakadha_point7_four_id_cards_widget_test.dart'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-intakadha-point7-no-apk
  cancel-in-progress: true
jobs:
  source-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure 100356 phone-verified baseline and no unauthorized files changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin backup-deda-100356-phone-ui-verified-2026-10-18
          test "$(git rev-parse origin/backup-deda-100356-phone-ui-verified-2026-10-18)" = "4373b8b30eadc5a284554ca7c021c350e0732caf"
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(
            ["git","diff","--name-only","4373b8b30eadc5a284554ca7c021c350e0732caf","HEAD"],
            text=True).splitlines())
          known={f"tools/stage_deda_intakadha_point{i}_{name}_2026_10_18.py"
                 for i,name in [
                   (2,"remove_member"),(3,"name_level_layout"),(4,"rectangular_id_geometry"),
                   (5,"four_premium_id_artworks"),(6,"profile_id_slot"),(7,"four_cards_id_management")]}
          known.update({
            "docs/DEDA_INTAKADHA_16_POINTS_STAGE1_CHECKPOINT_2026-10-18.md",
            "test/test_deda_intakadha_point2_member_caption_2026_10_18.py",
            "test/test_deda_intakadha_point3_name_level_layout_2026_10_18.py",
            "test/test_deda_intakadha_point4_rectangular_id_geometry_2026_10_18.py",
            "test/test_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py",
            "test/test_deda_intakadha_point6_profile_id_slot_2026_10_18.py",
            "test/test_deda_intakadha_point7_four_card_management_2026_10_18.py",
            "test/deda_intakadha_point5_visual_widget_test.dart",
            "test/deda_intakadha_point6_profile_slot_widget_test.dart",
            "test/deda_intakadha_point7_four_id_cards_widget_test.dart",
          })
          known.update({
            f".github/workflows/qa-deda-intakadha-point{i}-{name}-no-apk.yml"
            for i,name in [
              (5,"four-id-artworks"),(6,"profile-slot"),(7,"manage-four-cards")]}
          )
          known.update({
            ".github/workflows/qa-deda-intakadha-point2-caption-source-only-no-apk.yml",
            ".github/workflows/qa-deda-intakadha-point3-name-level-source-only-no-apk.yml",
            ".github/workflows/qa-deda-intakadha-point4-rectangular-id-source-only-no-apk.yml",
          })
          assert changed.issubset(known), f"SAFE_STOP unexpected files: {sorted(changed-known)}"
          assert not any(n.startswith(("lib/","assets/","android/","functions/","firestore")) for n in changed)
          print("PASS: 100356 unmodified; no actual user account, Play or wallet source edits")
          PY
      - name: Verify previous points plus exact locked manager and four preview cards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/stage_deda_intakadha_point7_four_cards_id_management_2026_10_18.py test/test_deda_intakadha_point7_four_card_management_2026_10_18.py
          for i in 2 3 4 5 6 7; do
            case "$i" in
              2) testfile=test_deda_intakadha_point2_member_caption_2026_10_18.py ;;
              3) testfile=test_deda_intakadha_point3_name_level_layout_2026_10_18.py ;;
              4) testfile=test_deda_intakadha_point4_rectangular_id_geometry_2026_10_18.py ;;
              5) testfile=test_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py ;;
              6) testfile=test_deda_intakadha_point6_profile_id_slot_2026_10_18.py ;;
              7) testfile=test_deda_intakadha_point7_four_card_management_2026_10_18.py ;;
            esac
            python3 -m unittest discover -s test -p "$testfile" -v
          done
          echo "PASS: preview-only stage, 5,000-diamond price shown, no purchase, no unowned use"
  flutter-preview:
    needs: source-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter-test four 50dp ID previews with verified-only use in throwaway app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deda-intakadha-p7/lib" "$RUNNER_TEMP/deda-intakadha-p7/test"
          python3 - "$RUNNER_TEMP/deda-intakadha-p7/lib/deda_id_point7_card_management_fixture.dart" <<'PY'
          import ast
          from pathlib import Path
          import sys
          sources=(
            ("tools/stage_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py", "ARTWORK"),
            ("tools/stage_deda_intakadha_point7_four_cards_id_management_2026_10_18.py", "WIDGET"),
          )
          blocks=[]
          for filename,name in sources:
            tree=ast.parse(Path(filename).read_text(encoding="utf-8"))
            expressions=[n.value.value for n in tree.body if isinstance(n,ast.Assign)
                   and isinstance(n.value,ast.Constant) and
                   any(isinstance(t,ast.Name) and t.id==name for t in n.targets)]
            assert len(expressions)==1, "SAFE_STOP approved stage source changed"
            blocks.append(expressions[0])
          Path(sys.argv[1]).write_text(
            "import 'package:flutter/material.dart';\n"
            "String dedaText(String ar, String en) => ar;\n"
            + "\n".join(blocks), encoding="utf-8")
          print("PASS: only presentational code extracted; no app or backend")
          PY
          cp test/deda_intakadha_point7_four_id_cards_widget_test.dart "$RUNNER_TEMP/deda-intakadha-p7/test/"
          cat > "$RUNNER_TEMP/deda-intakadha-p7/pubspec.yaml" <<'YAML'
          name: deda_intakadha_point7_fixture
          description: Isolated 4 DEDA ID card previews and ownership-gated buttons
          version: 0.0.1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
          YAML
          cd "$RUNNER_TEMP/deda-intakadha-p7"
          dart format lib/deda_id_point7_card_management_fixture.dart test/deda_intakadha_point7_four_id_cards_widget_test.dart
          flutter pub get
          flutter test test/deda_intakadha_point7_four_id_cards_widget_test.dart --reporter expanded
          echo "PASS: all cards dynamically display ID; preview safe; only verified owned can use"
          echo "PASS: no APK generated, no Firebase deployment, no diamond deduction"
