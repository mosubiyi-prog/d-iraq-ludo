jobs:
  actual-source-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test exact current Flutter sources, reject drift and forbidden repository edits
        run: python3 -m unittest discover -s test -p test_deda_stability_stage1_bind_2026_11_21.py -v
      - name: Verify Stage2 DEDA Settings/Google/Admin source integration without repository mutation
        run: python3 -m unittest discover -s test -p test_deda_stage2_source_wiring_2026_11_21.py -v
      - name: Verify original profile owner fence binder without new store or UID
        run: python3 -m unittest discover -s test -p test_deda_stage2_profile_owner_2026_11_23.py -v
      - name: Verify profile frames, IDs, balances, badges and Hadaya account rotation without writes
        run: python3 -m unittest discover -s test -p test_deda_stage2_profile_assets_2026_11_24.py -v
      - name: Verify complete original profile card, route and duplicate-safety audit
        run: python3 -m unittest discover -s test -p test_deda_stage2_profile_full_audit_2026_11_24.py -v
      - name: Protect 13 paid and 3 free frame labels, owner IDs, balances and six level badges
        run: python3 -m unittest discover -s test -p test_deda_stage2_profile_entitlement_parity_2026_11_24.py -v
      - name: Protect six original profile colors, royal backgrounds, frames and owner avatar hashes
        run: python3 -m unittest discover -s test -p test_deda_stage2_profile_visual_parity_2026_11_24.py -v
      - name: Verify original friends keys, readers and UI source guards
        run: python3 -m unittest discover -s test -p test_deda_stage2_friends_2026_11_24.py -v
      - name: Verify weekly source owner, clock, ranking and prize readers
        run: python3 -m unittest discover -s test -p test_deda_stage2_weekly_league_2026_11_24.py -v
      - name: Verify original tasks, quiz, ledger and friend signal source
        run: python3 -m unittest discover -s test -p test_deda_stage2_tasks_quiz_2026_11_24.py -v
      - name: Verify original home source routes and visual parity
        run: python3 -m unittest discover -s test -p test_deda_stage2_home_2026_11_24.py -v
      - name: Verify original five bottom destinations and gift badge lifecycle
        run: python3 -m unittest discover -s test -p test_deda_stage2_bottom_navigation_2026_11_24.py -v
      - name: Verify protected settings and original preference keys
        run: python3 -m unittest discover -s test -p test_deda_stage2_settings_2026_11_24.py -v
      - name: Verify map foundation and inventory of all five protected parts
        run: python3 -m unittest discover -s test -p test_deda_stage2_map_foundation_2026_11_24.py -v
      - name: Ensure no production access, no Flutter APK or deploy in source binder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('tools/app_stability/app_package/bind_stable_single_session_stage1_2026_11_21.py').read_text()
          for unsafe in ('firebase_admin', 'serviceAccountKey', 'firebase deploy',
                         'createCustomToken', 'deleteUser(', 'updateUser('):
              assert unsafe not in src, unsafe
          assert 'STAGE1_DO_NOT_MODIFY_REPOSITORY' in src
          assert 'STAGE1_SOURCE_GUARDS_BOUND_NO_FIREBASE_WRITE' in src
          print('PASS_SOURCE_ONLY_NO_FIREBASE_AUTH_RULES_OR_PLAY_CHANGES')
          PY
