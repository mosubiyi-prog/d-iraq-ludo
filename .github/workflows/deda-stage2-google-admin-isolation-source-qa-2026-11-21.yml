name: DEDA Dust Removal Stage2 Google UID and Isolated Admin Full App QA NO DEPLOY
on:
  push:
    branches:
      - deda-100451-owner-admin-session-safe-repair-2026-11-20
    paths:
      - 'tools/app_stability/app_package/bind_stable_single_session_stage1_2026_11_21.py'
      - 'test/test_deda_stability_stage1_bind_2026_11_21.py'
      - 'tools/app_stability/app_package/bind_stage2_google_admin_isolation_2026_11_21.py'
      - 'lib/deda_stable_google_login_2026_11_21.dart'
      - 'lib/deda_stage2_google_access_card_2026_11_21.dart'
      - 'lib/deda_stage2_isolated_admin_identity_2026_11_21.dart'
      - 'lib/deda_stage2_isolated_admin_dashboard_2026_11_21.dart'
      - 'lib/deda_stage2_isolated_exclusive_ids_admin_2026_11_23.dart'
      - 'lib/deda_stage2_isolated_league_admin_2026_11_23.dart'
      - 'test/deda_stage2_google_and_admin_isolation_policy_test.dart'
      - 'test/test_deda_stage2_source_wiring_2026_11_21.py'
      - '.github/workflows/deda-stage2-google-admin-isolation-source-qa-2026-11-21.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-stage2-single-login-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-source-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test exact current Flutter sources, reject drift and forbidden repository edits
        run: python3 -m unittest discover -s test -p test_deda_stability_stage1_bind_2026_11_21.py -v
      - name: Verify Stage2 DEDA Settings/Google/Admin source integration without repository mutation
        run: python3 -m unittest discover -s test -p test_deda_stage2_source_wiring_2026_11_21.py -v
      - name: Ensure no production access, no Flutter APK or deploy in source binder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('tools/app_stability/app_package/bind_stable_single_session_stage1_2026_11_21.py').read_text()
          for unsafe in ('firebase_admin', 'serviceAccountKey', 'firebase deploy',
                         'createCustomToken', 'deleteUser(', 'updateUser('):
              assert unsafe not in src, unsafe
          assert 'STAGE1_DO_NOT_MODIFY_REPOSITORY' in src
          assert 'STAGE1_SOURCE_GUARDS_BOUND_NO_FIREBASE_WRITE' in src
          print('PASS_SOURCE_ONLY_NO_FIREBASE_AUTH_RULES_OR_PLAY_CHANGES')
          PY
  assembled-full-app-source:
    needs: actual-source-safety
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
      - name: Reconstruct the complete protected DEDA app from existing branch recipe
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/deda-stage1-complete-source"
          flutter create --platforms=android --org com.diraq.ludo --project-name d_iraq_ludo "$project"
          python3 tools/app_stability/app_package/prepare.py "$project" --variant candidate
          for script in \
            bind_weekly_stage13.py \
            bind_active_id_boot_prewarm_stage14.py \
            bind_active_id_measured_startup_stage16.py \
            bind_weekly_private_trial_stage17.py \
            bind_weekly_full_qa_stage18.py \
            verify_rank_card_tap_stage19.py \
            bind_weekly_admin_league_stage27.py \
            bind_weekly_tasks_cta_stage28.py \
            bind_weekly_100397_owner_real_scores.py \
            bind_weekly_100398_after_level_xp.py \
            bind_weekly_100399_community_bridge.py \
            bind_weekly_100400_safe_score_retry.py \
            bind_weekly_100402_firestore_direct.py \
            bind_weekly_100403_first_open_gate.py \
            bind_weekly_100404_inline_clock_and_freeze.py \
            bind_weekly_100405_admin_live_read_only.py \
            bind_weekly_100406_league_display_fixes.py \
            bind_weekly_100407_full_avatar_shared_identity.py \
            bind_weekly_100408_seven_owner_points.py \
            bind_weekly_100409_single_verified_identity.py \
            bind_weekly_100410_unified_active_id.py \
            bind_weekly_100411_friend_copy_share.py \
            bind_weekly_100413_owner_id_admin_response.py \
            bind_weekly_100414_last_three.py \
            bind_weekly_100418_legacy340_friend_active_compat.py; do
            python3 "tools/app_stability/app_package/$script" "$project"
          done
          python3 tools/app_stability/app_package/guard_100436_parity_before_recovery.py "$project"
          shopt -s nullglob
          count=0
          for source in "$GITHUB_WORKSPACE"/lib/deda_step2_*.dart "$GITHUB_WORKSPACE"/lib/deda_100429*.dart "$GITHUB_WORKSPACE"/lib/deda_100430*.dart "$GITHUB_WORKSPACE"/lib/deda_100431*.dart "$GITHUB_WORKSPACE"/lib/deda_100432*.dart "$GITHUB_WORKSPACE"/lib/deda_100433*.dart; do
            target="$project/lib/$(basename "$source")"
            test ! -e "$target" || { echo "BLOCK_SOURCE_OVERWRITE:$target"; exit 1; }
            cp "$source" "$target"
            count=$((count+1))
          done
          test "$count" -ge 30
          python3 tools/app_stability/app_package/guard_100436_parity_before_recovery.py "$project" --staged-recovery
          python3 tools/app_stability/app_package/merge_stage2_into_protected_100436.py "$project"
          python3 tools/app_stability/app_package/merge_stage2_into_protected_100436.py "$project" --verify-only
          for script in bind_admin_league_winners_prizes_100439.py bind_smart_second_stage_account_100439.py bind_gm_compensation_100m_100439.py bind_session_rescue_stage3_100441.py bind_session_rescue_friends_retry_100441.py bind_session_missing_owner_entry_100441.py bind_point2_section_session_guards_2026_11_17.py bind_unified_room_runtime_readonly_2026_11_17.py; do
            python3 "tools/app_stability/app_package/$script" "$project"
          done
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'deda-stage1-complete-source'
          specs={
            'lib/deda_backend.dart':[
              ('public', 'static Future<User> _ensurePublicUser()'),
              ('owner', 'static Future<User> _ensureOwnerSessionForAccountKey('),
              ('admin-login', 'static Future<bool> signInAdmin({'),
              ('admin-logout', 'static Future<void> signOutAdmin() async {')],
            'lib/deda_pin_auth.dart':[
              ('anonymous-helper', 'static Future<User> _ensureAnonymousSession(')],
          }
          for file, targets in specs.items():
              body=(root/file).read_text()
              for label, marker in targets:
                  at=body.find(marker)
                  print('STAGE1_REVIEW_BEGIN',file,label,'found='+str(at >= 0))
                  if at >= 0: print(body[at:at+6500])
                  print('STAGE1_REVIEW_END',file,label)
          PY
          python3 tools/app_stability/app_package/bind_stable_single_session_stage1_2026_11_21.py "$project"
          python3 tools/app_stability/app_package/bind_stable_single_session_stage1_2026_11_21.py "$project" --verify-only
          python3 tools/app_stability/app_package/bind_stage2_google_admin_isolation_2026_11_21.py "$project"
          python3 tools/app_stability/app_package/bind_stage2_google_admin_isolation_2026_11_21.py "$project" --verify-only
          echo "DEDA_STAGE1_SOURCE=$project" >> "$GITHUB_ENV"
          echo 'PASS_PROTECTED_FULL_APPLICATION_SOURCE_SESSION_PATCH_APPLIED'
      - name: Analyze real assembled Flutter backend, entry, admin, map and PIN paths
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEDA_STAGE1_SOURCE"
          flutter pub get
          flutter test --no-pub --reporter expanded test/deda_stage2_google_and_admin_isolation_policy_test.dart
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings \
            lib/main.dart lib/deda_backend.dart lib/deda_pin_auth.dart \
            lib/admin_pages.dart lib/places_service.dart lib/admin_place_map.dart \
            lib/deda_stable_google_login_2026_11_21.dart \
            lib/deda_stage2_google_access_card_2026_11_21.dart \
            lib/deda_stage2_isolated_admin_identity_2026_11_21.dart \
            lib/deda_stage2_isolated_admin_dashboard_2026_11_21.dart \
            lib/deda_stage2_isolated_exclusive_ids_admin_2026_11_23.dart \
            lib/deda_stage2_isolated_league_admin_2026_11_23.dart \
            lib/deda_stage2_isolated_tasks_admin_2026_11_23.dart \
            lib/deda_100431_linked_owner_session_policy.dart
          python3 - <<'PY'
          from pathlib import Path
          backend=Path('lib/deda_backend.dart').read_text()
          pin=Path('lib/deda_pin_auth.dart').read_text()
          home=Path('lib/main.dart').read_text()
          assert 'deda-stability-explicit-auth-entry-no-new-uid' in backend
          assert 'deda-stability-admin-isolated-auth-required' in backend
          assert 'deda-stability-original-login-no-anonymous-uid' in pin
          assert 'DedaAdminDashboardPage' in Path('lib/admin_pages.dart').read_text()
          assert 'DedaMapStyle' in home
          assert 'deda_share_ids' in backend
          assert "DedaStage2GoogleAccessCard(" in home
          assert "onFreshGoogleIdentity: _onStage2FreshGoogleIdentity" in home
          assert "_dedaStage2LoadPreferencesWithGoogleFence" in home
          assert "DedaPreferences.suspendLegacyLiveSessionForGoogle()" in home
          assert "DedaIsolatedAdminIdentity" in Path("lib/deda_stage2_isolated_admin_identity_2026_11_21.dart").read_text()
          assert "DedaStage2IsolatedDashboardPage(" in Path("lib/admin_pages.dart").read_text()
          assert "if (dedaIsolatedAdminIdentityEnabled)" in Path("lib/admin_pages.dart").read_text()
          print('PASS_FULL_ASSEMBLY_MAP_AND_ADMIN_SOURCE_RETAINED_STAGE2_GOOGLE_ADMIN_ISOLATED')
          print('NOT_PHONE_TESTED_STAGE2_GOOGLE_AND_ADMIN_DASHBOARD_NOT_ACTIVATED_NO_APK_NO_PLAY')
          PY
      - name: No Firebase or app deployment, no signing, no final APK
        if: always()
        run: |
          echo 'NO_FIREBASE_PRODUCTION_MODIFICATIONS_NO_APP_DISTRIBUTION'
          test ! -e "$RUNNER_TEMP/deda-stage1-complete-source/build/app/outputs/flutter-apk/app-release.apk"
