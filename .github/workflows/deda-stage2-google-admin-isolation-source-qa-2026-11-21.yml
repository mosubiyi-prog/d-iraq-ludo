      - name: Bind phase 01 hold into the complete assembled DEDA entry and compile isolated debug QA
        env:
          LAB_CONFIG: ${{ secrets.DEDA_STAGE01_LAB_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/app_stability/app_package/stage01_lab_bind_full_2026_11_25.py "$DEDA_STAGE1_SOURCE"
          unset LAB_CONFIG
          cd "$DEDA_STAGE1_SOURCE"
          flutter_bin="$(command -v flutter)"
          sudo -n unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec setpriv --reuid "$1" --regid "$2" --init-groups env -i HOME="$3" PATH="$4" PUB_CACHE="$5" CI=true "$6" test --no-pub --reporter expanded test/deda_stage01_full_entry_hold_test.dart
          ' _ "$(id -u)" "$(id -g)" "$HOME" "$PATH" "${PUB_CACHE:-$HOME/.pub-cache}" "$flutter_bin"
          flutter build apk --debug --no-pub
          apk=build/app/outputs/flutter-apk/app-debug.apk
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          analyzer="$(find "$sdk/cmdline-tools" -type f -name apkanalyzer | head -n 1)"
          test -x "$analyzer"
          "$analyzer" manifest print "$apk" > "$RUNNER_TEMP/stage01-full-final-manifest.xml"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=ET.parse(Path(os.environ['RUNNER_TEMP'])/'stage01-full-final-manifest.xml').getroot()
          ns='{http://schemas.android.com/apk/res/android}'
          assert root.get('package') == 'com.deda.qa.uiddevice'
          assert root.find('application').get(ns+'allowBackup') == 'false'
          for node in root.iter():
              name=node.get(ns+'name','')
              if node.tag.startswith('uses-permission'):
                  assert name not in ('android.permission.INTERNET','android.permission.ACCESS_NETWORK_STATE'), name
              if node.tag == 'provider':
                  assert name != 'com.google.firebase.provider.FirebaseInitProvider', name
          print('PASS_FULL_DEDA_PHASE01_PACKAGED_NETWORK_AND_NATIVE_INIT_HOLD')
          PY
          rm -f "$apk"
          echo 'NO_DEVICE_LAUNCH_NO_AUTH_NO_APK_DELIVERY'
