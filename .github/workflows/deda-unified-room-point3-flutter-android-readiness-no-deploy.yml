name: DEDA Point3 Flutter + Android Phone Readiness (QA ONLY NO APK)
on:
  push:
    branches:
      - deda-unified-room-point3-android-runtime-readiness-qa-2026-11-17
    paths:
      - 'qa/unified_room_private/**'
      - '.github/workflows/deda-unified-room-point3-flutter-android-readiness-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-real-source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Protect app UI, Auth, Firebase rules and Play build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess
          baseline='fd8cfd590d0f6703e34d6fe8c6913b091c3468fd'
          files=subprocess.check_output(
            ['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines()
          assert files
          assert all(p.startswith('qa/unified_room_private/') or
            (p.startswith('.github/workflows/deda-unified_room-') and p.endswith('.yml')) or
            (p.startswith('.github/workflows/deda-unified-room-') and p.endswith('.yml'))
            for p in files), 'PROTECTED_APP_CHANGE_DETECTED'
          assert all(pathlib.Path(p).exists() for p in files)
          print('PASS_SOURCE_FIREBASE_PLAY_UNMODIFIED')
          PY
      - name: Reality gate — must not mislabel QA-only gateway as phone-ready
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main.dart').read_text()
          server=Path('functions/index.js').read_text()
          qa=Path('qa/unified_room_private/room_admin_firestore_gateway_EMULATOR_ONLY.cjs').read_text()
          proof=Path('qa/unified_room_private/room_owner_atomic_challenge_EMULATOR_ONLY.cjs').read_text()
          assert 'makeEmulatorGateway' in qa
          assert 'makeAtomicOwnerChallenge' in proof
          assert 'QA_SAFE_STOP_EMULATOR_ONLY' in proof
          assert 'room_admin_firestore_gateway_EMULATOR_ONLY' not in server
          assert 'room_owner_atomic_challenge_EMULATOR_ONLY' not in server
          assert 'deda_unified_room_private_views' not in main
          assert 'deda_unified_room_read_grants' not in main
          print('PASS_LAB_GATEWAY_ISOLATED_FROM_USER_APP_AND_PRODUCTION')
          print('ANDROID_PHONE_RESTORATION_GATE=HOLD_NOT_WIRED_IN_REAL_APP')
          print('SAFE_NO_APK_NO_LIVE_AUTH_NO_PRODUCTION_OWNER_GRANT')
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.7', channel: stable, cache: false}
      - name: Recover SHA-locked pre-existing Flutter QA gateway (runner-only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deda-flutter-room-qa"
          base64 --decode qa/unified_room_private/qa_suite_2026-11-16.tgz.b64 >"$RUNNER_TEMP/deda-room-qa.tgz"
          echo "1c99e9b848b02dd62d09a332eb258412ddcebd87111e5ae7ba6ce3e4ede8f68a  $RUNNER_TEMP/deda-room-qa.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deda-room-qa.tgz" -C "$RUNNER_TEMP/deda-flutter-room-qa"
          cp "$RUNNER_TEMP"/deda-flutter-room-qa/dart_candidate/*.dart lib/
          cp "$RUNNER_TEMP"/deda-flutter-room-qa/test/*.dart test/
          echo "PASS_SHA_PINNED_FLUTTER_SOURCE_IMPORTED_IN_CI_TEMP_ONLY"
      - name: Fetch Flutter packages without committing changes
        run: flutter pub get
      - name: Analyze Flutter room port and owner/session source
        shell: bash
        run: |
          set -euo pipefail
          dart analyze --no-fatal-warnings \
            lib/deda_unified_room_flutter_gateway_PRIVATE_QA.dart \
            lib/deda_unified_room_flutter_firestore_ports_PRIVATE_QA.dart \
            test/deda_unified_room_flutter_private_qa_test.dart \
            lib/deda_100431_linked_owner_session_policy.dart \
            lib/deda_step2_level_points_restore.dart \
            lib/deda_step2_original_backup_readback.dart
          echo "PASS_ROOM_FLUTTER_AND_LEGACY_PROGRESS_SOURCE_ANALYSIS"
      - name: Run fake Flutter room gateway, actual DEDA UID/session and progress regressions
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub -r expanded \
            --dart-define=DEDA_UNIFIED_ROOM_PRIVATE_QA=true \
            --dart-define=DEDA_STABILITY_AUTH_RUNTIME=true \
            test/deda_unified_room_flutter_private_qa_test.dart \
            test/deda_owner_login_commit_guard_private_test.dart \
            test/deda_owner_session_compat_private_test.dart \
            test/deda_step2_completion_gate_private_test.dart \
            test/deda_step2_account_domains_recovery_private_test.dart \
            test/deda_step2_assets_recovery_scoped_private_test.dart \
            test/deda_step2_recovery_guardian_private_test.dart
          echo "PASS_REAL_FLUTTER_QA_REGRESSIONS_NO_PHONE_CLAIM"
      - name: Confirm no APK or device test was performed
        run: |
          echo 'POINT3_FLUTTER_QA_CHECK_COMPLETE'
          echo 'REAL_ANDROID_PHONE_TEST=NOT_RUN_NOT_READY'
          echo 'NO_DEPLOY_NO_APK_NO_PLAY_NO_USER_ACCOUNT_MODIFICATION'
