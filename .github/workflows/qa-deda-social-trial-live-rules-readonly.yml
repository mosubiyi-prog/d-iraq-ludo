name: DEDA Social 100326 Read-Only Live Firebase Rules Diff - NO DEPLOY

on:
  push:
    branches:
      - deda-trial-live-scheduling-100326-2026-10-09
    paths:
      - '.github/workflows/qa-deda-social-trial-live-rules-readonly.yml'

permissions:
  contents: read

jobs:
  inspect-live-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google API read-only dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Read Firebase currently released rules without mutation
        env:
          FIREBASE_SERVICE_ACCOUNT_DEDA_25B88: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          raw=os.environ.get('FIREBASE_SERVICE_ACCOUNT_DEDA_25B88') or os.environ.get('FIREBASE_SERVICE_ACCOUNT')
          if not raw:
              sys.exit('READ_ONLY_BLOCKED: missing Firebase account secret')
          cred=service_account.Credentials.from_service_account_info(
              json.loads(raw),scopes=['https://www.googleapis.com/auth/cloud-platform'])
          session=AuthorizedSession(cred)
          root='https://firebaserules.googleapis.com/v1/'
          release=session.get(root+'projects/deda-25b88/releases/cloud.firestore',timeout=35)
          release.raise_for_status()
          rule_name=release.json().get('rulesetName','')
          assert rule_name.startswith('projects/deda-25b88/rulesets/')
          response=session.get(root+rule_name,timeout=35)
          response.raise_for_status()
          files=response.json().get('source',{}).get('files',[])
          live='\n'.join(f.get('content','') for f in files if f.get('name','').endswith('.rules'))
          candidate=Path('firestore.rules').read_text()
          assert live and 'rules_version' in live and 'rules_version' in candidate
          digest=lambda s: hashlib.sha256(s.encode()).hexdigest()[:18]
          print('READ_ONLY_CURRENT_LIVE_SHA',digest(live))
          print('READ_ONLY_REPO_CANDIDATE_SHA',digest(candidate))
          print('EXACT_MATCH',live==candidate)
          print('LIVE_HAS_SOCIAL_RULES','match /deda_social_task_public/' in live)
          print('LIVE_HAS_DAILY_PUBLISHED','match /deda_daily_published_task_slots/' in live)
          print('NEEDS_DIFF_MERGE_BEFORE_DEPLOY',live!=candidate)
          print('NO_DEPLOY: reading current released rules, not updating Firestore.')
          PY
