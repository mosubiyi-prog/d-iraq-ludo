name: DEDA 100427 OWNER-VERIFIED Legacy PIN Session Guard (MANUAL RULES ONLY)
on:
  workflow_dispatch:
    inputs:
      owner_approval_phrase:
        description: "Type exact owner-approved release phrase after real-device QA"
        required: true
        type: string
      tested_real_play_100340_pin:
        description: "Owner physically verified old Play 100340 login with number+PIN"
        required: true
        type: boolean
        default: false
      tested_real_new_phone_pin:
        description: "Owner physically verified account PIN on replacement handset"
        required: true
        type: boolean
        default: false
      understands_no_global_pin_rate_limit:
        description: "Acknowledges Firestore Rules alone do NOT impose global PIN attempts limit"
        required: true
        type: boolean
        default: false
      expected_published_rules_sha256:
        description: "Exactly matching SHA256 from current GET-only production release preflight"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deda-100427-production-firestore-auth-owner-confirmed
  cancel-in-progress: false
jobs:
  owner-reviewed-rules-only:
    if: >-
      ${{ github.ref == 'refs/heads/deda-100427-point1-login-firestore-reversible-release-private-qa-2026-11-01'
          && inputs.owner_approval_phrase == 'I_APPROVE_100427_PIN_ONLY_RULES_AFTER_REAL_DEVICE_QA'
          && inputs.tested_real_play_100340_pin
          && inputs.tested_real_new_phone_pin
          && inputs.understands_no_global_pin_rate_limit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DEDA_SA_PRIMARY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      DEDA_SA_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      DEDA_100427_OWNER_APPROVAL_PHRASE: ${{ inputs.owner_approval_phrase }}
      DEDA_100427_OWNER_REAL_100340_PIN_QA: 'YES'
      DEDA_100427_OWNER_NEW_PHONE_PIN_QA: 'YES'
      DEDA_100427_OWNER_AWARE_GLOBAL_PIN_RISK: 'YES'
      DEDA_100427_EXPECTED_LIVE_SHA: ${{ inputs.expected_published_rules_sha256 }}
      GCLOUD_PROJECT: demo-deda-100426-no-billing-qa
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Gate physical device approval, source SHA, and reversible exact-diff tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s test -p 'test_deda_100426_session_guard_diff.py' -v
          python3 -m unittest discover -s test -p 'test_deda_100427_login_release_gate.py' -v
          python3 -m pip install --quiet --disable-pip-version-check google-auth requests
          python3 tools/deda_100426_stage_live_session_guard_no_deploy.py
          echo "DEDA_100426_CANDIDATE_PATH=$RUNNER_TEMP/deda-100426-live-session-candidate.rules" >> "$GITHUB_ENV"
      - name: Retest 100340 model, correct PIN, copied install, logout and phone switch on ACTUAL live-based rules candidate
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions install --no-save --no-audit --no-fund \
            firebase@11.10.0 @firebase/rules-unit-testing@4 firebase-tools@14
          env -u DEDA_SA_PRIMARY -u DEDA_SA_FALLBACK \
            functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100426-no-billing-qa \
            --config "$RUNNER_TEMP/deda-100426-emulator.json" --only firestore \
            'node --test test/deda_100426_live_session_guard_emulator.test.cjs'
      - name: Retest unchanged 100408 league/prizes permissions on same candidate
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix tests/firestore-rules install --no-save --no-audit --no-fund \
            firebase@11.10.0 @firebase/rules-unit-testing@4
          env -u DEDA_SA_PRIMARY -u DEDA_SA_FALLBACK \
            DEDA_DIRECT_RULES_PATH="$DEDA_100426_CANDIDATE_PATH" \
            functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100426-no-billing-qa \
            --config "$RUNNER_TEMP/deda-100426-emulator.json" --only firestore \
            'node --test tests/firestore-rules/weekly-direct-manager-prizes-100408.test.mjs'
      - name: Publish ONLY one pre-reviewed session fallback rule with verified rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/deda_100427_login_guard_manual_release.py deploy
          python3 tools/deda_100427_login_guard_manual_release.py verify
      - name: Preserve old ruleset identifier / SHA as rollback evidence (NO credentials, user data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100427-MANUAL-LOGIN-RULES-ROLLBACK-PUBLIC-METADATA
          path: |
            ${{ runner.temp }}/deda-100427-rollback-metadata.json
            ${{ runner.temp }}/deda-100427-publish-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Scrub transient rules and secret-bearing files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/deda-100426-live-session-candidate.rules" \
            "$RUNNER_TEMP/deda-100426-emulator.json"
