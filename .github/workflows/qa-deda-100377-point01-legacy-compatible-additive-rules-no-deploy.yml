name: DEDA 100377 Point01 Legacy Shop Compatible Frames Emulator NO DEPLOY
on:
  push:
    branches:
      - deda-100377-13-points-sequential-qa-2026-10-22
    paths:
      - '.github/workflows/qa-deda-100377-point01-legacy-compatible-additive-rules-no-deploy.yml'
      - 'tools/deda_100377_point01_legacy_compatible_rules_NO_DEPLOY.py'
      - 'test/deda_100377_point01_legacy_compatible_checkout_emulator.test.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-point01-legacy-compat-no-deploy
  cancel-in-progress: true
jobs:
  readonly-real-policy-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DEDA_STAGE69_PRIMARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      DEDA_STAGE69_SECONDARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Protect owner APK, wallet, original purchases and signing
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet f4da0bfd52affaea8a4d45e2ac15498bc0cea280 -- \
            firestore.rules firebase.json functions/index.js storage.rules \
            android/ lib/main.dart lib/deda_backend.dart assets/ server_private/
          python3 -m py_compile tools/deda_100377_point01_legacy_compatible_rules_NO_DEPLOY.py
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo PASS_OWNER_APP_WALLET_SIGNING_UNTOUCHED
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Read published policy READ ONLY, retain legacy wallet clause unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 tools/deda_100377_point01_legacy_compatible_rules_NO_DEPLOY.py
          test -s /tmp/deda-point01-legacy-compatible.rules
          grep -q 'DEDA_100377_POINT01_LEGACY_SHOP_COMPATIBLE_NO_DEPLOY' \
            /tmp/deda-point01-legacy-compatible.rules
      - name: Install isolated Firestore test environment
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --no-save --no-audit --no-fund \
            firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Test original badge wallet, gift claim and 1000 frame checkout together
        shell: bash
        run: |
          set -euo pipefail
          export GCLOUD_PROJECT=demo-deda-100377-legacy-compatible
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100377-legacy-compatible --only firestore \
            'node --test test/deda_100377_point01_legacy_compatible_checkout_emulator.test.js'
          echo PASS_POINT01_LEGACY_BADGES_GIFTS_AND_ATOMIC_FRAME_1000_LOCAL_EMULATOR_ONLY
      - name: Verify ZERO publication, debit, APK, Play or live rule change
        shell: bash
        run: |
          set -euo pipefail
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          echo PASS_NO_DEPLOY_NO_LIVE_BALANCES_NO_PLAY_NO_FIREBASE_WRITE
