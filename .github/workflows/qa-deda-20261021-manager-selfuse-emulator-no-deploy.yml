name: DEDA QA32 Manager Direct Use and Gift Rules EMULATOR NO DEPLOY
on:
  push:
    branches:
      - deda-qa-32-batch1-no-deploy-2026-10-21
    paths:
      - '.github/workflows/qa-deda-20261021-manager-selfuse-emulator-no-deploy.yml'
      - 'tools/deda_stage71_free_admin200_live_rules_candidate_READONLY_NO_DEPLOY.py'
      - 'test/deda_stage74_hadaya_gift_receipt_account_security_emulator.test.js'
      - 'lib/deda_stage71_dual_admin_page.dart'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manager-free200-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      DEDA_STAGE71_PRIMARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      DEDA_STAGE71_SECONDARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prove original users, Firebase rules, Play and private encrypted IDs unaffected
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 2587f0cf260e1c9ca1768baa5ccad880fbb1d15c -- \
            firestore.rules firebase.json functions/index.js \
            lib/main.dart lib/deda_backend.dart android/ assets/ server_private/
          python3 -m py_compile tools/deda_stage71_free_admin200_live_rules_candidate_READONLY_NO_DEPLOY.py
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo PASS_NO_LIVE_FIREBASE_OR_APK_CHANGES
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Snapshot CURRENT live Stage74 rules READ ONLY into disposable emulator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY_RULES'
          import hashlib,json,os
          from pathlib import Path
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          project='deda-25b88'
          raw=os.environ.get('DEDA_STAGE71_PRIMARY_SA') or os.environ.get('DEDA_STAGE71_SECONDARY_SA')
          if not raw:raise SystemExit('SAFE_STOP_MISSING_READONLY_RULES_CREDENTIAL')
          info=json.loads(raw)
          if info.get('project_id')!=project or info.get('type')!='service_account':
              raise SystemExit('SAFE_STOP_UNEXPECTED_FIREBASE_PROJECT')
          creds=service_account.Credentials.from_service_account_info(info,
              scopes=['https://www.googleapis.com/auth/cloud-platform'])
          http=AuthorizedSession(creds)
          api='https://firebaserules.googleapis.com/v1/'
          release=http.get(api+f'projects/{project}/releases/cloud.firestore',timeout=25)
          release.raise_for_status()
          name=release.json().get('rulesetName','')
          if not name.startswith(f'projects/{project}/rulesets/'):
              raise SystemExit('SAFE_STOP_INVALID_LIVE_RULESET')
          response=http.get(api+name,timeout=25)
          response.raise_for_status()
          files=response.json().get('source',{}).get('files',[])
          texts=[f['content'] for f in files if f.get('name','').endswith('.rules')]
          if len(texts)!=1:raise SystemExit('SAFE_STOP_NOT_SINGLE_LIVE_RULE_FILE')
          rules=texts[0]
          for needle in ['STAGE71_FREE_DUAL_200_ROLE_AND_UNIQUE_GRANT_NO_DEPLOY',
                         'STAGE74_HADAYA_FREE_ID_GIFT_RECEIPT_ONLY',
                         'match /deda_stage71_granted_registry/',
                         'match /deda_stage74_id_gift_receipts/']:
              if rules.count(needle)!=1:
                  raise SystemExit('SAFE_STOP_LIVE_POLICY_MISSING_'+needle)
          Path('/tmp/deda-stage74-gifts-candidate.rules').write_text(rules)
          print('PASS_QA32_CURRENT_LIVE_POLICY_READ_ONLY_SHA16',
                hashlib.sha256(rules.encode()).hexdigest()[:16])
          print('PASS_QA32_DISPOSABLE_EMULATOR_RULES_ONLY_NO_DEPLOY')
          PY_RULES
      - name: Install local Firestore Emulator dependencies
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Actual released rule E2E manager self-use, gifts, receipts, ownership (offline emulator)
        shell: bash
        run: |
          set -euo pipefail
          export GCLOUD_PROJECT=demo-deda-stage74-hadaya-id-receipts
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-stage74-hadaya-id-receipts --only firestore \
            'node --test test/deda_stage74_hadaya_gift_receipt_account_security_emulator.test.js'
          echo PASS_200_PROTECTED_ID_GM_ONLY_FREE_GIFT_NO_PURCHASE_NO_DEPLOY
