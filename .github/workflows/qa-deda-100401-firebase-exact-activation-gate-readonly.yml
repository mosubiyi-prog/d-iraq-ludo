name: DEDA 100401 Firebase Exact Launch Gate READ ONLY
on:
  push:
    branches: [deda-100401-firebase-exact-activation-gate-readonly-2026-10-31]
    paths: ['.github/workflows/qa-deda-100401-firebase-exact-activation-gate-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-services-and-iam:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FIREBASE_PRIMARY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      FIREBASE_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Project service, IAM, billing and targeted functions - read-only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet google-auth requests
          python - <<'PY'
          import json,os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          project='deda-25b88'
          raw=os.environ.get('FIREBASE_PRIMARY') or os.environ.get('FIREBASE_FALLBACK')
          try:
            info=json.loads(raw or '{}')
            assert info.get('type')=='service_account' and info.get('project_id')==project
            credentials=service_account.Credentials.from_service_account_info(
              info,scopes=['https://www.googleapis.com/auth/cloud-platform'])
            api=AuthorizedSession(credentials)
          except Exception:
            print('AUTH=UNKNOWN_OR_WRONG_PROJECT')
            raise SystemExit(0)
          print('AUTH=MATCHED_PROJECT')
          def req(method,url,body=None):
            try:
              resp=api.request(method,url,json=body,timeout=15)
              try:payload=resp.json()
              except Exception:payload={}
              return resp.status_code,payload if isinstance(payload,dict) else {}
            except Exception:
              return 'TRANSPORT_UNKNOWN',{}
          services=['cloudfunctions.googleapis.com','cloudbuild.googleapis.com',
             'artifactregistry.googleapis.com','run.googleapis.com',
             'firestore.googleapis.com','serviceusage.googleapis.com']
          for service in services:
            status,data=req('GET',f'https://serviceusage.googleapis.com/v1/projects/{project}/services/{service}')
            value=data.get('state','UNKNOWN') if status==200 else 'UNKNOWN_HTTP_'+str(status)
            print('SERVICE_'+service+'='+str(value))
          status,billing=req('GET',f'https://cloudbilling.googleapis.com/v1/projects/{project}/billingInfo')
          value=('ENABLED' if billing.get('billingEnabled') is True else 'DISABLED') if status==200 else 'UNKNOWN_HTTP_'+str(status)
          print('BILLING='+value)
          required=['cloudfunctions.functions.create','cloudfunctions.functions.update',
            'cloudfunctions.functions.list','cloudfunctions.functions.get',
            'serviceusage.services.enable','iam.serviceAccounts.actAs',
            'cloudbuild.builds.create','artifactregistry.repositories.create',
            'run.services.create']
          status,data=req('POST',f'https://cloudresourcemanager.googleapis.com/v1/projects/{project}:testIamPermissions',
            {'permissions':required})
          if status==200:
            found=set(data.get('permissions',[]))
            for permission in required:
              print('PROJECT_IAM_'+permission+'='+str(permission in found).lower())
          else:
            print('PROJECT_IAM=UNKNOWN_HTTP_'+str(status))
          status,projectdata=req('GET',f'https://cloudresourcemanager.googleapis.com/v1/projects/{project}')
          number=projectdata.get('projectNumber') if status==200 else None
          if number and str(number).isdigit():
            emails=[f'{number}-compute@developer.gserviceaccount.com',
                    f'{project}@appspot.gserviceaccount.com']
            for i,email in enumerate(emails):
              status,data=req('POST',
                f'https://iam.googleapis.com/v1/projects/-/serviceAccounts/{email}:testIamPermissions',
                {'permissions':['iam.serviceAccounts.actAs']})
              value=('GRANTED' if 'iam.serviceAccounts.actAs' in data.get('permissions',[]) else 'NOT_GRANTED') if status==200 else 'UNKNOWN_HTTP_'+str(status)
              print('RUNTIME_SA_'+str(i)+'_ACT_AS='+value)
          else:
            print('RUNTIME_SA_ACT_AS=UNKNOWN_PROJECT_NUMBER')
          status,functions=req('GET',
            f'https://cloudfunctions.googleapis.com/v2/projects/{project}/locations/us-central1/functions?pageSize=100')
          if status==200:
            names=[x.get('name','').split('/')[-1] for x in functions.get('functions',[]) if isinstance(x,dict)]
            for target in ('dedaWeeklyCommunityClaimV1','dedaWeeklyCommunityStandingsV1'):
              print('FUNCTION_DEPLOYED_'+target+'='+str(target in names).lower())
            print('FUNCTION_LIST_PAGE_COMPLETE='+str('nextPageToken' not in functions).lower())
          else:
            print('FUNCTION_LIST=UNKNOWN_HTTP_'+str(status))
          print('READ_ONLY=True NO_DEPLOY NO_IAM_WRITE NO_BILLING_WRITE NO_USER_DATA')
          PY
