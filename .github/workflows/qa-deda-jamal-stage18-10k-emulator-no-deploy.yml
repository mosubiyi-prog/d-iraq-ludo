name: DEDA جمال التطبيق المتكاملة Stage18 10k Real Firestore Checkout Emulator PRIVATE NO DEPLOY

on:
  push:
    branches:
      - deda-stage19-jamal-alttatbiq-almutakamila-private-2026-10-19
    paths:
      - 'tools/deda_stage18_private_atomic_identifier_checkout_2026_10_19.js'
      - 'test/deda_stage18_verified10k_checkout_firestore_emulator.test.js'
      - '.github/workflows/qa-deda-jamal-stage18-10k-emulator-no-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-jamal-stage18-10k-real-firestore-no-deploy
  cancel-in-progress: true

jobs:
  protected:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SAFE STOP no live sale, wallets, functions, Android or manifest change
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 69043a503c6a1ae0a2a61b4694f719934099af94 -- \
            functions/index.js firestore.rules firebase.json \
            lib/main.dart lib/deda_backend.dart android/ assets/ \
            pubspec.yaml pubspec.lock
          ! grep -q 'deda_stage18_private_atomic_identifier_checkout' functions/index.js
          ! grep -q 'dedaStage18BuyIdentifier' functions/index.js
          test -f test/deda_stage18_verified10k_checkout_firestore_emulator.test.js
          node --check test/deda_stage18_verified10k_checkout_firestore_emulator.test.js
          node --check tools/deda_stage18_private_atomic_identifier_checkout_2026_10_19.js
          echo 'PASS: no production sale, price, diamonds, original IDs or Firebase changes'
  firestore-emulator-real-10k-checkout:
    needs: protected
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install throwaway Firebase emulator dependencies
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Atomic purchase, double-spend, client spoof and stock race tests
        shell: bash
        run: |
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-stage18-purchase-real-races --only firestore \
            'node --test test/deda_stage18_verified10k_checkout_firestore_emulator.test.js'
          echo 'PASS: 10k verified inventory and server-wallet transactions isolated to Firebase Emulator'
  done:
    needs: [protected, firestore-emulator-real-10k-checkout]
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'PASS DEDA Stage18 checkout tested in isolated emulator; no production APK/Functions deploy'
