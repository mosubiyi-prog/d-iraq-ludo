name: DEDA Stage19 manager exclusive ID tile + page UI PRIVATE - NO DEPLOY

on:
  push:
    branches:
      - deda-stage19-admin100-private-ui-no-deploy-2026-10-19
    paths:
      - 'lib/admin_pages.dart'
      - 'lib/deda_admin_compact_card.dart'
      - 'lib/deda_exclusive_ids_admin_page.dart'
      - 'test/deda_stage19_exclusive_admin_tile_test.dart'
      - '.github/workflows/qa-deda-stage19-manager100-ui-private-no-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-stage19-exclusive-manager-private-ui
  cancel-in-progress: true

jobs:
  admin-exclusive-ui-safe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SAFE_STOP protect production and verified Android source
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 810c2fe096ddd2521cbc6f1935e4f0c7c5eedc85 -- \
            functions/index.js firestore.rules firebase.json \
            lib/main.dart lib/deda_backend.dart lib/deda_social_service.dart \
            android/ catalogs/ assets/
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          ! grep -q 'deda_exclusive_ids_admin_page.dart' functions/index.js
          grep -q 'DedaAdminCompactCard(' lib/admin_pages.dart
          grep -q 'deda_stage19_admin100_dashboard_tile' lib/admin_pages.dart
          grep -q "DedaBackend.normalizeAdminStatus(profile) == 'active'" lib/admin_pages.dart
          grep -q 'exclusiveNavyTurquoise: true' lib/admin_pages.dart
          grep -q 'DedaExclusiveIdsAdminPage(isArabic: ar)' lib/admin_pages.dart
          grep -q 'DedaBackend.currentAdminProfile(forceRefresh: true)' lib/deda_exclusive_ids_admin_page.dart
          grep -q "DedaBackend.normalizeAdminRole(profile\\['role'\\])" lib/deda_exclusive_ids_admin_page.dart
          grep -q "Alignment.topLeft" lib/deda_exclusive_ids_admin_page.dart
          grep -q 'height: 50' lib/deda_exclusive_ids_admin_page.dart
          grep -q 'static Future<DedaExclusiveAdminSnapshot> Function()? readRemote;' lib/deda_exclusive_ids_admin_page.dart
          grep -q 'serverConfirmed' lib/deda_exclusive_ids_admin_page.dart
          grep -q 'DedaExclusiveAdminBridge.grantToUserRemote == null' lib/deda_exclusive_ids_admin_page.dart
          grep -q 'DedaExclusiveAdminBridge.useForManagerRemote == null' lib/deda_exclusive_ids_admin_page.dart
          echo 'PASS: manager only tile, private remote-only catalog and dormant grants, untouched prod'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Flutter compile/analyze and widget regression
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/deda_exclusive_ids_admin_page.dart lib/deda_admin_compact_card.dart \
            test/deda_stage19_exclusive_admin_tile_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/admin_pages.dart lib/deda_admin_compact_card.dart \
            lib/deda_exclusive_ids_admin_page.dart \
            test/deda_stage19_exclusive_admin_tile_test.dart
          flutter test test/deda_stage19_exclusive_admin_tile_test.dart \
            test/deda_admin_compact_card_test.dart
          echo 'PASS: stage19 manager exclusive tile UI/size/security tests, no APK/deploy'
