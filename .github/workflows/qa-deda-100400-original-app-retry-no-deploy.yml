name: DEDA 100400 DEDA Same-Day League Offline Retry QA (NO DEPLOY)
on:
  push:
    branches:
      - deda-weekly-100400-safe-same-day-score-retry-no-deploy-2026-10-31
    paths:
      - ".github/workflows/qa-deda-100400-original-app-retry-no-deploy.yml"
      - "tools/app_stability/app_package/bind_weekly_100400_safe_score_retry.py"
      - "lib/deda_weekly_community_outbox.dart"
      - "test/deda_weekly_community_outbox_test.dart"
      - "functions/deda_weekly_community_scores_core.js"
      - "functions/tests/deda_weekly_community_scores_core.test.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-original-100396-task-xp-signal:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: false
      - name: Reconstruct approved real task / league sources in isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/deda-real-100400"
          flutter create --platforms=android --org com.diraq.ludo --project-name d_iraq_ludo "$WORK"
          python3 tools/app_stability/app_package/prepare.py "$WORK" --variant candidate
          python3 tools/app_stability/app_package/bind_weekly_stage13.py "$WORK"
          python3 tools/app_stability/app_package/bind_active_id_boot_prewarm_stage14.py "$WORK"
          python3 tools/app_stability/app_package/bind_active_id_measured_startup_stage16.py "$WORK"
          python3 tools/app_stability/app_package/bind_weekly_private_trial_stage17.py "$WORK"
          python3 tools/app_stability/app_package/bind_weekly_full_qa_stage18.py "$WORK"
          python3 tools/app_stability/app_package/verify_rank_card_tap_stage19.py "$WORK"
          python3 tools/app_stability/app_package/bind_weekly_admin_league_stage27.py "$WORK"
          python3 tools/app_stability/app_package/bind_weekly_tasks_cta_stage28.py "$WORK"
          python3 tools/app_stability/app_package/bind_weekly_100397_owner_real_scores.py "$WORK"
          python3 tools/app_stability/app_package/bind_weekly_100398_after_level_xp.py "$WORK"
          python3 tools/app_stability/app_package/bind_weekly_100399_community_bridge.py "$WORK"
          python3 tools/app_stability/app_package/bind_weekly_100400_safe_score_retry.py "$WORK"
          export DEDA_QA_WORK="$WORK"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          p=Path(os.environ["DEDA_QA_WORK"])
          manifest=json.loads((p/"internal-build-inputs.json").read_text())
          main=(p/"lib/main.dart").read_text()
          assert manifest["versionCode"]==100400
          assert manifest["weekly100400SameDayRetry"]["serverRequiresClaimDayMatch"]
          assert manifest["weekly100399Community"]["noSecondTaskReward"]
          bridge=(p/"lib/deda_weekly_owner_pilot_bridge.dart").read_text()
          assert bridge.count("dedaWeeklyCommunityClaimV1")==1
          assert bridge.count("DedaWeeklyCommunityOutbox.recordAndSend(")==1
          assert bridge.count("DedaWeeklyCommunityOutbox.retry(")==1
          assert bridge.count("\u0027claimDay\u0027: claimDay")==1
          assert bridge.count("dedaWeeklyCommunityStandingsV1")==1
          assert "dedaWeeklyOwnerPilotClaimV1" not in bridge
          assert manifest["weekly100398SourceOfLevelXp"]["serverReportAfterActualLevelXp"]
          assert main.count("DedaWeeklyOwnerPilotBridge.claimAfterOriginalReward(")==1
          engine=main.split("  static Future<DedaTaskEventResult> claimTaskReward(",1)[1].split("  static Future<",1)[0]
          assert "DedaWeeklyOwnerPilotBridge.claimAfterOriginalReward(" not in engine
          view=main.split("  Future<void> _claimTaskReward(String taskId)",1)[1].split("  Future<void> _openTask(",1)[0]
          assert view.index("await DedaSectionOperationContext.wait(() => DedaSocialProgressWallet.awardTaskClaim(taskId));") < view.index("DedaWeeklyOwnerPilotBridge.claimAfterOriginalReward(")
          assert "leagueLevelXpDelta ==" in view
          print("ACTUAL ORIGINAL 100396 +20 LEVEL XP COMMUNITY SIGNAL ORDER VERIFIED")
          print("No APK, no Firebase deploy, no Play, no account balance changes")
          PY
      - name: Verify Flutter source compiles without touching production
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/deda-real-100400"
          flutter pub get --enforce-lockfile
          node --test "$GITHUB_WORKSPACE/functions/tests/deda_weekly_community_scores_core.test.cjs"
          dart analyze --no-fatal-warnings lib/main.dart lib/deda_weekly_owner_pilot_bridge.dart lib/deda_weekly_account_view_gate.dart lib/deda_weekly_community_outbox.dart
          flutter test test/deda_weekly_community_outbox_test.dart
