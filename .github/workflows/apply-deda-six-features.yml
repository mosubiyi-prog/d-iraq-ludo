name: Apply DEDA six features and build

on:
  push:
    branches:
      - places-v1
    paths:
      - '.github/workflows/apply-deda-six-features.yml'

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout places-v1
        uses: actions/checkout@v4
        with:
          ref: places-v1
          fetch-depth: 0

      - name: Apply the six agreed features
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > lib/main.dart
          echo '' | base64 -d > lib/places_service.dart
          echo '' | base64 -d > pubspec.yaml

      - name: Commit feature files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart lib/places_service.dart pubspec.yaml
          if git diff --cached --quiet; then
            echo 'No file changes to commit.'
          else
            git commit -m 'Complete six agreed DEDA features'
            git push origin HEAD:places-v1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Save DEDA files
        shell: bash
        run: |
          cp lib/main.dart /tmp/main.dart
          cp lib/places_service.dart /tmp/places_service.dart
          cp pubspec.yaml /tmp/pubspec.yaml

      - name: Create Flutter project
        run: flutter create . --org com.diraq.ludo --project-name d_iraq_ludo

      - name: Restore DEDA files
        shell: bash
        run: |
          cp /tmp/main.dart lib/main.dart
          cp /tmp/places_service.dart lib/places_service.dart
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Add Android permissions
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]
          missing = [p for p in permissions if p not in text]
          if missing:
              pos = text.find('>')
              inserted = '\n' + '\n'.join(f'    {p}' for p in missing) + '\n'
              text = text[:pos + 1] + inserted + text[pos + 1:]
              path.write_text(text)
          PY2

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: d-iraq-ludo-six-features-apk
          path: build/app/outputs/flutter-apk/app-release.apk
