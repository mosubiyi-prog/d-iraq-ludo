name: DEDA «إنت كدها» Point 10 - 100 ID candidates, no sales - NO APK
on:
  push:
    branches:
      - deda-intakadha-ids-cards-stage1-2026-10-18
    paths:
      - '.github/workflows/qa-deda-intakadha-point10-100-id-candidates-no-apk.yml'
      - 'catalogs/DEDA_ID_GROUP_002_CANDIDATES_100_NO_SALES_2026-10-18.json'
      - 'tools/stage_deda_intakadha_point10_group002_candidates_2026_10_18.py'
      - 'test/test_deda_intakadha_point10_group002_catalog_2026_10_18.py'
      - 'test/deda_intakadha_point10_catalog_preview_widget_test.dart'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-intakadha-point10-no-apk
  cancel-in-progress: true
jobs:
  source-collision-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify signed 100356 backup remains unchanged and stage files are scoped
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin backup-deda-100356-phone-ui-verified-2026-10-18
          test "$(git rev-parse origin/backup-deda-100356-phone-ui-verified-2026-10-18)" = "4373b8b30eadc5a284554ca7c021c350e0732caf"
          python3 - <<'PY'
          import re,subprocess
          changed=set(subprocess.check_output(
              ["git","diff","--name-only","4373b8b30eadc5a284554ca7c021c350e0732caf","HEAD"],
              text=True).splitlines())
          permitted=(
              r"docs/DEDA_INTAKADHA_16_POINTS_STAGE1_CHECKPOINT_2026-10-18\.md",
              r"tools/stage_deda_intakadha_point(?:[2-9]|10)_[a-z0-9_]+_2026_10_18\.py",
              r"test/test_deda_intakadha_point(?:[2-9]|10)_[a-z0-9_]+_2026_10_18\.py",
              r"test/deda_intakadha_point(?:[5-9]|10)_[a-z0-9_]+\.dart",
              r"\.github/workflows/qa-deda-intakadha-point(?:[2-9]|10)-[a-z0-9-]+\.yml",
              r"catalogs/DEDA_ID_GROUP_002_CANDIDATES_100_NO_SALES_2026-10-18\.json",
          )
          bad=[x for x in changed if not any(re.fullmatch(p,x) for p in permitted)]
          assert not bad, f"SAFE_STOP unapproved repository paths: {bad}"
          assert not any(x.startswith(("lib/","android/","assets/","functions/","firestore")) for x in changed)
          print("PASS: original 100356 backup protected, no original app source/backend or balances modified")
          PY
      - name: Validate 100 frozen candidates and stage2 through 10 source regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/stage_deda_intakadha_point10_group002_candidates_2026_10_18.py test/test_deda_intakadha_point10_group002_catalog_2026_10_18.py
          for i in 2 3 4 5 6 7 8 9 10; do
            case "$i" in
              2) pattern=test_deda_intakadha_point2_member_caption_2026_10_18.py ;;
              3) pattern=test_deda_intakadha_point3_name_level_layout_2026_10_18.py ;;
              4) pattern=test_deda_intakadha_point4_rectangular_id_geometry_2026_10_18.py ;;
              5) pattern=test_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py ;;
              6) pattern=test_deda_intakadha_point6_profile_id_slot_2026_10_18.py ;;
              7) pattern=test_deda_intakadha_point7_four_card_management_2026_10_18.py ;;
              8) pattern=test_deda_intakadha_point8_photos_to_id_shop_2026_10_18.py ;;
              9) pattern=test_deda_intakadha_point9_sticky_store_2026_10_18.py ;;
              10) pattern=test_deda_intakadha_point10_group002_catalog_2026_10_18.py ;;
            esac
            python3 -m unittest discover -s test -p "$pattern" -v
          done
          echo "PASS: Group 002 proposals, 100 unique A-Z0-9 six-char, no real inventory or purchases"
  flutter-100-candidates-preview:
    needs: source-collision-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter-test original point9 store + exact point10 100 proposal registry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deda-point10/lib" "$RUNNER_TEMP/deda-point10/test"
          python3 - "$RUNNER_TEMP/deda-point10/lib/deda_point10_group002_fixture.dart" <<'PY'
          import ast,sys,json,importlib.util
          from pathlib import Path
          def extract(path,name):
              tree=ast.parse(Path(path).read_text(encoding="utf-8"))
              val=[s.value.value for s in tree.body if isinstance(s,ast.Assign)
                   and isinstance(s.value,ast.Constant)
                   and any(isinstance(t,ast.Name) and t.id==name for t in s.targets)]
              assert len(val)==1, "SAFE_STOP stage source changed: "+name
              return val[0]
          a=extract("tools/stage_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py","ARTWORK")
          p=extract("tools/stage_deda_intakadha_point9_sticky_four_card_store_2026_10_18.py","PAGE")
          tool="tools/stage_deda_intakadha_point10_group002_candidates_2026_10_18.py"
          spec=importlib.util.spec_from_file_location("stage10_readonly",tool)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          data=json.loads(Path("catalogs/DEDA_ID_GROUP_002_CANDIDATES_100_NO_SALES_2026-10-18.json").read_text(encoding="utf-8"))
          ids=mod.validate_catalog(data)
          assert p.count(mod.OLD_HEADING)==1 and p.count(mod.OLD_SUBTITLE)==1
          page=p.replace(mod.OLD_HEADING,mod.NEW_HEADING,1).replace(mod.OLD_SUBTITLE,mod.NEW_SUBTITLE,1)
          out="import 'package:flutter/material.dart';\nString dedaText(String ar,String en)=>ar;\n"
          out+=a+"\n"+mod.dart_block(ids)+"\n"+page
          Path(sys.argv[1]).write_text(out,encoding="utf-8")
          print("PASS: real source and 100 typed catalog injected into temporary Flutter fixture")
          PY
          cp test/deda_intakadha_point10_catalog_preview_widget_test.dart "$RUNNER_TEMP/deda-point10/test/"
          cat > "$RUNNER_TEMP/deda-point10/pubspec.yaml" <<'YAML'
          name: deda_point10_catalog_fixture
          description: Read-only six-character group002 catalogue test
          version: 0.0.1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
          YAML
          cd "$RUNNER_TEMP/deda-point10"
          dart format lib/deda_point10_group002_fixture.dart test/deda_intakadha_point10_catalog_preview_widget_test.dart
          flutter pub get
          flutter test test/deda_intakadha_point10_catalog_preview_widget_test.dart --reporter expanded
          echo "PASS: 100 candidates, four pinned cards, no purchases, mobile layout"
          echo "PASS: NO APK, no Firestore write, no Play publishing"
