name: DEDA original signed app OFFLINE Android16 integration smoke NOT FINAL
on:
  push:
    branches: [deda-app-stability-isolated-2026-10-23]
    paths:
      - '.github/workflows/deda-stability-original-app-offline-smoke.yml'
      - 'tools/app_stability/native_app/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deda-stability-original-offline-smoke
  cancel-in-progress: true
jobs:
  offline-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Wait for the exact source-verified internal build before downloading
        env:
          DEDA_BUILD_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYWAIT'
          import json, os, time, urllib.request
          source_url = 'https://api.github.com/repos/mosubiyi-prog/d-iraq-ludo/actions/runs/40249138022'
          for attempt in range(80):
              request = urllib.request.Request(source_url, headers={
                  'Authorization': 'Bearer ' + os.environ['DEDA_BUILD_READ_TOKEN'],
                  'Accept': 'application/vnd.github+json',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  source_result = json.load(response)
              if source_result.get('head_sha') != '9a694099b8773e300e08adceb25bf1a8eb07ebd3':
                  raise SystemExit('Source QA mismatch; no APK downloaded or launched')
              if source_result.get('status') == 'completed':
                  if source_result.get('conclusion') != 'success':
                      raise SystemExit('Source QA did not pass; no APK downloaded or launched')
                  break
              time.sleep(15)
          else:
              raise SystemExit('Source QA still pending; no APK downloaded or launched')
          url = 'https://api.github.com/repos/mosubiyi-prog/d-iraq-ludo/actions/runs/40249219165'
          expected = 'e26b0bf9cccce1c3d0eaf310be211aaa66b75ae7'
          for attempt in range(80):
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['DEDA_BUILD_READ_TOKEN'],
                  'Accept': 'application/vnd.github+json',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              if result.get('head_sha') != expected:
                  raise SystemExit('Internal build source mismatch; no APK downloaded or launched')
              if result.get('status') == 'completed':
                  if result.get('conclusion') != 'success':
                      raise SystemExit('Internal build did not pass; no APK downloaded or launched')
                  print('Exact internal build passed; downloading its verified artifacts')
                  break
              time.sleep(15)
          else:
              raise SystemExit('Internal build still pending; no APK downloaded or launched')
          PYWAIT
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: mosubiyi-prog/d-iraq-ludo
          run-id: 40249219165
          name: DEDA-STABILITY-INTERNAL-control-NOT-FINAL
          path: ${{ runner.temp }}/internal-control
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: mosubiyi-prog/d-iraq-ludo
          run-id: 40249219165
          name: DEDA-STABILITY-INTERNAL-candidate-NOT-FINAL
          path: ${{ runner.temp }}/internal-candidate
      - name: Enable KVM for the disposable emulator only
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Root, block ALL external IPv4/IPv6 egress before APK launch, then test empty-account starts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/app_stability/native_app/offline_smoke.py "$RUNNER_TEMP/internal-control" "$RUNNER_TEMP/internal-candidate" "$RUNNER_TEMP/original-app-offline-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEDA-ORIGINAL-APP-OFFLINE-SMOKE-NOT-FINAL
          path: |
            ${{ runner.temp }}/original-app-offline-smoke/report.json
            ${{ runner.temp }}/original-app-offline-smoke/*.png
          if-no-files-found: warn
          retention-days: 14
