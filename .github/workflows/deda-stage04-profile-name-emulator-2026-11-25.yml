name: DEDA Stage04 profile name candidate emulator REVIEW ONLY NO DEPLOY
on:
  push:
    branches: [deda-100451-owner-admin-session-safe-repair-2026-11-20]
    paths:
      - 'qa/stage04/profile-name-candidate.cjs'
      - 'qa/stage04/profile-name-candidate.test.cjs'
      - '.github/workflows/deda-stage04-profile-name-emulator-2026-11-25.yml'
permissions:
  contents: read
jobs:
  profile-name:
    if: github.ref == 'refs/heads/deda-100451-owner-admin-session-safe-repair-2026-11-20'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test candidate in disposable emulator, no cloud credentials or publishing
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/stage04-profile-name"
          mkdir -p "$work/stage03" "$work/stage04"
          cp qa/stage03/{uid-spark-fixture-rules,uid-trusted-fixture,uid-ownership-projection}.cjs tools/app_stability/progress_archive/{reconcile-core,reconcile-store,purchase-frames}.cjs functions/deda_weekly_direct_prize_plan.js "$work/stage03/"
          cp qa/stage04/profile-name-candidate*.cjs "$work/stage04/"
          cp qa/stage03/firestore.lab-candidate.rules "$work/original.rules"
          cd "$work"
          node --check stage04/profile-name-candidate.cjs
          node --check stage04/profile-name-candidate.test.cjs
          node -e 'const fs=require("node:fs");const g=require("./stage04/profile-name-candidate.cjs");fs.writeFileSync("firestore.rules",g.generateProfileName(fs.readFileSync("original.rules","utf8")))'
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false}}}' > firebase.json
          npm install --no-audit --no-fund --ignore-scripts --no-package-lock @firebase/rules-unit-testing@4.0.0 firebase@11.10.0
          GCLOUD_PROJECT=demo-deda-stage03-uid npx --yes firebase-tools@13.35.1 emulators:exec --project demo-deda-stage03-uid --only firestore --config firebase.json --non-interactive 'node --test stage04/profile-name-candidate.test.cjs'
          node -e 'const fs=require("node:fs");const g=require("./stage04/profile-name-candidate.cjs");const old=fs.readFileSync("original.rules","utf8");fs.writeFileSync("profile-readiness-readonly.rules",g.generateProfileReadiness(old));fs.writeFileSync("previous-account-fixed.rules",require("./stage03/uid-spark-fixture-rules.cjs").generateAccount(old))'
          sha256sum profile-readiness-readonly.rules previous-account-fixed.rules > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stage04-profile-readiness-LAB-ONLY
          path: |
            ${{ runner.temp }}/stage04-profile-name/profile-readiness-readonly.rules
            ${{ runner.temp }}/stage04-profile-name/previous-account-fixed.rules
            ${{ runner.temp }}/stage04-profile-name/SHA256SUMS.txt
          if-no-files-found: error
