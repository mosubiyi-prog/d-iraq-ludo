name: DEDA Point 14 Verified ID Card Use - NO APK NO DEPLOY
on:
  workflow_dispatch:
  push:
    branches:
      - deda-intakadha-ids-cards-stage1-2026-10-18
    paths:
      - tools/stage_deda_intakadha_point14_verified_card_use_profile_2026_10_19.py
      - tools/deda_intakadha_point14_verified_id_card_selection_2026_10_19.js
      - test/test_deda_intakadha_point14_verified_card_use_profile_2026_10_19.py
      - test/deda_intakadha_point14_verified_card_use_profile_widget_test.dart
      - test/deda_intakadha_point14_verified_id_card_selection_emulator.test.js
      - .github/workflows/qa-deda-intakadha-point14-owned-use-no-deploy.yml
permissions:
  contents: read
concurrency:
  group: deda-point14-owned-use-qa
  cancel-in-progress: true
jobs:
  source-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assert protected 100356 source, production Firebase and Play unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin backup-deda-100356-phone-ui-verified-2026-10-18
          test "$(git rev-parse origin/backup-deda-100356-phone-ui-verified-2026-10-18)" = 4373b8b30eadc5a284554ca7c021c350e0732caf
          python3 - <<'PY'
          import subprocess,re
          files=set(subprocess.check_output(['git','diff','--name-only',
            '4373b8b30eadc5a284554ca7c021c350e0732caf','HEAD'],text=True).splitlines())
          allowed=[
            r'docs/DEDA_INTAKADHA_16_POINTS_STAGE1_CHECKPOINT_2026-10-18\.md',
            r'catalogs/DEDA_ID_GROUP_002_CANDIDATES_100_NO_SALES_2026-10-18\.json',
            r'tools/stage_deda_intakadha_point(?:[2-9]|1[0-4])_[a-z0-9_]+_2026_10_(?:18|19)\.py',
            r'tools/deda_intakadha_point1[34]_[a-z0-9_]+_2026_10_19\.js',
            r'test/test_deda_intakadha_point(?:[2-9]|1[0-4])_[a-z0-9_]+_2026_10_(?:18|19)\.py',
            r'test/deda_intakadha_point(?:[5-9]|1[0-4])_[a-z0-9_]+(?:_emulator\.test\.js|\.dart)',
            r'\.github/workflows/qa-deda-intakadha-point(?:[2-9]|1[0-4])-[a-z0-9-]+\.yml',
          ]
          unexpected=sorted(f for f in files if not any(re.fullmatch(x,f) for x in allowed))
          assert not unexpected, 'SAFE_STOP changed protected files: '+str(unexpected)
          assert not any(f.startswith(('lib/','android/','functions/','assets/','firestore')) for f in files)
          print('PASS: 100356, live Functions, Firestore rules, signed APK and Play untouched')
          PY
      - name: Python source-stage and Node syntax checks
        run: |
          set -euo pipefail
          python3 -m py_compile tools/stage_deda_intakadha_point14_verified_card_use_profile_2026_10_19.py
          python3 -m unittest discover -s test -p 'test_deda_intakadha_point14_verified_card_use_profile_2026_10_19.py' -v
          node --check tools/deda_intakadha_point14_verified_id_card_selection_2026_10_19.js
          node --check test/deda_intakadha_point14_verified_id_card_selection_emulator.test.js
          test "$(grep -c 'point14_verified_id_card_selection' functions/index.js || true)" = 0
  emulator-ownership:
    needs: source-guards
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Disposable local Firestore Emulator dependencies
        run: |
          npm install --prefix functions --no-save --no-audit --no-fund \
            firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Run real transaction and rules tests without deployment
        run: |
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-point14-owned-cards --only firestore \
            'node --test test/deda_intakadha_point14_verified_id_card_selection_emulator.test.js'
  flutter-widgets:
    needs: source-guards
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build isolated account and profile Flutter fixture (no real app APK)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p14/lib" "$RUNNER_TEMP/p14/test"
          python3 - "$RUNNER_TEMP/p14/lib/deda_point14_fixture.dart" <<'PY'
          import ast,importlib.util,sys
          from pathlib import Path
          def get(path,label):
            tree=ast.parse(Path(path).read_text(encoding='utf-8'))
            values=[s.value.value for s in tree.body if isinstance(s,ast.Assign)
              and isinstance(s.value,ast.Constant) and
              any(isinstance(t,ast.Name) and t.id==label for t in s.targets)]
            assert len(values)==1,(path,label)
            return values[0]
          def load(path):
            spec=importlib.util.spec_from_file_location('fixture_'+path.stem,path)
            m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
            return m
          p12=load(Path('tools/stage_deda_intakadha_point12_safe_card_checkout_2026_10_19.py'))
          pieces=[
            get('tools/stage_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py','ARTWORK'),
            get('tools/stage_deda_intakadha_point6_profile_id_slot_2026_10_18.py','WIDGET'),
            p12.upgraded_widget(),
            get('tools/stage_deda_intakadha_point14_verified_card_use_profile_2026_10_19.py','WIDGETS'),
          ]
          Path(sys.argv[1]).write_text("import 'package:flutter/material.dart';\n"
            "String dedaText(String ar,String en)=>ar;\n"+"\n".join(pieces),encoding='utf8')
          PY
          cp test/deda_intakadha_point14_verified_card_use_profile_widget_test.dart "$RUNNER_TEMP/p14/test/"
          cat > "$RUNNER_TEMP/p14/pubspec.yaml" <<'YAML'
          name: deda_point14_verified_id_qa
          description: Isolated DEDA verified card use tests
          version: 0.0.1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
          YAML
          cd "$RUNNER_TEMP/p14"
          dart format lib test
          flutter pub get
          flutter test --reporter expanded
  no-release:
    needs: [source-guards, emulator-ownership, flutter-widgets]
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm no APK or release
        run: echo "PASS point14 private source+Flutter+Firebase Emulator only; no APK/AAB/Play or live database changes"
