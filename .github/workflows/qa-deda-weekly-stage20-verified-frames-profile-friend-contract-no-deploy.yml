name: DEDA Stage20 verified leaderboard frame + public profile + friendship UI contract NO DEPLOY
on:
  push:
    branches:
      - deda-weekly-stage20-competitor-profile-friend-frame-contract-no-deploy-2026-10-28
    paths:
      - '.github/workflows/qa-deda-weekly-stage20-verified-frames-profile-friend-contract-no-deploy.yml'
      - 'lib/deda_weekly_competitor_public_card.dart'
      - 'test/deda_weekly_competitor_public_card_test.dart'
      - 'docs/DEDA_WEEKLY_STAGE20_PROFILE_FRAME_FRIENDSHIP_CHECKPOINT_2026-10-28.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-account-wallet-and-server-unchanged:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject any modification to original DEDA wallets, existing friend handling, authentication or live backend
        run: |
          git diff --quiet a0dd340e8843162ac5fb89784cb54d0be82b23ec -- lib/main.dart lib/deda_social_service.dart lib/deda_backend.dart lib/deda_migrated_progress.dart lib/deda_owner18_cosmetics.dart lib/deda_six_frame_equip.dart pubspec.yaml firestore.rules firebase.json functions/index.js
          grep -q 'Future<void> Function(DedaWeeklyPublicCompetitor)' lib/deda_weekly_competitor_public_card.dart
          ! grep -Eq 'FirebaseFirestore|FieldValue\.increment|\.set\(|\.update\(|\.delete\(' lib/deda_weekly_competitor_public_card.dart
  private-widget-tests:
    needs: original-account-wallet-and-server-unchanged
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
      - name: Test strict verified public appearance / frame ownership and existing social-action routing
        run: |
          set -euo pipefail
          flutter create --project-name deda_weekly_stage20_check --platforms=android "$RUNNER_TEMP/stage20"
          cp lib/deda_weekly_competitor_public_card.dart "$RUNNER_TEMP/stage20/lib/"
          cp test/deda_weekly_competitor_public_card_test.dart "$RUNNER_TEMP/stage20/test/"
          cd "$RUNNER_TEMP/stage20"
          flutter pub get
          dart analyze lib/deda_weekly_competitor_public_card.dart
          flutter test test/deda_weekly_competitor_public_card_test.dart
