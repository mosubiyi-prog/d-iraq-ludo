name: DEDA 100405 Actual Hadaya Weekly Worker Emulator ONLY NO PAYOUT
on:
  push:
    branches: [deda-100405-admin-five-points-integrated-no-apk-until-qa-2026-10-31]
    paths:
      - '.github/workflows/qa-deda-100405-weekly-prize-worker-hadaya-emulator-no-deploy.yml'
      - 'functions/deda_weekly_direct_prize_worker.cjs'
      - 'functions/deda_weekly_direct_prize_plan.js'
      - 'functions/tests/deda_weekly_direct_prize_worker.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-local-firestore:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Real prize gift ledger integration on Firebase emulator (NO LIVE WRITES)
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          npm install --prefix functions --no-audit --no-fund
          npm install --prefix tests/firestore-rules --no-audit --no-fund --no-save firebase-tools@14
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100405-worker --only firestore \
            'node --test functions/tests/deda_weekly_direct_prize_worker.test.cjs'
          echo 'EMULATOR_ONLY — no production diamonds, no wallet modification, no Play or APK'
