name: DEDA signed approved friend private weekly XP atomic tally NO DEPLOY
on:
  push:
    branches:
      - deda-weekly-friend-signed-xp-atomic-shadow-no-deploy-2026-10-29
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-friend-signed-private-weekly-xp-tally
  cancel-in-progress: true
jobs:
  immutable-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse ANY original Android/production/wallet/ID/rules change
        run: |
          set -euo pipefail
          BASE=1834d3769cbed2705ffc517aec65c33307fb44b4
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE" HEAD >/tmp/deda-friend-xp-change-list.txt
          cat /tmp/deda-friend-xp-change-list.txt
          while IFS= read -r f; do
            case "$f" in
              functions/deda_weekly_original_friend_reviewed_signed_claim_NOT_EXPORTED.js|\
              functions/deda_weekly_original_friend_signed_xp_atomic_shadow_NOT_EXPORTED.js|\
              functions/tests/deda_weekly_original_friend_signed_xp_atomic_shadow.test.js|\
              .github/workflows/qa-deda-weekly-original-friend-signed-xp-atomic-shadow-no-deploy.yml|\
              docs/DEDA_WEEKLY_FRIEND_SIGNED_SHADOW_XP_ATOMIC_2026-10-29.md) ;;
              *) echo "STOP: not part of safe private XP task $f"; exit 1 ;;
            esac
          done </tmp/deda-friend-xp-change-list.txt
          git diff --quiet "$BASE" -- lib/ android/ assets/ \
            functions/index.js functions/package.json \
            firestore.rules firebase.json pubspec.yaml pubspec.lock \
            tools/ tests/firestore-rules/
          node --check functions/deda_weekly_original_friend_reviewed_signed_claim_NOT_EXPORTED.js
          node --check functions/deda_weekly_original_friend_signed_xp_atomic_shadow_NOT_EXPORTED.js
          node --check functions/tests/deda_weekly_original_friend_signed_xp_atomic_shadow.test.js
          ! grep -q 'deda_weekly_original_friend_signed_xp_atomic_shadow_NOT_EXPORTED' functions/index.js
          echo "PASS original 100342, production wallets, level XP and quiz unchanged"
  real-private-firestore:
    needs: immutable-original
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GCLOUD_PROJECT: demo-deda-weekly-xp-stage9
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      DEDA_FRIEND_REVIEW_EMULATOR_ONLY: 'true'
      DEDA_FRIEND_ATOMIC_SHADOW_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install LOCAL Firebase emulator tools only
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase-tools@14
      - name: Regression previous friend HMAC approval and NEW atomic weekly candidate XP
        run: |
          set -euo pipefail
          # Both suites intentionally use canonical QA account IDs. An emulator
          # MUST be torn down between suites so review fixtures cannot collide.
          functions/node_modules/.bin/firebase emulators:exec \
            --config tools/app_stability/stage30/firebase.json \
            --project demo-deda-weekly-xp-stage9 --only firestore \
            'node --test functions/tests/deda_weekly_original_friend_reviewed_signed_claim.test.js'
          functions/node_modules/.bin/firebase emulators:exec \
            --config tools/app_stability/stage30/firebase.json \
            --project demo-deda-weekly-xp-stage9 --only firestore \
            'node --test functions/tests/deda_weekly_original_friend_signed_xp_atomic_shadow.test.js'
      - name: Never authorize APK or live credits
        run: |
          echo 'PRIVATE candidate XP not ORIGINAL level XP or spendable diamonds.'
          echo 'No live account ownership, no old APK revocation, no real migration.'
          echo 'No Firebase deployment, APK, Play or quiz change.'
