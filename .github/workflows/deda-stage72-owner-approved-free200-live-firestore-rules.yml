name: DEDA Stage72 OWNER APPROVED GM Free200 LIVE FIRESTORE RULES guarded deploy
on:
  push:
    branches:
      - deda-stage72-live-gm200-rules-owner-approved-2026-10-21
    paths:
      - '.github/workflows/deda-stage72-owner-approved-free200-live-firestore-rules.yml'
      - 'tools/deda_stage72_owner_approved_live_firestorm_rules_deploy.py'
      - 'tools/deda_stage71_free_admin200_live_rules_candidate_READONLY_NO_DEPLOY.py'
      - 'test/deda_stage71_free_admin_200_role_grant_emulator.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manager-free200-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DEDA_STAGE72_OWNER_EXPLICIT_APPROVAL: 2026-10-21-FREE200-GM-RULES-ONLY
      DEDA_STAGE71_PRIMARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      DEDA_STAGE71_SECONDARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prove original users, Firebase rules, Play and private encrypted IDs unaffected
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 2587f0cf260e1c9ca1768baa5ccad880fbb1d15c -- \
            firestore.rules firebase.json functions/index.js \
            lib/main.dart lib/deda_backend.dart android/ assets/ server_private/
          python3 -m py_compile tools/deda_stage71_free_admin200_live_rules_candidate_READONLY_NO_DEPLOY.py
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo PASS_NO_LIVE_FIREBASE_OR_APK_CHANGES
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Inspect current published rules READ ONLY, append temporary GM-only free200 rules
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 tools/deda_stage71_free_admin200_live_rules_candidate_READONLY_NO_DEPLOY.py
      - name: Install local Firestore Emulator dependencies
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Five E2E security tests original+second 100, manager/outsider, use, gift, permanent ownership
        shell: bash
        run: |
          set -euo pipefail
          export GCLOUD_PROJECT=demo-deda-stage71-free-admin200
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-stage71-free-admin200 --only firestore \
            'node --test test/deda_stage71_free_admin_200_role_grant_emulator.test.js'
          echo PASS_200_PROTECTED_ID_GM_ONLY_FREE_GIFT_NO_PURCHASE_NO_DEPLOY
      - name: After all emulated authorization checks PASS, publish only additive owner-approved rules
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/deda_stage72_owner_approved_live_firestorm_rules_deploy.py
          python3 tools/deda_stage72_owner_approved_live_firestorm_rules_deploy.py
      - name: Preserve private rollback sources and approval audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-STAGE72-FIRESTORE-RULES-ROLLBACK-AUDIT-PRIVATE
          path: /tmp/deda-stage72-rules-backup/
          if-no-files-found: warn
          retention-days: 30
