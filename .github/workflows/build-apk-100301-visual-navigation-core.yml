name: Build DEDA 100301 Visual Navigation Core

on:
  push:
    branches:
      - driver-visual-core-100301-2026-10-07
    paths:
      - '.github/workflows/build-apk-100301-visual-navigation-core.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100301 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100301
        run: bash tools/build_100301_visual_navigation_core.sh

      - name: Upload APK 100301
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100301-visual-navigation-core-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
