name: DEDA 100441 Step1 Google-to-legacy ownership safety gate QA NO DEPLOY
on:
  push:
    branches:
      - deda-100441-step1-legacy-google-proof-gate-isolated-no-deploy-2026-11-09
    paths:
      - 'functions/deda_100441_lab_to_legacy_google_proof_gate_PRIVATE_NOT_EXPORTED.js'
      - 'functions/deda_100441_owner_split_identity_challenge_review_private_v1.js'
      - 'functions/test/deda_100441_owner_split_identity_challenge_review_private_v1.test.js'
      - 'functions/deda_100441_legacy_google_oidc_verifier_PRIVATE_NOT_EXPORTED.js'
      - 'functions/test/deda_100441_lab_to_legacy_google_proof_gate_PRIVATE.test.js'
      - 'functions/test/deda_100441_legacy_google_oidc_verifier_PRIVATE.test.js'
      - 'docs/DEDA_100441_STEP1_GOOGLE_LAB_TO_LEGACY_OWNER_GATE_QA_2026-11-09.md'
      - 'tools/app_stability/app_package/bind_google_account_settings_100439.py'
      - '.github/workflows/deda-100441-step1-legacy-google-proof-gate-private-qa-no-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-100441-step1-google-to-legacy-private-safety
  cancel-in-progress: false

jobs:
  offline-isolated-proof-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Protected production files remain byte-identical
        shell: bash
        run: |
          set -euo pipefail
          # Use last approved successful isolated checkpoint; earlier PIN
          # remediation is intentional and must not fail this later QA.
          git diff --exit-code 37d07ec68e9ce02e819f8df85916248fcbe785a8 HEAD -- \
            lib/main.dart lib/deda_backend.dart lib/deda_pin_auth.dart \
            functions/index.js functions/deda_owner_pin_verify_private_v1.js \
            functions/deda_linked_owner_session_grant_private_v1.js \
            functions/deda_stage2_live_gate.js firestore.rules storage.rules \
            firebase.json .firebaserc android assets pubspec.yaml pubspec.lock
          echo PASS_PROTECTED_SINCE_LAST_APPROVED_CHECKPOINT_APP_FIREBASE_SIGNING_UNCHANGED
      - name: Verify owner-approved Google card stays above session diagnostics in either assembly order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import runpy
          m=runpy.run_path('tools/app_stability/app_package/bind_google_account_settings_100439.py')
          top=m['place_google_card_at_approved_top']
          voice=m['SETTINGS_ANCHOR']
          diag=m['DIAGNOSTIC_ANCHOR']
          # Old full app gets Google first; diagnostic is added later.
          google_first=top(voice)
          with_diag_later=google_first.replace(voice, diag+'\\n'+voice)
          assert with_diag_later.index('DedaGoogleSettingsLinkCard(') < with_diag_later.index(diag) < with_diag_later.index(voice)
          # Assemblies that add the diagnostic first must keep identical order.
          diag_first=top(diag+'\\n'+voice)
          assert diag_first.index('DedaGoogleSettingsLinkCard(') < diag_first.index(diag) < diag_first.index(voice)
          assert top(voice).count('DedaGoogleSettingsLinkCard(')==1
          for input_value in (google_first, diag_first):
              try:
                  top(input_value)
              except SystemExit:
                  pass
              else:
                  raise AssertionError('Duplicate Google card unexpectedly accepted')
          print('PASS_GOOGLE_CARD_FIRST_ABOVE_SESSION_DIAGNOSTIC_BOTH_ORDERS')
          PY
      - name: No deployed integration and no authority from QA Google project
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/deda_100441_lab_to_legacy_google_proof_gate_PRIVATE_NOT_EXPORTED.js
          node --check functions/test/deda_100441_lab_to_legacy_google_proof_gate_PRIVATE.test.js
          node --check functions/deda_100441_legacy_google_oidc_verifier_PRIVATE_NOT_EXPORTED.js
          node --check functions/test/deda_100441_legacy_google_oidc_verifier_PRIVATE.test.js
          node - <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const code=fs.readFileSync(
            'functions/deda_100441_lab_to_legacy_google_proof_gate_PRIVATE_NOT_EXPORTED.js','utf8');
          const index=fs.readFileSync('functions/index.js','utf8');
          assert.equal(index.includes('deda_100441_lab_to_legacy_google_proof_gate'),false);
          assert.equal(index.includes('deda_100441_owner_split_identity_challenge_review_private_v1'),false);
          assert.equal(index.includes('deda_100441_legacy_google_oidc_verifier'),false);
          const verifier=fs.readFileSync(
            'functions/deda_100441_legacy_google_oidc_verifier_PRIVATE_NOT_EXPORTED.js','utf8');
          assert.match(verifier,/https:\/\/www\.googleapis\.com\/oauth2\/v3\/certs/);
          assert.match(verifier,/verify\("RSA-SHA256"/);
          for(const marker of ['createCustomToken(', 'signInWithCredential(',
            'signInWithCustomToken(', 'linkWithCredential(', 'firebase-admin',
            'firebase-functions']) assert.equal(verifier.includes(marker),false,marker);
          assert.match(code,/QA_PROJECT = "deda-qa-uid-lab-20261108"/);
          assert.match(code,/PRODUCTION_PROJECT = "deda-25b88"/);
          for(const marker of ['createCustomToken(', 'signInWithCredential(',
              'linkWithCredential(', 'firebase-admin', 'firebase-functions',
              '.set(', '.delete(']) assert.equal(code.includes(marker),false,marker);
          console.log('PASS_PRIVATE_QA_BRIDGE_HAS_ZERO_ISSUING_OR_DEPLOYED_CAPABILITY');
          NODE
      - name: New security tests and existing owner proof regression
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            functions/test/deda_100441_lab_to_legacy_google_proof_gate_PRIVATE.test.js \
            functions/test/deda_100441_legacy_google_oidc_verifier_PRIVATE.test.js \
            functions/test/deda_100441_owner_split_identity_challenge_review_private_v1.test.js \
            functions/test/deda_100441_step2_conflicted_uids_owner_proof.test.js \
            functions/test/deda_owner_pin_verify_private_v1.test.js
          echo PASS_GOOGLE_QA_NOT_OWNER_PROOF_THREE_UID_CANDIDATES_REVIEW_ONLY
      - name: No production operation
        run: echo PASS_NO_FIREBASE_DEPLOY_NO_AUTH_UID_MUTATION_NO_APK_NO_PLAY
