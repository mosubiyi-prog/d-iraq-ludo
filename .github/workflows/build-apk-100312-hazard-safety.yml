name: Build DEDA 100312 Hazard Safety

on:
  push:
    branches:
      - driver-hazard-roadclass-100312-2026-10-08
    paths:
      - '.github/workflows/build-apk-100312-hazard-safety.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100312 after proven 100311
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Build and validate only DEDA 100312 hazard safety
        run: bash tools/build_100312_hazard_safety.sh
      - name: Upload signed APK DEDA 100312
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100312-hazard-safety-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
