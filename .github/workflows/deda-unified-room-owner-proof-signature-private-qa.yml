name: DEDA signed owner proof source binding (PRIVATE QA NO DEPLOY)
on:
  push:
    branches:
      - deda-unified-room-owner-proof-binding-private-qa-2026-11-16
    paths:
      - 'qa/unified_room_private/room_independent_owner_signature_PRIVATE_QA.cjs'
      - 'qa/unified_room_private/room_owner_proof_source_binding_PRIVATE_QA.cjs'
      - 'qa/unified_room_private/room_owner_proof_source_binding_PRIVATE_QA.test.cjs'
      - '.github/workflows/deda-unified-room-owner-proof-signature-private-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-proof-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify ONLY independent QA sources changed since protected DEDA baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, pathlib
          base='fd8cfd590d0f6703e34d6fe8c6913b091c3468fd'
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          assert paths, "NO_CHANGE"
          assert all(p.startswith('qa/unified_room_private/') or
            (p.startswith('.github/workflows/deda-unified-room-') and p.endswith('.yml'))
            for p in paths), 'PROTECTED_APPLICATION_OR_FIREBASE_MODIFIED'
          main=pathlib.Path('functions/index.js').read_text()
          for marker in ('room_owner_proof_source_binding_PRIVATE_QA',
              'room_independent_owner_signature_PRIVATE_QA'):
            assert marker not in main, 'QA_PROOF_ACCESSED_FROM_LIVE_FUNCTIONS'
          for fname in ('room_owner_proof_source_binding_PRIVATE_QA.cjs',
              'room_independent_owner_signature_PRIVATE_QA.cjs'):
            data=pathlib.Path('qa/unified_room_private/'+fname).read_text()
            for forbidden in ('createCustomToken(', 'createUser(', 'signInAnonymously(',
              'runTransaction(', 'httpsCallable(', 'admin.firestore('):
              assert forbidden not in data, 'PRIVILEGED_PATH:'+forbidden
          print('PASS_GUARDED_TEST_BRANCH_PRODUCTION_UNCHANGED')
          PY
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Real crypto verification with generated ephemeral QA Ed25519 keys
        shell: bash
        run: |
          set -euo pipefail
          node --check qa/unified_room_private/room_independent_owner_signature_PRIVATE_QA.cjs
          node --check qa/unified_room_private/room_owner_proof_source_binding_PRIVATE_QA.cjs
          node --test qa/unified_room_private/room_owner_proof_source_binding_PRIVATE_QA.test.cjs
      - name: Confirm no Firebase/Play/UID writes or releases
        run: echo 'OWNER_PROOF_QA_CANDIDATE_ONLY_NO_FIREBASE_NO_APK_NO_PLAY'
