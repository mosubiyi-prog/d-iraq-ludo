          python3 -m unittest discover -s test -p 'test_deda_100377_point04_wallet_account_scope_source.py'
          # Point05 PREFLIGHT ONLY: preserve 3 royal + 3 free classic slots,
          # pending retrieval of exact approved moonlit art. No substitution.
          python3 -m unittest discover -s test -p 'test_deda_100377_point05_avatar_preservation_preflight.py'
          # Point05 guard-only transformer tests; do NOT integrate absent or unapproved art.
          python3 -m py_compile tools/stage_deda_100377_point05_verified_moonlit_avatars.py
          python3 -m unittest discover -s test -p 'test_deda_100377_point05_verified_moonlit_gate.py'
          # Point12 is a read-only personal inventory; existing purchase stores stay put.
          python3 tools/stage_deda_100377_point12_my_store.py
          python3 -m unittest discover -s test -p 'test_deda_100377_point12_my_store_source.py'
          dart format lib/deda_100377_my_store_page_staged.dart
          flutter analyze lib/deda_100377_my_store_page_staged.dart
          flutter test test/deda_100377_point12_my_store_widget_test.dart
          flutter analyze lib/deda_100377_profile_free_inventory.dart
          flutter test test/deda_100377_point12_full_free_inventory_test.dart
          # Point11: replace the REAL profile Badges placeholder with the
          # distinct six earned LEVEL achievement preview. Release/unlock OFF.
          python3 tools/stage_deda_100377_point11_achievements_real_profile_nav.py
          python3 -m unittest discover -s test -p 'test_deda_100377_point11_real_profile_nav_source.py'
          # Point09: local profile preference save is frozen to the original
          # phone and signed Firebase UID across async SharedPreferences I/O.
          # This does NOT claim cross-device cloud cosmetic restoration.
          python3 tools/stage_deda_100377_point09_account_scoped_appearance_async.py
          python3 -m unittest discover -s test -p 'test_deda_100377_point09_account_scoped_appearance_async.py'
          dart format lib/deda_100377_level_achievements_page_staged.dart
          flutter analyze lib/deda_100377_level_achievements_page_staged.dart lib/deda_100377_level_achievement_badges_policy.dart
          flutter test test/deda_100377_point11_achievements_locked_preview_widget_test.dart
          # Point13 source-only. All visible IDs use verified active alias; original ID stays canonical.
          python3 -m unittest discover -s test -p 'test_deda_100377_point13_all_surfaces_source.py'
          flutter analyze lib/deda_100377_point13_unified_identity_projection_staged.dart
          flutter test test/deda_100377_point13_unified_identity_source_test.dart
          flutter test test/deda_100377_point01_lab_frame_checkout_contract_test.dart
          flutter analyze lib/deda_lab_frame_secure_checkout.dart lib/deda_lab_frame_purchase_action.dart
          flutter test test/deda_owner19_stage51_friend_alias_widget_test.dart
          echo 'PASS_100377_LEGACY_FRIEND_ORIGINAL_INPUT_PRESERVED_WITH_SPARK_OFF'
          flutter test test/deda_lab_premium_frame_artwork_test.dart
          flutter test test/deda_lab_verified_frame_catalog_test.dart
          flutter test test/deda_lab_three_royal_frames_free_actual_app_test.dart
          flutter test test/deda_100374_admin_premium_alias_recipient_bridge_test.dart
          flutter test test/deda_qa32_manager_original_owner_proof_test.dart
          flutter test test/deda_qa32_spark_free_public_identifier_directory_test.dart
          flutter test test/deda_qa32_public_recipient_live_bridge_test.dart
          flutter test test/deda_profile_visible_diamonds_test.dart
          flutter test test/deda_unified_currency_totals_test.dart
          # Legacy first-pass source test is replaced by the unified
          # task+store+profile account-scope test directly below.
          python3 -m unittest discover -s test -p 'test_deda_100377_wallet_all_screens_source.py'
          echo 'PASS_SIGNED_100377_WALLET_SOURCE_GUARD_MATCHES_REAL_STICKY_PROFILE_CARD'
          python3 -m unittest discover -s test -p 'test_deda_100374_profile_wallet_refresh_source.py'
          grep -q 'DEDA_QA32_SHARE_TO_VERIFIED_ACTIVE_PREMIUM_ALIAS_CANONICAL_ROUTE' lib/deda_backend.dart
          grep -q 'DEDA_QA32_SPARK_STAGE51_FRIEND_SEARCH_CANONICAL_NO_FUNCTIONS' lib/deda_stage51_verified_friend_alias_search.dart
          python3 -m py_compile tools/stage_deda_100375_spark_all_routing_on_rebuilt_source.py
          echo 'PASS 100377 premium owner GM+friends+shares+Spark, gift alerts, free royal, wallet'
          # QA source probe is optional diagnostics. Do NOT abort a signed
          # build merely because a private class was renamed/reformatted.
          python3 - <<'PY_ACCOUNT'
          from pathlib import Path
          s=Path('lib/main.dart').read_text()
          checks=['DEDA_QA32_ACCOUNT_ACTIVE_ALIAS_READONLY_DISPLAY_NO_DEPLOY',
                  'DEDA_100377_UNIFIED_REAL_TASK_COINS_AND_ALL_PERSONAL_DIAMONDS']
          for marker in checks:
            if marker not in s:
              raise SystemExit('SAFE_STOP_MISSING_REQUIRED_QA32_'+marker)
          print('PASS_100377_ACCOUNT_HERO_DIAGNOSTIC_NONBRITTLE')
          PY_ACCOUNT
          dart format lib/main.dart lib/deda_backend.dart lib/deda_exclusive_ids_admin_page.dart \
            lib/deda_stage71_free_id_cards.dart lib/deda_stage71_dual_admin_page.dart \
            lib/deda_stage71_free_manager_200_service.dart lib/deda_stage71_free_owned_use_profile.dart \
            lib/deda_stage74_id_gift_service.dart lib/deda_stage74_hadaya_identifier_section.dart lib/deda_stage75_unread_gift_badge.dart lib/deda_qa32_active_account_scope.dart lib/deda_qa32_live_friend_appearance.dart lib/admin_pages.dart \
            lib/deda_stage48_verified_active_profile_ink.dart lib/deda_verified_identifier_ink.dart \
            lib/deda_stage49_verified_share_id_badge.dart lib/deda_stage50_verified_friend_ink_badge.dart \
            lib/deda_stage51_verified_friend_alias_search.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/deda_backend.dart lib/deda_exclusive_ids_admin_page.dart \
            lib/deda_stage71_free_id_cards.dart lib/deda_stage71_dual_admin_page.dart \
            lib/deda_stage71_free_manager_200_service.dart lib/deda_stage71_free_owned_use_profile.dart \
            lib/deda_stage74_id_gift_service.dart lib/deda_stage74_hadaya_identifier_section.dart lib/admin_pages.dart \
            lib/deda_stage42_verified_sale_panel.dart lib/deda_stage48_verified_active_profile_ink.dart \
            lib/deda_stage49_verified_share_id_badge.dart lib/deda_stage50_verified_friend_ink_badge.dart \
            lib/deda_stage51_verified_friend_alias_search.dart
          flutter test test/deda_stage75_gift_unread_badge_test.dart
