          flutter test test/deda_100377_point09_account_switch_fallback_widget_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/deda_stage71_free_owned_use_profile.dart
          # Point13: actual reconstructed app includes stage71 owner + stage50 friend ID dependencies.
          flutter test test/deda_100377_point13_unified_identity_source_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/deda_100377_point13_unified_identity_projection_staged.dart
          flutter test test/deda_qa32_public_royal_hero_parity_widget_test.dart
          flutter test test/deda_qa32_live_friend_appearance_test.dart
          flutter test test/deda_100374_nonid_public_readability_test.dart
          flutter test test/deda_100374_nonid_diamond_gift_nav_test.dart
          flutter test test/deda_stage71_four_free_cards_dual200_widget_test.dart test/deda_makani_100337_test.dart test/deda_stage71_real_store_four_free_integration_test.dart \
