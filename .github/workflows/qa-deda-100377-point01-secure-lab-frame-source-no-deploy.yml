name: DEDA 100377 Point01 Secure LAB Frames Real Source QA NO DEPLOY
on:
  push:
    branches:
      - deda-100377-13-points-sequential-qa-2026-10-22
    paths:
      - '.github/workflows/qa-deda-100377-point01-secure-lab-frame-source-no-deploy.yml'
      - 'lib/deda_lab_frame_secure_checkout.dart'
      - 'lib/deda_lab_frame_purchase_action.dart'
      - 'tools/stage_deda_100377_point01_lab_frame_checkout_private.py'
      - 'test/deda_100377_point01_lab_frame_checkout_contract_test.dart'
      - 'test/test_deda_100377_point07_received_friend_source.py'
      - 'test/deda_100377_point07_received_friend_identity_test.dart'
      - 'lib/deda_stage74_hadaya_identifier_section.dart'
      - 'test/test_deda_100377_point08_gift_inbox_account_scope.py'
      - 'tools/stage_deda_100359_stage75_id_gift_unread_badge.py'
      - 'test/test_deda_100377_point08_stage75_compat_source.py'
      - 'lib/deda_stage71_free_owned_use_profile.dart'
      - 'test/test_deda_100377_point09_cross_account_restore_source.py'
      - 'tools/stage_deda_100377_point09_account_scoped_appearance_async.py'
      - 'test/test_deda_100377_point09_account_scoped_appearance_async.py'
      - 'test/deda_100377_point09_account_switch_fallback_widget_test.dart'
      - 'lib/deda_100377_my_store_page_staged.dart'
      - 'lib/deda_100377_profile_free_inventory.dart'
      - 'test/deda_100377_point12_full_free_inventory_test.dart'
      - 'tools/stage_deda_100377_point11_achievements_real_profile_nav.py'
      - 'test/test_deda_100377_point11_real_profile_nav_source.py'
      - 'lib/deda_100377_level_achievements_page_staged.dart'
      - 'tools/stage_deda_100377_point12_my_store.py'
      - 'test/deda_100377_point12_my_store_widget_test.dart'
      - 'test/test_deda_100377_point12_my_store_source.py'
      - 'test/test_deda_100377_point13_all_surfaces_source.py'
      - 'lib/deda_100377_point13_unified_identity_projection_staged.dart'
      - 'test/deda_100377_point13_unified_identity_source_test.dart'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-qa32-point01-lab-frame-source-no-deploy
  cancel-in-progress: true
jobs:
  reconstruct-real-store:
    runs-on: ubuntu-24.04
    # The EXACT baseline reconstruction validates the original signing
    # configuration even for source-only QA. No APK/AAB is produced here.
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect signing, original APK and released Spark baseline
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet d14e573d1f7f1ab67deff04222aca13c6f928553 -- \
            android/ firebase.json firestore.rules lib/main.dart \
            lib/deda_backend.dart lib/deda_social_service.dart \
            assets/deda_home_bg.jpg assets/deda_login_bg.jpg \
            assets/deda_royal_frames/
          python3 - <<'PY_ORIGINALS'
          import hashlib,json
          from pathlib import Path
          rows=json.loads(Path('docs/DEDA_LAB_16_VERIFIED_FRAME_CATALOG_STAGED_ONLY_2026-10-21.json').read_text())['frames']
          paid=[x for x in rows if x['initial_price_diamonds']==1000]
          assert len(paid)==13
          for item in paid:
            p=Path('assets/deda_lab_frames')/(item['id']+'.webp')
            assert p.stat().st_size==item['bytes']
            assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
          print('PASS native source 13 exact original premium LAB WebPs')
          PY_ORIGINALS
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          test -f lib/deda_qa32_spark_public_identifier_directory.dart
          test -f lib/deda_qa32_public_recipient_resolver.dart
          test -f lib/deda_stage71_free_owned_use_profile.dart
          grep -q 'DEDA_QA32_SPARK_PUBLIC_IDS_LIVE' lib/deda_qa32_spark_public_identifier_directory.dart
          grep -q 'DEDA_QA32_SHARE_TO_VERIFIED_ACTIVE_PREMIUM_ALIAS_CANONICAL_ROUTE' tools/stage_deda_100375_spark_all_routing_on_rebuilt_source.py
          grep -q 'DEDA_QA32_STAGE51_SPARK_FRIEND_INTEGRATES_IN_EXISTING_SEARCH' tools/stage_deda_100375_spark_all_routing_on_rebuilt_source.py
          echo 'PASS original signed app unmodified, owner-approved Spark-only QA'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Reconstruct EXACT approved 100359 generated app, prohibit APK compilation
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python3 -m py_compile tools/qa_reconstruct_100359_then_stage35_no_apk.py
          # Capture the EXACT already-signed 100359 build invocation before
          # the approved no-build reconstruction replaces it with an echo.
          python3 - <<'CAPTURE_SIGNED_SOURCE'
          from pathlib import Path
          p=Path('tools/qa_reconstruct_100359_then_stage35_no_apk.py')
          s=p.read_text()
          needle="    adjusted = original.replace(matches[0],"
          assert s.count(needle)==1, 'SAFE_STOP original signed command capture point moved'
          s=s.replace(needle,
             "    Path('/tmp/deda_stage71_exact_signed_100359_command.txt').write_text(matches[0]+'\\n')\n"
             +needle,1)
          p.write_text(s)
          CAPTURE_SIGNED_SOURCE
          python3 tools/qa_reconstruct_100359_then_stage35_no_apk.py
          test -s /tmp/deda_stage71_exact_signed_100359_command.txt
          bash -e /tmp/deda_100340_play_aab.sh
          grep -q "DEDA_STAGE17_STORE_CARDS_BLUE_OWNED_IDS_2026_10_19" lib/main.dart
          grep -q "DEDA_STAGE31_OWNER_QA_LAUNCH_SANDBOX_ONLY_2026_10_19" lib/main.dart
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          echo 'PASS: actual approved 100359 Flutter UI recreated with NO output APK'
      - name: Apply compact real four-foil preview to reconstructed app and check Flutter
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage_deda_100360_compact_four_real_foils_after_100359.py
          python3 tools/stage_deda_100360_remove_fake_store_sandbox.py
          python3 tools/stage_deda_100360_real_admin_foils_on_reconstructed_source.py
          python3 tools/stage_deda_100360_verified_group002_only_store.py
          python3 -m unittest discover -s test -p 'test_deda_stage48_real_profile_active_ink.py'
          python3 tools/stage_deda_100360_profile_active_ink_after_100359.py
          python3 -m unittest discover -s test -p 'test_deda_owner19_stage49_original_qr_share.py'
          python3 tools/stage_deda_100360_share_premium_ink_after_stage48.py
          python3 -m unittest discover -s test -p 'test_deda_stage50_friend_ink_source.py'
          python3 tools/stage_deda_100360_friend_visible_ink_after_stage49.py
          python3 -m unittest discover -s test -p 'test_deda_stage51_friend_alias_source.py'
          python3 tools/stage_deda_100360_friend_alias_search_after_stage50.py
          python3 tools/stage_deda_owner_place_cross_device_recovery_stage64.py
          python3 tools/stage_deda_100359_stage71_free_4_cards_dual_admin200.py
          python3 tools/stage_deda_100359_stage74_hadaya_id_gift_inbox.py
          python3 tools/stage_deda_100359_stage75_id_gift_unread_badge.py
          python3 tools/stage_deda_100359_qa32_account_active_header.py
          python3 tools/stage_deda_100359_qa32_share_verified_id_visual.py
          python3 tools/stage_deda_100359_qa32_public_friend_premium_card.py
          python3 tools/stage_deda_100359_qa32_received_location_sender_alias.py
          python3 tools/stage_deda_100359_qa32_public_profile_royal_parity.py
          python3 tools/stage_deda_100359_qa32_live_public_friend_appearance.py
          # Exactly one non-ID runtime repair: diamond-gift badge after login,
          # account switch or foreground return. Never modify gift backend.
          python3 tools/stage_deda_100374_nonid_diamond_gift_badge_rearm.py
          python3 tools/stage_deda_lab_three_existing_royal_frames_free_2026_10_21.py
          python3 tools/stage_deda_100374_admin_gift_original_and_premium_alias_ui.py
          python3 tools/stage_deda_100374_wallet_total_diamonds_coins_display_only.py
          python3 tools/stage_deda_100374_profile_wallet_retry_read_only.py
          python3 tools/stage_deda_100377_unified_currency_everywhere.py
          python3 tools/stage_deda_100375_spark_all_routing_on_rebuilt_source.py
          echo 'PASS_STAGE51_SPARK_ALIAS_FINDS_EXISTING_CANONICAL_UID_WITHOUT_REWRITING_SOCIAL_SERVICE'
          python3 tools/stage_deda_100375_all_16_lab_original_royal_frames_native.py
          python3 tools/stage_deda_100377_point01_lab_frame_checkout_private.py
          # Owner 13-point staged sequence: source-only Point02 name fix AFTER secure Point01.
          python3 tools/stage_deda_100377_point02_exact_frame_names.py
          python3 -m unittest discover -s test -p 'test_deda_100377_point02_exact_frame_names_source.py'
          # Point03 checks existing three royal FREE save/use, sticky preview, public owner frame.
          python3 -m unittest discover -s test -p 'test_deda_100377_point03_free_royal_sticky_source.py'
