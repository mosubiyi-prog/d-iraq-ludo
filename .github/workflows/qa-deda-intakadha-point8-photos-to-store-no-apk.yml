name: DEDA «إنت كدها» Point 8 - Replace Photos with ID Store Tile - NO APK
on:
  push:
    branches:
      - deda-intakadha-ids-cards-stage1-2026-10-18
    paths:
      - '.github/workflows/qa-deda-intakadha-point8-photos-to-store-no-apk.yml'
      - 'tools/stage_deda_intakadha_point8_photos_to_id_shop_2026_10_18.py'
      - 'test/test_deda_intakadha_point8_photos_to_id_shop_2026_10_18.py'
      - 'test/deda_intakadha_point8_store_tile_widget_test.dart'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-intakadha-point8-no-apk
  cancel-in-progress: true
jobs:
  original-tile-and-scoped-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify 100356 phone-verified backup and forbid production edits
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin backup-deda-100356-phone-ui-verified-2026-10-18
          test "$(git rev-parse origin/backup-deda-100356-phone-ui-verified-2026-10-18)" = "4373b8b30eadc5a284554ca7c021c350e0732caf"
          python3 - <<'PY'
          import re, subprocess
          changed=set(subprocess.check_output(
            ["git","diff","--name-only","4373b8b30eadc5a284554ca7c021c350e0732caf","HEAD"],
            text=True).splitlines())
          allowed=[
            r"docs/DEDA_INTAKADHA_16_POINTS_STAGE1_CHECKPOINT_2026-10-18\.md",
            r"tools/stage_deda_intakadha_point[2-8]_[a-z0-9_]+_2026_10_18\.py",
            r"test/test_deda_intakadha_point[2-8]_[a-z0-9_]+_2026_10_18\.py",
            r"test/deda_intakadha_point[5-8]_[a-z0-9_]+\.dart",
            r"\.github/workflows/qa-deda-intakadha-point[2-8]-[a-z0-9-]+\.yml",
          ]
          bad=[f for f in changed if not any(re.fullmatch(p, f) for p in allowed)]
          assert not bad, f"SAFE_STOP unauthorized source changes: {bad}"
          assert not any(f.startswith(("lib/","assets/","android/","functions/")) for f in changed)
          print("PASS: 100356 protected and real source/account/wallet/navigation untouched")
          PY
      - name: Point8 exact historical-Photos tile and stages 2-8 regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/stage_deda_intakadha_point8_photos_to_id_shop_2026_10_18.py test/test_deda_intakadha_point8_photos_to_id_shop_2026_10_18.py
          for i in 2 3 4 5 6 7 8; do
            case "$i" in
              2) f=test_deda_intakadha_point2_member_caption_2026_10_18.py ;;
              3) f=test_deda_intakadha_point3_name_level_layout_2026_10_18.py ;;
              4) f=test_deda_intakadha_point4_rectangular_id_geometry_2026_10_18.py ;;
              5) f=test_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py ;;
              6) f=test_deda_intakadha_point6_profile_id_slot_2026_10_18.py ;;
              7) f=test_deda_intakadha_point7_four_card_management_2026_10_18.py ;;
              8) f=test_deda_intakadha_point8_photos_to_id_shop_2026_10_18.py ;;
            esac
            python3 -m unittest discover -s test -p "$f" -v
          done
          echo 'PASS: original Photos replaced ONCE in same purple 112dp tile only, store page not activated'
  isolated-flutter-shop-tile:
    needs: original-tile-and-scoped-source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Compile Flutter _featureCard from EXACT historical source and test small screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deda-p8-card/lib" "$RUNNER_TEMP/deda-p8-card/test"
          python3 - "$RUNNER_TEMP/deda-p8-card/lib/deda_intakadha_point8_store_tile_fixture.dart" <<'PY'
          import ast, importlib.util, sys
          from pathlib import Path
          def val(filename, var):
              tree=ast.parse(Path(filename).read_text(encoding="utf-8"))
              choices=[s.value.value for s in tree.body if isinstance(s,ast.Assign)
                       and any(isinstance(t,ast.Name) and t.id==var for t in s.targets)
                       and isinstance(s.value,ast.Constant)]
              assert len(choices)==1, "SAFE_STOP historical profile code changed: "+var
              return choices[0]
          gen="tools/profile_phase2_100261_2026_10_04.py"
          cards="tools/profile_stage_cards_fix_100263_2026_10_04.py"
          src=val(gen,"phase2_code")
          before,after=val(cards,"photos_card_old"),val(cards,"photos_card_new")
          assert src.count(before)==1
          src="// DEDA_PROFILE_STAGE_CARDS_FIX_100263\n" + (
              "// DEDA_INTAKADHA_POINT5_FOUR_PREMIUM_ID_ARTWORKS_2026_10_18\n"
              "// DEDA_INTAKADHA_POINT6_VERIFIED_ID_PROFILE_SLOT_2026_10_18\n"
              "// DEDA_INTAKADHA_POINT7_FOUR_CARDS_UNDER_ID_MANAGEMENT_2026_10_18\n"
          )+src.replace(before,after,1)
          p="tools/stage_deda_intakadha_point8_photos_to_id_shop_2026_10_18.py"
          spec=importlib.util.spec_from_file_location("deda_shop_tile_p8",p)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          result=mod.apply(src)
          a=result.index(mod.CARD)
          b=result.index(mod.BIO,a)
          method=result[a:b]
          fixture="""
          import 'package:flutter/material.dart';

          class DedaPoint8StoreTileFixture extends StatelessWidget {
            final double width;
            final bool compact;
            final VoidCallback onTap;
            const DedaPoint8StoreTileFixture({
              super.key, required this.width, required this.compact, required this.onTap,
            });
            @override
            Widget build(BuildContext context) {
              return SizedBox(
                width: width,
                child: _featureCard(
                  icon: compact ? Icons.storefront_rounded : Icons.edit_rounded,
                  title: compact ? 'متجر المعرّفات' : 'تعديل الملف',
                  subtitle: compact ? 'معرّفات مميزة' : 'بيانات الحساب وإعداداته',
                  colors: compact
                      ? const <Color>[Color(0xFF914BE1), Color(0xFF6530B7)]
                      : const <Color>[Color(0xFF0877C9), Color(0xFF07579B)],
                  compactContent: compact, onTap: onTap,
                ),
              );
            }
          """[:-0] if False else """
          import 'package:flutter/material.dart';

          class DedaPoint8StoreTileFixture extends StatelessWidget {
            final double width;
            final bool compact;
            final VoidCallback onTap;
            const DedaPoint8StoreTileFixture({
              super.key, required this.width, required this.compact, required this.onTap,
            });
            @override
            Widget build(BuildContext context) {
              return SizedBox(
                width: width,
                child: _featureCard(
                  icon: compact ? Icons.storefront_rounded : Icons.edit_rounded,
                  title: compact ? 'متجر المعرّفات' : 'تعديل الملف',
                  subtitle: compact ? 'معرّفات مميزة' : 'بيانات الحساب وإعداداته',
                  colors: compact
                      ? const <Color>[Color(0xFF914BE1), Color(0xFF6530B7)]
                      : const <Color>[Color(0xFF0877C9), Color(0xFF07579B)],
                  compactContent: compact, onTap: onTap,
                ),
              );
            }
          """
          # Insert the original _featureCard method INSIDE the fixture class,
          # not as a separate replacement or imitation.
          idx=fixture.rfind("\n          }")
          assert idx>=0
          fixture=fixture[:idx] + "\n" + method + fixture[idx:]
          Path(sys.argv[1]).write_text(fixture,encoding="utf-8")
          print("PASS: Flutter fixture generated from exact real 100261/100263 source and stage8 changes")
          PY
          cp test/deda_intakadha_point8_store_tile_widget_test.dart "$RUNNER_TEMP/deda-p8-card/test/"
          cat > "$RUNNER_TEMP/deda-p8-card/pubspec.yaml" <<'YAML'
          name: deda_p8_store_tile_fixture
          description: Isolated 112dp identifier-store tile visual safety
          version: 0.0.1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
          YAML
          cd "$RUNNER_TEMP/deda-p8-card"
          dart format lib/deda_intakadha_point8_store_tile_fixture.dart test/deda_intakadha_point8_store_tile_widget_test.dart
          flutter pub get
          flutter test test/deda_intakadha_point8_store_tile_widget_test.dart --reporter expanded
          echo "PASS: shop tile same 112dp, legible Arabic on 320/360/430, all other tiles old size"
          echo "PASS: NO APK, no Play, no account/diamond/FireStore modification"
