name: DEDA Jamal Stage25 Protect Users Existing Diamonds Flutter QA NO DEPLOY

on:
  push:
    branches:
      - deda-jamal-stage25-existing-diamonds-display-protection-2026-10-19
    paths:
      - 'lib/deda_owner_diamond_provenance_preview_stage25.dart'
      - 'test/deda_owner_diamond_provenance_stage25_test.dart'
      - '.github/workflows/qa-deda-jamal-stage25-preserve-existing-diamonds-private-no-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-jamal-stage25-user-visible-63-preserved
  cancel-in-progress: true

jobs:
  guard-existing-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm installed and backend originals untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 881889d535d467aed3a3d4c8f106cda5553a9338 -- \
            lib/main.dart lib/deda_backend.dart \
            lib/deda_profile_visible_diamonds.dart \
            android/ assets/ firestore.rules firebase.json functions/ \
            server_private/ catalogs/ pubspec.yaml pubspec.lock \
            tools/add_diamonds_reward_100259_2026_10_04.py \
            tools/deda_stage18_private_atomic_identifier_checkout_2026_10_19.js \
            tools/deda_intakadha_point13_atomic_id_card_checkout_2026_10_19.js
          ! grep -q 'deda_owner_diamond_provenance_preview_stage25' lib/main.dart
          ! grep -q 'deda_owner_diamond_provenance_preview_stage25' functions/index.js
          echo 'PASS: old ad reward and real users unchanged; Stage25 preview not mounted'
  verify-flutter:
    needs: guard-existing-production
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Analyze future wallet UI model, without changing installed app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format \
            lib/deda_owner_diamond_provenance_preview_stage25.dart \
            test/deda_owner_diamond_provenance_stage25_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/deda_owner_diamond_provenance_preview_stage25.dart \
            test/deda_owner_diamond_provenance_stage25_test.dart
          flutter test test/deda_owner_diamond_provenance_stage25_test.dart
          flutter test test/deda_profile_visible_diamonds_test.dart
          echo 'PASS: owner shown 63 never reset/merged; existing GM +3 profile display retained'
  done:
    needs: [guard-existing-production,verify-flutter]
    runs-on: ubuntu-24.04
    steps:
      - name: Read only testing
        run: |
          echo 'PASS: 100358 original signed app and all Google AdMob rewards stay untouched'
