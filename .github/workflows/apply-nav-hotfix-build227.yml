name: Apply Build 227 navigation hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - nav-hotfix-build227-2026-09-30
    paths:
      - tools/nav_hotfix_build227_2026_09_30.py
      - .github/workflows/apply-nav-hotfix-build227.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout navigation hotfix branch
        uses: actions/checkout@v4
        with:
          ref: nav-hotfix-build227-2026-09-30
          fetch-depth: 0

      - name: Apply navigation hotfix
        run: python3 tools/nav_hotfix_build227_2026_09_30.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze navigation source
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/main.dart

      - name: Commit validated navigation changes
        run: |
          if git diff --quiet -- lib/main.dart; then
            echo "No navigation source changes were needed."
            exit 0
          fi
          git config user.name "DEDA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Fix Build 227 navigation follow lag and reroute"
          git push origin HEAD:nav-hotfix-build227-2026-09-30
