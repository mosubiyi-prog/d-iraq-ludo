name: DEDA Stage61 original account-scoped league UI 2-home-source QA NO APK NO DEPLOY
on:
  push:
    branches:
      - deda-weekly-stage61-original-account-scope-home-integration-no-deploy-2026-10-28
    paths:
      - 'lib/deda_weekly_account_view_gate.dart'
      - 'tools/app_stability/app_package/bind_weekly_account_scope_stage61.py'
      - 'test/deda_weekly_account_view_gate_stage61_test.dart'
      - '.github/workflows/qa-deda-weekly-stage61-original-account-home-no-deploy.yml'
      - 'docs/DEDA_WEEKLY_STAGE61_ACCOUNT_SCOPE_ORIGINAL_TWO_HOME_ROUTES_2026-10-28.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-stage61-private-original-ui-account-scope-no-deploy
  cancel-in-progress: true
jobs:
  original-source-and-quiz-immutable:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only Stage61 five new paths; no quiz, original app or real backend modifications
        run: |
          set -euo pipefail
          BASE=804fae5fa48ce50918268ed9c1fc46a65c0b0a21
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE" HEAD > /tmp/deda-stage61-allowlist.txt
          cat /tmp/deda-stage61-allowlist.txt
          while IFS= read -r path; do
            case "$path" in
              lib/deda_weekly_account_view_gate.dart|\
              tools/app_stability/app_package/bind_weekly_account_scope_stage61.py|\
              test/deda_weekly_account_view_gate_stage61_test.dart|\
              .github/workflows/qa-deda-weekly-stage61-original-account-home-no-deploy.yml|\
              docs/DEDA_WEEKLY_STAGE61_ACCOUNT_SCOPE_ORIGINAL_TWO_HOME_ROUTES_2026-10-28.md) ;;
              *) echo "REFUSE UNAPPROVED PATH: $path"; exit 1 ;;
            esac
          done < /tmp/deda-stage61-allowlist.txt
          git diff --quiet "$BASE" -- \
            lib/main.dart lib/traffic_quiz_page.dart lib/deda_backend.dart \
            lib/deda_social_service.dart lib/deda_pin_auth.dart \
            lib/admin_pages.dart lib/deda_weekly_leaderboard_page.dart \
            lib/deda_weekly_leaderboard_safe_screen.dart \
            functions/index.js firestore.rules firebase.json \
            pubspec.yaml pubspec.lock android/ assets/ \
            tools/app_stability/app_package/prepare.py
          python3 -m py_compile \
            tools/app_stability/app_package/bind_weekly_account_scope_stage61.py
          python3 -m unittest discover -s tools/app_stability/tests \
            -p 'test_weekly_stage28_tasks_cta_original_route.py' -v
          echo 'PASS: no original Android/quiz/wallet/back-end changes'
  compile-restored-original-account-scoped-ui:
    needs: original-source-and-quiz-immutable
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
      - name: Reconstruct exact original DEDA candidate through Stage28; bind Stage61 to BOTH existing home routes
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/deda-stage61-original-source-no-apk"
          flutter create --platforms=android --org com.diraq.ludo --project-name d_iraq_ludo "$TARGET"
          python3 tools/app_stability/app_package/prepare.py "$TARGET" --variant candidate
          python3 tools/app_stability/app_package/bind_weekly_stage13.py "$TARGET"
          python3 tools/app_stability/app_package/bind_active_id_boot_prewarm_stage14.py "$TARGET"
          python3 tools/app_stability/app_package/bind_active_id_measured_startup_stage16.py "$TARGET"
          python3 tools/app_stability/app_package/bind_weekly_private_trial_stage17.py "$TARGET"
          python3 tools/app_stability/app_package/bind_weekly_full_qa_stage18.py "$TARGET"
          python3 tools/app_stability/app_package/verify_rank_card_tap_stage19.py "$TARGET"
          python3 tools/app_stability/app_package/bind_weekly_admin_league_stage27.py "$TARGET"
          python3 tools/app_stability/app_package/bind_weekly_tasks_cta_stage28.py "$TARGET"
          python3 tools/app_stability/app_package/bind_weekly_account_scope_stage61.py "$TARGET"
          TARGET="$TARGET" python3 - <<'PY'
          import json,os
          from pathlib import Path
          project=Path(os.environ['TARGET'])
          data=json.loads((project/'internal-build-inputs.json').read_text())
          proof=data['weeklyStage61']
          assert data['versionCode']==100396, 'No new APK build/version should be planned'
          assert proof['officialHomeRoutesScoped']==2
          assert proof['originalAnonymousUidAndAccountCaptured']
          assert proof['reactiveAuthSignOutInvalidation']
          assert proof['localQaXpScopedToCapturedViewer']
          for field in [
            'verifiedGlobalRankingsAvailable','actualWeeklyPrizePayoutEnabled',
            'realCrossDeviceAccountMigrationEnabled','serverAccountBindingProofProvided',
            'walletOrXpChanged','quizBankChanged',
            'firebaseRulesOrProductionFunctionsChanged','apkBuilt',
          ]: assert proof[field] is False, field
          assert data['completeOwnerDelivery'] is False
          assert data['financialRestoreEnabled'] is False
          assert data['productionExecutionPerformed'] is False
          main=(project/'lib/main.dart').read_text()
          assert main.count('DedaWeeklyAccountViewGate(')==2
          assert main.count('DedaLeaderboardHomeCard(')==2
          assert 'categoryCard(restaurant)' not in main
          assert main.count('localTrialAccountKey: viewerAccount')==2
          assert main.count('currentAccountStillAuthorized: stillSameViewer')==2
          assert main.count('authEvents: FirebaseAuth.instance.authStateChanges()')==2
          print('PASS original two homes display-account scoped with anon Firebase UID; NO server ranking or awards')
          PY
      - name: Compile actual restored Flutter files; run pure account switching widget tests (NO APK)
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/deda-stage61-original-source-no-apk"
          cp test/deda_weekly_account_view_gate_stage61_test.dart "$TARGET/test/"
          cd "$TARGET"
          flutter pub get --enforce-lockfile
          # Old full original main.dart already contains historical deprecation /
          # unused warnings. Require zero analyzer ERRORS, not zero old warnings.
          # Strictly lint the NEW isolated account-scoping file first.
          dart analyze lib/deda_weekly_account_view_gate.dart
          set +e
          dart analyze --format=machine lib/main.dart lib/deda_weekly_leaderboard_safe_screen.dart \
            > "$RUNNER_TEMP/deda-stage61-original-analyzer.txt" 2>&1
          analyzer_status=$?
          set -e
          if grep -q '^ERROR|' "$RUNNER_TEMP/deda-stage61-original-analyzer.txt"; then
            cat "$RUNNER_TEMP/deda-stage61-original-analyzer.txt"
            echo 'STOP: genuine analyzer ERROR in restored original app'
            exit 1
          fi
          if [ "$analyzer_status" -ne 0 ] && \
             ! grep -Eq '^(WARNING|INFO)\\|' "$RUNNER_TEMP/deda-stage61-original-analyzer.txt"; then
            cat "$RUNNER_TEMP/deda-stage61-original-analyzer.txt"
            echo 'STOP: analyzer failed without recognized legacy warnings'
            exit 1
          fi
          echo 'PASS: no original-app analyzer ERRORS; prior lint warnings are not rewritten here.'
          flutter test test/deda_weekly_account_view_gate_stage61_test.dart --no-pub
          test -z "$(find "$TARGET" -name '*.apk' -type f -print -quit)"
          echo 'PASS: genuine restored original Flutter source verified, NO APK.'
      - name: Explicitly block production migration, awards, source changes or Play deployment
        run: |
          echo 'This is original reconstructed Flutter league/account display scoping, NOT a real verified server leaderboard.'
          echo 'DedaPinAuth anonymous login + mutable install trust is not upgraded here.'
          echo 'XP and bonuses do not become spendable; no real diamonds or premium IDs touched.'
          echo 'NO traffic question bank change, by owner explicit deferral.'
          echo 'NO APK/AAB, NO Play, NO production Firestore Rules/Cloud Functions/AppCheck deploy.'
          echo 'Pre-APK complete owner approval and actual phone/tablet QA remain mandatory.'
