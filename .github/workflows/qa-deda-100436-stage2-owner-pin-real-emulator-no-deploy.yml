name: DEDA Stage2 Real Auth & Firestore PIN Proof Emulator QA — NO DEPLOY

on:
  push:
    branches:
      - deda-100436-stage2-recovery-buildable-integration-qa-2026-11-05
    paths:
      - 'functions/test/deda_owner_pin_real_auth_firestore_emulator.stage2.test.cjs'
      - 'functions/deda_owner_pin_verify_private_v1.js'
      - 'functions/deda_pin_manual_recovery_compat_private_v1.js'
      - '.github/workflows/qa-deda-100436-stage2-owner-pin-real-emulator-no-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-local-emulator-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      GOOGLE_CLOUD_PROJECT: demo-deda-100436-stage2-pin-qa
      GCLOUD_PROJECT: demo-deda-100436-stage2-pin-qa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce protected owner reference and no cloud account
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e fea54d7db2e8a24a74267f04a14c9572bcb408ee^{commit}
          git diff --exit-code fea54d7db2e8a24a74267f04a14c9572bcb408ee HEAD -- \
            assets android firestore.rules firebase.json storage.rules
          test "$GOOGLE_CLOUD_PROJECT" = "demo-deda-100436-stage2-pin-qa"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          echo SAFE_DEMO_PROJECT_ONLY_NO_PRODUCTION_FIREBASE
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install isolated QA dependencies (no deploy)
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --no-save --no-audit --no-fund --ignore-scripts
          mkdir -p "$RUNNER_TEMP/deda-stage2-firebase-cli"
          npm install --prefix "$RUNNER_TEMP/deda-stage2-firebase-cli" \
            --no-save --no-audit --no-fund --ignore-scripts firebase-tools@13.35.1
          node --check functions/deda_owner_pin_verify_private_v1.js
          node --check functions/test/deda_owner_pin_real_auth_firestore_emulator.stage2.test.cjs
      - name: Create local-only Firebase Emulator config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          out=Path(os.environ['RUNNER_TEMP'])/'deda-stage2-pin-emulator.json'
          out.write_text(json.dumps({
            'firestore':{'rules':str(Path('firestore.rules').resolve())},
            'emulators':{
              'firestore':{'host':'127.0.0.1','port':8098},
              'auth':{'host':'127.0.0.1','port':9099},
              'ui':{'enabled':False}
            }
          }))
          with open(os.environ['GITHUB_ENV'],'a') as fd:
            fd.write('DEDA_STAGE2_FIREBASE_CONFIG='+str(out)+'\n')
          PY
          test -s "$RUNNER_TEMP/deda-stage2-pin-emulator.json"
          test "$(realpath "$RUNNER_TEMP/deda-stage2-pin-emulator.json")" != "$(realpath firebase.json)"
      - name: Run true Auth + Firestore Emulator server-side original UID proof
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/deda-stage2-firebase-cli/node_modules/.bin/firebase" \
            emulators:exec --project demo-deda-100436-stage2-pin-qa \
            --config "$DEDA_STAGE2_FIREBASE_CONFIG" \
            --only auth,firestore --non-interactive \
            'node --test functions/test/deda_owner_pin_real_auth_firestore_emulator.stage2.test.cjs'
          echo PASS_REAL_AUTH_FIRESTORE_EMULATOR_STAGE2_PIN_PROOF
      - name: Explicit QA limits
        run: |
          echo "NO_APP_CHECK_ATTESTATION_VERIFIED"
          echo "NO_FUNCTIONS_CALLABLE_TRANSPORT_VERIFIED"
          echo "NO_ANDROID_DEVICE_QA_NO_APK_NO_DEPLOY_NO_PLAY"
