name: DEDA 100442 scoped old UID and archive evidence READ ONLY NO DEPLOY
on:
  push:
    branches:
      - deda-100441-source-audit-isolated-recovery-2026-11-12
    paths:
      - '.github/workflows/deda-100442-abc-uid-fingerprint-scoped-readonly-no-deploy.yml'
      - 'tools/deda_100442_current_uid_abc_fingerprints_readonly.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-100442-abc-fingerprint-readonly-no-deploy
  cancel-in-progress: false

jobs:
  compare-only-historic-uid-pseudonyms:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DEDA_PRIMARY_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove protected Firebase production source remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 958ed9a3c9cce0f207e98d8956e8b659e1ff7246 HEAD -- \
            functions/index.js firestore.rules storage.rules firebase.json \
            android assets pubspec.yaml pubspec.lock
          python3 -m py_compile tools/deda_100442_current_uid_abc_fingerprints_readonly.py
          python3 - <<'PY'
          from pathlib import Path
          script = Path("tools/deda_100442_current_uid_abc_fingerprints_readonly.py").read_text()
          assert "DEDA_PRIMARY_FIREBASE_SA" in script
          for forbidden in (".set(", ".update(", ".delete(", ".add(", "create_custom_token", "revoke_refresh_tokens"):
              assert forbidden not in script, f"Unexpected Firebase mutation: {forbidden}"
          assert '"ownerUid"' in script and '"createdUid"' in script
          assert 'def inspect_archived_original_source' in script
          assert 'deda_progress_evidence' in script
          assert 'deda_purchase_evidence' in script
          assert 'limit(26).select(fields)' in script
          assert '"records.localSnapshot"' not in script
          assert 'record.get("pin")' not in script and '"pin"' not in script
          assert '["publicId", "balance"]' in script
          assert 'say("RECEIVED_GIFT_WALLET"' in script
          assert 'print(wallet' not in script and 'print(account' not in script
          assert '"admin"' not in script
          assert 'def inspect_existing_assets_readonly' in script
          assert 'def inspect_historical_auth_timeline' in script
          assert 'firebase_auth.get_user(uid, app=app)' in script
          assert 'AUTH_CREATION_ORDER_IS_NOT_INDEPENDENT_OWNERSHIP_PROOF' in script
          assert 'firebase_auth.update_user(' not in script
          assert 'firebase_auth.create_user(' not in script
          assert 'deda_diamond_gifts' in script and 'deda_friendships' in script
          assert 'deda_lab_frame_receipts' in script
          assert 'deda_stage66_card_receipts' in script
          assert 'OLD_SOURCE_ARCHIVE_IS_NOT_OWNERSHIP_PROOF_OR_SPENDABLE_BALANCE' in script
          print("PASS_NO_UID_AUTH_RULES_DATA_OR_PLAY_MUTATION")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audited production Firestore READ ONLY SDK
        run: python3 -m pip install --quiet google-cloud-firestore==2.21.0 firebase-admin==6.9.0
      - name: Read exact owner-scoped historic UID fingerprints and bounded progress/purchase metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/deda_100442_current_uid_abc_fingerprints_readonly.py
      - name: Finish without authentication or Firebase deployment
        run: echo PASS_NO_LOGIN_NO_FIREBASE_WRITE_NO_UID_CHANGE_NO_APK_NO_PLAY
