name: Build DEDA 100308 True Pitch Driver

on:
  push:
    branches:
      - driver-true-pitch-100308-2026-10-08
    paths:
      - '.github/workflows/build-apk-100308-true-pitch-driver.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100308 branch
        uses: actions/checkout@v4

      - name: Setup Java 21 for MapLibre 0.27.1
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100308
        run: bash tools/build_100308_true_pitch_driver.sh

      - name: Upload APK 100308
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100308-true-pitch-driver-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
