name: DEDA 100374 Premium Alias All Surfaces Canonical No Deploy
on:
  push:
    branches: [deda-100374-ids-qa32-frames-deferred-2026-10-21]
    paths: ['.github/workflows/qa-deda-100374-premium-all-surfaces-firstpass-no-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-recipient-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Firebase ownership proof and public canonical alias contract
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/deda_qa32_public_alias_resolver_NOT_EXPORTED.js
          node --check functions/deda_100374_qa32_verified_public_gift_callables_NOT_EXPORTED.js
          node --test test/deda_100374_verified_gm_alias_callables.test.js
          node --test functions/tests/deda_qa32_public_alias_resolver.test.js
          ! grep -q "dedaPremiumResolvePublicRecipient" functions/index.js
          echo 'PASS_NO_PUBLIC_ALIAS_PRODUCTION_DEPLOYMENT_YET'
      - name: Check real Dart client share, friends and admin recipient mappings
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/deda_qa32_public_recipient_live_bridge_test.dart
          flutter test test/deda_100374_admin_premium_alias_recipient_bridge_test.dart
          grep -q "DEDA_QA32_SHARE_TO_VERIFIED_ACTIVE_PREMIUM_ALIAS_CANONICAL_ROUTE" lib/deda_backend.dart
          grep -q "DEDA_QA32_FIND_FRIEND_BY_VERIFIED_PREMIUM_ID_TO_CANONICAL_ACCOUNT" lib/deda_social_service.dart
          grep -q "'recipientPublicId': recipientId," lib/deda_backend.dart
          grep -q "resolveActiveAlias" lib/deda_social_service.dart
          grep -q "resolveActiveAlias" lib/deda_backend.dart
          echo 'PASS_QA32_BOTH_SEND_AND_FRIEND_LOOKUP_USE_CANONICAL_ACCOUNT'
