name: DEDA 100359 owner 19-point Stage32 secure purchase and GM contracts NO DEPLOY
on:
  push:
    branches:
      - deda-100359-19-issues-staged-private-no-deploy-2026-10-19
    paths:
      - '.github/workflows/qa-deda-100359-owner19-stage32-no-deploy.yml'
      - 'tools/deda_100359_owner19_combined_gateway_private_2026_10_19.js'
      - 'tools/deda_100359_stage41_verified_sale_list_private_2026_10_20.js'
      - 'test/deda_100359_stage41_verified_sale_list.test.js'
      - 'tools/deda_100359_owner19_lazy_server_callables_PRIVATE_NOT_EXPORTED_2026_10_19.js'
      - 'test/deda_100359_owner19_lazy_server_secrets_stage33.test.js'
      - 'lib/deda_exclusive_ids_admin_page.dart'
      - 'tools/stage_deda_100360_compact_four_real_foils_after_100359.py'
      - 'test/test_deda_stage35_compact_foils.py'
      - 'tools/stage_deda_100360_remove_fake_store_sandbox.py'
      - 'test/test_deda_stage38_remove_fake_owner_lab.py'
      - 'tools/stage_deda_100360_real_admin_foils_on_reconstructed_source.py'
      - 'test/test_deda_stage39_gm_real_foil_integration.py'
      - 'tools/stage_deda_100360_remove_fake_store_sandbox.py'
      - 'test/test_deda_stage38_remove_fake_sandbox.py'
      - 'tools/deda_stage18_private_atomic_identifier_checkout_2026_10_19.js'
      - 'test/deda_100359_owner19_combined_gateway_stage32.test.js'
      - 'docs/DEDA_100359_19_ISSUES_OWNER_ACCEPTANCE_GATE_2026-10-19.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage32-private-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Strict no production changes, no published APK
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet d14e573d1f7f1ab67deff04222aca13c6f928553 -- \
            functions/index.js firestore.rules firebase.json \
            android/ lib/main.dart lib/deda_backend.dart lib/deda_social_service.dart \
            server_private/catalogs/ assets/
          ! grep -q 'deda_100359_owner19_combined_gateway_private' functions/index.js
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          echo 'PASS: stable DEDA phone baseline unchanged, no deploy.'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and Stage32 strict authenticated/AppCheck/100-ID gates
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/deda_100359_owner19_combined_gateway_private_2026_10_19.js
          node --check tools/deda_100359_owner19_lazy_server_callables_PRIVATE_NOT_EXPORTED_2026_10_19.js
          node --check tools/deda_stage18_private_atomic_identifier_checkout_2026_10_19.js
          node --test test/deda_100359_owner19_combined_gateway_stage32.test.js
          node --test test/deda_100359_owner19_lazy_server_secrets_stage33.test.js
          node --test test/deda_100359_stage41_verified_sale_list.test.js
          python3 -m py_compile tools/stage_deda_100360_compact_four_real_foils_after_100359.py
          python3 -m unittest discover -s test -p 'test_deda_stage35_compact_foils.py'
          python3 -m unittest discover -s test -p 'test_deda_stage38_remove_fake_owner_lab.py'
          python3 -m unittest discover -s test -p 'test_deda_stage39_gm_real_foil_integration.py'
          python3 -m py_compile tools/stage_deda_100360_remove_fake_store_sandbox.py
          python3 -m unittest discover -s test -p 'test_deda_stage38_remove_fake_sandbox.py'
      - name: Existing atomic card, ID, admin and 100-private regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test test/deda_stage18_atomic_identifier_checkout_unit.test.js
          node --test test/deda_stage19_exclusive_admin_private_reader.test.js
          node --test test/deda_stage19_exclusive_fixed_color_actions.test.js
          node --test test/deda_stage19_encrypted_original100_loader.test.js
          echo 'PASS: staging-only offline checks; live wallet and GM grants remain OFF.'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Verify staged manager page compiles and write gates remain OFF
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DEDA_STAGE32_MANAGER100_ACTIONS_LIVE' lib/deda_exclusive_ids_admin_page.dart
          grep -q "defaultValue: false" lib/deda_exclusive_ids_admin_page.dart
          grep -q 'dedaStage19Exclusive100SelfUse' lib/deda_exclusive_ids_admin_page.dart
          grep -q 'dedaStage19Exclusive100Grant' lib/deda_exclusive_ids_admin_page.dart
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/deda_exclusive_ids_admin_page.dart
          flutter test test/deda_stage19_exclusive_admin_tile_test.dart
          echo 'PASS: manager UI compiles; GM live read/grant/use require explicit separately gated deployment.'
