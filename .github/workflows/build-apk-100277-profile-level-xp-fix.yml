name: Build DEDA 100277 Profile Level XP Fix

on:
  push:
    branches:
      - profile-level-xp-fix-100277-2026-10-05
    paths:
      - '.github/workflows/build-apk-100277-profile-level-xp-fix.yml'

jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-100277]')
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100277 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100277
        run: bash tools/build_100277_profile_level_xp_fix.sh

      - name: Upload APK 100277
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100277-profile-level-xp-fix-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
