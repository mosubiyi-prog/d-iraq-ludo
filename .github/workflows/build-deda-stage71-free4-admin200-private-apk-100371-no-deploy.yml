name: DEDA Stage71 FREE4 200 GM Signed Owner APK 100371 NO PLAY NO FIREBASE DEPLOY
on:
  push:
    branches:
      - deda-owner-free-200-ids-4-cards-stage71-2026-10-21
    paths:
      - '.github/workflows/build-deda-stage71-free4-admin200-private-apk-100371-no-deploy.yml'
      - 'tools/stage_deda_100359_stage71_free_4_cards_dual_admin200.py'
      - 'lib/deda_stage71_free_id_cards.dart'
      - 'lib/deda_stage71_free_manager_200_service.dart'
      - 'lib/deda_stage71_dual_admin_page.dart'
      - 'lib/deda_stage71_free_owned_use_profile.dart'
      - 'test/deda_stage71_four_free_cards_dual200_widget_test.dart'
      - 'tools/stage_deda_owner_place_cross_device_recovery_stage64.py'
      - 'test/deda_stage64_owner_place_cross_device_firestore_emulator.test.js'
      - 'tools/qa_reconstruct_100359_then_stage35_no_apk.py'
      - 'tools/stage_deda_100360_compact_four_real_foils_after_100359.py'
      - 'tools/stage_deda_100360_remove_fake_store_sandbox.py'
      - 'tools/stage_deda_100360_real_admin_foils_on_reconstructed_source.py'
      - 'test/deda_stage71_real_store_four_free_integration_test.dart'
      - 'tools/stage_deda_100360_verified_group002_only_store.py'
      - 'lib/deda_stage42_verified_sale_panel.dart'
      - 'lib/deda_stage48_verified_active_profile_ink.dart'
      - 'lib/deda_verified_identifier_ink.dart'
      - 'tools/stage_deda_100360_profile_active_ink_after_100359.py'
      - 'test/test_deda_stage48_real_profile_active_ink.py'
      - 'test/deda_owner19_stage48_active_profile_ink_test.dart'
      - 'lib/deda_stage49_verified_share_id_badge.dart'
      - 'tools/stage_deda_100360_share_premium_ink_after_stage48.py'
      - 'test/test_deda_owner19_stage49_original_qr_share.py'
      - 'test/deda_owner19_stage49_verified_share_ink_test.dart'
      - 'tools/stage_deda_100360_friend_visible_ink_after_stage49.py'
      - 'test/test_deda_stage50_friend_ink_source.py'
      - 'lib/deda_stage50_verified_friend_ink_badge.dart'
      - 'test/deda_owner19_stage50_friend_ink_widget_test.dart'
      - 'tools/stage_deda_100360_friend_alias_search_after_stage50.py'
      - 'test/test_deda_stage51_friend_alias_source.py'
      - 'lib/deda_stage51_verified_friend_alias_search.dart'
      - 'test/deda_owner19_stage51_friend_alias_widget_test.dart'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-stage71-free4-200-gm-signed-100371-owner
  cancel-in-progress: false
jobs:
  reconstruct-real-store:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prevent any mutation to signed 100359 phone baseline
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet d14e573d1f7f1ab67deff04222aca13c6f928553 -- \
            functions/index.js firestore.rules firebase.json \
            lib/main.dart lib/deda_backend.dart lib/deda_social_service.dart \
            android/ assets/
          # The sole permitted change under server_private/catalogs is the
          # owner-paired ENCRYPTED manifest. Never accept a plaintext catalog,
          # added file, altered key or unexpected encrypted payload.
          manifest="server_private/catalogs/DEDA_GROUP001_ADMIN100_AES256GCM_2026-10-19.enc.json"
          changed="$(git diff --name-only d14e573d1f7f1ab67deff04222aca13c6f928553 -- server_private/catalogs/)"
          test "$changed" = "$manifest"
          test "$(git hash-object "$manifest")" = "d07198ced5c9019d0eb85e99ee94101db52921e3"
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          echo 'PASS: no user/production/app signing changes'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Reconstruct EXACT approved 100359 generated app, prohibit APK compilation
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python3 -m py_compile tools/qa_reconstruct_100359_then_stage35_no_apk.py
          python3 tools/qa_reconstruct_100359_then_stage35_no_apk.py
          bash -e /tmp/deda_100340_play_aab.sh
          grep -q "DEDA_STAGE17_STORE_CARDS_BLUE_OWNED_IDS_2026_10_19" lib/main.dart
          grep -q "DEDA_STAGE31_OWNER_QA_LAUNCH_SANDBOX_ONLY_2026_10_19" lib/main.dart
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          echo 'PASS: actual approved 100359 Flutter UI recreated with NO output APK'
      - name: Apply compact real four-foil preview to reconstructed app and check Flutter
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage_deda_100360_compact_four_real_foils_after_100359.py
          python3 tools/stage_deda_100360_remove_fake_store_sandbox.py
          python3 tools/stage_deda_100360_real_admin_foils_on_reconstructed_source.py
          python3 tools/stage_deda_100360_verified_group002_only_store.py
          python3 -m unittest discover -s test -p 'test_deda_stage48_real_profile_active_ink.py'
          python3 tools/stage_deda_100360_profile_active_ink_after_100359.py
          python3 -m unittest discover -s test -p 'test_deda_owner19_stage49_original_qr_share.py'
          python3 tools/stage_deda_100360_share_premium_ink_after_stage48.py
          python3 -m unittest discover -s test -p 'test_deda_stage50_friend_ink_source.py'
          python3 tools/stage_deda_100360_friend_visible_ink_after_stage49.py
          python3 -m unittest discover -s test -p 'test_deda_stage51_friend_alias_source.py'
          python3 tools/stage_deda_100360_friend_alias_search_after_stage50.py
          python3 tools/stage_deda_owner_place_cross_device_recovery_stage64.py
          python3 tools/stage_deda_100359_stage71_free_4_cards_dual_admin200.py
          dart format lib/main.dart lib/deda_backend.dart lib/deda_exclusive_ids_admin_page.dart \
            lib/deda_stage71_free_id_cards.dart lib/deda_stage71_dual_admin_page.dart \
            lib/deda_stage71_free_manager_200_service.dart lib/deda_stage71_free_owned_use_profile.dart lib/admin_pages.dart \
            lib/deda_stage48_verified_active_profile_ink.dart lib/deda_verified_identifier_ink.dart \
            lib/deda_stage49_verified_share_id_badge.dart lib/deda_stage50_verified_friend_ink_badge.dart \
            lib/deda_stage51_verified_friend_alias_search.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/deda_backend.dart lib/deda_exclusive_ids_admin_page.dart \
            lib/deda_stage71_free_id_cards.dart lib/deda_stage71_dual_admin_page.dart \
            lib/deda_stage71_free_manager_200_service.dart lib/deda_stage71_free_owned_use_profile.dart lib/admin_pages.dart \
            lib/deda_stage42_verified_sale_panel.dart lib/deda_stage48_verified_active_profile_ink.dart \
            lib/deda_stage49_verified_share_id_badge.dart lib/deda_stage50_verified_friend_ink_badge.dart \
            lib/deda_stage51_verified_friend_alias_search.dart
          flutter test test/deda_stage71_four_free_cards_dual200_widget_test.dart test/deda_makani_100337_test.dart test/deda_stage71_real_store_four_free_integration_test.dart \
            test/deda_stage19_exclusive_admin_tile_test.dart \
            test/deda_owner19_stage48_active_profile_ink_test.dart \
            test/deda_owner19_stage46_verified_identifier_ink_test.dart \
            test/deda_owner19_stage49_verified_share_ink_test.dart \
            test/deda_owner19_stage50_friend_ink_widget_test.dart \
            test/deda_owner19_stage51_friend_alias_widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          src=Path('lib/main.dart').read_text()
          assert src.count('DEDA_100360_COMPACT_REAL_FOILS_MERGED_PRICE_AND_ACTION') == 1
          a=src.index('class _DedaIdentifierStorePageState extends State<DedaIdentifierStorePage> {')
          b=src.index('class _DedaProfilePhase2PageState extends State<DedaProfilePhase2Page> {',a)
          shop=src[a:b]
          assert shop.count("DedaPremiumIdCard(") == 1, "four cards must share original renderer"
          assert shop.count("DedaStage71FreeCardAction(") == 1, "all four free actions are original artwork"
          assert shop.count("DedaPoint17ShopCardAction(") == 0, "paid widget still shown in shop"
          assert "for (final style in DedaPremiumIdCardColor.values)" in shop
          assert "height: 50" in shop, "original 50dp foil was changed"
          assert "DEDA_PREMIUM_IDS_SERVER_LIVE" in src, "server flag lost"
          assert src.count("DEDA_100360_SERVER_VERIFIED_GROUP002_INSTEAD_OF_MOCK_CANDIDATES")==1
          assert "DedaStage42VerifiedSalePanel(" in src
          assert src.count('DEDA_OWNER19_STAGE48_PROFILE_ACTIVE_ID_FIXED_INK_NO_DEPLOY')==1
          assert src.count('DedaStage48ActiveInkProfileSlot(')==1, 'one profile slot only'
          assert src.count('fallback: DedaPoint14VerifiedProfileSlot(')==1, 'original 100359 fallback must be retained'
          assert 'premiumFoil: (verifiedId, lockedColor, copyVerifiedId)' in src
          assert 'onTap: copyVerifiedId' in src, 'copy must follow verified active ID'
          assert src.count('DEDA_OWNER19_STAGE49_ORIGINAL_QR_PLUS_VERIFIED_PREMIUM_INK') == 1
          assert src.count('DedaStage49VerifiedShareIdBadge(') == 1
          assert src.count('DEDA_OWNER19_STAGE50_FRIEND_INK_THREE_PUBLIC_SURFACES_NO_DEPLOY') == 1
          assert src.count('DedaStage50VerifiedFriendInkBadge(') == 3
          assert 'class DedaFriendPublicProfilePage extends StatelessWidget' in src
          assert 'DedaSocialService.findByPublicId(' in src
          assert src.count('DEDA_OWNER19_STAGE51_FRIEND_SEARCH_CANONICAL_ALIAS_NO_DEPLOY') == 1
          assert src.count('DedaStage51FriendSearch.acceptsInput(id)') == 1
          assert src.count('DedaStage51FriendSearch.findByUserInput(id)') == 1
          assert 'DedaSocialService.sendFriendRequest(' in src
          assert "data: id," in src and 'onPressed: _shareDedaId' in src and 'onPressed: _copyDedaId' in src
          assert "DedaOwnerQaSandboxPage()" not in src, "fake purchase lab still reachable"
          owner=src[src.index('class _OwnerPlacePageState extends State<OwnerPlacePage> {'):src.index('class DedaPersonalPlace')]
          assert owner.count('DedaBackend.recoverPublishedPlaceForSignedInOwner(')==1
          assert owner.count('await prefs.setString(_placeIdKey, recoveredId)')==1
          assert "_status = 'recovery_blocked';" in owner
          backend=Path('lib/deda_backend.dart').read_text()
          assert backend.count('STAGE64_CROSS_DEVICE_OWNER_RECOVERY')==1
          assert "trustedKey != expected" in backend
          assert ".where('accountKey', isEqualTo: trustedKey)" in backend
          assert ".where('published', isEqualTo: true)" in backend
          manager=Path('lib/deda_exclusive_ids_admin_page.dart').read_text()
          assert "DEDA_100360_ADMIN_USES_ORIGINAL_FOUR_FULL_FOILS" in manager
          assert "DedaPremiumIdCard(" in manager, "GM artwork still fake border"
          assert src.count('DEDA_STAGE71_OWNER_APPROVED_FOUR_FREE_CARDS_TWO_ADMIN100_NO_PURCHASE') == 1
          assert src.count('DedaStage71FreeProfileFoil(') == 1
          assert src.count('DedaStage71ActiveProfileFoil(') == 1
          assert src.count('DedaStage71OwnedIdsPanel(') == 1
          assert "import 'deda_stage71_free_owned_use_profile.dart';" in src
          assert 'itemCount: 0,' in shop, 'second 100 must never show in consumer free store'
          assert 'DedaStage71DualAdminPage(isArabic: ar)' in Path('lib/admin_pages.dart').read_text()
          assert 'تصميم البطاقة: مجاني' in shop
          assert 'تصميم البطاقة: 5,000 ماسة' not in shop
          admin_source=Path('lib/admin_pages.dart').read_text()
          assert 'DedaStage71DualAdminPage(isArabic: ar)' in admin_source
          assert 'DedaExclusiveIdsAdminPage(isArabic: ar)' not in admin_source
          dual=Path('lib/deda_stage71_dual_admin_page.dart').read_text()
          assert 'deda_stage71_two_equal_vertical_columns' in dual
          assert "_column('001')" in dual and "_column('002')" in dual
          assert 'ChoiceChip(' not in dual
          print('PASS: TRUE 100359 signed source, four original FREE foils + profile, real 100+100 GM-only columns')
          PY
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          echo 'PASS: Stage71 accepted new no-purchase 200-admin catalog and four no-charge original cosmetics applied to reconstructed 100359. No APK/Play/Firebase deploy'

      - name: Guard original signature and prepare owner-only APK build
        shell: bash
        run: |
          set -euo pipefail
          for key in DEDA_KEYSTORE_BASE64 DEDA_KEY_ALIAS DEDA_STORE_PASSWORD DEDA_KEY_PASSWORD; do
            test -n "${!key:-}" || { echo "SAFE_STOP missing original signing secret: $key"; exit 5; }
          done
          python3 - <<'PY_BUILD'
          from pathlib import Path
          import re
          source=Path('/tmp/deda_100340_play_aab.sh').read_text()
          lines=[line for line in source.splitlines()
            if re.match(r'^flutter build appbundle --release --build-number=100340(?:\s|$)',line)]
          assert len(lines)==1, 'SAFE_STOP: approved AAB signing command is missing'
          cmd=lines[0].replace(
            'flutter build appbundle --release --build-number=100340',
            'flutter build apk --release --build-number=100371',1)
          assert 'flutter build appbundle' not in cmd
          for required in (
            'USE_NEXT_GEN_SDK=true',
            'DEDA_SPARK_FIRESTORE_LIVE=true',
          ):
            assert required in cmd, 'SAFE_STOP old reviewed feature build setting changed: '+required
          for key in ('DEDA_PREMIUM_IDS_SERVER_LIVE','DEDA_PREMIUM_ALIAS_ROUTING_LIVE',
            'DEDA_OWNER_PRIVATE_SANDBOX','DEDA_STAGE71_ADMIN200_RULES_AND_PRIVATE_CATALOG_DEPLOYED'):
            assert not re.search(r'--dart-define='+key+r'=',cmd),'SAFE_STOP duplicated flag '+key
          cmd += (
            ' --dart-define=DEDA_PREMIUM_IDS_SERVER_LIVE=false'
            ' --dart-define=DEDA_PREMIUM_ALIAS_ROUTING_LIVE=false'
            ' --dart-define=DEDA_OWNER_PRIVATE_SANDBOX=false'
            ' --dart-define=DEDA_STAGE71_ADMIN200_RULES_AND_PRIVATE_CATALOG_DEPLOYED=true'
          )
          script=Path('/tmp/deda_stage71_owner_phone_signed_100371.sh')
          script.write_text('set -euo pipefail\n'+cmd+'\n')
          print('PASS build from original signed 100340 command with only 100371 and free200 owner-client flags')
          PY_BUILD
      - name: Build 100371 PRIVATE signed APK - no Play/Firebase deploy
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/deda_stage71_owner_phone_signed_100371.sh
          test -s build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
      - name: Verify signed APK identity, zip integrity, version and publish PRIVATE artifact
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          buildtools="$(find "${ANDROID_HOME:-/opt/android-sdk}"/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$buildtools/apksigner"
          test -x "$buildtools/aapt"
          "$buildtools/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/deda_stage71_signer.txt
          grep -q 'certificate SHA-256 digest:' /tmp/deda_stage71_signer.txt
          "$buildtools/aapt" dump badging "$apk" | grep -E "^package: name='com\.diraq\.ludo\.d_iraq_ludo' versionCode='100371'"
          python3 - <<'PY_ZIP'
          import zipfile
          from pathlib import Path
          p=Path('build/app/outputs/flutter-apk/app-release.apk')
          assert p.stat().st_size>1_000_000
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            assert 'AndroidManifest.xml' in z.namelist()
            assert 'classes.dex' in z.namelist()
          print('PASS signed APK original package, zip integrity, 100371, local owner QA only')
          PY_ZIP
          mkdir -p private-deda-100371
          cp "$apk" private-deda-100371/DEDA-100371-FOUR-FREE-CARDS-200-ADMIN-OWNER-PRIVATE-SIGNED.apk
          sha256sum private-deda-100371/*.apk > private-deda-100371/SHA256SUMS.txt
          git rev-parse HEAD > private-deda-100371/source-commit.txt
          grep 'certificate SHA-256 digest:' /tmp/deda_stage71_signer.txt > private-deda-100371/SIGNER-SHA256.txt
          printf '%s\n' \
            'OWNER QA ONLY. Never upload to Play without owner approval.' \
            'Four free ID cards; no purchase or diamond spend.' \
            'GM private200 catalog and use/grant need owner-approved Firestore rules and original100 import; before that remote admin functions reject safely.' \
            'Preserves original account, wallet, places, and existing Play deployment.' \
            > private-deda-100371/READ-ME-FIRST.txt
      - name: Upload signed private 100371 APK without deploying
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100371-FOUR-FREE-CARDS-PRIVATE-SIGNED-OWNER-QA-NO-PLAY
          path: private-deda-100371/
          retention-days: 21
          if-no-files-found: error
