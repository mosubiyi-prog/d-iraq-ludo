name: DEDA 100423 Canonical Original-ID Server HOLD QA (NO DEPLOY)
on:
  push:
    branches:
      - deda-100423-canonical-original-hold-private-no-deploy-2026-11-01
    paths:
      - 'functions/deda_canonical_account_proof_core.js'
      - 'functions/deda_canonical_account_proof.js'
      - 'tools/app_stability/account_security/canonical_account_proof.test.cjs'
      - 'functions/deda_secure_pin_gate_core.js'
      - 'functions/deda_secure_pin_gate.js'
      - 'functions/index.js'
      - 'functions/tests/deda_secure_pin_gate_emulator.test.js'
      - 'tools/app_stability/account_security/secure_pin_gate.test.cjs'
      - 'lib/deda_secure_pin_preflight.dart'
      - 'test/deda_secure_pin_preflight_contract_test.dart'
      - 'tools/app_stability/app_package/stage_100422_secure_pin_recovery_hold_no_build.py'
      - '.github/workflows/qa-deda-100423-canonical-original-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secure-server-unit-and-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GCLOUD_PROJECT: demo-deda-secure-pin-private-qa
      GOOGLE_CLOUD_PROJECT: demo-deda-secure-pin-private-qa
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      DEDA_SECURE_PIN_EMULATOR_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check merged backend entrypoint and regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/index.js
          node --check functions/deda_secure_pin_gate.js
          node --check functions/deda_secure_pin_gate_core.js
          node --check functions/deda_canonical_account_proof_core.js
          node --check functions/deda_canonical_account_proof.js
          grep -q 'exports.dedaCanonicalOriginalHoldV1' functions/index.js
          grep -q 'enforceAppCheck:true' functions/deda_canonical_account_proof.js
          grep -q 'exports.dedaSecurePinPreflightV1' functions/index.js
          grep -q 'enforceAppCheck: true' functions/deda_secure_pin_gate.js
          node --test tools/app_stability/account_security/secure_pin_gate.test.cjs tools/app_stability/account_security/canonical_account_proof.test.cjs
      - name: Run isolated real Auth and Firestore emulators (no cloud creds)
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions install --no-save --no-audit --no-fund firebase@12.3.0 firebase-tools@14
          cat > firebase.pin.qa.json <<'JSON'
          {
            "firestore": {"rules": "firestore.rules"},
            "emulators": {
              "auth": {"port": 9099},
              "firestore": {"port": 8080},
              "ui": {"enabled": false},
              "singleProjectMode": true
            }
          }
          JSON
          trap 'rm -f firebase.pin.qa.json' EXIT
          functions/node_modules/.bin/firebase emulators:exec --config firebase.pin.qa.json --project demo-deda-secure-pin-private-qa --only auth,firestore 'node --test functions/tests/deda_secure_pin_gate_emulator.test.js'
      - name: Assert no deployment, no wallet migration
        run: |
          echo 'LOCAL_EMULATOR_ONLY_NO_FIREBASE_WRITES_NO_APK_NO_GOOGLE_PLAY'
  reconstructed-account-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
      - name: Reconstruct EXACT 100420 pre-build app source, without signing or network backend access
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/deda-100421-reassembled"
          flutter create --platforms=android --org com.diraq.ludo --project-name d_iraq_ludo "$project"
          python3 tools/app_stability/app_package/prepare.py "$project" --variant candidate
          python3 tools/app_stability/app_package/bind_weekly_stage13.py "$project"
          python3 tools/app_stability/app_package/bind_active_id_boot_prewarm_stage14.py "$project"
          python3 tools/app_stability/app_package/bind_active_id_measured_startup_stage16.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_private_trial_stage17.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_full_qa_stage18.py "$project"
          python3 tools/app_stability/app_package/verify_rank_card_tap_stage19.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_admin_league_stage27.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_tasks_cta_stage28.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100397_owner_real_scores.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100398_after_level_xp.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100399_community_bridge.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100400_safe_score_retry.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100402_firestore_direct.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100403_first_open_gate.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100404_inline_clock_and_freeze.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100405_admin_live_read_only.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100406_league_display_fixes.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100407_full_avatar_shared_identity.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100408_seven_owner_points.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100409_single_verified_identity.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100410_unified_active_id.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100411_friend_copy_share.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100413_owner_id_admin_response.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100414_last_three.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100418_legacy340_friend_active_compat.py "$project"
          test -f "$project/lib/deda_owner18_original_account_proof.dart"
          python3 tools/app_stability/app_package/stage_100421_original_account_guard_no_build.py "$project"
          python3 tools/app_stability/app_package/stage_100422_secure_pin_recovery_hold_no_build.py "$project"
          python3 - "$project" <<'PY'
          import sys,hashlib,json
          from pathlib import Path
          p=Path(sys.argv[1])
          d=json.loads((p/'internal-build-inputs.json').read_text())
          assert d['versionCode']==100418
          assert d['weekly100421CanonicalOriginalIdGuardSourceOnly']['real100420Assembly']
          assert d['weekly100422SecurePinRecoveryPreflightSourceOnly']['normalSignInUnchanged']
          assert d['weekly100422SecurePinRecoveryPreflightSourceOnly']['canonicalOriginalServerHoldOnly']
          assert d['weekly100422SecurePinRecoveryPreflightSourceOnly']['walletAndIdentityMigrationEnabled'] is False
          assert d['financialRestoreEnabled'] is False
          assert d['completeOwnerDelivery'] is False
          for f,h in d['sourceHashes'].items():
              assert hashlib.sha256((p/f).read_bytes()).hexdigest()==h,f
          print('PASS_100421_ALL_RECONSTRUCTED_SOURCE_HASHES')
          PY
      - name: Test guard in actual reassembled Flutter source (no APK)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/deda-100421-reassembled"
          flutter pub get --enforce-lockfile
          flutter test test/deda_owner18_original_account_proof_test.dart test/deda_secure_pin_preflight_contract_test.dart --no-pub
          dart analyze --no-fatal-warnings lib/deda_owner18_original_account_proof.dart lib/deda_secure_pin_preflight.dart lib/deda_pin_auth.dart
          echo 'PASS_100423_REAL_100420_SOURCE_CANONICAL_HOLD_QA_NO_APK'
      - name: Guard forbidden outputs
        shell: bash
        run: |
          set -euo pipefail
          test ! -f "$RUNNER_TEMP/deda-100421-reassembled/build/app/outputs/flutter-apk/app-release.apk"
          echo 'NO_APK_NO_FIREBASE_WRITES_NO_GOOGLE_PLAY_NO_FINANCIAL_RESTORE'
