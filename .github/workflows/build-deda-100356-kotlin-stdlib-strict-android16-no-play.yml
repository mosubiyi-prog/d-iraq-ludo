                'assets/deda_royal_frames/royal_frame_2.webp': 'dbd02ca458cf9e94e3a0005134d2b61cb0bdaaf7729893a8cbfe5f75123c249f',
                'assets/deda_royal_backgrounds/deda_royal_bg_emerald.webp': '744f1a731b0611fc47b7685a78a6f81b319e066869c7f831f4a84b93dc343f5c',
                'assets/deda_royal_backgrounds/deda_royal_bg_burgundy.webp': '5efd143d3ae5ab2ab6e3c0a4c2e98105398fa0428e7530f2acf085e957db4b9b',
                'assets/deda_royal_avatars/deda_avatar_male_royal.jpg': 'a78adc468b63d9897c6adba887dfe81f37ba97b0aa99c212563387b5f820710f',
                'assets/deda_royal_avatars/deda_avatar_female_royal.jpg': '46e6eeb18eb05eaeeabf5706ac910be127f50f2865e48277c79027db4a95f2f2',
                'assets/deda_royal_avatars/deda_avatar_couple_royal.jpg': '8c3f0d39a8e5c582979494efea04de54b0949654f56e90629d9333aa9789f14a',
