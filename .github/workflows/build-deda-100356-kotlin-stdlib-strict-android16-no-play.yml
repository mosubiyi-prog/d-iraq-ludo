          assert 'flags: InteractiveFlag.all' in m
          assert 'InteractiveFlag.all & ~InteractiveFlag.rotate' not in m, '100332 rotate lock still active'
          assert m.count('interactionOptions: const InteractionOptions(') == 1, 'duplicate pretrip map options'
          assert '0.7162162162162162' in m
          assert re.search(r'rotate:\s*true,\s*child:\s*DedaMapPlaceMarker\(',m)
          assert 'onLabelTap: () => _selectPlaceWithSocial(place)' in m
          assert 'onTap: () => selectMapPlace(place)' in m
          assert 'class _DedaIraqDestinationFlag' in nav
          assert '_buildFixedDriverArrow(navigationArrowAngle)' in nav
          flag_start=nav.index('point: destinationPoint,')
          flag_end=nav.index('_DedaIraqDestinationFlag()',flag_start)
          assert 'rotate: true' in nav[flag_start:flag_end], 'Iraqi flag orientation guard failed'
          print('PASS: flag upright, navigation page unchanged, map engagement preserved')
          MAP_100339_GUARD
          echo 'PASS: two-finger rotation and map avatar anchoring test stage passed'
          echo '== 100340 ONLY place circle true geographic pivot, zoom 15.8 to 15.2 =='
          python3 -m py_compile tools/stage_deda_100340_pin_center_nav_zoom.py
          python3 tools/stage_deda_100340_pin_center_nav_zoom.py
          dart format lib/main.dart test/deda_100340_geo_marker_camera_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart test/deda_100340_geo_marker_camera_test.dart
          flutter test test/deda_100339_pretrip_map_rotation_test.dart test/deda_100340_geo_marker_camera_test.dart test/deda_map_place_taps_100335_test.dart test/deda_place_engagement_bar_test.dart test/deda_makani_100337_test.dart
          python3 - <<'SAFE_100340'
          from pathlib import Path
          import re
          s=Path('lib/main.dart').read_text()
          route=s[s.index('class DedaRoutePage extends StatefulWidget'):s.index('class _MapReadyPageState extends State<MapReadyPage> {')]
          marker=s[s.index('class _MapReadyPageState extends State<MapReadyPage> {'):]
          assert route.count('final navigationHomeZoom = 15.2;')==1
          assert 'final navigationHomeZoom = 15.8;' not in route
          assert 'initialZoom: 11.8' in marker, 'Main map zoom changed!'
          assert 'flags: InteractiveFlag.all' in marker, 'Pretrip rotation was broken'
          assert 'InteractiveFlag.all & ~InteractiveFlag.rotate' not in marker
          assert 'height: place.isDedaRegistered ? 260 : 58' in marker
          assert 'alignment: Alignment.center' in marker
          assert re.search(r'top:\s*place\.isDedaRegistered\s*\?\s*3\s*:\s*0', marker), 'geo pin wrapper top offset changed'
          assert '_selectPlaceWithSocial(place)' in marker and 'onLabelTap:' in marker, 'name tap lost'
          assert 'selectMapPlace(place)' in marker and 'onTap:' in marker, 'destination tap lost'
          assert '_buildFixedDriverArrow(navigationArrowAngle)' in route
          assert '_DedaIraqDestinationFlag()' in route
          print('PASS: true DEDA geo-centre, live reactions, successful rotation, only requested zoom change')
          SAFE_100340
          echo 'PASS: 100340 pin geometry and start zoom tests complete; now build private APK only'
