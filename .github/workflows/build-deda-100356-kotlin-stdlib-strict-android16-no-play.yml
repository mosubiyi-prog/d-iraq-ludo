          echo '4fd93e0d0596c5d6846b3d24620d7ec9bdb77f169c47abd7cf782770c320857d  /tmp/deda353-reference/DEDA-100342-POINT7-COMPACT-PRIVATE-QA.apk' | sha256sum -c -
          "$APKSIGNER" verify --print-certs "$ORIGINAL" >/tmp/deda353-reference/original-cert.txt
