          src=src.replace(marker,add+'\n'+marker)
          new=('flutter build appbundle --release --build-number=100340 '
               '--dart-define=USE_NEXT_GEN_SDK=true '
               '--dart-define=DEDA_DAILY_TASK_DISPLAY_PREVIEW=false '
               '--dart-define=DEDA_SOCIAL_TASKS_UI_PREVIEW=true '
               '--dart-define=DEDA_SERVER_AUTOMATIONS_LIVE=false '
