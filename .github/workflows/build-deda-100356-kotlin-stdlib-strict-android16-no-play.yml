          assert new.count('--dart-define=DEDA_PLACE_ENGAGEMENT_LIVE=true') == 1
          assert new.count('--dart-define=DEDA_SPARK_FIRESTORE_LIVE=true') == 1
          assert new.count('--dart-define=DEDA_OWNER_PLACE_BRANDING_LIVE=true') == 1
          assert new.count('--dart-define=DEDA_OWNER_PLACE_LOGO_UPLOADS_LIVE=false') == 1
          src=src.replace(old,new)
          assert src.count(new)==1
          Path('/tmp/deda_100340_play_aab.sh').write_text(src)
          print('Prepared signed 100340 Play AAB with EXACT accepted phone source and defines; NO Firebase deploy or Play auto-publish')
          MAKE_SCRIPT
      - name: Replace accepted 100340 bundle with signed 100356 private APK after passed 3-point tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PRIVATE_100356'
          from pathlib import Path
          import re
          f=Path('/tmp/deda_100340_play_aab.sh')
          lines=f.read_text().splitlines()
          matches=[i for i,line in enumerate(lines)
                   if line.startswith('flutter build appbundle --release --build-number=100340 ')]
          assert len(matches)==1, 'SAFE_STOP accepted 100340 build command missing or duplicated'
          original=lines[matches[0]]
