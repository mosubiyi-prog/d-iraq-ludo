name: DEDA 100441 SAME UID 2 DEVICES PRIVATE QA NO DEPLOY

on:
  push:
    branches:
      - deda-100441-same-uid-two-device-recovery-private-qa-no-deploy-2026-11-08
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-100441-same-uid-2-devices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-device-uid-continuity-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      GCLOUD_PROJECT: demo-deda-100441-legacy340-anti-split
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Protect live production files and STOP ancestry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base = "a93eb2bd79bfd002e7f27650085fa447174164e4"
          original_stop = "3850c93b7a18e11613a951a32dc520701717a263"
          changed = set(subprocess.check_output(
            ["git","diff","--name-only",base,"HEAD"],text=True
          ).splitlines())
          allowed = {
            "functions/deda_100441_same_uid_recovery_readiness_PRIVATE_NOT_EXPORTED.js",
            "functions/test/deda_100441_same_uid_recovery_readiness_PRIVATE.test.js",
            "functions/test/deda_100441_same_uid_two_device_AUTH_FIRESTORE_EMULATOR_ONLY.test.js",
            ".github/workflows/deda-100441-same-uid-two-device-recovery-private-qa-no-deploy-2026-11-08.yml",
            "docs/DEDA_100441_SAME_UID_TWO_DEVICE_RECOVERY_PRIVATE_QA_CHECKPOINT_2026-11-08.md",
          }
          assert changed and changed <= allowed, "UNEXPECTED_CHANGED_PATHS: "+str(changed-allowed)
          subprocess.check_call(["git","merge-base","--is-ancestor",original_stop,"HEAD"])
          print("PASS_ONLY_SAME_UID_PRIVATE_ADDENDUM")
          PY
          git diff --quiet 3850c93b7a18e11613a951a32dc520701717a263 -- \
            lib/ android/ assets/ firestore.rules firebase.json storage.rules functions/index.js
          echo PASS_NO_PRODUCTION_SOURCE_DIFFERENCES

      - name: Verify no deployment exports or Auth mutators introduced
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/deda_100441_same_uid_recovery_readiness_PRIVATE_NOT_EXPORTED.js
          node --check functions/test/deda_100441_same_uid_recovery_readiness_PRIVATE.test.js
          node --check functions/test/deda_100441_same_uid_two_device_AUTH_FIRESTORE_EMULATOR_ONLY.test.js
          ! grep -Fq 'deda_100441_same_uid_recovery_readiness_PRIVATE_NOT_EXPORTED' functions/index.js
          ! grep -Eq 'onCall|onRequest|createCustomToken|signInAnonymously|updateUser|runTransaction|tx\.set|tx\.update' \
            functions/deda_100441_same_uid_recovery_readiness_PRIVATE_NOT_EXPORTED.js
          echo PASS_NO_LIVE_AUTH_ENDPOINT_NO_WRITE_NO_NEW_UID

      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}

      - name: Verify same UID recovery policy and previous anti-split regression
        shell: bash
        run: |
          set -euo pipefail
          node --test functions/test/deda_100441_same_uid_recovery_readiness_PRIVATE.test.js
          node --test functions/test/deda_100441_canonical_uid_preflight_callable_PRIVATE.test.js
          node --test functions/test/deda_100441_server_canonical_uid_read_adapter_PRIVATE.test.js
          node --test functions/test/deda_100441_canonical_uid_anti_split_preflight_PRIVATE.test.js

      - name: Install only local Firebase emulator test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests/firestore-rules --no-save --no-audit --no-fund firebase-tools@14
          npm install --prefix functions --no-save --no-audit --no-fund firebase@12.3.0

      - name: Keep deployed 100340 PIN client Firestore Rules compatible in local QA
        shell: bash
        run: |
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100441-legacy340-anti-split \
            --only firestore \
            'node --test tests/firestore-rules/deda_100441_legacy340_auth_anti_split_compat_PRIVATE.test.mjs'

      - name: Recheck Firebase Auth Admin reader with genuine local ID tokens
        shell: bash
        run: |
          set -euo pipefail
          export FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          export GCLOUD_PROJECT=demo-deda-100441-server-auth-read-integration
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --config firebase.100441.server-emulators.qa.json \
            --project demo-deda-100441-server-auth-read-integration \
            --only auth,firestore \
            'node --test functions/test/deda_100441_server_canonical_uid_actual_auth_firestore_EMULATOR_ONLY.test.js'

      - name: Recheck previous Callable gate with actual local Auth and Firestore
        shell: bash
        run: |
          set -euo pipefail
          export FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          export GCLOUD_PROJECT=demo-deda-100441-canonical-callable-qa
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --config firebase.100441.server-emulators.qa.json \
            --project demo-deda-100441-canonical-callable-qa \
            --only auth,firestore \
            'node --test functions/test/deda_100441_canonical_uid_preflight_callable_EMULATOR_ONLY.test.js'

      - name: Two distinct Auth client apps, same original UID, separate legacy PIN from owner proof
        shell: bash
        run: |
          set -euo pipefail
          export FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          export GCLOUD_PROJECT=demo-deda-100441-two-device-continuity
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --config firebase.100441.server-emulators.qa.json \
            --project demo-deda-100441-two-device-continuity \
            --only auth,firestore \
            'node --test functions/test/deda_100441_same_uid_two_device_AUTH_FIRESTORE_EMULATOR_ONLY.test.js'

      - name: Final immutable production + no-release assertion
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 3850c93b7a18e11613a951a32dc520701717a263 -- \
            lib/ android/ assets/ firestore.rules firebase.json storage.rules functions/index.js
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          echo PASS_NO_PRODUCTION_FIREBASE_WRITES_NO_APK_AAB_PLAY_NO_USER_ACCOUNT_CHANGE
