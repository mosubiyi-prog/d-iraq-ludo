name: DEDA 100438 current-week live SOURCE dry run - READ ONLY NO GIFTS
on:
  push:
    branches:
      - deda-100438-weekly-payout-candidate-no-live-2026-11-06
    paths:
      - 'functions/deda_weekly_prize_live_dryrun_readonly_100438.cjs'
      - '.github/workflows/qa-deda-100438-weekly-live-dryrun-approved-source-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-prize-plan-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEDA_FIREBASE_SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      DEDA_LEAGUE_WEEK: '2026-10-31'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify source and no live mutations requested
        run: |
          set -euo pipefail
          node --check functions/deda_weekly_prize_live_dryrun_readonly_100438.cjs
          node --check functions/deda_weekly_direct_prize_worker.cjs
          node --check functions/deda_weekly_direct_prize_plan.js
          echo 'PASS_NO_LIVE_PAYOUT_ENV_NO_FIRESTORE_WRITE'
      - name: Read only: live week plan, scores and recipient personal IDs; simulate exact approved amounts
        run: |
          set -euo pipefail
          npm install --prefix functions --no-audit --no-fund
          node functions/deda_weekly_prize_live_dryrun_readonly_100438.cjs
      - name: Report result, no gifts created
        run: |
          echo 'LIVE_PLAN_READONLY_DRYRUN_FINISHED'
          echo 'NO_REAL_PAYOUT_NO_OWNER_GIFTS_NO_FIREBASE_DEPLOY'
