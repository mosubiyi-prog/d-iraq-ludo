name: DEDA real cross-device original account archive stage integrated Flutter NO APK OR DEPLOY
on:
  push:
    branches:
      - deda-owner-cross-device-actual-restoration-integration-no-deploy-2026-10-29
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-cross-device-owner-restoration-actual-flutter
  cancel-in-progress: true
jobs:
  protected-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact QA-only task session patch; protect reference 100342, original wallet and traffic bank
        run: |
          set -euo pipefail
          BASE=563fcd0df12c778e92faa30cf266d43590f54651
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE" HEAD >/tmp/owner-bundle1
          cat /tmp/owner-bundle1
          while IFS= read -r p; do
            case "$p" in
              lib/deda_cross_device_restore.dart|\
              lib/deda_second_phone_link_client.dart|\
              lib/deda_legacy_purchase_evidence.dart|\
              lib/deda_weekly_snapshot_decode.dart|\
              lib/deda_progress_backup_runtime.dart|\
              test/deda_cross_device_restore_test.dart|\
              test/deda_second_phone_link_client_test.dart|\
              test/deda_weekly_snapshot_decode_test.dart|\
              test/deda_weekly_leaderboard_verified_rank_tap_stage22_test.dart|\
              tools/app_stability/progress_archive/cross-device-readiness-audit.cjs|\
              tools/app_stability/progress_archive/cross-device-readiness-audit.test.cjs|\
              tools/app_stability/progress_archive/cross-device-readonly-firestore-reader.cjs|\
              tools/app_stability/progress_archive/cross-device-readonly-firestore-reader.test.cjs|\
              tools/app_stability/progress_archive/second-phone-account-link.cjs|\
              tools/app_stability/progress_archive/second-phone-account-link.test.cjs|\
              tools/app_stability/progress_archive/second-phone-link-callable.cjs|\
              tools/app_stability/progress_archive/second-phone-link-callable.test.cjs|\
              tools/app_stability/progress_archive/qa_second_phone_functions/index.js|\
              tools/app_stability/progress_archive/qa_second_phone_functions/package.json|\
              tools/restore_deda_stability_baseline.py|\
              .github/workflows/qa-deda-owner-cross-device-restoration-integration-no-deploy.yml|\
              docs/DEDA_OWNER_CROSS_DEVICE_RESTORATION_INTEGRATION_2026-10-29.md) ;;
              *) echo "REFUSE unexpected change $p"; exit 1 ;;
            esac
          done </tmp/owner-bundle1
          git diff --quiet "$BASE" -- lib/main.dart lib/deda_social_service.dart \
            lib/deda_backend.dart lib/deda_pin_auth.dart \
            lib/traffic_quiz_page.dart functions/index.js firestore.rules \
            android/ assets/ pubspec.yaml pubspec.lock \
            tools/app_stability/app_package/prepare.py
          python3 -m py_compile tools/app_stability/bind_tasks_integrated_100383.py
          # The historical Stage28 hand-built fixture is stale relative to
          # the current approved 100383 task binding. The next job runs the
          # whole Stage13-61 original Flutter app reconstruction instead.
          python3 -m py_compile tools/restore_deda_stability_baseline.py
          node --check tools/app_stability/progress_archive/cross-device-readiness-audit.cjs
          node --check tools/app_stability/progress_archive/cross-device-readiness-audit.test.cjs
          node --check tools/app_stability/progress_archive/cross-device-readonly-firestore-reader.cjs
          node --check tools/app_stability/progress_archive/cross-device-readonly-firestore-reader.test.cjs
          node --check tools/app_stability/progress_archive/second-phone-account-link.cjs
          node --check tools/app_stability/progress_archive/second-phone-account-link.test.cjs
          node --check tools/app_stability/progress_archive/second-phone-link-callable.cjs
          node --check tools/app_stability/progress_archive/second-phone-link-callable.test.cjs
          node --check tools/app_stability/progress_archive/qa_second_phone_functions/index.js
          node --test tools/app_stability/progress_archive/cross-device-readiness-audit.test.cjs tools/app_stability/progress_archive/cross-device-readonly-firestore-reader.test.cjs tools/app_stability/progress_archive/second-phone-account-link.test.cjs tools/app_stability/progress_archive/second-phone-link-callable.test.cjs
          echo "Original DEDA account, league, wallets/IDs, Play and quiz bank unchanged"
  prepare-actual-original-flutter-no-apk:
    needs: protected-original
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
      - name: Reconstruct real ORIGINAL DEDA 100383 task-mapped + two protected league home routes
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/deda-bundle1-real-flutter-no-apk"
          flutter create --platforms=android --org com.diraq.ludo --project-name d_iraq_ludo "$TARGET"
          python3 tools/app_stability/app_package/prepare.py "$TARGET" --variant candidate
          python3 tools/app_stability/app_package/bind_weekly_stage13.py "$TARGET"
          python3 tools/app_stability/app_package/restore_weekly_stage17_legacy_screen_only.py "$TARGET"
          python3 tools/app_stability/app_package/bind_active_id_boot_prewarm_stage14.py "$TARGET"
          python3 tools/app_stability/app_package/bind_active_id_measured_startup_stage16.py "$TARGET"
          python3 tools/app_stability/app_package/bind_weekly_private_trial_stage17.py "$TARGET"
          python3 tools/app_stability/app_package/bind_weekly_full_qa_stage18.py "$TARGET"
          python3 tools/app_stability/app_package/verify_rank_card_tap_stage19.py "$TARGET"
          python3 tools/app_stability/app_package/bind_weekly_admin_league_stage27.py "$TARGET"
          python3 tools/app_stability/app_package/bind_weekly_tasks_cta_stage28.py "$TARGET"
          python3 tools/app_stability/app_package/bind_weekly_account_scope_stage61.py "$TARGET"
          python3 tools/app_stability/app_package/bind_weekly_original_public_profile_readonly.py "$TARGET"
          TARGET="$TARGET" python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['TARGET'])
          d=json.loads((p/'internal-build-inputs.json').read_text())
          main=(p/'lib/main.dart').read_text()
          social=(p/'lib/deda_social_service.dart').read_text()
          bridge=(p/'lib/deda_task_signal_bridge.dart').read_text()
          assert (p/'lib/deda_cross_device_restore.dart').is_file()
          assert (p/'lib/deda_progress_backup_runtime.dart').is_file()
          assert 'DedaCrossDeviceRestore(' in (p/'lib/deda_progress_backup_runtime.dart').read_text()
          assert 'DedaRecoveryStageStatus.stagedAwaitingServerReconciliation' in (p/'lib/deda_cross_device_restore.dart').read_text()
          assert d['completeOwnerDelivery'] is False
          assert d['financialRestoreEnabled'] is False
          assert d['productionExecutionPerformed'] is False
          assert d['weeklyStage61']['officialHomeRoutesScoped']==2
          assert d['weeklyOriginalReadOnlyProfile']['originalRoutes']==2
          assert main.count('DedaWeeklyAccountViewGate(')==2
          assert 'DedaTaskSignalBridge.bind(' in main
          assert main.count('DedaTaskWriteFence.serialized<DedaTaskEventResult>(')==4
          assert main.count('DedaTaskWriteFence.invalidate();')==2
          assert main.count('if (!stillOnAccount()) return rejectStale();')==8
          assert 'DedaTaskWriteFence.isCurrent(' in main
          assert (p/'lib/deda_task_write_fence.dart').exists()
          assert 'DedaTaskSignalBridge.revoke();' in main
          assert 'DedaTaskEvent.friendAccepted => DedaTaskIds.longTrip' in main
          assert 'DedaTaskEvent.longTripCompleted => null' in main
          assert 'DedaTaskEvent.prizeCardsExplored => DedaTaskIds.shareRegisteredPlace' in main
          assert 'DedaTaskEvent.mapSearchTyped => DedaTaskIds.reviewAddedPlace' in main
          assert 'DedaTaskEvent.placeDiscovered => DedaTaskIds.openSavedPlace' in main
          assert social.count('originatingUid:')>=2
          assert 'DateTime.now().toUtc().add(const Duration(hours: 3))' in social
          assert 'readCurrentUid: () => FirebaseAuth.instance.currentUser?.uid' in social
          assert 'static void revoke()' in bridge
          assert 'static Future<void> friendAccepted({' in bridge
          assert d['weeklyStage61']['walletOrXpChanged'] is False
          assert d['weeklyStage61']['realCrossDeviceAccountMigrationEnabled'] is False
          print('PASS original DEDA account-safe task mapping + actual social service source + 2 home routes')
          PY
      - name: Validate compiled original Dart and real widget integration; absolutely NO APK
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/deda-bundle1-real-flutter-no-apk"
          cp test/deda_cross_device_restore_test.dart "$TARGET/test/"
          cp test/deda_second_phone_link_client_test.dart "$TARGET/test/"
          cp test/deda_weekly_snapshot_decode_test.dart "$TARGET/test/"
          cp test/deda_weekly_leaderboard_verified_rank_tap_stage22_test.dart "$TARGET/test/"
          cp test/deda_friend_task_session_fence_test.dart "$TARGET/test/"
          cp test/deda_task_write_fence_test.dart "$TARGET/test/"
          cp test/deda_weekly_account_view_gate_stage61_test.dart "$TARGET/test/"
          cp test/deda_weekly_original_public_profile_readonly_test.dart "$TARGET/test/"
          cd "$TARGET"
          flutter pub get --enforce-lockfile
          dart analyze lib/deda_cross_device_restore.dart lib/deda_second_phone_link_client.dart lib/deda_legacy_purchase_evidence.dart lib/deda_weekly_snapshot_decode.dart lib/deda_progress_backup_runtime.dart lib/deda_task_signal_bridge.dart lib/deda_task_write_fence.dart
          set +e
          dart analyze --format=machine lib/main.dart lib/deda_social_service.dart \
            > "$RUNNER_TEMP/owner-bundle1-actual-analyzer.txt" 2>&1
          status=$?
          set -e
          if grep -q '^ERROR|' "$RUNNER_TEMP/owner-bundle1-actual-analyzer.txt"; then
            cat "$RUNNER_TEMP/owner-bundle1-actual-analyzer.txt"
            exit 1
          fi
          if [ "$status" -ne 0 ] && ! grep -Eq '^(WARNING|INFO)[|]' \
            "$RUNNER_TEMP/owner-bundle1-actual-analyzer.txt"; then
            cat "$RUNNER_TEMP/owner-bundle1-actual-analyzer.txt"
            exit 1
          fi
          flutter test --no-pub \
            test/deda_cross_device_restore_test.dart \
            test/deda_second_phone_link_client_test.dart \
            test/deda_weekly_snapshot_decode_test.dart \
            test/deda_weekly_leaderboard_verified_rank_tap_stage22_test.dart \
            test/deda_task_write_fence_test.dart \
            test/deda_friend_task_session_fence_test.dart \
            test/deda_weekly_account_view_gate_stage61_test.dart \
            test/deda_weekly_original_public_profile_readonly_test.dart
          test -z "$(find "$TARGET" -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit)"
          echo "PASS original Flutter owner verified cross-phone staging, protected league, no APK"
      - name: Explicit server settlement and payout hold
        run: |
          echo 'Actual original archive recovery staging QA only; no actual server-signed XP producer enabled.'
          echo 'Older installed APKs can still write local XP; cross-phone migration remains blocked.'
          echo 'Real Firestore social rules, PIN identity attestation and 370-diamond gifts NOT deployed.'
          echo 'No production Firebase deployment, Play upload, wallet change, APK or quiz modifications.'
