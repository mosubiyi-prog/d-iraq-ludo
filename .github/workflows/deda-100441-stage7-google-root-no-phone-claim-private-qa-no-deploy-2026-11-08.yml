name: DEDA 100441 STAGE7 GOOGLE UID ROOT PRIVATE QA NO PHONE CLAIM

on:
  push:
    branches:
      - deda-100441-stage7-google-root-no-phone-claim-private-no-deploy-2026-11-08
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-100441-stage7-google-root-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage7-server-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
      GCLOUD_PROJECT: demo-deda-100441-legacy340-anti-split
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}

      - name: Verify only stage7 private sources and protected ancestor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base="caee2ec359c691a73dd4e5a762415d80bb3fa99a"
          protected_stop="3850c93b7a18e11613a951a32dc520701717a263"
          changed=set(subprocess.check_output(
            ["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          permitted={
            "functions/deda_100441_stage7_google_uid_root_reservation_PRIVATE_NOT_EXPORTED.js",
            "functions/test/deda_100441_stage7_google_uid_root_reservation_PRIVATE.test.js",
            "functions/test/deda_100441_stage7_google_uid_root_reservation_EMULATOR_ONLY.test.js",
            "lib/deda_stage7_google_root_private_preview_NOT_WIRED.dart",
            "test/deda_stage7_google_root_private_preview_test.dart",
            ".github/workflows/deda-100441-stage7-google-root-no-phone-claim-private-qa-no-deploy-2026-11-08.yml",
            "docs/DEDA_100441_STAGE7_GOOGLE_ROOT_NO_PHONE_CLAIM_PRIVATE_QA_CHECKPOINT_2026-11-08.md",
          }
          assert changed and changed<=permitted,"UNEXPECTED_FILE:"+str(changed-permitted)
          subprocess.check_call(["git","merge-base","--is-ancestor",protected_stop,"HEAD"])
          print("PASS_ONLY_STAGE7_PRIVATE_ADDITIONS")
          PY
          git diff --quiet caee2ec359c691a73dd4e5a762415d80bb3fa99a -- \
            lib/main.dart lib/deda_pin_auth.dart lib/deda_backend.dart \
            android/ assets/ firestore.rules firebase.json storage.rules \
            functions/index.js pubspec.yaml pubspec.lock
          ! grep -Fq 'deda_100441_stage7_google_uid_root_reservation_PRIVATE_NOT_EXPORTED' functions/index.js
          ! grep -Fq 'deda_stage7_google_root_private_preview_NOT_WIRED' lib/main.dart
          echo PASS_PRODUCTION_AUTH_AND_ACCOUNT_FILES_UNCHANGED

      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}

      - name: Execute stage7 Google root plus previous owner protections
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/deda_100441_stage7_google_uid_root_reservation_PRIVATE_NOT_EXPORTED.js
          node --test functions/test/deda_100441_stage7_google_uid_root_reservation_PRIVATE.test.js
          node --test functions/test/deda_100441_new_owner_google_enrollment_PRIVATE.test.js
          node --test functions/test/deda_100441_same_uid_recovery_readiness_PRIVATE.test.js
          node --test functions/test/deda_100441_canonical_uid_preflight_callable_PRIVATE.test.js
          node --test functions/test/deda_100441_server_canonical_uid_read_adapter_PRIVATE.test.js
          node --test functions/test/deda_100441_canonical_uid_anti_split_preflight_PRIVATE.test.js

      - name: Install disposable local emulator dependencies only
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests/firestore-rules --no-save --no-audit --no-fund firebase-tools@14
          npm install --prefix functions --no-save --no-audit --no-fund firebase@12.3.0

      - name: Verify old 100340 Firestore Rules contract still works
        shell: bash
        run: |
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100441-legacy340-anti-split \
            --only firestore \
            'node --test tests/firestore-rules/deda_100441_legacy340_auth_anti_split_compat_PRIVATE.test.mjs'

      - name: Exercise stage7 REAL local Firestore transaction plus actual Auth negative controls
        shell: bash
        run: |
          set -euo pipefail
          export FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          export GCLOUD_PROJECT=demo-deda-stage7-google-root-no-phone-claim
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --config firebase.100441.server-emulators.qa.json \
            --project demo-deda-stage7-google-root-no-phone-claim \
            --only auth,firestore \
            'node --test functions/test/deda_100441_stage7_google_uid_root_reservation_EMULATOR_ONLY.test.js'

      - name: Recheck stage6 phone-proof gate and stage5 two-device continuity
        shell: bash
        run: |
          set -euo pipefail
          export FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          export GCLOUD_PROJECT=demo-deda-stage6-google-enroll-negative
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --config firebase.100441.server-emulators.qa.json \
            --project demo-deda-stage6-google-enroll-negative \
            --only auth,firestore \
            'node --test functions/test/deda_100441_new_owner_google_enrollment_EMULATOR_ONLY.test.js'
          export GCLOUD_PROJECT=demo-deda-100441-two-device-continuity
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --config firebase.100441.server-emulators.qa.json \
            --project demo-deda-100441-two-device-continuity \
            --only auth,firestore \
            'node --test functions/test/deda_100441_same_uid_two_device_AUTH_FIRESTORE_EMULATOR_ONLY.test.js'

      - name: No APK, Play, deployed Firebase or production changes
        shell: bash
        run: |
          set -euo pipefail
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          git diff --quiet caee2ec359c691a73dd4e5a762415d80bb3fa99a -- \
            lib/main.dart lib/deda_pin_auth.dart lib/deda_backend.dart \
            android/ assets/ firestore.rules firebase.json functions/index.js
          echo PASS_NO_PRODUCTION_MUTATION_OR_RELEASE

  stage7-flutter-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: false
      - name: Dart analyze and execute stage6+7 contract tests
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze --fatal-infos \
            lib/deda_stage6_new_account_google_handoff_PRIVATE_NOT_WIRED.dart \
            lib/deda_stage7_google_root_private_preview_NOT_WIRED.dart \
            test/deda_stage6_new_account_google_handoff_private_test.dart \
            test/deda_stage7_google_root_private_preview_test.dart
          flutter test --no-pub \
            test/deda_stage6_new_account_google_handoff_private_test.dart \
            test/deda_stage7_google_root_private_preview_test.dart
          ! grep -Fq 'deda_stage7_google_root_private_preview_NOT_WIRED' lib/main.dart
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo PASS_FLUTTER_STAGE7_PRIVATE_NOT_WIRED_NO_APK
