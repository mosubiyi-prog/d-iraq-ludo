name: DEDA 100441 SERVER CANONICAL UID AUTH READ QA NO DEPLOY

on:
  push:
    branches:
      - deda-100441-server-canonical-uid-read-adapter-private-no-deploy-2026-11-08
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-100441-server-read-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-server-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-deda-100441-legacy340-anti-split
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Guard exact previous checkpoint and production file integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base = "c8e393497cbcb3d69a5558083a457d82f89b79ec"
          stop = "3850c93b7a18e11613a951a32dc520701717a263"
          names = set(subprocess.check_output(
            ["git", "diff", "--name-only", base, "HEAD"], text=True
          ).splitlines())
          allowed = {
            "functions/deda_100441_server_canonical_uid_read_adapter_PRIVATE_NOT_EXPORTED.js",
            "functions/test/deda_100441_server_canonical_uid_read_adapter_PRIVATE.test.js",
            "functions/test/deda_100441_server_canonical_uid_actual_auth_firestore_EMULATOR_ONLY.test.js",
            ".github/workflows/deda-100441-server-canonical-uid-read-adapter-private-qa-no-deploy-2026-11-08.yml",
            "docs/DEDA_100441_SERVER_CANONICAL_UID_READ_ADAPTER_PRIVATE_QA_CHECKPOINT_2026-11-08.md",
          }
          assert names and names <= allowed, "UNEXPECTED_CHANGED_PATHS:" + str(names - allowed)
          subprocess.check_call(["git", "merge-base", "--is-ancestor", stop, "HEAD"])
          protected = {
            "firestore.rules", "firebase.json", "storage.rules",
            "functions/index.js", "lib/deda_pin_auth.dart",
            "lib/deda_backend.dart", "lib/main.dart",
            "lib/deda_social_service.dart",
          }
          assert not names & protected, "LIVE_SOURCE_CHANGED"
          print("PASS_ISOLATED_100441_SERVER_READ_ADAPTER_SCOPE")
          PY
          git diff --quiet 3850c93b7a18e11613a951a32dc520701717a263 -- \
            lib/ firestore.rules firebase.json storage.rules functions/index.js

      - name: Verify new reader cannot be a published Firebase callable
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/deda_100441_server_canonical_uid_read_adapter_PRIVATE_NOT_EXPORTED.js
          ! grep -Fq 'deda_100441_server_canonical_uid_read_adapter_PRIVATE_NOT_EXPORTED' functions/index.js
          ! grep -Eq 'onCall|onRequest|createCustomToken|linkWithCredential|signInAnonymously|runTransaction' \
            functions/deda_100441_server_canonical_uid_read_adapter_PRIVATE_NOT_EXPORTED.js
          echo 'PASS_NO_EXTERNAL_TRIGGER_OR_AUTH_OR_FIRESTORE_WRITES'

      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}

      - name: Run server Auth and Firestore read adapter unit integration
        run: |
          set -euo pipefail
          node --test functions/test/deda_100441_server_canonical_uid_read_adapter_PRIVATE.test.js
          node --test functions/test/deda_100441_canonical_uid_anti_split_preflight_PRIVATE.test.js

      - name: Recheck previous 100340 Firestore emulator compatibility
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests/firestore-rules \
            --no-save --no-audit --no-fund firebase-tools@14
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100441-legacy340-anti-split \
            --only firestore \
            'node --test tests/firestore-rules/deda_100441_legacy340_auth_anti_split_compat_PRIVATE.test.mjs'

      - name: Exercise Firebase Auth ID tokens and real Admin SDK Firestore against both local emulators
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --no-save --no-audit --no-fund firebase@12.3.0
          export FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          export GCLOUD_PROJECT=demo-deda-100441-server-auth-read-integration
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100441-server-auth-read-integration \
            --only auth,firestore \
            'node --test functions/test/deda_100441_server_canonical_uid_actual_auth_firestore_EMULATOR_ONLY.test.js'

      - name: Final immutable-output and release safeguards
        shell: bash
        run: |
          set -euo pipefail
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          git diff --quiet 3850c93b7a18e11613a951a32dc520701717a263 -- \
            lib/ firestore.rules firebase.json storage.rules functions/index.js
          echo 'PASS_NO_USER_CHANGE_NO_AUTH_TOKEN_NO_DATA_MIGRATION_NO_DEPLOY_NO_APK_NO_PLAY'
