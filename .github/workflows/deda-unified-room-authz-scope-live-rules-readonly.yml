name: DEDA unified room scope review + LIVE rules fingerprint READONLY NO DEPLOY
on:
  push:
    branches:
      - deda-unified-room-authz-scopes-isolated-qa-2026-11-16
    paths:
      - 'qa/unified_room_private/room_scope_review_PRIVATE_NO_GRANT.cjs'
      - 'qa/unified_room_private/room_scope_review_PRIVATE_NO_GRANT.test.cjs'
      - '.github/workflows/deda-unified-room-authz-scope-live-rules-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-per-domain-authorization-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove protected source unchanged since checkpoint and private module not exported
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, pathlib
          base='fd8cfd590d0f6703e34d6fe8c6913b091c3468fd'
          changed=set(subprocess.check_output(
            ['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={
            '.github/workflows/deda-unified-room-flutter-firestore-private-qa.yml',
            'qa/unified_room_private/qa_suite_2026-11-16.tgz.b64',
            '.github/workflows/deda-unified-room-authz-scope-live-rules-readonly.yml',
            'qa/unified_room_private/room_scope_review_PRIVATE_NO_GRANT.cjs',
            'qa/unified_room_private/room_scope_review_PRIVATE_NO_GRANT.test.cjs',
          }
          assert changed.issubset(allowed), 'PROTECTED_FILES_CHANGED:'+repr(sorted(changed-allowed))
          src=pathlib.Path('qa/unified_room_private/room_scope_review_PRIVATE_NO_GRANT.cjs').read_text()
          idx=pathlib.Path('functions/index.js').read_text()
          assert 'room_scope_review_PRIVATE_NO_GRANT' not in idx
          for forbidden in ('firebase-admin','createCustomToken','signInWithCredential',
                            '.set(','.update(','.delete(','.runTransaction(','.batch('):
            assert forbidden not in src,'PROHIBITED_RUNTIME_MUTATION:'+forbidden
          assert 'grantsAccess: false' in src and 'grantsWrite: false' in src
          assert 'issuesToken: false' in src and 'changesUid: false' in src
          print('PASS_CHECKPOINT_PROTECTED_SOURCE_UNCHANGED_AND_NO_AUTH_GRANT')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test 30 isolated per-domain scope and negative authorization cases
        shell: bash
        run: |
          node --check qa/unified_room_private/room_scope_review_PRIVATE_NO_GRANT.cjs
          node --test qa/unified_room_private/room_scope_review_PRIVATE_NO_GRANT.test.cjs
          echo 'PASS_ISOLATED_SCOPE_REVIEW_NO_LIVE_AUTH_OR_DATA_GRANT'

  compare-actual-published-firestore-rules-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEDA_RULES_SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}"
      DEDA_RULES_FALLBACK: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only Google Rules API client
        run: python -m pip install --quiet google-auth requests
      - name: Fetch ONLY published rules release + ruleset with GET; compare hashes locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,hashlib, pathlib,sys,requests
          from google.oauth2.service_account import Credentials
          from google.auth.transport.requests import Request
          raw=os.environ.get('DEDA_RULES_SA') or os.environ.get('DEDA_RULES_FALLBACK')
          if not raw:
            print('LIVE_RULES_NOT_VERIFIED_NO_READONLY_SERVICE_ACCOUNT')
            sys.exit(3)
          try: data=json.loads(raw)
          except (ValueError,TypeError):
            print('LIVE_RULES_NOT_VERIFIED_CREDENTIAL_FORMAT');sys.exit(3)
          if data.get('project_id')!='deda-25b88':
            print('LIVE_RULES_NOT_VERIFIED_PROJECT_MISMATCH');sys.exit(3)
          creds=Credentials.from_service_account_info(data,
            scopes=['https://www.googleapis.com/auth/cloud-platform'])
          creds.refresh(Request())
          headers={'Authorization':'Bearer '+creds.token}
          def read(url):
            response=requests.get(url,headers=headers,timeout=22)
            if response.status_code!=200:
              print('LIVE_RULES_NOT_VERIFIED_HTTP_STATUS',response.status_code)
              sys.exit(3)
            return response.json()
          root='https://firebaserules.googleapis.com/v1/'
          release=read(root+'projects/deda-25b88/releases/cloud.firestore')
          ruleset=release.get('rulesetName')
          if not isinstance(ruleset,str) or not ruleset.startswith('projects/deda-25b88/rulesets/'):
            print('LIVE_RULES_NOT_VERIFIED_INVALID_RELEASE');sys.exit(3)
          rules=read(root+ruleset)
          files=rules.get('source',{}).get('files',[])
          if len(files)!=1 or not isinstance(files[0].get('content'),str):
            print('LIVE_RULES_NOT_VERIFIED_MULTIFILE_OR_MISSING');sys.exit(3)
          live=files[0]['content']
          source=pathlib.Path('firestore.rules').read_text(encoding='utf-8')
          sha=lambda s:hashlib.sha256(s.encode('utf-8')).hexdigest()
          print('PINNED_SOURCE_RULES_SHA256',sha(source))
          print('CURRENT_LIVE_RULES_SHA256',sha(live))
          print('RULES_EQUAL_EXACT',sha(source)==sha(live))
          print('LIVE_RULES_HAS_VERIFIED_DIAMONDS_OWNER',
                'function verifiedDiamondsPersonalOwner(publicId)' in live)
          print('LIVE_RULES_HAS_SAME_ACCOUNT_HELPER',
                'function sameAccount(accountKey)' in live)
          print('LIVE_RULES_SOURCE_DRIFT',sha(source)!=sha(live))
          print('NO_USER_RECORDS_READ_NO_SECRETS_LOGGED_NO_WRITES_NO_DEPLOY')
          PY
