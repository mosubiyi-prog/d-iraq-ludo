name: DEDA 100452 Owner-Admin Same-UID Logout Guard QA NO DEPLOY
on:
  push:
    branches:
      - deda-100451-owner-admin-session-safe-repair-2026-11-20
    paths:
      - 'functions/deda_100441_owner_split_identity_challenge_review_private_v1.js'
      - 'functions/deda_unified_room_grant_issuer_private_v1.js'
      - 'functions/test/deda_unified_room_grant_issuer_private_v1.test.js'
      - 'qa/unified_room_private/deda_b_all_eight_atomic_real_firestore_EMULATOR_ONLY.test.cjs'
      - 'functions/test/deda_100441_owner_split_identity_challenge_review_private_v1.test.js'
      - 'lib/deda_backend.dart'
      - 'lib/deda_100431_linked_owner_session_policy.dart'
      - 'test/deda_owner_session_compat_private_test.dart'
      - 'test/test_deda_100450_admin_logout_merge_guard.py'
      - 'tools/app_stability/app_package/reconcile_stage2_auth_conflicts.py'
      - '.github/workflows/deda-100452-owner-admin-session-repair-qa-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-session-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
      - name: Regression B registration, split A/C source rights and fail-closed recovery (offline)
        shell: bash
        run: |
          set -euo pipefail
          node --test functions/test/deda_100441_owner_split_identity_challenge_review_private_v1.test.js
          node --test functions/test/deda_unified_room_grant_issuer_private_v1.test.js
          echo 'PASS_ATOMIC_ALL_EIGHT_B_SCOPES_SOURCE_ONLY'
          echo 'PASS_B_CANONICAL_REGISTRATION_REVIEW_NO_UID_TRANSFER_NO_ASSET_WRITES'
      - name: Verify source-level protected Admin signout order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('lib/deda_backend.dart').read_text()
          p=Path('lib/deda_100431_linked_owner_session_policy.dart').read_text()
          start=s.index('static Future<void> signOutAdmin() async {')
          end=s.index('// DEDA in-app location sharing v1.',start)
          block=s[start:end]
          required=[
            'dedaLinkedOwnerCompatEnabled',
            'principal == null || principal.isAnonymous',
            "collection('admins')",
            'get(const GetOptions(source: Source.server))',
            'maySignOutAdminPrincipal(',
            'serverVerifiedAdminDocument: proof.exists',
            'FirebaseAuth.instance.currentUser?.uid != confirmedAdminUid',
            "throw StateError('admin-logout-principal-changed-owner-preserved')",
          ]
          assert all(x in block for x in required)
          assert block.index("collection('admins')") < block.index(
            'await FirebaseAuth.instance.signOut()')
          assert block.index('currentUser?.uid != confirmedAdminUid') < block.index(
            'await FirebaseAuth.instance.signOut()')
          assert 'signInAnonymously' not in block
          assert 'maySignOutAdminPrincipal' in p
          assert 'serverVerifiedNoOwnerSession' in p
          assert "collection('deda_sessions')" in block
          assert 'proof.data()?[\'active\'] == true' in block
          entry=s.split('static Future<bool> signInAdmin({',1)[1].split('static Future<',1)[0]
          assert 'mayBeginAdminAuthenticationOnSharedAuth(' in entry
          assert entry.index('mayBeginAdminAuthenticationOnSharedAuth(') < entry.index('final credential =')
          assert 'admin-login-refused-preserve-deda-owner-session' in entry
          assert 'mayBeginAdminAuthenticationOnSharedAuth' in p
          print('PASS_SOURCE_ADMIN_ENTRY_AND_EXIT_PRESERVE_OWNER_PRINCIPAL')
          PY
      - name: Flutter dependencies and focused session regression tests
        shell: bash
        run: |
          flutter pub get
          dart analyze --no-fatal-warnings lib/deda_backend.dart
          dart analyze --no-fatal-warnings lib/deda_100431_linked_owner_session_policy.dart
          flutter test --no-pub test/deda_owner_session_compat_private_test.dart
      - name: Review exact merged Auth logout conflict fixtures (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/app_stability/app_package/reconcile_stage2_auth_conflicts.py
          python3 -m unittest discover -s test -p test_deda_100450_admin_logout_merge_guard.py -v

      - name: Assemble the exact protected 100450 app source recipe (NO APK)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          # Reuse the existing signed-100450 source assembly recipe exactly;
          # do not clone or rewrite dozens of protected bind/merge operations.
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          workflow = yaml.safe_load(Path(
            '.github/workflows/deda-100450-point2-full-signed-phone-qa-no-play.yml'
          ).read_text())
          steps = workflow['jobs']['build-signed-complete-owner-phone-apk']['steps']
          source = [step['run'] for step in steps
            if 'Reconstruct FULL protected 100439' in step.get('name','')]
          if len(source) != 1 or 'merge_stage2_into_protected_100436.py' not in source[0]:
            raise SystemExit('SAFE_STOP_SIGNED_100450_SOURCE_RECIPE_NOT_FOUND')
          Path('/tmp/deda-100450-source-assembly.sh').write_text(
            'set -euo pipefail\n' + source[0])
          print('PASS_REUSED_EXISTING_100450_FULL_ASSEMBLY_RECIPE')
          PY
          bash /tmp/deda-100450-source-assembly.sh

      - name: Analyze actual full assembled 100450 backend and linked-owner policy
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEDA_SOURCE_ONLY_PROJECT"
          flutter pub get
          dart analyze --no-fatal-warnings lib/deda_backend.dart
          dart analyze --no-fatal-warnings lib/deda_100431_linked_owner_session_policy.dart
          echo 'PASS_ASSEMBLED_100450_ADMIN_OWNER_DART_ANALYSIS'

      - name: Assert guarded admin exit survived complete 100450 assembly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          project = Path(os.environ['DEDA_SOURCE_ONLY_PROJECT'])
          backend = (project/'lib/deda_backend.dart').read_text()
          policy = (project/'lib/deda_100431_linked_owner_session_policy.dart').read_text()
          source = (Path('lib')/'deda_backend.dart').read_text()
          required = [
            'maySignOutAdminPrincipal(',
            'admin-logout-refused-preserve-deda-owner',
            'admin-logout-principal-changed-owner-preserved',
          ]
          before = backend.split('static Future<void> signOutAdmin() async {',1)
          assert len(before) == 2
          block = before[1].split('// DEDA in-app location sharing v1.',1)[0]
          assert all(token in block for token in required)
          assert all(token in source for token in required)
          assert "get(const GetOptions(source: Source.server))" in block
          assert 'maySignOutAdminPrincipal' in policy
          assert 'serverVerifiedNoOwnerSession' in policy
          assert "collection('deda_sessions')" in block
          assert "serverVerifiedNoOwnerSession: !ownerSessionProof.exists" in block
          assert 'mayBeginAdminAuthenticationOnSharedAuth' in policy
          entry = backend.split('static Future<bool> signInAdmin({',1)[1].split('static Future<',1)[0]
          assert 'mayBeginAdminAuthenticationOnSharedAuth(' in entry
          assert entry.index('mayBeginAdminAuthenticationOnSharedAuth(') < entry.index('final credential =')
          assert 'admin-login-refused-preserve-deda-owner-session' in entry
          assert 'DedaGoogleSettingsLinkCard(' not in (project/'lib/main.dart').read_text()
          assert 'deda-stage2-core-merge-proof.json' in {p.name for p in project.glob('*.json')}
          print('PASS_100450_ASSEMBLED_ADMIN_OWNER_UID_GUARD_PRESERVED')
          print('NO_AUTH_RECOVERY_NO_FIREBASE_WRITES_NO_SIGNED_APK_NO_PLAY')
          PY

      - name: No deployment declaration
        run: |
          echo 'NO Firebase Auth write, no Firestore write, no rule deployment'
          echo 'NO signed APK, no Google Play, no production app changed'

  b-eight-real-firestore-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GCLOUD_PROJECT: demo-deda-room-live-additive-compare
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8088
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify emulator-only file and no production exports
        shell: bash
        run: |
          set -euo pipefail
          node --check qa/unified_room_private/deda_b_all_eight_atomic_real_firestore_EMULATOR_ONLY.test.cjs
          node --check functions/deda_unified_room_grant_issuer_private_v1.js
          python3 - <<'PY'
          from pathlib import Path
          index=Path('functions/index.js').read_text()
          issuer=Path('functions/deda_unified_room_grant_issuer_private_v1.js').read_text()
          assert 'require("./deda_unified_room_grant_issuer_private_v1.js")' not in index
          assert 'enabled:false' in index
          assert 'issueAllForB' in issuer
          assert 'enabled=false' in issuer
          print("PASS_UNDEPLOYED_PRIVATE_B_EMULATOR_ONLY_ISSUER")
          PY
      - name: Construct existing private candidate rules in tmp only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,json,pathlib
          src=pathlib.Path('firestore.rules').read_text()
          patch=pathlib.Path('qa/unified_room_private/additive_room_views_rules_CANDIDATE_ONLY.txt').read_text()
          assert 'deda_unified_room_private_views' not in src
          assert 'allow read: if true' not in patch
          matches=list(re.finditer(r'(?m)^  \}\s*\n\}\s*$',src))
          assert matches
          pathlib.Path('/tmp/deda-room-candidate-rules.rules').write_text(src[:matches[-1].start()]+patch+'\n'+src[matches[-1].start():])
          pathlib.Path('/tmp/deda-room-atomic-emulators.json').write_text(json.dumps({
            'firestore':{'rules':'deda-room-candidate-rules.rules'},
            'emulators':{
              'firestore':{'host':'127.0.0.1','port':8088},
              'auth':{'host':'127.0.0.1','port':9099},
              'ui':{'enabled':False}
            }
          }))
          print("PASS_PRIVATE_RULES_FROM_EXISTING_CANDIDATE_ONLY")
          PY
      - name: Install isolated Firebase emulator libraries
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts @firebase/rules-unit-testing@4.0.0 firebase@11.10.0 firebase-admin@13.4.0
      - name: Test eight B grants as ONE real Firestore transaction, never on production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@13.35.1 emulators:exec --project demo-deda-room-live-additive-compare --config /tmp/deda-room-atomic-emulators.json --only firestore,auth --non-interactive 'node --test qa/unified_room_private/deda_b_all_eight_atomic_real_firestore_EMULATOR_ONLY.test.cjs'
      - name: No Firebase production, data migration or APK
        run: echo "QA_EMULATOR_ONLY_NO_AUTH_TRANSFER_NO_FIRESTORE_PROD_NO_PLAY"
