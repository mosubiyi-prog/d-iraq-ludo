name: DEDA Stage54 backend-owned PIN binding + account throttling private REAL emulator NO DEPLOY
on:
  push:
    branches:
      - deda-weekly-stage54-backend-pin-binding-rate-limit-private-no-deploy-2026-10-28
    paths:
      - 'tools/app_stability/stage54/**'
      - 'functions/tests/deda_weekly_stage54_real_anonymous_pin_binding.test.js'
      - 'tests/firestore-rules/stage54_original_rules_private_binding_denial.test.mjs'
      - '.github/workflows/qa-deda-weekly-stage54-pin-binding-no-deploy.yml'
      - 'docs/DEDA_WEEKLY_STAGE54_PRIVATE_AUTH_PIN_BINDING_CHECKPOINT_2026-10-28.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-stage54-private-anonymous-pin-binding-no-deploy
  cancel-in-progress: true
jobs:
  no-original-or-production-source-edits:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact six-file allowlist and reference archive protection
        run: |
          set -euo pipefail
          BASE=ce53071538765421415f20da9d7d61a7e9cce62a
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE" HEAD > /tmp/stage54-changed.txt
          cat /tmp/stage54-changed.txt
          while IFS= read -r path; do
            case "$path" in
              tools/app_stability/stage54/functions/index.js|\
              tools/app_stability/stage54/functions/package.json|\
              functions/tests/deda_weekly_stage54_real_anonymous_pin_binding.test.js|\
              tests/firestore-rules/stage54_original_rules_private_binding_denial.test.mjs|\
              .github/workflows/qa-deda-weekly-stage54-pin-binding-no-deploy.yml|\
              docs/DEDA_WEEKLY_STAGE54_PRIVATE_AUTH_PIN_BINDING_CHECKPOINT_2026-10-28.md) ;;
              *) echo "REFUSE non-stage54 change: $path"; exit 1;;
            esac
          done < /tmp/stage54-changed.txt
          git diff --quiet "$BASE" -- \
            lib/ android/ functions/index.js functions/package.json \
            firebase.json firestore.rules storage.rules \
            pubspec.yaml pubspec.lock \
            tools/app_stability/100380-baseline.tar.gz \
            tools/app_stability/100380-baseline-manifest.json \
            tools/app_stability/app_package/ tools/app_stability/progress_archive/
          node --check tools/app_stability/stage54/functions/index.js
          node --check functions/tests/deda_weekly_stage54_real_anonymous_pin_binding.test.js
          node --check tests/firestore-rules/stage54_original_rules_private_binding_denial.test.mjs
          node - <<'JS'
          const fs=require('node:fs');
          const live=fs.readFileSync('functions/index.js','utf8');
          const privateSource=fs.readFileSync('tools/app_stability/stage54/functions/index.js','utf8');
          if(live.includes('dedaStage54LegacyPinPreflight') ||
             live.includes('deda_stage54_private'))throw Error('Stage54 must be NOT_EXPORTED');
          for(const x of [
            "STAGE54_EMULATOR_ONLY_REFUSE_PRODUCTION_START",
            "STAGE54_EMULATOR_TEST_KEY",
            "getAuth().getUser(uid)",
            "tx.create(bindingRef",
            "lockedUntilMs",
            "HOLD_NO_GRANTS",
            "canCreditDiamonds:false",
            "canMigrate:false",
          ])if(!privateSource.includes(x))throw Error('Missing hold-only invariant '+x);
          console.log('PASS unchanged real DEDA app, signed reference, original Rules, wallets and live Functions');
          JS
  real-auth-functions-and-original-rules:
    needs: no-original-or-production-source-edits
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-deda-stage54-pin-binding
      GOOGLE_CLOUD_PROJECT: demo-deda-stage54-pin-binding
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIREBASE_FUNCTIONS_EMULATOR_HOST: 127.0.0.1:5001
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      STAGE54_EMULATOR_ONLY: 'true'
      STAGE54_EMULATOR_TEST_KEY: 'DISPOSABLE_STAGE54_QA_HMAC_KEY_NEVER_A_PRODUCTION_SECRET_20261028'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install disposable Firebase SDK, local Functions dependencies and Firebase CLI
        run: |
          set -euo pipefail
          npm --prefix tests/firestore-rules install --no-audit --no-fund
          npm --prefix tools/app_stability/stage54/functions install --no-audit --no-fund
          npm --prefix functions install --no-save --no-audit --no-fund firebase-tools@14
      - name: Actual original Firestore Rules + REAL Auth anonymous transport + private Functions v2
        run: |
          set -euo pipefail
          # Firebase CLI reads a transient config at REPOSITORY ROOT.
          # It loads the ORIGINAL UNCHANGED firestore.rules; NOT a permissive fake.
          cat > firebase.stage54.ci.json <<'JSON'
          {
            "functions": {
              "source": "tools/app_stability/stage54/functions",
              "codebase": "deda-stage54-private-pin-emulator"
            },
            "firestore": {"rules": "firestore.rules"},
            "emulators": {
              "auth": {"port": 9099},
              "functions": {"port": 5001},
              "firestore": {"port": 8080},
              "ui": {"enabled": false},
              "singleProjectMode": true
            }
          }
          JSON
          trap 'rm -f firebase.stage54.ci.json' EXIT
          node - <<'JS'
          const c=require('./firebase.stage54.ci.json');
          const f=require('./firebase.json');
          if(c.firestore.rules!==f.firestore.rules ||
             c.functions.source==='functions' ||
             c.emulators.auth.port!==9099) throw Error('Stage54 wrong source/config');
          JS
          functions/node_modules/.bin/firebase emulators:exec \
            --config firebase.stage54.ci.json \
            --project demo-deda-stage54-pin-binding --only auth,functions,firestore \
            'node --test functions/tests/deda_weekly_stage54_real_anonymous_pin_binding.test.js && cd tests/firestore-rules && node --test stage54_original_rules_private_binding_denial.test.mjs'
      - name: Validate NO production authorization, user migration or real rewards
        run: |
          echo 'Stage54 authenticated anonymous-UID + PIN against TEST ONLY credentials on local Firebase emulators.'
          echo 'Firebase Auth Emulator JWTs are UNSIGNED and may allow forgery patterns absent in production.'
          echo 'Stage54 uses enforceAppCheck:false ONLY inside demo-project guarded emulator sandbox.'
          echo 'No production proof of real App Check, old APK cutoff, real migration or approved prize issuance.'
          echo 'Original app, Firestore Rules, Cloud Functions, old XP, diamonds, wallet, purchases, ID, frames remain untouched.'
          echo 'No APK, AAB, Play or Firebase deployment. Mandatory full owner pre-APK review remains in force.'
