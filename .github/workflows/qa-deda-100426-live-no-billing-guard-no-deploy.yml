name: DEDA 100426 Existing Live Rules No-Billing PIN-Safe Session Guard QA (NO DEPLOY)
on:
  push:
    branches:
      - deda-100426-no-billing-legacy-session-guard-qa-no-deploy-2026-11-01
    paths:
      - 'tools/deda_100426_stage_live_session_guard_no_deploy.py'
      - 'test/test_deda_100426_session_guard_diff.py'
      - 'test/deda_100426_live_session_guard_emulator.test.cjs'
      - '.github/workflows/qa-deda-100426-live-no-billing-guard-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-100426-live-readonly-qa
  cancel-in-progress: false
jobs:
  read-exact-live-and-test-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEDA_SA_PRIMARY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      DEDA_SA_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GCLOUD_PROJECT: demo-deda-100426-no-billing-qa
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Assert exact reversible one-branch change and fail-closed drift
        run: python3 -m unittest discover -s test -p 'test_deda_100426_session_guard_diff.py' -v
      - name: Read LIVE Firestore Rules GET ONLY and stage temporary local candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check google-auth requests
          python3 tools/deda_100426_stage_live_session_guard_no_deploy.py
          echo "DEDA_100426_CANDIDATE_PATH=$RUNNER_TEMP/deda-100426-live-session-candidate.rules" >> "$GITHUB_ENV"
      - name: Test legacy PIN, stolen install token, existing sessions and original identity on emulator
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions install --no-save --no-audit --no-fund \
            firebase@11.10.0 @firebase/rules-unit-testing@4 firebase-tools@14
          test "$GCLOUD_PROJECT" = demo-deda-100426-no-billing-qa
          env -u DEDA_SA_PRIMARY -u DEDA_SA_FALLBACK \
            functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100426-no-billing-qa \
            --config "$RUNNER_TEMP/deda-100426-emulator.json" --only firestore \
            'node --test test/deda_100426_live_session_guard_emulator.test.cjs'
          echo 'PASS_100426_LOCAL_QA_ONLY_NO_DEPLOY'
      - name: Explicit no production Firebase writes, APK or Play
        run: |
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo 'GET_ONLY_NO_FIREBASE_DEPLOY_NO_RULES_RELEASE_NO_WALLET_MUTATION_NO_APK_NO_PLAY'
      - name: Scrub temporary live Rules and candidate
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/deda-100426-live-session-candidate.rules" \
                "$RUNNER_TEMP/deda-100426-emulator.json"
