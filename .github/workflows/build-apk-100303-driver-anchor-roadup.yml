name: Build DEDA 100303 Driver Anchor Road-Up

on:
  push:
    branches:
      - driver-anchor-roadup-100303-2026-10-07
    paths:
      - '.github/workflows/build-apk-100303-driver-anchor-roadup.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100303 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100303
        run: bash tools/build_100303_driver_anchor_roadup.sh

      - name: Upload APK 100303
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100303-driver-anchor-roadup-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
