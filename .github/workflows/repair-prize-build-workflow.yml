name: Repair Prize Build Workflow

on:
  push:
    branches:
      - prize-winners-flow-2026-10-01
    paths:
      - .github/workflows/repair-prize-build-workflow.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prize branch
        uses: actions/checkout@v4
        with:
          ref: prize-winners-flow-2026-10-01
          fetch-depth: 0

      - name: Restore known-good Build 235 workflow and add only prize changes
        run: |
          git show checkpoint-build235-daily-tasks-card-sequence-2026-10-01:.github/workflows/build.yml > .github/workflows/build.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/build.yml')
          text = path.read_text()

          branch_anchor = '      - fix-daily-tasks-card-sequence-2026-10-01\n'
          if '      - prize-winners-flow-2026-10-01\n' not in text:
              if branch_anchor not in text:
                  raise SystemExit('Build 235 branch anchor missing')
              text = text.replace(
                  branch_anchor,
                  branch_anchor + '      - prize-winners-flow-2026-10-01\n',
                  1,
              )

          validator_anchor = '''      - name: Validate DEDA daily tasks and card sequence in final source
        run: python3 tools/validate_daily_tasks_card_sequence_2026_10_01.py
'''
          prize_validator = '''
      - name: Validate DEDA prize winner flow in final source
        run: python3 tools/validate_prize_winners_flow_2026_10_01.py
'''
          if 'Validate DEDA prize winner flow in final source' not in text:
              if validator_anchor not in text:
                  raise SystemExit('Build 235 validator anchor missing')
              text = text.replace(
                  validator_anchor,
                  validator_anchor + prize_validator,
                  1,
              )

          path.write_text(text)
          PY

      - name: Commit repaired workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build.yml
          git diff --cached --quiet && exit 0
          git commit -m "Restore Build 235 workflow and enable prize release build"
          git push origin HEAD:prize-winners-flow-2026-10-01
