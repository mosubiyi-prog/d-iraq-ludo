name: Apply complete prize cycle patch

on:
  push:
    branches:
      - prize-cycle-complete-2026-10-01
    paths:
      - .github/workflows/repair-prize-build-workflow.yml
      - tools/patch_prize_cycle_complete_2026_10_01.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: prize-cycle-complete-2026-10-01
          fetch-depth: 0

      - name: Scope cycle-id insertion and apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/patch_prize_cycle_complete_2026_10_01.py')
          text = path.read_text(encoding='utf-8')
          old = '''if "'cycleId': prizeWinnerCycleId," not in b:
              b = replace_once(
                  b,
                  "      'ownerUid': user.uid,\\n",
                  "      'ownerUid': user.uid,\\n      'cycleId': prizeWinnerCycleId,\\n",
                  'persist prize cycle id',
              )
          '''
          new = '''if "'cycleId': prizeWinnerCycleId," not in b:
              submit_start = b.find('  static Future<String> submitPrizeWinnerRequest({')
              submit_end = b.find('  static Future<void> replyToPrizeWinnerRequestFromUser({', submit_start)
              if submit_start < 0 or submit_end < 0:
                  raise SystemExit('submit prize request block not found')
              submit_block = b[submit_start:submit_end]
              submit_block = replace_once(
                  submit_block,
                  "      'ownerUid': user.uid,\\n",
                  "      'ownerUid': user.uid,\\n      'cycleId': prizeWinnerCycleId,\\n",
                  'persist prize cycle id',
              )
              b = b[:submit_start] + submit_block + b[submit_end:]
          '''
          if old not in text:
              raise SystemExit('runtime cycle-id patch anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tools/patch_prize_cycle_complete_2026_10_01.py

      - name: Validate complete prize cycle before commit
        run: |
          python3 tools/validate_daily_tasks_card_sequence_2026_10_01.py
          python3 tools/validate_prize_winners_flow_2026_10_01.py
          python3 tools/validate_prize_cycle_complete_2026_10_01.py
          git diff --check

      - name: Commit complete prize cycle
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/deda_backend.dart lib/prize_winner_pages.dart firestore.rules \
            .github/workflows/build.yml .github/workflows/deploy-prize-winners-firestore.yml \
            tools/validate_prize_cycle_complete_2026_10_01.py
          git commit -m "Complete prize delivery confirmation and winners administration"
          git push origin HEAD:prize-cycle-complete-2026-10-01
