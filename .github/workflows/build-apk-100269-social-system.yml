name: Build DEDA 100269 Social System

on:
  push:
    branches:
      - social-system-consolidated-100269-2026-10-04
    paths:
      - '.github/workflows/build-apk-100269-social-system.yml'

jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-100269]')
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100269 social branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100269
        run: bash tools/build_100269_social_system.sh

      - name: Upload APK 100269
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100269-social-system-apk
          path: build/app/outputs/flutter-apk/app-release.apk
