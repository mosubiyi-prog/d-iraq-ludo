name: DEDA Point 12 Checkout Preview Tests
on:
  workflow_dispatch:
  push:
    branches:
      - deda-intakadha-ids-cards-stage1-2026-10-18
    paths:
      - tools/stage_deda_intakadha_point12_safe_card_checkout_2026_10_19.py
      - test/test_deda_intakadha_point12_safe_checkout_2026_10_19.py
      - test/deda_intakadha_point12_safe_checkout_widget_test.dart
      - .github/workflows/qa-deda-intakadha-point12-safe-checkout-no-apk.yml
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Confirm protected source unchanged
        run: |
          git fetch origin backup-deda-100356-phone-ui-verified-2026-10-18
          test "$(git rev-parse origin/backup-deda-100356-phone-ui-verified-2026-10-18)" = 4373b8b30eadc5a284554ca7c021c350e0732caf
          git diff --name-only origin/backup-deda-100356-phone-ui-verified-2026-10-18 HEAD | grep -E '^lib/|^android/|^functions/|^assets/' && exit 1 || true
      - name: Run focused source checkout tests
        run: |
          python3 -m py_compile tools/stage_deda_intakadha_point12_safe_card_checkout_2026_10_19.py
          python3 -m unittest discover -s test -p 'test_deda_intakadha_point12_safe_checkout_2026_10_19.py' -v
  isolated-flutter:
    needs: source-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Isolated purchase UI tests
        run: |
          mkdir -p "$RUNNER_TEMP/checkout/lib" "$RUNNER_TEMP/checkout/test"
          python3 - "$RUNNER_TEMP/checkout/lib/deda_point12_checkout_fixture.dart" <<'PY'
          import ast,importlib.util,sys
          from pathlib import Path
          def extract(path,name):
              root=ast.parse(Path(path).read_text(encoding='utf-8'))
              result=[s.value.value for s in root.body if isinstance(s,ast.Assign)
                      and isinstance(s.value,ast.Constant)
                      and any(isinstance(t,ast.Name) and t.id==name for t in s.targets)]
              assert len(result)==1
              return result[0]
          path='tools/stage_deda_intakadha_point12_safe_card_checkout_2026_10_19.py'
          spec=importlib.util.spec_from_file_location('checkout',path)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          art=extract('tools/stage_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py','ARTWORK')
          Path(sys.argv[1]).write_text("import 'package:flutter/material.dart';\nString dedaText(String ar,String en)=>ar;\n"+art+"\n"+mod.upgraded_widget(),encoding='utf-8')
          PY
          cp test/deda_intakadha_point12_safe_checkout_widget_test.dart "$RUNNER_TEMP/checkout/test/"
          cat > "$RUNNER_TEMP/checkout/pubspec.yaml" <<'YAML'
          name: deda_checkout_qa
          description: Isolated checkout preview tests
          version: 0.0.1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
          YAML
          cd "$RUNNER_TEMP/checkout"
          dart format lib test
          flutter pub get
          flutter test --reporter expanded
