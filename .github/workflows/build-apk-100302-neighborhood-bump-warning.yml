name: Build DEDA 100302 Neighborhood Bump Warning

on:
  push:
    branches:
      - bump-neighborhood-100302-2026-10-07
    paths:
      - '.github/workflows/build-apk-100302-neighborhood-bump-warning.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100302 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100302
        run: bash tools/build_100302_neighborhood_bump_warning.sh

      - name: Upload APK 100302
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100302-neighborhood-bump-warning-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
