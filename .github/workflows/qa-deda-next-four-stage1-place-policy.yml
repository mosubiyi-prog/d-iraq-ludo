name: DEDA Next Four Stage1 Place Automation Safety - NO DEPLOY

on:
  push:
    branches:
      - deda-next-four-items-stage0-2026-10-10
    paths:
      - 'functions/deda_place_auto_approval_policy.js'
      - 'functions/deda_place_auto_approval_worker.js'
      - 'functions/index.js'
      - 'tests/stage14/deda_place_auto_approval_policy.test.cjs'
      - 'tests/stage14/deda_pin_auto_recovery_policy.test.cjs'
      - 'tests/stage14/deda_pin_auto_recovery_worker.test.cjs'
      - 'functions/deda_pin_auto_recovery_policy.js'
      - 'functions/deda_pin_auto_recovery_worker.js'
      - 'functions/deda_telegram_reward_policy.js'
      - 'functions/deda_telegram_verified_claim.js'
      - 'functions/deda_telegram_bot_binding.js'
      - 'functions/deda_telegram_reward_activation.js'
      - 'tests/stage14/deda_telegram_reward_activation.test.cjs'
      - 'tests/stage14/deda_telegram_bot_binding.test.cjs'
      - 'tests/stage14/deda_telegram_verified_claim.test.cjs'
      - 'tests/stage14/deda_telegram_reward_policy.test.cjs'
      - '.github/workflows/qa-deda-next-four-stage1-place-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-stage1-no-prod:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Functions SDK locally for syntax and import checks
        run: npm --prefix functions install --no-audit --no-fund
      - name: Validate isolated server policy and review cases
        run: |
          node --check functions/index.js
          python3 - <<'PY'
          from pathlib import Path
          root=Path('functions/index.js').read_text()
          scope=root.split('exports.dedaAutomationReadiness = onCall(',1)[1].split('const ADMIN_ROLES',1)[0]
          assert 'await requireGeneralManager(request)' in scope, 'GM backend role authorization missing'
          assert 'if (actor.data.role' not in scope, 'GM role reference broken (requireGeneralManager returns actor.role)'
          assert 'deda_automation_status' in scope
          assert 'place_auto_approval' in scope and 'pin_auto_recovery' in scope
          print('PASS: deployed manager activation handshake uses normalized strict GM identity.')
          PY
          node --check functions/deda_place_auto_approval_worker.js
          node --check functions/deda_place_auto_approval_policy.js
          node --check functions/deda_pin_auto_recovery_worker.js
          node --check functions/deda_pin_auto_recovery_policy.js
          node --check functions/deda_telegram_verified_claim.js
          node --check functions/deda_telegram_bot_binding.js
          node --check functions/deda_telegram_reward_activation.js
          node --test tests/stage14/deda_place_auto_approval_policy.test.cjs tests/stage14/deda_pin_auto_recovery_policy.test.cjs tests/stage14/deda_pin_auto_recovery_worker.test.cjs tests/stage14/deda_telegram_reward_policy.test.cjs tests/stage14/deda_telegram_verified_claim.test.cjs tests/stage14/deda_telegram_bot_binding.test.cjs tests/stage14/deda_telegram_reward_activation.test.cjs
          node --test tests/stage2_social/social_policy.test.cjs tests/stage2_social/trial_runtime.test.cjs
      - name: Assert no Firebase deploy or APK build in stage1
        run: |
          test -f functions/deda_place_auto_approval_worker.js
          grep -q 'processNewPlace' functions/index.js
          echo 'Only tests ran. No production Firebase or APK changes.'
