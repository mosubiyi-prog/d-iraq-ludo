name: DEDA Four-Question Survey Secure Save QA (Emulator Only)

on:
  push:
    branches:
      - survey-4-questions-safe-2026-10-09
    paths:
      - '.github/workflows/qa-survey-save-permission-2026-10-08.yml'
      - 'tests/firestore-rules/phase2.test.mjs'
      - 'firestore.rules'

permissions:
  contents: read

jobs:
  replay-apk-survey-writes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated QA branch (no production changes)
        uses: actions/checkout@v4
      - name: Node.js for Firestore emulator
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm this workflow cannot deploy
        run: |
          ! grep -Eq 'firebase-tools.*deploy|deda_activate_admin_drafts_rules_2026_10_08.py deploy' .github/workflows/qa-survey-save-permission-2026-10-08.yml
          git diff --exit-code origin/admin-firebase-drafts-live-activation-2026-10-08 -- lib/ functions/ android/ 2>/dev/null || true
      - name: Install local test tools only
        run: npm --prefix tests/firestore-rules install --no-audit --no-fund
      - name: Verify 1-4 surveys, full audit batch, reject invalid and fifth question
        env:
          CI: 'true'
        run: |
          npx --yes firebase-tools@14 emulators:exec \
            --only firestore \
            --project demo-deda-phase2-drafts \
            "node --test tests/firestore-rules/phase2.test.mjs"
      - name: Report safe result
        run: echo 'Emulator-only survey-save tests completed; NO production rules or wallets modified.'
