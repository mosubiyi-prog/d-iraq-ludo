name: Build DEDA 100282 Control From 100279

on:
  push:
    branches:
      - control-100282-from-100279-2026-10-06
    paths:
      - '.github/workflows/build-apk-100282-control-from-100279.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100282 control branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100282 control
        run: bash tools/build_100282_control_from_100279.sh

      - name: Upload APK 100282 control
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100282-control-from-100279-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
