name: DEDA 100436 PIN compatibility — PRIVATE NO DEPLOY

on:
  push:
    branches:
      - deda-100436-pin-compat-private-no-deploy-2026-11-05
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin-compat-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Functions syntax without installing/deploying
        run: |
          node --check functions/index.js
          node --check functions/deda_owner_pin_verify_private_v1.js
          node --check functions/deda_pin_manual_recovery_compat_private_v1.js
          node --check functions/test/deda_owner_pin_verify_private_v1.test.js
          node --check functions/test/deda_pin_manual_recovery_compat_private_v1.test.js
      - name: Ensure production Functions index has no new exports/imports
        shell: bash
        run: |
          if grep -Eq 'deda_owner_pin_verify_private_v1|deda_pin_manual_recovery_compat_private_v1' functions/index.js; then
            echo "BLOCK: private candidate is wired into existing Functions"
            exit 1
          fi
          echo "PASS: both private Functions are inert"
      - name: Mocked PIN verification + manual recovery compatibility tests
        run: |
          node --test functions/test/deda_owner_pin_verify_private_v1.test.js functions/test/deda_pin_manual_recovery_compat_private_v1.test.js
