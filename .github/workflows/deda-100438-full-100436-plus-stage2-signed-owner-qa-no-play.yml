name: DEDA 100438 SIGNED FULL 100436 + integrated Stage2 sources (OWNER QA NO PLAY)
on:
  push:
    branches:
      - deda-100438-full-100436-plus-stage2-signed-owner-qa-no-play-2026-11-06
    paths:
      - '.github/workflows/deda-100438-full-100436-plus-stage2-signed-owner-qa-no-play.yml'
      - 'tools/app_stability/app_package/guard_100436_parity_before_recovery.py'
      - 'tools/app_stability/app_package/merge_stage2_into_protected_100436.py'
      - 'tools/app_stability/app_package/reconcile_stage2_auth_conflicts.py'
      - 'tools/app_stability/app_package/reconcile_stage2_main_conflicts.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reconstruct-and-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lock old owner baseline and protect all user data
        shell: bash
        run: |
          set -euo pipefail
          signed_reference=fea54d7db2e8a24a74267f04a14c9572bcb408ee
          stage2_source=80f5c03e4a25677b448b1593f843995c6d81b356
          git cat-file -e "$signed_reference^{commit}"
          git merge-base --is-ancestor "$stage2_source" HEAD
          git diff --exit-code "$stage2_source" HEAD -- lib assets android functions pubspec.yaml pubspec.lock google-services.json firestore.rules firebase.json storage.rules
          test -f lib/deda_step2_completion_gate.dart
          test -f tools/app_stability/app_package/guard_100436_parity_before_recovery.py
          echo 'PASS_OWNER100436_SOURCE_AND_FIREBASE_UNMODIFIED'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
      - name: Reconstruct EXACT same ordered signed 100436 app source, not raw lib
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/deda-100438-protected-source"
          flutter create --platforms=android --org com.diraq.ludo --project-name d_iraq_ludo "$project"
          python3 tools/app_stability/app_package/prepare.py "$project" --variant candidate
          python3 tools/app_stability/app_package/bind_weekly_stage13.py "$project"
          python3 tools/app_stability/app_package/bind_active_id_boot_prewarm_stage14.py "$project"
          python3 tools/app_stability/app_package/bind_active_id_measured_startup_stage16.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_private_trial_stage17.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_full_qa_stage18.py "$project"
          python3 tools/app_stability/app_package/verify_rank_card_tap_stage19.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_admin_league_stage27.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_tasks_cta_stage28.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100397_owner_real_scores.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100398_after_level_xp.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100399_community_bridge.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100400_safe_score_retry.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100402_firestore_direct.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100403_first_open_gate.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100404_inline_clock_and_freeze.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100405_admin_live_read_only.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100406_league_display_fixes.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100407_full_avatar_shared_identity.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100408_seven_owner_points.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100409_single_verified_identity.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100410_unified_active_id.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100411_friend_copy_share.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100413_owner_id_admin_response.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100414_last_three.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100418_legacy340_friend_active_compat.py "$project"
          echo "DEDA_PROTECTED_STAGE2_PROJECT=$project" >> "$GITHUB_ENV"
          python3 tools/app_stability/app_package/guard_100436_parity_before_recovery.py "$project"
          echo 'PASS_EXACT_ORDERED_100436_RECONSTRUCTION_NO_RAW_OVERWRITE'
      - name: Safely stage ONLY new recovery modules; never overwrite old UI, backend, league, ID, admin
        shell: bash
        run: |
          set -euo pipefail
          project="$DEDA_PROTECTED_STAGE2_PROJECT"
          shopt -s nullglob
          count=0
          for source in "$GITHUB_WORKSPACE"/lib/deda_step2_*.dart "$GITHUB_WORKSPACE"/lib/deda_100429*.dart "$GITHUB_WORKSPACE"/lib/deda_100430*.dart "$GITHUB_WORKSPACE"/lib/deda_100431*.dart "$GITHUB_WORKSPACE"/lib/deda_100432*.dart "$GITHUB_WORKSPACE"/lib/deda_100433*.dart; do
            target="$project/lib/$(basename "$source")"
            if test -e "$target"; then
              echo "BLOCK_RECOVERY_MODULE_WOULD_OVERWRITE_BASELINE: $target"
              exit 1
            fi
            cp "$source" "$target"
            count=$((count + 1))
          done
          test "$count" -ge 30
          python3 tools/app_stability/app_package/guard_100436_parity_before_recovery.py "$project" --staged-recovery
          echo "PASS_ADDITIVE_RECOVERY_FILES_COUNT=$count"
      - name: Negative regression test - RAW lib overwrite must be blocked
        shell: bash
        run: |
          set -euo pipefail
          project="$DEDA_PROTECTED_STAGE2_PROJECT"
          cp "$project/lib/main.dart" "$RUNNER_TEMP/deda-100436-good-main.dart"
          cp "$GITHUB_WORKSPACE/lib/main.dart" "$project/lib/main.dart"
          if python3 tools/app_stability/app_package/guard_100436_parity_before_recovery.py "$project" --staged-recovery; then
            echo 'FAIL_REGRESSION_GATE_ACCEPTED_RAW_OLD_MAIN'
            exit 1
          fi
          cp "$RUNNER_TEMP/deda-100436-good-main.dart" "$project/lib/main.dart"
          python3 tools/app_stability/app_package/guard_100436_parity_before_recovery.py "$project" --staged-recovery
          echo 'PASS_REGRESSION_DETECTED_AND_BASELINE_RESTORED'
      - name: Three-way merge Stage2 core changes on top of complete assembled 100436 - fail on conflicts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/app_stability/app_package/merge_stage2_into_protected_100436.py "$DEDA_PROTECTED_STAGE2_PROJECT"
          echo 'PASS_OR_BLOCK_3WAY_RESTORE_CORE_SAFETY_GATE'
      - name: Analyze combined assembled 100436 and conservatively merged recovery source
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEDA_PROTECTED_STAGE2_PROJECT"
          flutter pub get --enforce-lockfile
          dart analyze --no-fatal-warnings lib/main.dart lib/admin_pages.dart lib/deda_weekly_leaderboard_page.dart lib/deda_friend_id_copy_100411.dart lib/deda_step2_completion_gate.dart lib/deda_step2_existing_account_signin_page.dart lib/deda_step2_linked_owner_guardian_assembly.dart
          echo 'PASS_SOURCE_ANALYSIS_NOT_A_FINISHED_RESTORE'
      - name: Run account, linked UID, recovery and wallet no-grant tests on FINAL assembled app
        shell: bash
        run: |
          set -euo pipefail
          project="$DEDA_PROTECTED_STAGE2_PROJECT"
          mkdir -p "$project/test"
          for testname in \
            deda_owner_login_commit_guard_private_test.dart \
            deda_owner_session_compat_private_test.dart \
            deda_step2_existing_account_signin_page_private_test.dart \
            deda_step2_completion_gate_private_test.dart \
            deda_step2_recovery_guardian_private_test.dart \
            deda_step2_linked_owner_guardian_bridge_private_test.dart; do
            cp "$GITHUB_WORKSPACE/test/$testname" "$project/test/$testname"
          done
          cd "$project"
          flutter test --no-pub \
            test/deda_owner_login_commit_guard_private_test.dart \
            test/deda_owner_session_compat_private_test.dart \
            test/deda_step2_existing_account_signin_page_private_test.dart \
            test/deda_step2_completion_gate_private_test.dart \
            test/deda_step2_recovery_guardian_private_test.dart \
            test/deda_step2_linked_owner_guardian_bridge_private_test.dart
          echo 'PASS_ASSEMBLED_APP_OWNER_AND_FINANCIAL_INVARIANT_TESTS'
      - name: Test protected 100436 leaderboard, admin scores, premium ID, friends and tasks
        shell: bash
        run: |
          set -euo pipefail
          project="$DEDA_PROTECTED_STAGE2_PROJECT"
          mkdir -p "$project/test"
          for testname in \
            deda_weekly_100404_league_clock_test.dart \
            deda_weekly_leaderboard_earned_points_test.dart \
            deda_100410_unified_active_id_test.dart \
            deda_100411_friend_copy_test.dart \
            deda_admin_league_live_widgets_test.dart \
            deda_daily_task_slots_test.dart; do
            cp "$GITHUB_WORKSPACE/test/$testname" "$project/test/$testname"
          done
          cd "$project"
          flutter test --no-pub \
            test/deda_weekly_100404_league_clock_test.dart \
            test/deda_weekly_leaderboard_earned_points_test.dart \
            test/deda_100410_unified_active_id_test.dart \
            test/deda_100411_friend_copy_test.dart \
            test/deda_admin_league_live_widgets_test.dart \
            test/deda_daily_task_slots_test.dart
          echo 'PASS_PROTECTED_100436_LEAGUE_ADMIN_ID_FRIEND_TASKS'
      - name: Verify signed baseline hash proof after merged Dart analysis
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/app_stability/app_package/merge_stage2_into_protected_100436.py "$DEDA_PROTECTED_STAGE2_PROJECT" --verify-only
          echo 'PASS_FINAL_SOURCE_RECOVERY_PARITY_GUARD_NO_APK'

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: mosubiyi-prog/d-iraq-ludo
          run-id: 39948539871
          name: DEDA-100379-OWNER18-PRIVATE-QA
          path: ${{ runner.temp }}/deda-original-reference

      - name: Restore EXACT original DEDA signing identity (no new certificate)
        shell: bash
        working-directory: ${{ runner.temp }}/deda-100438-protected-source
        run: |
          set -euo pipefail
          test -n "${DEDA_KEYSTORE_BASE64:-}"
          test -n "${DEDA_KEY_ALIAS:-}"
          test -n "${DEDA_STORE_PASSWORD:-}"
          test -n "${DEDA_KEY_PASSWORD:-}"
          dart run flutter_launcher_icons
          python3 "$GITHUB_WORKSPACE/tools/restore_signing_key_2026_10_02.py"
          keytool -list -keystore android/app/deda-release.jks -storepass "$DEDA_STORE_PASSWORD" -alias "$DEDA_KEY_ALIAS" >/dev/null
          echo 'PASS_ORIGINAL_DEDA_SIGNING_IDENTITY_AVAILABLE'

      - name: Lock complete 100436 features and merged Stage2 in FINAL build inputs
        shell: bash
        run: |
          set -euo pipefail
          project="$DEDA_PROTECTED_STAGE2_PROJECT"
          python3 tools/app_stability/app_package/merge_stage2_into_protected_100436.py "$project" --verify-only
          python3 - "$project" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          project=Path(sys.argv[1])
          path=project/'internal-build-inputs.json'
          data=json.loads(path.read_text())
          merge=json.loads((project/'deda-stage2-core-merge-proof.json').read_text())
          assert data['package']=='com.diraq.ludo.d_iraq_ludo'
          assert data['versionCode']==100418
          assert data['financialRestoreEnabled'] is False
          assert data['completeOwnerDelivery'] is False
          assert len(merge['coreHashes'])==6
          assert merge['noFirebaseOrPlayDeploy'] is True
          for key in ('weeklyStage13','weekly100404InlineClock','weekly100406DisplayFixes','weekly100408OwnerSevenPoints',
                      'weekly100411FriendCopy','weekly100413PublicOwnerAdminResponsive','weekly100414FinalThree',
                      'weekly100418Legacy340OwnerOnlyAuthReadCandidate'):
              assert key in data,key
          dart_files=list((project/'lib').glob('*.dart'))
          assert len([p for p in dart_files if p.name.startswith('deda_step2_')])>=20
          for p in ('lib/deda_step2_completion_gate.dart','lib/deda_step2_existing_account_signin_page.dart',
                    'lib/deda_step2_linked_owner_guardian_assembly.dart','lib/deda_weekly_leaderboard_page.dart',
                    'lib/deda_admin_league_page.dart','lib/deda_unified_active_id_100410.dart'):
              assert (project/p).is_file(),p
          assert 'bool get canPrepareFullRecoveryApk => false;' in (project/'lib/deda_step2_completion_gate.dart').read_text()
          assert 'defaultValue: false' in (project/'lib/deda_step2_existing_account_signin_page.dart').read_text()
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          data['versionCode']=100438
          data['completeOwnerDelivery']=False
          data['financialRestoreEnabled']=False
          data['recoveryUserEntryEnabled']=False
          data['stage2IntegratedRecoveryIncludedButNotActivated']=True
          data['sourceOfTruthFeatureBaselineVersion']=100436
          data['sourceOfTruthFeatureBaselineCommit']='fea54d7db2e8a24a74267f04a14c9572bcb408ee'
          data['recoveryCoreMergeProofSha256']=sha(project/'deda-stage2-core-merge-proof.json')
          data['purpose']='SIGNED PRIVATE PHONE QA: original 100436 UI and league/admin PLUS inert Stage2 modules; NOT LIVE ACCOUNT RESTORE'
          data['sourceHashes']={str(p.relative_to(project)):sha(p) for p in dart_files}
          for name in ('pubspec.yaml','pubspec.lock'):
              data['sourceHashes'][name]=sha(project/name)
          manifest=project/'android/app/src/main/AndroidManifest.xml'
          assert manifest.read_text().count('ca-app-pub-2512641627784244~4635932278')==1
          data['platformHashes']['android/app/src/main/AndroidManifest.xml']=sha(manifest)
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          print('PASS_100436_FULL_FEATURE_PARITY_AND_STAGE2_PRESERVED_IN_SIGNED_BUILD_INPUTS')
          PY

      - name: Compile ONE signed owner phone APK 100438 from final protected 100436+Stage2 sources
        shell: bash
        working-directory: ${{ runner.temp }}/deda-100438-protected-source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          data=json.load(open('internal-build-inputs.json'))
          assert data['versionCode']==100438
          assert data['stage2IntegratedRecoveryIncludedButNotActivated'] is True
          assert data['weeklyStage13']['bothHomeRoutes']==2
          cmd=['flutter','build','apk','--release','--no-pub','--build-number=100438',
               '--dart-define=DEDA_QA32_SPARK_PUBLIC_IDS_LIVE=true',
               '--dart-define=DEDA_100418_LEGACY340_ACTIVE_READ_APPROVED=true',
               '--dart-define=DEDA_STEP2_EXISTING_ACCOUNT_ENTRY=false']
          cmd+=['--dart-define='+key+'='+str(value).lower() for key,value in data['flags'].items()]
          subprocess.run(cmd,check=True)
          PY

      - name: Verify signed APK original package/certificate/Android parity and SHA256
        shell: bash
        run: |
          set -euo pipefail
          project="$DEDA_PROTECTED_STAGE2_PROJECT"
          ref="$RUNNER_TEMP/deda-original-reference/DEDA-100379-OWNER18-PRIVATE-QA.apk"
          out="$RUNNER_TEMP/deda-100438-full-100436-plus-stage2-owner-phone-qa"
          test -s "$ref"
          test -s "$project/build/app/outputs/flutter-apk/app-release.apk"
          mkdir -p "$out"
          python3 tools/app_stability/app_package/verify.py "$project" "$ref" --output "$out/verification.json"
          python3 - "$out/verification.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['packageVerification']['versionCode']==100438
          assert d['packageVerification']['package']=='com.diraq.ludo.d_iraq_ludo'
          assert d['certificateSha256']=='a53d855b82d1280f324037428421838139ecf2e30174f9fcd0bd1878698b5f4a'
          assert d['stage2IntegratedRecoveryIncludedButNotActivated'] is True
          assert d['sourceOfTruthFeatureBaselineVersion']==100436
          assert d['originalPortraitsVerified']==3
          assert d['appLaunched'] is False
          print('PASS_APK_ORIGINAL_DEDA_SIGNATURE_PACKAGE_100438_PORTRAITS_BUILD_SOURCE')
          PY
          cp "$project/build/app/outputs/flutter-apk/app-release.apk" "$out/DEDA-100438-FULL-100436-PLUS-STAGE2-OWNER-PHONE-QA.apk"
          (cd "$out" && sha256sum *.apk > SHA256.txt)
          printf '%s\n' \
            'DEDA 100438 signed OWNER QA: retains complete 100436 app, league, admin, friends, IDs, gifts and tasks, plus integrated Stage2 recovery source modules.' \
            'Important: existing account login and financial restoration remain DISABLED because production Cloud Functions/owner data proof are NOT ready.' \
            'Do NOT uninstall the currently installed DEDA app or clear data. Only attempt in-place update after comparing SHA256 and signing results.' \
            'No Google Play, no Firebase functions/rules deploy, no wallet/points/customer data changes.' \
            'Owner must inspect home, league card, admin tools and phone update behavior; real cross-phone account restoration must not be attempted.' \
            > "$out/README.txt"
          echo 'PASS_FULL_100436_PLUS_STAGE2_SIGNED_OWNER_INSTALLATION_QA_NOT_LIVE_RESTORE'

      - name: Upload ONE complete-baseline signed owner QA APK, verification and hash (NO PLAY)
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100438-FULL-100436-PLUS-STAGE2-SIGNED-OWNER-QA-APK
          path: |
            ${{ runner.temp }}/deda-100438-full-100436-plus-stage2-owner-phone-qa/*.apk
            ${{ runner.temp }}/deda-100438-full-100436-plus-stage2-owner-phone-qa/*.json
            ${{ runner.temp }}/deda-100438-full-100436-plus-stage2-owner-phone-qa/*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Destroy original DEDA private signing key from ephemeral runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/deda-100438-protected-source/android/app/deda-release.jks"
