name: DEDA 100409 Active ID Read Permissions Audit Only (NO DEPLOY)
on:
  push:
    branches: [deda-100409-identity-single-source-no-play-2026-10-31]
    paths: ['.github/workflows/qa-deda-100409-identity-permission-audit-no-deploy.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  read-only-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRIMARY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read active Firebase rules - do not show contents and do not deploy
        shell: bash
        run: |
          python -m pip install --quiet google-auth requests
          python - <<'PY'
          import os,json
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          project='deda-25b88'
          info=json.loads(os.getenv('PRIMARY') or os.getenv('FALLBACK') or '{}')
          assert info.get('project_id') == project and info.get('type')=='service_account'
          auth=service_account.Credentials.from_service_account_info(info,
            scopes=['https://www.googleapis.com/auth/cloud-platform'])
          session=AuthorizedSession(auth)
          root=f'https://firebaserules.googleapis.com/v1/projects/{project}'
          release=session.get(root+'/releases/cloud.firestore',timeout=20)
          assert release.status_code==200
          name=release.json()['rulesetName']
          response=session.get('https://firebaserules.googleapis.com/v1/'+name,timeout=20)
          assert response.status_code==200
          source='\n'.join(v['content'] for v in response.json()['source']['files'])
          for path in ['deda_public_active_aliases','deda_public_alias_routes',
                       'deda_stage71_active_identifier','deda_social_profiles']:
            print('LIVE_FIRESTORE_MATCH_'+path.upper()+'='+str('match /'+path+'/' in source))
          for name in ['deda_public_active_aliases','deda_stage71_active_identifier']:
            anchor='match /'+name+'/'
            start=source.find(anchor)
            if start>=0:
              piece=source[start:start+1900]
              clauses=[line.strip() for line in piece.splitlines() if
                line.strip().startswith(('allow get:','allow read:','allow list:','allow create:','allow update:'))]
              print('LIVE_ID_RULE_CLAUSES_'+name.upper()+'='+str(clauses[:6]))
          print('LIVE_FIRESTORE_RULES_READ_ONLY=TRUE')
          PY
