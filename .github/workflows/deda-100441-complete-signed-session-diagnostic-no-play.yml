name: DEDA 100441 COMPLETE signed 100440 parity session diagnostics RESCUE owner APK NO PLAY
on:
  push:
    branches:
      - deda-100440-session-rescue-isolated-owner-review-2026-11-07
      - deda-100441-source-audit-isolated-recovery-2026-11-12
    paths:
      - '.github/workflows/deda-100441-complete-signed-session-diagnostic-no-play.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deda-100441-complete-owner-signed-diagnostic-no-play
  cancel-in-progress: false
jobs:
  build-signed-complete-owner-phone-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
      - name: Reconstruct FULL protected 100439 + Google + smart second account + verified 100m admin wallet in isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/deda-100441-complete-signed-app"
          flutter create --platforms=android --org com.diraq.ludo --project-name d_iraq_ludo "$project"
          python3 tools/app_stability/app_package/prepare.py "$project" --variant candidate
          for script in \
            bind_weekly_stage13.py \
            bind_active_id_boot_prewarm_stage14.py \
            bind_active_id_measured_startup_stage16.py \
            bind_weekly_private_trial_stage17.py \
            bind_weekly_full_qa_stage18.py \
            verify_rank_card_tap_stage19.py \
            bind_weekly_admin_league_stage27.py \
            bind_weekly_tasks_cta_stage28.py \
            bind_weekly_100397_owner_real_scores.py \
            bind_weekly_100398_after_level_xp.py \
            bind_weekly_100399_community_bridge.py \
            bind_weekly_100400_safe_score_retry.py \
            bind_weekly_100402_firestore_direct.py \
            bind_weekly_100403_first_open_gate.py \
            bind_weekly_100404_inline_clock_and_freeze.py \
            bind_weekly_100405_admin_live_read_only.py \
            bind_weekly_100406_league_display_fixes.py \
            bind_weekly_100407_full_avatar_shared_identity.py \
            bind_weekly_100408_seven_owner_points.py \
            bind_weekly_100409_single_verified_identity.py \
            bind_weekly_100410_unified_active_id.py \
            bind_weekly_100411_friend_copy_share.py \
            bind_weekly_100413_owner_id_admin_response.py \
            bind_weekly_100414_last_three.py \
            bind_weekly_100418_legacy340_friend_active_compat.py; do
            python3 "tools/app_stability/app_package/$script" "$project"
          done
          python3 tools/app_stability/app_package/guard_100436_parity_before_recovery.py "$project"
          shopt -s nullglob
          count=0
          for source in "$GITHUB_WORKSPACE"/lib/deda_step2_*.dart "$GITHUB_WORKSPACE"/lib/deda_100429*.dart "$GITHUB_WORKSPACE"/lib/deda_100430*.dart "$GITHUB_WORKSPACE"/lib/deda_100431*.dart "$GITHUB_WORKSPACE"/lib/deda_100432*.dart "$GITHUB_WORKSPACE"/lib/deda_100433*.dart; do
            target="$project/lib/$(basename "$source")"
            test ! -e "$target" || { echo "BLOCK_SOURCE_OVERWRITE:$target"; exit 1; }
            cp "$source" "$target"
            count=$((count+1))
          done
          test "$count" -ge 30
          python3 tools/app_stability/app_package/guard_100436_parity_before_recovery.py "$project" --staged-recovery
          python3 tools/app_stability/app_package/merge_stage2_into_protected_100436.py "$project"
          python3 tools/app_stability/app_package/merge_stage2_into_protected_100436.py "$project" --verify-only
          python3 tools/app_stability/app_package/bind_admin_league_winners_prizes_100439.py "$project"
          python3 tools/app_stability/app_package/bind_google_account_settings_100439.py "$project"
          echo 'PASS_PRESERVED_OWNER_LOGIN_NOT_LOGGED'
          python3 tools/app_stability/app_package/bind_smart_second_stage_account_100439.py "$project"
          echo 'PASS_ORIGINAL_WALLET_SOURCE_UNMODIFIED'
          python3 tools/app_stability/app_package/bind_gm_compensation_100m_100439.py "$project"
          python3 tools/app_stability/app_package/bind_session_rescue_stage3_100441.py "$project"
          python3 tools/app_stability/app_package/bind_session_rescue_friends_retry_100441.py "$project"
          python3 tools/app_stability/app_package/bind_session_missing_owner_entry_100441.py "$project"
          python3 tools/app_stability/app_package/bind_session_diagnostic_readonly_100441.py "$project"
          echo "DEDA_SOURCE_ONLY_PROJECT=$project" >> "$GITHUB_ENV"
          echo 'PASS_FULL_100439_GOOGLE_SMART_ACCOUNT_AND_100M_ADMIN_SOURCE_ASSEMBLED'
      - name: Analyze entire assembled entry, guardian, and admin backend without building APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEDA_SOURCE_ONLY_PROJECT"
          flutter pub get
          dart analyze --no-fatal-warnings \
            lib/main.dart lib/deda_backend.dart lib/admin_pages.dart \
            lib/deda_admin_league_page.dart \
            lib/deda_step1_google_settings_link_100439.dart \
            lib/deda_step2_google_replacement_login_100439.dart \
            lib/deda_step2_smart_second_stage_account_page_100439.dart \
            lib/deda_session_recovery_coordinator.dart \
            lib/deda_session_rescue_stage3_core.dart \
            lib/deda_session_rescue_stage3_bridge.dart \
            lib/deda_session_missing_owner_entry_100441.dart \
            lib/deda_session_diagnostic_readonly_100441.dart
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("internal-build-inputs.json").read_text())
          assert d["financialRestoreEnabled"] is False
          assert d["generalManagerCompensation100m"]["targetAdminPoolDiamonds"]==100000000
          assert d["generalManagerCompensation100m"]["defaultNotFunded"]
          assert d["generalManagerCompensation100m"]["personalManagerWalletUnchanged"]
          assert d["smartSecondStageAccount"]["defaultOff"]
          print("PASS_FULL_SOURCE_100M_ADMIN_AND_GOOGLE_WITHOUT_LIVE_CREDIT")
          PY

      - name: Full owner app parity, protection, Google, PIN and admin wallet QA
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == "deda-100441-source-audit-isolated-recovery-2026-11-12" ]]; then
            # Build EXACTLY the source that already passed the comprehensive
            # same-UID/PIN/Google/Firebase-free full assembly QA. This is
            # STRONGER than an unscoped older-branch comparison: no source,
            # Functions or platform inputs may drift between QA and signing.
            git diff --exit-code f883fd972e292ebbdf0ffe5a11d7cfc03b4d533f HEAD -- \
              lib/ functions/ android/ assets/ firestore.rules firebase.json \
              storage.rules google-services.json pubspec.yaml pubspec.lock
            # Also prove the protected APK's release inputs have never changed.
            git diff --exit-code 308a846ef0c44169929a2908adb0457b4b028672 HEAD -- \
              lib/main.dart functions/index.js android/ assets/ firestore.rules \
              firebase.json storage.rules google-services.json pubspec.yaml pubspec.lock
          else
            git diff --exit-code 958ed9a3c9cce0f207e98d8956e8b659e1ff7246 HEAD -- \
              lib/main.dart lib/deda_backend.dart android assets firestore.rules firebase.json \
              storage.rules google-services.json pubspec.yaml pubspec.lock functions
            git diff --exit-code d609d5ac55bf0c4d29513d6345b4797d7a716527 HEAD -- \
              android assets firestore.rules firebase.json storage.rules google-services.json \
              pubspec.yaml pubspec.lock functions
          fi
          node --test test/deda_gm_admin_compensation_100m_server_only_100439.test.js
          python3 -m unittest discover -s test -p test_deda_gm_admin_compensation_100m_100439.py
          python3 tools/deda_google_auth_readiness_100439.py \
            --config config/deda_google_auth_100439/google-services.json
          cd "$DEDA_SOURCE_ONLY_PROJECT"
          mkdir -p test
          for filename in \
            deda_owner_login_commit_guard_private_test.dart \
            deda_owner_session_compat_private_test.dart \
            deda_step2_existing_account_signin_page_private_test.dart \
            deda_step2_completion_gate_private_test.dart \
            deda_step2_recovery_guardian_private_test.dart \
            deda_step2_linked_owner_guardian_bridge_private_test.dart \
            deda_weekly_100404_league_clock_test.dart \
            deda_weekly_leaderboard_earned_points_test.dart \
            deda_100410_unified_active_id_test.dart \
            deda_100411_friend_copy_test.dart \
            deda_admin_league_live_widgets_test.dart \
            deda_daily_task_slots_test.dart \
            deda_admin_winners_prizes_100439_test.dart \
            deda_google_original_uid_link_private_test.dart \
            deda_google_guardian_contract_private_test.dart \
            deda_google_replacement_existing_uid_private_test.dart \
            deda_google_replacement_page_private_test.dart \
            deda_google_recovery_progress_policy_private_test.dart \
            deda_google_settings_card_private_test.dart \
            deda_smart_second_stage_account_private_test.dart; do
            test -s "$GITHUB_WORKSPACE/test/$filename"
            cp "$GITHUB_WORKSPACE/test/$filename" "test/$filename"
          done
          flutter test --no-pub test/deda_owner_login_commit_guard_private_test.dart \
            test/deda_owner_session_compat_private_test.dart \
            test/deda_step2_existing_account_signin_page_private_test.dart \
            test/deda_step2_completion_gate_private_test.dart \
            test/deda_step2_recovery_guardian_private_test.dart \
            test/deda_step2_linked_owner_guardian_bridge_private_test.dart
          flutter test --no-pub test/deda_weekly_100404_league_clock_test.dart \
            test/deda_weekly_leaderboard_earned_points_test.dart \
            test/deda_100410_unified_active_id_test.dart \
            test/deda_100411_friend_copy_test.dart \
            test/deda_admin_league_live_widgets_test.dart \
            test/deda_daily_task_slots_test.dart \
            test/deda_admin_winners_prizes_100439_test.dart
          flutter test --no-pub test/deda_google_original_uid_link_private_test.dart \
            test/deda_google_guardian_contract_private_test.dart \
            test/deda_google_replacement_existing_uid_private_test.dart \
            test/deda_google_replacement_page_private_test.dart \
            test/deda_google_recovery_progress_policy_private_test.dart \
            test/deda_google_settings_card_private_test.dart \
            test/deda_smart_second_stage_account_private_test.dart
          # Stage3 candidate has unassembled source contracts; test those
          # untouched, not against a different 100418 assembled search adapter.
          (
            cd "$GITHUB_WORKSPACE"
            flutter pub get
            flutter test --no-pub --dart-define=DEDA_QA32_SPARK_PUBLIC_IDS_LIVE=true \
              test/deda_session_recovery_coordinator_private_test.dart \
              test/deda_session_rescue_stage3_4char_private_test.dart \
              test/deda_session_missing_owner_entry_100441_test.dart
          )
          # Full 100440 assembly intentionally accepts four-char premium IDs
          # as SEARCH INPUT; it never treats them as account/UID ownership.
          for t in deda_session_recovery_coordinator_private_test.dart deda_session_missing_owner_entry_100441_test.dart deda_100441_assembled_friend_alias_search_test.dart; do
            cp "$GITHUB_WORKSPACE/test/$t" "test/$t"
          done
          flutter test --no-pub --dart-define=DEDA_QA32_SPARK_PUBLIC_IDS_LIVE=true \
            test/deda_session_recovery_coordinator_private_test.dart \
            test/deda_session_missing_owner_entry_100441_test.dart \
            test/deda_100441_assembled_friend_alias_search_test.dart
          echo 'PASS_100441_34_SOURCE_RESCUE_TESTS_AND_23_ASSEMBLED_SEARCH_SECURITY_TESTS'
      - name: Protect agreed Google settings location and record exact signed inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path(os.environ['DEDA_SOURCE_ONLY_PROJECT'])
          meta=root/'internal-build-inputs.json'
          d=json.loads(meta.read_text())
          page=(root/'lib/main.dart').read_text()
          assert page.count('DedaGoogleSettingsLinkCard(')==1
          assert page.index('DedaGoogleSettingsLinkCard(')<page.index(
            "dedaText('الصوت والملاحة', 'Voice & navigation')")
          assert page.count('DedaSmartSecondStageAccountPage(')==1
          league=(root/'lib/deda_admin_league_page.dart').read_text()
          assert league.count('DedaAdminLeagueWinnersPrizes(isArabic: isArabic)')==1
          assert (root/'lib/deda_step2_completion_gate.dart').is_file()
          # No fake completion of historical restored finances or lost assets.
          assert 'bool get canPrepareFullRecoveryApk => false;' in (
            root/'lib/deda_step2_completion_gate.dart').read_text()
          assert d['financialRestoreEnabled'] is False
          assert d['generalManagerCompensation100m']['targetAdminPoolDiamonds']==100000000
          assert d['smartSecondStageAccount']['originalFirstScreenVisibleFieldsUnchanged']
          assert page.count('DedaSessionDiagnosticReadOnlyTile(')==1
          assert 'DEDA_100441_FRIENDS_RETRY_FIX' in page
          assert 'DedaMissingOwnerEntryPolicy.canOffer' in page
          diag=(root/'lib/deda_session_diagnostic_readonly_100441.dart').read_text()
          for banned in ('signInAnonymously(', 'signOut(', '.set(', '.update(', '.delete('):
            assert banned not in diag
          assert 'Source.server' in diag
          assert 'DedaProbeKind.anonymous' in diag and 'DedaProbeKind.linked' in diag
          assert 'DedaProbeKind.signedOut' in diag
          assert d['googleOriginalUidSettings']['requiresOriginalUid']
          d['versionCode']=100441
          d['completeOwnerDelivery']=False
          d['financialRestoreEnabled']=False
          d['recoveryUserEntryEnabled']=True
          d['ownerApprovedLastSignedReferenceVersion']=100440
          d['sourceOfTruthFeatureBaselineVersion']=100440
          d['purpose']='Signed 100441 owner diagnostic from complete protected 100440 baseline. Includes same-UID rescue, real friends Retry and manual read-only Firebase session report. Linked-UID direct login held due server UID split; no Firebase writes or Play; historical financial restore not proven.'
          d['ownerPhoneVerificationPending']=True
          d['googleSettingsPlacement']='original approved settings before voice; unchanged by later unauthorized move'
          d['featureDefines']={
            'DEDA_STEP2_EXISTING_ACCOUNT_ENTRY':'true',
            'DEDA_SMART_SECOND_STAGE_ACCOUNT':'true',
            'DEDA_STEP2_LINKED_OWNER_COMPAT':'true',
            'DEDA_STEP1_GOOGLE_ORIGINAL_UID_LINK':'true',
            'DEDA_STEP2_GOOGLE_REPLACEMENT_LOGIN':'true',
            'DEDA_SESSION_RESCUE_STAGE3':'true',
            'DEDA_STEP2_SPARK_LINKED_UID_READ_ONLY':'false',
          }
          d['ownerDiagnostic100441']={
            'manualReadOnly':True,
            'showsUid':False,
            'directSparkLinkedUidLoginEnabled':False,
            'serverUidSplitUnresolved':True,
            'friendsRetryIncluded':True,
            'premiumFourCharSupported':True,
            'noFirebaseDeployment':True,
          }
          d['sourceHashes']={
            str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
            for p in (list((root/'lib').glob('*.dart'))+
              [root/'pubspec.yaml',root/'pubspec.lock'])
          }
          meta.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print('PASS_100440_APPROVED_GOOGLE_LOCATION_PROTECTED_ACCOUNT_AND_ALL_APP_SOURCE_HASHES')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: mosubiyi-prog/d-iraq-ludo
          run-id: 39948539871
          name: DEDA-100379-OWNER18-PRIVATE-QA
          path: ${{ runner.temp }}/deda-100440-original-reference
      - name: Restore and verify EXACT original signed DEDA Android keystore identity
        shell: bash
        working-directory: ${{ runner.temp }}/deda-100441-complete-signed-app
        run: |
          set -euo pipefail
          test -n "$DEDA_KEYSTORE_BASE64"
          test -n "$DEDA_KEY_ALIAS"
          test -n "$DEDA_STORE_PASSWORD"
          test -n "$DEDA_KEY_PASSWORD"
          dart run flutter_launcher_icons
          python3 "$GITHUB_WORKSPACE/tools/restore_signing_key_2026_10_02.py"
          keytool -list -keystore android/app/deda-release.jks \
            -storepass "$DEDA_STORE_PASSWORD" -alias "$DEDA_KEY_ALIAS" >/dev/null
          echo 'PASS_ORIGINAL_DEDA_RELEASE_SIGNER_RESTORED_ONLY_EPHEMERALLY'
      - name: Build ONE original-signer 100441 APK complete with read-only Firebase diagnostics
        shell: bash
        working-directory: ${{ runner.temp }}/deda-100441-complete-signed-app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          d=json.loads(Path('internal-build-inputs.json').read_text())
          assert d['versionCode']==100441
          assert d['financialRestoreEnabled'] is False
          flags=dict(d['flags'])
          flags.update(d['featureDefines'])
          assert flags['DEDA_STEP2_EXISTING_ACCOUNT_ENTRY']=='true'
          assert flags['DEDA_SMART_SECOND_STAGE_ACCOUNT']=='true'
          assert flags['DEDA_SESSION_RESCUE_STAGE3']=='true'
          assert flags['DEDA_STEP2_SPARK_LINKED_UID_READ_ONLY']=='false'
          cmd=['flutter','build','apk','--release','--no-pub',
               '--build-number=100441',
               '--dart-define=DEDA_QA32_SPARK_PUBLIC_IDS_LIVE=true',
               '--dart-define=DEDA_100418_LEGACY340_ACTIVE_READ_APPROVED=true']
          for key,value in sorted(flags.items()):
              txt=str(value).lower()
              if txt not in ('true','false'):
                  raise ValueError('Unexpected compile-time feature flag: '+key)
              cmd.append('--dart-define='+key+'='+txt)
          print('BUILD_APPROVED_FULL_FEATURE_FLAGS',','.join(sorted(flags)))
          subprocess.run(cmd,check=True)
          PY
      - name: Verify APK identity, signer, version, complete source hashes and assets
        shell: bash
        run: |
          set -euo pipefail
          project="$DEDA_SOURCE_ONLY_PROJECT"
          apk="$project/build/app/outputs/flutter-apk/app-release.apk"
          ref="$RUNNER_TEMP/deda-100440-original-reference/DEDA-100379-OWNER18-PRIVATE-QA.apk"
          test -s "$ref"
          test -s "$apk"
          output="$RUNNER_TEMP/deda-100441-owner-delivery"
          mkdir -p "$output"
          python3 tools/app_stability/app_package/verify.py "$project" "$ref" \
            --output "$output/verification.json"
          python3 - "$output/verification.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m['packageVerification']['package']=='com.diraq.ludo.d_iraq_ludo'
          assert m['packageVerification']['versionCode']==100441
          assert m['certificateSha256']=='a53d855b82d1280f324037428421838139ecf2e30174f9fcd0bd1878698b5f4a'
          assert m['originalPortraitsVerified']==3
          assert m['featureDefines']['DEDA_SMART_SECOND_STAGE_ACCOUNT']=='true'
          assert m['featureDefines']['DEDA_STEP1_GOOGLE_ORIGINAL_UID_LINK']=='true'
          assert m['googleSettingsPlacement'].startswith('original approved settings')
          assert m['financialRestoreEnabled'] is False
          assert m['featureDefines']['DEDA_SESSION_RESCUE_STAGE3']=='true'
          assert m['featureDefines']['DEDA_STEP2_SPARK_LINKED_UID_READ_ONLY']=='false'
          assert m['ownerDiagnostic100441']['manualReadOnly'] is True
          assert m['ownerDiagnostic100441']['serverUidSplitUnresolved'] is True
          print('PASS_SIGNED_100441_SAME_PACKAGE_CERT_COMPLETE_UI_SAFE_UID_DIAG')
          PY
          cp "$apk" "$output/DEDA-100441-COMPLETE-SESSION-RESCUE-DIAGNOSTIC-SIGNED.apk"
          (cd "$output" && sha256sum *.apk > SHA256.txt)
          printf '%s\n' \
            'DEDA owner signed 100441 QA APK from full 100440 baseline, original signing identity and package, no Play release.' \
            'Preserves all features in signed 100440. Adds safe same-UID rescue, friends retry and read-only session diagnostics in Settings. Premium four-letter IDs supported.' \
            'Original UID and phone directory still conflict on Firebase. Linked-only automatic recovery is disabled; do not uninstall, sign out or clear app data. Full historical financial restore is NOT proven.' \
            'NEW PRIVATE OWNER TEST: Google settings card may link ONLY the current detached anonymous UID after separate explicit consent, when both old owner records mismatch. This DOES NOT restore original DEDA ID, balances, admin access or purchases. Do not mistake this for legacy account recovery.' \
            'Never uninstall the current DEDA app and never clear app storage. Install OVER existing app.' \
            'Signed archive and feature tests pass in CI; physical-phone operation is for owner to validate after delivery.' \
            > "$output/README-OWNER-INSTALL.txt"
          echo 'PASS_SIGNED_100441_COMPLETE_DIAGNOSTIC_QA_APK_READY_FOR_OWNER_PHONE'
      - name: Upload one verified installer, SHA and evidence for direct owner download
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100441-COMPLETE-SESSION-DIAGNOSTIC-SIGNED-APK
          path: |
            ${{ runner.temp }}/deda-100441-owner-delivery/*.apk
            ${{ runner.temp }}/deda-100441-owner-delivery/*.json
            ${{ runner.temp }}/deda-100441-owner-delivery/*.txt
          if-no-files-found: error
          retention-days: 21
      - name: Remove release key from ephemeral CI runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/deda-100441-complete-signed-app/android/app/deda-release.jks"
