name: Deploy DEDA Storage rules

on:
  push:
    branches:
      - map-nav-9-points-work-2026-09-24
    paths:
      - storage.rules
      - firebase.json
      - .github/workflows/deploy-map-nav-storage-rules.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current DEDA branch
        uses: actions/checkout@v4

      - name: Select Firebase credential
        id: auth
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_DEDA_25B88: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_DEDA_25B88:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_DEDA_25B88" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "mode=service" >> "$GITHUB_OUTPUT"
            echo "path=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_OUTPUT"
          elif [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "mode=service" >> "$GITHUB_OUTPUT"
            echo "path=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_OUTPUT"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "No Firebase deployment credential is configured in GitHub Actions." >&2
            exit 2
          fi

      - name: Deploy Storage rules with service account
        if: steps.auth.outputs.mode == 'service'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.path }}
        run: |
          npx --yes firebase-tools@latest deploy             --only storage             --project deda-25b88             --non-interactive

      - name: Deploy Storage rules with CI token
        if: steps.auth.outputs.mode == 'token'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx --yes firebase-tools@latest deploy             --only storage             --project deda-25b88             --token "$FIREBASE_TOKEN"             --non-interactive
