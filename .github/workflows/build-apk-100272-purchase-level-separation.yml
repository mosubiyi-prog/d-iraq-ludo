name: Build DEDA 100272 Purchase Level Separation

# retry-2: normalize formatted 100271 style purchase signature before overlay
on:
  push:
    branches:
      - purchase-level-separation-100272-2026-10-05
    paths:
      - '.github/workflows/build-apk-100272-purchase-level-separation.yml'

jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-100272]')
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100272 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100272
        run: bash tools/build_100272_purchase_level_separation.sh

      - name: Upload APK 100272
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100272-purchase-level-separation-apk
          path: build/app/outputs/flutter-apk/app-release.apk
