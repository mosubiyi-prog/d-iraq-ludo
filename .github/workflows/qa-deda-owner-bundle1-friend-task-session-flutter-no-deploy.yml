name: DEDA owner bundle 1 original approved task session safe integrated Flutter source NO APK
on:
  push:
    branches:
      - deda-owner-bundle1-original-friend-task-session-fence-no-deploy-2026-10-29
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-owner-bundle1-original-friend-actual-flutter-integration
  cancel-in-progress: true
jobs:
  protected-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact QA-only task session patch; protect reference 100342, original wallet and traffic bank
        run: |
          set -euo pipefail
          BASE=b37183c2a6d8f2048ef3ef383eecd116a968a44d
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE" HEAD >/tmp/owner-bundle1
          cat /tmp/owner-bundle1
          while IFS= read -r p; do
            case "$p" in
              lib/deda_task_signal_bridge.dart|\
              tools/app_stability/bind_tasks_integrated_100383.py|\
              test/deda_friend_task_session_fence_test.dart|\
              .github/workflows/qa-deda-owner-bundle1-friend-task-session-flutter-no-deploy.yml|\
              docs/DEDA_OWNER_BUNDLE1_REAL_FLUTTER_TASK_ACCOUNT_BOUND_2026-10-29.md) ;;
              *) echo "REFUSE unexpected change $p"; exit 1 ;;
            esac
          done </tmp/owner-bundle1
          git diff --quiet "$BASE" -- lib/main.dart lib/deda_social_service.dart \
            lib/deda_backend.dart lib/deda_pin_auth.dart \
            lib/traffic_quiz_page.dart functions/index.js firestore.rules \
            android/ assets/ pubspec.yaml pubspec.lock \
            tools/app_stability/app_package/prepare.py
          python3 -m py_compile tools/app_stability/bind_tasks_integrated_100383.py
          # The historical Stage28 hand-built fixture is stale relative to
          # the current approved 100383 task binding. The next job runs the
          # whole Stage13-61 original Flutter app reconstruction instead.
          echo "Original DEDA source, real wallets/IDs and quiz bank not changed"
  prepare-actual-original-flutter-no-apk:
    needs: protected-original
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
      - name: Reconstruct real ORIGINAL DEDA 100383 task-mapped + two protected league home routes
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/deda-bundle1-real-flutter-no-apk"
          flutter create --platforms=android --org com.diraq.ludo --project-name d_iraq_ludo "$TARGET"
          python3 tools/app_stability/app_package/prepare.py "$TARGET" --variant candidate
          python3 tools/app_stability/app_package/bind_weekly_stage13.py "$TARGET"
          python3 tools/app_stability/app_package/restore_weekly_stage17_legacy_screen_only.py "$TARGET"
          python3 tools/app_stability/app_package/bind_active_id_boot_prewarm_stage14.py "$TARGET"
          python3 tools/app_stability/app_package/bind_active_id_measured_startup_stage16.py "$TARGET"
          python3 tools/app_stability/app_package/bind_weekly_private_trial_stage17.py "$TARGET"
          python3 tools/app_stability/app_package/bind_weekly_full_qa_stage18.py "$TARGET"
          python3 tools/app_stability/app_package/verify_rank_card_tap_stage19.py "$TARGET"
          python3 tools/app_stability/app_package/bind_weekly_admin_league_stage27.py "$TARGET"
          python3 tools/app_stability/app_package/bind_weekly_tasks_cta_stage28.py "$TARGET"
          python3 tools/app_stability/app_package/bind_weekly_account_scope_stage61.py "$TARGET"
          python3 tools/app_stability/app_package/bind_weekly_original_public_profile_readonly.py "$TARGET"
          TARGET="$TARGET" python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['TARGET'])
          d=json.loads((p/'internal-build-inputs.json').read_text())
          main=(p/'lib/main.dart').read_text()
          social=(p/'lib/deda_social_service.dart').read_text()
          bridge=(p/'lib/deda_task_signal_bridge.dart').read_text()
          assert d['completeOwnerDelivery'] is False
          assert d['financialRestoreEnabled'] is False
          assert d['productionExecutionPerformed'] is False
          assert d['weeklyStage61']['officialHomeRoutesScoped']==2
          assert d['weeklyOriginalReadOnlyProfile']['originalRoutes']==2
          assert main.count('DedaWeeklyAccountViewGate(')==2
          assert 'DedaTaskSignalBridge.bind(' in main
          assert 'DedaTaskSignalBridge.revoke();' in main
          assert 'DedaTaskEvent.friendAccepted => DedaTaskIds.longTrip' in main
          assert 'DedaTaskEvent.longTripCompleted => null' in main
          assert 'DedaTaskEvent.prizeCardsExplored => DedaTaskIds.shareRegisteredPlace' in main
          assert 'DedaTaskEvent.mapSearchTyped => DedaTaskIds.reviewAddedPlace' in main
          assert 'DedaTaskEvent.placeDiscovered => DedaTaskIds.openSavedPlace' in main
          assert social.count('originatingUid:')>=2
          assert 'DateTime.now().toUtc().add(const Duration(hours: 3))' in social
          assert 'readCurrentUid: () => FirebaseAuth.instance.currentUser?.uid' in social
          assert 'static void revoke()' in bridge
          assert 'static Future<void> friendAccepted({' in bridge
          assert d['weeklyStage61']['walletOrXpChanged'] is False
          assert d['weeklyStage61']['realCrossDeviceAccountMigrationEnabled'] is False
          print('PASS original DEDA account-safe task mapping + actual social service source + 2 home routes')
          PY
      - name: Validate compiled original Dart and real widget integration; absolutely NO APK
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/deda-bundle1-real-flutter-no-apk"
          cp test/deda_friend_task_session_fence_test.dart "$TARGET/test/"
          cp test/deda_weekly_account_view_gate_stage61_test.dart "$TARGET/test/"
          cp test/deda_weekly_original_public_profile_readonly_test.dart "$TARGET/test/"
          cd "$TARGET"
          flutter pub get --enforce-lockfile
          dart analyze lib/deda_task_signal_bridge.dart
          set +e
          dart analyze --format=machine lib/main.dart lib/deda_social_service.dart \
            > "$RUNNER_TEMP/owner-bundle1-actual-analyzer.txt" 2>&1
          status=$?
          set -e
          if grep -q '^ERROR|' "$RUNNER_TEMP/owner-bundle1-actual-analyzer.txt"; then
            cat "$RUNNER_TEMP/owner-bundle1-actual-analyzer.txt"
            exit 1
          fi
          if [ "$status" -ne 0 ] && ! grep -Eq '^(WARNING|INFO)[|]' \
            "$RUNNER_TEMP/owner-bundle1-actual-analyzer.txt"; then
            cat "$RUNNER_TEMP/owner-bundle1-actual-analyzer.txt"
            exit 1
          fi
          flutter test --no-pub \
            test/deda_friend_task_session_fence_test.dart \
            test/deda_weekly_account_view_gate_stage61_test.dart \
            test/deda_weekly_original_public_profile_readonly_test.dart
          test -z "$(find "$TARGET" -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit)"
          echo "PASS ORIGINAL Flutter compilation, secure friend completion and two-home account UI, no APK"
      - name: Explicit real-account migration and payout hold
        run: |
          echo 'Real original UI/task integration QA only; no actual server-signed XP producer enabled.'
          echo 'Older installed APKs can still write local XP; cross-phone migration remains blocked.'
          echo 'Real Firestore social rules, PIN identity attestation and 370-diamond gifts NOT deployed.'
          echo 'No production Firebase deployment, Play upload, wallet change, APK or quiz modifications.'
