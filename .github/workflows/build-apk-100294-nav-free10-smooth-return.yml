name: Build DEDA 100294 Smooth Free Control

on:
  push:
    branches:
      - nav-free10-smooth-return-100294-2026-10-07
    paths:
      - '.github/workflows/build-apk-100294-nav-free10-smooth-return.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100294 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100294
        run: bash tools/build_100294_nav_free10_smooth_return.sh

      - name: Upload APK 100294
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100294-nav-free10-smooth-return-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

# retry-after-camera-scope-fix
