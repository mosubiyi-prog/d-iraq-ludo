name: DEDA 100408 GM Prize Increase Firestore Security Emulator (NO DEPLOY)
on:
  push:
    branches: [deda-100408-seven-owner-fixes-ordered-no-play-2026-10-31]
    paths:
      - 'firestore.rules'
      - 'tests/firestore-rules/weekly-direct-manager-prizes-100408.test.mjs'
      - '.github/workflows/qa-deda-100408-prize-increase-emulator-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-prize-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test current Firestore rules in emulator, no production mutations
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests/firestore-rules --no-audit --no-fund --no-save firebase-tools@14
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100408-prizes --only firestore \
            'node --test tests/firestore-rules/weekly-direct-manager-prizes-100408.test.mjs'
          echo 'EMULATOR_ONLY; no real diamonds, no production rules deploy, no Play'
