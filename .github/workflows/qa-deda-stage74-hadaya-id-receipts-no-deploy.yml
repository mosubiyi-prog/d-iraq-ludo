name: DEDA Stage74 Hadaya ID gift receipts recipient use SECURE emulator NO DEPLOY
on:
  push:
    branches:
      - deda-stage74-id-gift-inbox-claim-use-tablet-2026-10-21
    paths:
      - '.github/workflows/qa-deda-stage74-hadaya-id-receipts-no-deploy.yml'
      - 'tools/deda_stage74_id_gifts_live_rules_READONLY_CANDIDATE.py'
      - 'test/deda_stage74_hadaya_gift_receipt_account_security_emulator.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manager-free200-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      DEDA_STAGE71_PRIMARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      DEDA_STAGE71_SECONDARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prove original users, Firebase rules, Play and private encrypted IDs unaffected
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 2587f0cf260e1c9ca1768baa5ccad880fbb1d15c -- \
            firestore.rules firebase.json functions/index.js \
            lib/main.dart lib/deda_backend.dart android/ assets/ server_private/
          python3 -m py_compile tools/deda_stage74_id_gifts_live_rules_READONLY_CANDIDATE.py
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo PASS_NO_LIVE_FIREBASE_OR_APK_CHANGES
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Inspect current published rules READ ONLY, append temporary GM-only free200 rules
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 tools/deda_stage74_id_gifts_live_rules_READONLY_CANDIDATE.py
      - name: Install local Firestore Emulator dependencies
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Five E2E security tests original+second 100, manager/outsider, use, gift, permanent ownership
        shell: bash
        run: |
          set -euo pipefail
          export GCLOUD_PROJECT=demo-deda-stage74-hadaya-id-receipts
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-stage71-free-admin200 --only firestore \
            'node --test test/deda_stage74_hadaya_gift_receipt_account_security_emulator.test.js'
          echo PASS_STAGE74_HADAYA_PERMANENT_FREE_ID_RECEIPT_11_E2E_NO_DEPLOY
