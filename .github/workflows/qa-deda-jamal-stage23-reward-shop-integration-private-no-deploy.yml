name: DEDA جمال التطبيق المتكاملة Stage23 Reward to 5000 Card + 10000 ID PRIVATE NO DEPLOY

on:
  push:
    branches:
      - deda-jamal-stage23-reward-to-shop-private-emulator-2026-10-19
    paths:
      - 'tools/deda_intakadha_point13_atomic_id_card_checkout_2026_10_19.js'
      - 'tools/deda_jamal_stage22_admob_ssv_ecdsa_staged_no_deploy_2026_10_19.js'
      - 'test/deda_intakadha_point13_firebase_atomic_checkout_emulator.test.js'
      - 'test/deda_jamal_stage23_rewards_cards_ids_same_wallet_emulator.test.js'
      - '.github/workflows/qa-deda-jamal-stage23-reward-shop-integration-private-no-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-jamal-stage23-reward-to-shop-qa
  cancel-in-progress: true

jobs:
  freeze-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve accepted release 100358, wallet, Flutter, Firebase and inventory
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet d71265acce8c48f829fafda163c3b63bbb3d2b48 -- \
            lib/ android/ assets/ functions/ firestore.rules firebase.json \
            pubspec.yaml pubspec.lock \
            catalogs/ server_private/ \
            tools/deda_stage18_private_atomic_identifier_checkout_2026_10_19.js
          ! grep -q 'deda_jamal_stage22_admob_ssv' functions/index.js
          ! grep -q 'deda_intakadha_point13_atomic_id_card_checkout' functions/index.js
          node --check tools/deda_intakadha_point13_atomic_id_card_checkout_2026_10_19.js
          node --check tools/deda_jamal_stage22_admob_ssv_ecdsa_staged_no_deploy_2026_10_19.js
          node --check test/deda_intakadha_point13_firebase_atomic_checkout_emulator.test.js
          node --check test/deda_jamal_stage23_rewards_cards_ids_same_wallet_emulator.test.js
          echo 'PASS: no live wallet, user/account data, Google Play package, or real SSV changes'
  real-emulator:
    needs: freeze-production
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install throwaway Firebase emulator dependencies
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Original 5000-style checkout tests including GM role revocation
        shell: bash
        run: |
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-point13-atomic-ledger --only firestore \
            'node --test test/deda_intakadha_point13_firebase_atomic_checkout_emulator.test.js'
      - name: Shared wallet synthetic reward to 5000 card and 10000 ID, zero double-spend
        shell: bash
        run: |
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          export GCLOUD_PROJECT=demo-deda-stage22-ssv-fakeprovider
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-stage22-ssv-fakeprovider --only firestore \
            'node --test test/deda_jamal_stage23_rewards_cards_ids_same_wallet_emulator.test.js'
          echo 'PASS: Stage23 synthetic signed demo to one canonical wallet, no real AdMob or purchases'
  no-deploy:
    needs: [freeze-production,real-emulator]
    runs-on: ubuntu-24.04
    steps:
      - name: Private integration only
        run: |
          echo 'PASS: no active purchase, real wallet conversion, Firebase deployment or Play APK'
