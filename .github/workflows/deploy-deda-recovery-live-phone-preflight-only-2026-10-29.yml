name: DEDA LIVE Firebase recovery phone proof ONLY - no wallet no APK
on:
  push:
    branches:
      - deda-restoration-private-build-first-separate-from-weekly-no-play-2026-10-29
    paths:
      - 'functions/deda_recovery_live_phone_preflight.js'
      - 'functions/tests/deda_recovery_live_phone_preflight.test.cjs'
      - 'functions/index.js'
      - '.github/workflows/deploy-deda-recovery-live-phone-preflight-only-2026-10-29.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-live-recovery-phone-preflight-only
  cancel-in-progress: false
jobs:
  strict-no-wallet-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no wallet/rules/old-app changes in recovery-only commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 34cfd8e6d69c4805dd698562bca4c89194468ec0 -- \
            firestore.rules firebase.json storage.rules \
            lib/ android/ assets/ pubspec.yaml
          node --check functions/index.js
          node --check functions/deda_recovery_live_phone_preflight.js
          node --check functions/tests/deda_recovery_live_phone_preflight.test.cjs
          node --test functions/tests/deda_recovery_live_phone_preflight.test.cjs
          grep -q 'enforceAppCheck:true' functions/deda_recovery_live_phone_preflight.js
          grep -q 'canWriteWallet:false' functions/deda_recovery_live_phone_preflight.js
          grep -q 'canTransferAccount:false' functions/deda_recovery_live_phone_preflight.js
          test "$(grep -c 'exports.dedaRecoveryLivePhonePreflight' functions/index.js)" = 1
          echo 'PASS production-bound READ ONLY phone proof; no wallet or user writes'
  target-only-live-deploy:
    needs: strict-no-wallet-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEDA_SERVICE_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      FALLBACK_SERVICE_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      DEDA_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare existing DEDA project credential without printing or shipping it
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DEDA_SERVICE_CREDENTIAL:-}" ]; then
            printf '%s' "$DEDA_SERVICE_CREDENTIAL" > "$RUNNER_TEMP/deda-firebase-deploy.json"
            chmod 600 "$RUNNER_TEMP/deda-firebase-deploy.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/deda-firebase-deploy.json" >> "$GITHUB_ENV"
          elif [ -n "${FALLBACK_SERVICE_CREDENTIAL:-}" ]; then
            printf '%s' "$FALLBACK_SERVICE_CREDENTIAL" > "$RUNNER_TEMP/deda-firebase-deploy.json"
            chmod 600 "$RUNNER_TEMP/deda-firebase-deploy.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/deda-firebase-deploy.json" >> "$GITHUB_ENV"
          elif [ -n "${DEDA_FIREBASE_TOKEN:-}" ]; then
            echo 'DEDA_FIREBASE_TOKEN is provided via existing CI secret'
          else
            echo 'REFUSED: no connected production Firebase deployment credential' >&2
            exit 3
          fi
      - name: Install pinned Firebase project dependencies and CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --no-audit --no-fund
          npm install --no-save --no-audit --no-fund firebase-tools@14
      - name: Deploy ONLY read-only recovery phone proof to real DEDA Firebase
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            ./node_modules/.bin/firebase deploy \
              --only functions:dedaRecoveryLivePhonePreflight \
              --project deda-25b88 --non-interactive
          else
            ./node_modules/.bin/firebase deploy \
              --only functions:dedaRecoveryLivePhonePreflight \
              --project deda-25b88 --token "$DEDA_FIREBASE_TOKEN" --non-interactive
          fi
          echo 'DEPLOY VERIFIED: only verified-phone read-only preflight; NO account migration, NO APK'
      - name: Delete temporary Firebase credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/deda-firebase-deploy.json"
