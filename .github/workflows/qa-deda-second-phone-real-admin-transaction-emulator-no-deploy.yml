name: DEDA second phone ACTUAL Admin SDK transaction emulator NO APK NO DEPLOY
on:
  push:
    branches:
      - deda-owner-cross-device-actual-restoration-integration-no-deploy-2026-10-29
    paths:
      - 'tests/firestore-rules/deda_second_phone_link_real_admin_emulator.test.cjs'
      - 'tools/app_stability/progress_archive/second-phone-account-link.cjs'
      - 'tools/app_stability/progress_archive/second-phone-link-callable.cjs'
      - '.github/workflows/qa-deda-second-phone-real-admin-transaction-emulator-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-second-phone-real-admin-emulator-no-deploy
  cancel-in-progress: true
jobs:
  real-admin-emulator-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GCLOUD_PROJECT: demo-deda-restore-readiness
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIREBASE_FUNCTIONS_EMULATOR_HOST: 127.0.0.1:5001
      DEDA_RESTORE_AUDIT_EMULATOR_ONLY: 'true'
      DEDA_RESTORE_AUDIT_LINK_KEY_HEX: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse protected app changes and accidental production identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = demo-deda-restore-readiness
          test "$FIRESTORE_EMULATOR_HOST" = 127.0.0.1:8080
          git diff --quiet 0915c51f251c7a9e197e6e971d66fc6e1402b8b7 -- \
            firestore.rules functions/index.js firebase.json storage.rules \
            lib/main.dart lib/deda_backend.dart lib/deda_pin_auth.dart \
            android/ assets/ pubspec.yaml
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo 'PASS protected code and original Rules unchanged'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install disposable Admin SDK and local Firebase emulator
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests/firestore-rules --no-save --no-audit --no-fund \
            firebase-admin@13 firebase-tools@14 firebase@12.3.0 \
            @firebase/rules-unit-testing@5
      - name: Run authenticated account-link transaction against REAL Firestore Admin emulator
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/firestore-rules/deda_second_phone_link_real_admin_emulator.test.cjs
          node - <<'NODE'
          const fs=require('node:fs');
          fs.copyFileSync('firestore.rules','/tmp/deda-second-phone-admin-emulator.rules');
          fs.writeFileSync('/tmp/deda-second-phone-admin-emulator.firebase.json',
            JSON.stringify({
              firestore:{rules:'/tmp/deda-second-phone-admin-emulator.rules'},
              emulators:{firestore:{host:'127.0.0.1',port:8080},ui:{enabled:false}},
            }));
          NODE
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --config /tmp/deda-second-phone-admin-emulator.firebase.json \
            --project demo-deda-restore-readiness --only firestore \
            'node --test tests/firestore-rules/deda_second_phone_link_real_admin_emulator.test.cjs'
          echo 'PASS: real Firestore Admin transaction against synthetic emulator, NO DEPLOY, NO APK'
