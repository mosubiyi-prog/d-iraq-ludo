name: DEDA Stage70 Approved Group002 Fixed 10000 Spark EMULATOR NO DEPLOY
on:
  push:
    branches: [deda-owner20-firestore-only-shop-stage66-no-deploy-2026-10-21]
    paths:
      - '.github/workflows/qa-deda-stage70-approved-group002-10000-emulator-no-deploy.yml'
      - 'tools/deda_stage70_group002_10000_atomic_live_rules_candidate_NO_DEPLOY.py'
      - 'test/deda_stage70_group002_10000_atomic_live_emulator.test.js'
      - 'tools/deda_stage69_merge_5000_checkout_into_live_rules_READONLY_NO_DEPLOY.py'
      - 'test/deda_stage69_live_spark_gift_claim_preservation.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch-active-rules-only-in-tmp-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      DEDA_STAGE69_PRIMARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      DEDA_STAGE69_SECONDARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prove no production rules, app, original100 or backend mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 2587f0cf260e1c9ca1768baa5ccad880fbb1d15c -- \
            functions/index.js firestore.rules firebase.json storage.rules \
            lib/main.dart lib/deda_backend.dart android/ assets/ server_private/
          python3 -m py_compile tools/deda_stage69_merge_5000_checkout_into_live_rules_READONLY_NO_DEPLOY.py
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo 'PASS no APK or production changes'
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch published policy read-only and create /tmp merged candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 tools/deda_stage69_merge_5000_checkout_into_live_rules_READONLY_NO_DEPLOY.py
          python3 tools/deda_stage70_group002_10000_atomic_live_rules_candidate_NO_DEPLOY.py /tmp/deda-stage66-candidate.rules
      - name: Install isolated local rules emulator
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Prove real published wallet preserves one-time gifts and secure 5k purchases in emulator
        shell: bash
        run: |
          set -euo pipefail
          export GCLOUD_PROJECT=demo-deda-stage70-group002-spark
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-stage66-spark-card-only --only firestore \
            'node --test test/deda_stage70_group002_10000_atomic_live_emulator.test.js'
          echo 'PASS currently PUBLISHED policy, FIXED unreceipted-debit path, unchanged legitimate gift claim, isolated 5k card receipts; emulator only, no live deploy'
