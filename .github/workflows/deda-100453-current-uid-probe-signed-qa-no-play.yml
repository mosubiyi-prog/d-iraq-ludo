                  'lib/arm64-v8a/libapp.so','lib/armeabi-v7a/libapp.so','lib/x86_64/libapp.so'))
          assert os.path.getsize(apk)>40000000
          print('PASS_COMPLETE_SINGLE_APK_100453',hashlib.sha256(open(apk,'rb').read()).hexdigest())
          PY
