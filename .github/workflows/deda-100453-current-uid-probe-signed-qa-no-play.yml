          assert d['smartSecondStageAccount']['originalFirstScreenVisibleFieldsUnchanged']
          assert 'DedaSessionDiagnosticReadOnlyTile(' not in page
          assert page.count('DedaCurrentUidProbe100453.open(context)')==1
          assert page.count("import 'deda_current_uid_probe_100453.dart';")==1
          assert 'DedaCurrentUidProbe100453.open(context)' not in (root/'lib/deda_session_diagnostic_readonly_100441.dart').read_text()
          assert (root/'lib/deda_current_uid_probe_100453.dart').exists()
          backend=(root/'lib/deda_backend.dart').read_text()
          policy=(root/'lib/deda_100431_linked_owner_session_policy.dart').read_text()
          entry=backend.split('static Future<bool> signInAdmin({',1)[1].split('static Future<',1)[0]
          logout=backend.split('static Future<void> signOutAdmin() async {',1)[1].split('// DEDA in-app location sharing v1.',1)[0]
          assert 'mayBeginAdminAuthenticationOnSharedAuth(' in entry
          assert entry.index('mayBeginAdminAuthenticationOnSharedAuth(') < entry.index('final credential =')
          assert 'admin-login-refused-preserve-deda-owner-session' in entry
          assert 'maySignOutAdminPrincipal(' in logout
          assert 'admin-logout-principal-changed-owner-preserved' in logout
          assert 'mayBeginAdminAuthenticationOnSharedAuth' in policy
          assert 'maySignOutAdminPrincipal' in policy
