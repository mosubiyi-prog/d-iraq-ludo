          aapt="$(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          test -x "$signer"
          test -x "$aapt"
          "$signer" verify --verbose --print-certs "$apk"
          "$aapt" dump badging "$apk" | grep -E "^package: name='com.diraq.ludo.d_iraq_ludo' versionCode='100453' "
          python3 - "$apk" <<'PY'
