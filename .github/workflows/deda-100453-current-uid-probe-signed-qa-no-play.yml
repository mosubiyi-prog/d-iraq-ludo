          d['sourceOfTruthFeatureBaselineVersion']=100440
          d['purpose']='PRIVATE 100453 current UID fingerprint read-only QA; original full app with no deleted cards; NO Play/Firebase deploy, no recovery or owner transfer.'
          d['ownerPhoneVerificationPending']=True
          d['featureDefines']={
            'DEDA_CURRENT_UID_PROBE_100453_QA':'true',
            'DEDA_STEP2_EXISTING_ACCOUNT_ENTRY':'true',
            'DEDA_SMART_SECOND_STAGE_ACCOUNT':'true',
