name: DEDA 100405 Owner Verified Canonical League Enrollment (NO XP OR DIAMONDS)
on:
  push:
    branches: [deda-100405-admin-five-points-integrated-no-apk-until-qa-2026-10-31]
    paths: ['.github/workflows/deda-100405-owner-verified-direct-enrollment.yml']
permissions: {contents: read}
concurrency:
  group: deda-100405-single-original-owner-weekly-binding
  cancel-in-progress: false
jobs:
  original-account-enrollment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRIMARY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Create verified account binding ONLY after exact owner UID and PIN account-session check
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet firebase-admin
          python - <<'PY'
          import os,json,firebase_admin
          from firebase_admin import credentials,firestore,auth
          from google.cloud.firestore_v1 import transactional
          info=json.loads(os.getenv('PRIMARY') or os.getenv('FALLBACK') or '{}')
          assert info.get('project_id')=='deda-25b88'
          firebase_admin.initialize_app(credentials.Certificate(info),{'projectId':'deda-25b88'})
          db=firestore.client()
          public='@DEDA-D62UEB'
          owner=db.collection('deda_share_ids').document(public).get().to_dict() or {}
          uid=owner.get('ownerUid')
          assert owner.get('active') is True and owner.get('kind')=='personal'
          assert isinstance(uid,str) and 6<=len(uid)<=128
          user=db.collection('users').document(uid).get().to_dict() or {}
          session=db.collection('deda_sessions').document(uid).get().to_dict() or {}
          key=user.get('accountKey')
          assert isinstance(key,str) and key.isdigit() and 10<=len(key)<=16
          assert session.get('accountKey')==key and user.get('sharePersonalId')==public
          userAuth=auth.get_user(uid)
          assert not userAuth.disabled and not userAuth.email and not userAuth.provider_data
          ref=db.collection('deda_weekly_direct_accounts').document(public)
          @transactional
          def create(tx):
            old=ref.get(transaction=tx)
            payload={'accountKey':key,'publicId':public,'createdByUid':uid}
            if old.exists:
              data=old.to_dict()
              assert all(data.get(k)==v for k,v in payload.items()),'BOUND_TO_DIFFERENT_ACCOUNT'
              return 'ALREADY_CANONICALLY_ENROLLED'
            tx.create(ref,{**payload,'createdAt':firestore.SERVER_TIMESTAMP})
            return 'CANONICAL_ACCOUNT_ENROLLED'
          result=create(db.transaction())
          print('LEAGUE_OWNER_BINDING_RESULT='+result)
          print('OWNER_SESSION_AND_ORIGINAL_PUBLIC_ID=VERIFIED')
          print('NO_PERSONAL_DATA_IN_LOG_NO_XP_NO_GIFT_NO_WALLET_CHANGES=True')
          PY
