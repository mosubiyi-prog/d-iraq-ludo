name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - places-v1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore DEDA login timers
        run: python3 tools/restore_login_timers.py

      - name: Save DEDA files
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          cp deda_app_icon.png /tmp/deda_app_icon.png
          cp google-services.json /tmp/google-services.json

      - name: Create Flutter project
        run: flutter create . --org com.diraq.ludo --project-name d_iraq_ludo

      - name: Restore DEDA files
        run: |
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/deda_app_icon.png deda_app_icon.png
          cp /tmp/google-services.json android/app/google-services.json

      - name: Configure Firebase Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings_kts = Path("android/settings.gradle.kts")
          settings_groovy = Path("android/settings.gradle")
          app_kts = Path("android/app/build.gradle.kts")
          app_groovy = Path("android/app/build.gradle")

          if settings_kts.exists():
              text = settings_kts.read_text()
              plugin_line = '    id("com.google.gms.google-services") version "4.4.2" apply false\n'
              if 'com.google.gms.google-services' not in text:
                  marker = 'plugins {\n'
                  if marker not in text:
                      raise SystemExit("plugins block not found in settings.gradle.kts")
                  text = text.replace(marker, marker + plugin_line, 1)
                  settings_kts.write_text(text)
          elif settings_groovy.exists():
              text = settings_groovy.read_text()
              plugin_line = "    id 'com.google.gms.google-services' version '4.4.2' apply false\n"
              if 'com.google.gms.google-services' not in text:
                  marker = 'plugins {\n'
                  if marker not in text:
                      raise SystemExit("plugins block not found in settings.gradle")
                  text = text.replace(marker, marker + plugin_line, 1)
                  settings_groovy.write_text(text)
          else:
              raise SystemExit("Android settings Gradle file not found")

          if app_kts.exists():
              text = app_kts.read_text()
              plugin_line = '    id("com.google.gms.google-services")\n'
              if 'com.google.gms.google-services' not in text:
                  marker = 'plugins {\n'
                  if marker not in text:
                      raise SystemExit("plugins block not found in app build.gradle.kts")
                  text = text.replace(marker, marker + plugin_line, 1)
                  app_kts.write_text(text)
          elif app_groovy.exists():
              text = app_groovy.read_text()
              plugin_line = "    id 'com.google.gms.google-services'\n"
              if 'com.google.gms.google-services' not in text:
                  marker = 'plugins {\n'
                  if marker not in text:
                      raise SystemExit("plugins block not found in app build.gradle")
                  text = text.replace(marker, marker + plugin_line, 1)
                  app_groovy.write_text(text)
          else:
              raise SystemExit("Android app Gradle file not found")
          PY

      - name: Add Android permissions and DEDA app name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]

          missing = [
              permission
              for permission in permissions
              if permission not in text
          ]

          if missing:
              pos = text.find(">")
              inserted = "\n" + "\n".join(
                  f"    {permission}" for permission in missing
              ) + "\n"
              text = text[:pos + 1] + inserted + text[pos + 1:]

          text = text.replace(
              'android:label="d_iraq_ludo"',
              'android:label="DEDA"',
          )

          path.write_text(text)
          PY

      - name: Configure DEDA launcher icon
        run: |
          flutter pub add --dev flutter_launcher_icons
          cat >> pubspec.yaml <<'YAML'

          flutter_launcher_icons:
            android: "ic_launcher"
            ios: false
            image_path: "deda_app_icon.png"
            min_sdk_android: 21
          YAML
          dart run flutter_launcher_icons

      - name: Restore permanent signing key
        env:
          DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os
          import base64
          from pathlib import Path

          raw = os.environ["DEDA_KEYSTORE_BASE64"].strip()

          if raw.startswith("DEDA_KEYSTORE_BASE64="):
              raw = raw.split("=", 1)[1].strip()

          raw = "".join(raw.split())
          data = base64.b64decode(raw, validate=True)

          output = Path("android/app/deda-release.jks")
          output.write_bytes(data)

          if output.stat().st_size == 0:
              raise SystemExit("Signing key is empty")
          PY

      - name: Validate permanent signing key
        env:
          DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
          DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore android/app/deda-release.jks \
            -storepass "$DEDA_STORE_PASSWORD" \
            -alias "$DEDA_KEY_ALIAS" > /dev/null

      - name: Configure permanent release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              text = kts.read_text()
              marker = "    buildTypes {"
              signing = """    signingConfigs {
                  create("release") {
                      keyAlias = System.getenv("DEDA_KEY_ALIAS")
                      keyPassword = System.getenv("DEDA_KEY_PASSWORD")
                      storeFile = file("deda-release.jks")
                      storePassword = System.getenv("DEDA_STORE_PASSWORD")
                  }
              }

          """

              if marker not in text:
                  raise SystemExit("buildTypes not found in build.gradle.kts")

              text = text.replace(marker, signing + marker, 1)

              old = 'signingConfig = signingConfigs.getByName("debug")'
              new = 'signingConfig = signingConfigs.getByName("release")'

              if old not in text:
                  raise SystemExit("Debug signing configuration not found")

              text = text.replace(old, new, 1)
              kts.write_text(text)

          elif groovy.exists():
              text = groovy.read_text()
              marker = "    buildTypes {"
              signing = """    signingConfigs {
                  release {
                      keyAlias System.getenv("DEDA_KEY_ALIAS")
                      keyPassword System.getenv("DEDA_KEY_PASSWORD")
                      storeFile file("deda-release.jks")
                      storePassword System.getenv("DEDA_STORE_PASSWORD")
                  }
              }

          """

              if marker not in text:
                  raise SystemExit("buildTypes not found in build.gradle")

              text = text.replace(marker, signing + marker, 1)

              if "signingConfig signingConfigs.debug" in text:
                  text = text.replace(
                      "signingConfig signingConfigs.debug",
                      "signingConfig signingConfigs.release",
                      1,
                  )
              elif "signingConfig = signingConfigs.debug" in text:
                  text = text.replace(
                      "signingConfig = signingConfigs.debug",
                      "signingConfig = signingConfigs.release",
                      1,
                  )
              else:
                  raise SystemExit("Debug signing configuration not found")

              groovy.write_text(text)

          else:
              raise SystemExit("Android Gradle file not found")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build permanently signed APK
        env:
          DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
          DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
          DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}
        run: |
          BUILD_NUMBER=$((100000 + GITHUB_RUN_NUMBER))
          flutter build apk --release --build-number="$BUILD_NUMBER"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: d-iraq-ludo-permanently-signed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
