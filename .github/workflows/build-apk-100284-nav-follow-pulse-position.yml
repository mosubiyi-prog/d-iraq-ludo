name: Build DEDA 100284 Nav Follow + Raised Road Pulse

on:
  push:
    branches:
      - nav-follow-road-pulse-position-100284-2026-10-06
    paths:
      - '.github/workflows/build-apk-100284-nav-follow-pulse-position.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100284 navigation branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100284
        run: bash tools/build_100284_nav_follow_pulse_position.sh

      - name: Upload APK 100284
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100284-nav-follow-raised-road-pulse-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
