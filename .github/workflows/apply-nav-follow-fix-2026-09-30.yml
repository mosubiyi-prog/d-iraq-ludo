name: Apply navigation auto-follow fix

on:
  push:
    branches:
      - nav-follow-fix-2026-09-30
    paths:
      - .github/workflows/apply-nav-follow-fix-2026-09-30.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout navigation fix branch
        uses: actions/checkout@v4
        with:
          ref: nav-follow-fix-2026-09-30
          fetch-depth: 0

      - name: Keep navigation camera following live position
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/main.dart')
          text = path.read_text(encoding='utf-8')
          old = 'setState(() => _autoFollowMap = false);'
          new = 'setState(() => _autoFollowMap = true);'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one auto-follow disable statement, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Navigation auto-follow fix applied.')
          PY

      - name: Verify patch
        run: |
          if grep -q "_autoFollowMap = false" lib/main.dart; then
            echo "Old auto-follow disable is still present"
            exit 1
          fi
          grep -n "setState(() => _autoFollowMap = true);" lib/main.dart

      - name: Commit source fix only
        run: |
          git config user.name "DEDA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Keep navigation camera following live position"
          git push origin HEAD:nav-follow-fix-2026-09-30
