name: Apply navigation auto-follow fix

on:
  push:
    branches:
      - nav-follow-fix-2026-09-30
    paths:
      - .github/workflows/apply-nav-follow-fix-2026-09-30.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout navigation fix branch
        uses: actions/checkout@v4
        with:
          ref: nav-follow-fix-2026-09-30
          fetch-depth: 0

      - name: Keep camera following live vehicle position
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/main.dart')
          text = path.read_text(encoding='utf-8')

          old = """                        onPositionChanged: (camera, hasGesture) {
                          if (tripStarted &&
                              hasGesture &&
                              _autoFollowMap &&
                              mounted) {
                            setState(() => _autoFollowMap = false);
                          }
                        },
"""

          new = """                        onPositionChanged: (camera, hasGesture) {
                          // During active navigation the live vehicle position owns
                          // the camera. A map gesture must not turn follow mode off.
                          if (tripStarted && !_autoFollowMap && mounted) {
                            setState(() => _autoFollowMap = true);
                          }
                        },
"""

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one navigation follow block, found {count}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Navigation auto-follow block patched successfully.')
          PY

      - name: Enable APK build for navigation fix branch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build.yml')
          text = path.read_text(encoding='utf-8')
          branch_line = '      - nav-follow-fix-2026-09-30\n'
          if branch_line not in text:
              anchor = '      - task-engine-points-2026-09-29\n'
              if anchor not in text:
                  raise SystemExit('Build branch anchor not found')
              text = text.replace(anchor, anchor + branch_line, 1)
              path.write_text(text, encoding='utf-8')
              print('Build workflow enabled for navigation fix branch.')
          else:
              print('Build workflow already enabled for navigation fix branch.')
          PY

      - name: Verify source change
        run: |
          grep -n -A8 -B2 "During active navigation the live vehicle position owns" lib/main.dart
          grep -n "nav-follow-fix-2026-09-30" .github/workflows/build.yml

      - name: Remove one-shot workflow and commit source fix
        run: |
          rm -f .github/workflows/apply-nav-follow-fix-2026-09-30.yml
          git config user.name "DEDA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/main.dart .github/workflows/build.yml .github/workflows/apply-nav-follow-fix-2026-09-30.yml
          git commit -m "Keep navigation camera following live position"
          git push origin HEAD:nav-follow-fix-2026-09-30
