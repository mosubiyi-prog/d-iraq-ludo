name: DEDA Jamal AlTtatbiq AlMutakamila Stage19 Firestore real races PRIVATE NO DEPLOY

on:
  push:
    branches:
      - deda-stage19-jamal-alttatbiq-almutakamila-private-2026-10-19
    paths:
      - 'test/deda_stage19_private100_firestore_races_emulator.test.js'
      - 'tools/deda_stage19_private_exclusive_catalog_reader_2026_10_19.js'
      - 'tools/deda_stage19_private_fixed_color_manager_actions_2026_10_19.js'
      - 'tools/deda_stage19_encrypted_admin100_callable_gateway_2026_10_19.js'
      - '.github/workflows/qa-deda-jamal-stage19-atomic-race-emulator-private-no-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-jamal-stage19-real-races-no-deploy
  cancel-in-progress: true

jobs:
  verify-protection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SAFE STOP same previous published Flutter/Firebase prod
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet backup-deda-stage19-original100-encrypted33-green-2026-10-19 -- \
            functions/index.js firestore.rules firebase.json \
            lib/main.dart lib/deda_backend.dart android/ assets/ \
            pubspec.yaml pubspec.lock
          ! grep -q 'deda_stage19_private100_firestore_races_emulator' functions/index.js
          ! grep -q 'deda_stage19_encrypted_admin100_callable_gateway' functions/index.js
          ! grep -q 'DEDA_STAGE19_ADMIN100_AES_KEY_B64' lib/main.dart
          test -f server_private/catalogs/DEDA_GROUP001_ADMIN100_AES256GCM_2026-10-19.enc.json
          node --check test/deda_stage19_private100_firestore_races_emulator.test.js
          node --check tools/deda_stage19_private_fixed_color_manager_actions_2026_10_19.js
          echo 'PASS: no production functions, rules, android, wallet or signing change'
  real-firestore-emulator:
    needs: verify-protection
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install throwaway Firebase emulator dependencies
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Run real transaction races, authenticated read and immutable colors
        shell: bash
        run: |
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-stage19-owner100-races --only firestore \
            'node --test test/deda_stage19_private100_firestore_races_emulator.test.js'
          echo 'PASS: Firestore emulator concurrency and no client-side bypass'
  all-gated:
    needs: [verify-protection, real-firestore-emulator]
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'PASS: STAGE19 private source emulator only; NO deployment or APK'
