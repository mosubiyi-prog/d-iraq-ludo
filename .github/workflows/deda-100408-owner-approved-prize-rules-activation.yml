name: DEDA 100408 Owner-Approved Additive Ten-Prize Firestore Rules ONLY (NO PLAY)
on:
  push:
    branches: [deda-100408-seven-owner-fixes-ordered-no-play-2026-10-31]
    paths:
      - '.github/workflows/deda-100408-owner-approved-prize-rules-activation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-100408-production-firestore-prize-permission
  cancel-in-progress: false
jobs:
  additive-prizes-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PRIMARY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read exact active production rules and prepare prize-only additive candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet google-auth requests
          python3 tools/deda_100408_live_prize_rules_readonly_preflight.py prepare
      - name: Emulator-verify exact merged production rules including real admin permission attacks
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests/firestore-rules --no-audit --no-fund --no-save firebase-tools@14
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          export DEDA_DIRECT_RULES_PATH="$RUNNER_TEMP/deda-100408-active-merged.rules"
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100408-prizes --only firestore \
            --config "$RUNNER_TEMP/deda-100408-active-merged-emulator.json" \
            'node --test tests/firestore-rules/weekly-direct-manager-prizes-100408.test.mjs'
      - name: Check live release is identical to emulator-tested source, then restore SA file
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/deda_100408_additive_prize_rules_release.py predeploy
      - name: Publish ONLY tested additive 100408 prize PLAN permission to original Firebase project
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/deda-100408-firestore-sa.json
        shell: bash
        run: |
          set -euo pipefail
          tests/firestore-rules/node_modules/.bin/firebase deploy \
            --only firestore:rules --project deda-25b88 \
            --config "$RUNNER_TEMP/deda-100408-active-merged-emulator.json" \
            --non-interactive
      - name: Independently verify exact active production rules match candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/deda_100408_additive_prize_rules_release.py verify
          echo 'NO_PLAY_DEPLOY_NO_DIAMOND_GIFT_PAYOUT=True'
      - name: Scrub all temporary Firebase credentials and policy snapshots
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/deda-100408-firestore-sa.json" \
            "$RUNNER_TEMP/deda-100408-active-merged.rules" \
            "$RUNNER_TEMP/deda-100408-active-merged-emulator.json" \
            "$RUNNER_TEMP/deda-100408-prize-preflight.json"
