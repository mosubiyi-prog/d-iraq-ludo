name: DEDA «إنت كدها» Point 5 - Four premium ID artwork tests - NO APK
on:
  push:
    branches:
      - deda-intakadha-ids-cards-stage1-2026-10-18
    paths:
      - '.github/workflows/qa-deda-intakadha-point5-four-id-artworks-no-apk.yml'
      - 'tools/stage_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py'
      - 'test/test_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py'
      - 'test/deda_intakadha_point5_visual_widget_test.dart'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-intakadha-point5-source-only
  cancel-in-progress: true
jobs:
  validate-scoped-design:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify stable phone 100356 and only stage 2-5 files changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin backup-deda-100356-phone-ui-verified-2026-10-18
          test "$(git rev-parse origin/backup-deda-100356-phone-ui-verified-2026-10-18)" = "4373b8b30eadc5a284554ca7c021c350e0732caf"
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(
              ["git","diff","--name-only","4373b8b30eadc5a284554ca7c021c350e0732caf","HEAD"],
              text=True).splitlines())
          allowed={
              "docs/DEDA_INTAKADHA_16_POINTS_STAGE1_CHECKPOINT_2026-10-18.md",
              "tools/stage_deda_intakadha_point2_remove_member_2026_10_18.py",
              "test/test_deda_intakadha_point2_member_caption_2026_10_18.py",
              ".github/workflows/qa-deda-intakadha-point2-caption-source-only-no-apk.yml",
              "tools/stage_deda_intakadha_point3_name_level_layout_2026_10_18.py",
              "test/test_deda_intakadha_point3_name_level_layout_2026_10_18.py",
              ".github/workflows/qa-deda-intakadha-point3-name-level-source-only-no-apk.yml",
              "tools/stage_deda_intakadha_point4_rectangular_id_geometry_2026_10_18.py",
              "test/test_deda_intakadha_point4_rectangular_id_geometry_2026_10_18.py",
              ".github/workflows/qa-deda-intakadha-point4-rectangular-id-source-only-no-apk.yml",
              "tools/stage_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py",
              "test/test_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py",
              "test/deda_intakadha_point5_visual_widget_test.dart",
              ".github/workflows/qa-deda-intakadha-point5-four-id-artworks-no-apk.yml",
          }
          assert changed.issubset(allowed), f"SAFE_STOP unapproved files: {sorted(changed-allowed)}"
          assert "lib/main.dart" not in changed
          assert not any(x.startswith(("android/","functions/","assets/")) for x in changed)
          print("PASS: backup untouched, no app asset/accounts/backend/Play mutation")
          PY
      - name: Run approved stages 2,3,4 and new artwork stage5 source regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/stage_deda_intakadha_point2_remove_member_2026_10_18.py \
            tools/stage_deda_intakadha_point3_name_level_layout_2026_10_18.py \
            tools/stage_deda_intakadha_point4_rectangular_id_geometry_2026_10_18.py \
            tools/stage_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py \
            test/test_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py
          for suite in 2 3 4 5; do
            case "$suite" in
              2) pattern=test_deda_intakadha_point2_member_caption_2026_10_18.py ;;
              3) pattern=test_deda_intakadha_point3_name_level_layout_2026_10_18.py ;;
              4) pattern=test_deda_intakadha_point4_rectangular_id_geometry_2026_10_18.py ;;
              5) pattern=test_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py ;;
            esac
            python3 -m unittest discover -s test -p "$pattern" -v
          done
          echo 'PASS: all four decorative ID artworks are data-driven; purchase/account logic untouched'
  isolated-flutter-render-test:
    needs: validate-scoped-design
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build ONLY a throwaway Flutter unit-test fixture with the pure staged painter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deda-id-visual-fixture/lib" "$RUNNER_TEMP/deda-id-visual-fixture/test"
          python3 - "$RUNNER_TEMP/deda-id-visual-fixture/lib/deda_premium_id_point5_only.dart" <<'PY'
          import ast
          import pathlib
          import sys
          path=pathlib.Path("tools/stage_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py")
          root=ast.parse(path.read_text(encoding="utf-8"))
          artwork=[node.value.value for node in root.body
                   if isinstance(node,ast.Assign)
                   and any(isinstance(t,ast.Name) and t.id=="ARTWORK" for t in node.targets)
                   and isinstance(node.value,ast.Constant)]
          assert len(artwork)==1
          pathlib.Path(sys.argv[1]).write_text(
              "import 'package:flutter/material.dart';\n" + artwork[0],
              encoding="utf-8")
          print("PASS: exact point5 source extracted for Flutter compile; no app backend dependencies")
          PY
          cp test/deda_intakadha_point5_visual_widget_test.dart "$RUNNER_TEMP/deda-id-visual-fixture/test/"
          cat > "$RUNNER_TEMP/deda-id-visual-fixture/pubspec.yaml" <<'YAML'
          name: deda_id_visual_fixture
          description: Decorative DEDA ID design smoke without application/backend
          version: 0.0.1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
          YAML
          cd "$RUNNER_TEMP/deda-id-visual-fixture"
          dart format lib/deda_premium_id_point5_only.dart test/deda_intakadha_point5_visual_widget_test.dart
          flutter pub get
          flutter test test/deda_intakadha_point5_visual_widget_test.dart --reporter expanded
          echo 'PASS: 4 live foils compile/render with dynamic text, gestures and widths'
          echo 'PASS: NO APK BUILD, no real user data, no Google Play publishing'
