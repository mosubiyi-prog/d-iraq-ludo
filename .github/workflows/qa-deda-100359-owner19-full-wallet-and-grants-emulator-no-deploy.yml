name: DEDA owner19 genuine Firestore emulator card + ID purchase and GM gift races NO DEPLOY
on:
  push:
    branches:
      - deda-100359-19-issues-staged-private-no-deploy-2026-10-19
    paths:
      - '.github/workflows/qa-deda-100359-owner19-full-wallet-and-grants-emulator-no-deploy.yml'
      - 'tools/deda_100359_owner19_combined_gateway_private_2026_10_19.js'
      - 'tools/deda_100359_stage41_verified_sale_list_private_2026_10_20.js'
      - 'tools/deda_stage18_private_atomic_identifier_checkout_2026_10_19.js'
      - 'test/deda_stage18_verified10k_checkout_firestore_emulator.test.js'
      - 'tools/deda_stage19_private_fixed_color_manager_actions_2026_10_19.js'
permissions:
  contents: read
concurrency:
  group: deda-100359-owner19-emulator-real-transactions-no-deploy
  cancel-in-progress: true
jobs:
  protect-real-accounts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject any production/app account migration or deployment
        # Stage53 pinned backup includes earlier approved encrypted-catalog
        # revisions. Do not compare to the pre-catalog Stage32 ancestor:
        # that historical difference falsely blocks new emulator regression.
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 5141c5e6cfe07692dc135815f051eef981dd306f -- \
            functions/index.js firestore.rules firebase.json \
            android/ lib/main.dart lib/deda_backend.dart lib/deda_social_service.dart \
            server_private/catalogs/ pubspec.yaml pubspec.lock
          ! grep -q 'deda_100359_owner19_combined_gateway_private' functions/index.js
          ! grep -q 'dedaPremiumBuyIdentifier' functions/index.js
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo 'PASS: real wallets, auth, navigation and deployed functions unchanged'
  firestore-emulator:
    needs: protect-real-accounts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install emulator-only test dependencies
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Exercise actual Firestore transaction, race, replay and role denials
        shell: bash
        run: |
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-owner19-wallet-verified-private --only firestore \
            'node --test test/deda_intakadha_point13_firebase_atomic_checkout_emulator.test.js &&
             node --test test/deda_stage18_verified10k_checkout_firestore_emulator.test.js &&
             node --test test/deda_stage19_private100_firestore_races_emulator.test.js &&
             node --test test/deda_intakadha_point15_owned_identifiers_emulator.test.js'
          echo 'PASS: real Firestore emulator transaction suite, NOT real customer debits'
  checkpoint:
    needs: [protect-real-accounts, firestore-emulator]
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'PASS owner19 emulator safety only; NO deployment, APK, production gifts or real wallet writes'
