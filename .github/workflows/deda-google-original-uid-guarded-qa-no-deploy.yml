name: DEDA isolated Google original UID guarded QA - no deploy
on:
  push:
    branches:
      - deda-100439-isolated-google-recovery-work-2026-11-07
    paths:
      - 'lib/deda_100430_owner_uid_continuity.dart'
      - 'lib/deda_100431_linked_owner_session_policy.dart'
      - 'lib/deda_step2_spark_linked_uid_readonly.dart'
      - 'lib/deda_step2_linked_owner_firebase_port.dart'
      - 'lib/deda_step2_linked_owner_flutter_handoff.dart'
      - 'lib/deda_step2_linked_owner_guardian_bridge.dart'
      - 'lib/deda_step1_google_settings_link_100439.dart'
      - 'lib/deda_step2_google_replacement_login_100439.dart'
      - 'lib/deda_google_recovery_progress_100439.dart'
      - 'lib/deda_step2_smart_second_stage_account_page_100439.dart'
      - 'lib/deda_step2_existing_account_signin_page.dart'
      - 'tools/app_stability/app_package/bind_google_account_settings_100439.py'
      - 'tools/app_stability/app_package/bind_smart_second_stage_account_100439.py'
      - 'test/deda_google_original_uid_link_private_test.dart'
      - 'test/deda_step2_spark_linked_uid_readonly_private_test.dart'
      - 'test/deda_owner_session_compat_private_test.dart'
      - 'test/deda_google_settings_card_private_test.dart'
      - 'test/deda_google_replacement_existing_uid_private_test.dart'
      - 'test/deda_google_replacement_page_private_test.dart'
      - 'test/deda_google_recovery_progress_policy_private_test.dart'
      - 'test/deda_smart_second_stage_account_private_test.dart'
      - 'test/deda_google_guardian_contract_private_test.dart'
      - 'test/deda_step2_linked_owner_guardian_bridge_private_test.dart'
      - 'tools/deda_google_auth_readiness_100439.py'
      - 'config/deda_google_auth_100439/google-services.json'
      - 'tools/test_deda_google_auth_readiness_100439.py'
      - '.github/workflows/deda-google-original-uid-guarded-qa-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-uid-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
      - name: Keep the original 100439 signing build and cloud deployment untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 6bd4b423cdc8aab028958665e7aa7b99c8370007 HEAD -- android assets firestore.rules firebase.json storage.rules pubspec.yaml pubspec.lock
          grep -q "'DEDA_STEP1_GOOGLE_ORIGINAL_UID_LINK', defaultValue: false" lib/deda_100430_owner_uid_continuity.dart
          echo PASS_ONLY_ISOLATED_GOOGLE_OWNER_LINK_NO_SIGNED_APK_NO_FIREBASE_DEPLOY
      - name: Test Google OAuth configuration readiness checker
        run: python3 -m unittest discover -s tools -p test_deda_google_auth_readiness_100439.py
      - name: Report actual Google OAuth configuration readiness without changing Firebase
        run: python3 tools/deda_google_auth_readiness_100439.py --report-only
      - name: Verify approved new Google OAuth config separately from protected original
        run: python3 tools/deda_google_auth_readiness_100439.py --config config/deda_google_auth_100439/google-services.json
      - name: Resolve raw staging dependencies in disposable runner only
        run: flutter pub get
      - name: Analyze linked-original UID and Google-only guards
        run: dart analyze --no-fatal-warnings lib/deda_100430_owner_uid_continuity.dart lib/deda_100431_linked_owner_session_policy.dart lib/deda_step2_spark_linked_uid_readonly.dart lib/deda_step2_linked_owner_firebase_port.dart lib/deda_step2_linked_owner_flutter_handoff.dart lib/deda_step2_linked_owner_guardian_bridge.dart test/deda_step2_linked_owner_guardian_bridge_private_test.dart test/deda_google_original_uid_link_private_test.dart test/deda_step2_spark_linked_uid_readonly_private_test.dart
      - name: Run original UID and linked-provider negative regression checks
        run: flutter test --no-pub test/deda_google_original_uid_link_private_test.dart test/deda_owner_session_compat_private_test.dart test/deda_step2_spark_linked_uid_readonly_private_test.dart test/deda_google_guardian_contract_private_test.dart test/deda_step2_recovery_guardian_private_test.dart test/deda_step2_linked_owner_guardian_bridge_private_test.dart
      - name: Validate settings integration in a disposable source directory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import runpy
          import shutil
          import tempfile
          from pathlib import Path
          from hashlib import sha256
          binder=runpy.run_path('tools/app_stability/app_package/bind_google_account_settings_100439.py')['bind']
          smart_binder=runpy.run_path('tools/app_stability/app_package/bind_smart_second_stage_account_100439.py')['bind']
          with tempfile.TemporaryDirectory(prefix='deda-google-private-') as tmp:
            project=Path(tmp)
            (project/'lib').mkdir()
            (project/'android/app').mkdir(parents=True)
            shutil.copy2('google-services.json', project/'android/app/google-services.json')
            for name in ('lib/main.dart','lib/deda_backend.dart','pubspec.yaml'):
              shutil.copy2(name, project/name)
            (project/'deda-stage2-core-merge-proof.json').write_text('{}')
            (project/'internal-build-inputs.json').write_text(json.dumps({
              'financialRestoreEnabled':False,
              'weekly100439AdminWinnersPrizeReport':{'singlePanelNoDuplicate':True},
              'sourceHashes':{},
            }))
            before=(project/'lib/main.dart').read_text()
            backend=(project/'lib/deda_backend.dart').read_text()
            binder(project)
            after=(project/'lib/main.dart').read_text()
            assert before.count("dedaText('الصوت والملاحة', 'Voice & navigation')")==1
            assert after.count('DedaGoogleSettingsLinkCard(')==1
            assert after.index('DedaGoogleSettingsLinkCard(') < after.index("dedaText('الصوت والملاحة', 'Voice & navigation')")
            assert 'currentHasOriginalGoogleProvider: user != null' in after
            assert backend != (project/'lib/deda_backend.dart').read_text()
            assert 'userProviderIdentityMatches(user, cleanKey)' in (project/'lib/deda_backend.dart').read_text()
            assert 'google_sign_in: 6.3.0' in (project/'pubspec.yaml').read_text()
            google = json.loads((project/'android/app/google-services.json').read_text())
            assert any(p['client_type']==1 and p['android_info']['certificate_hash']=='f5d7e13309be6f7af76798a60d72bac880005c58' for p in google['client'][0]['oauth_client'])
            assert any(p['client_type']==3 for p in google['client'][0]['oauth_client'])
            assert json.loads(Path('google-services.json').read_text())['client'][0].get('oauth_client',[]) == []
            assert json.loads((project/'internal-build-inputs.json').read_text())['googleOriginalUidSettings']['googleOAuthReleaseConfigVerified']
            assert (project/'lib/deda_step1_google_settings_link_100439.dart').is_file()
            assert (project/'lib/deda_step2_google_replacement_login_100439.dart').is_file()
            assert (project/'lib/deda_google_recovery_progress_100439.dart').is_file()
            assert 'googleProgressDrivenByVerifiedOperations' in (project/'internal-build-inputs.json').read_text()
            assert after.count('verifiedGoogleLogin: (reportProgress) async {')==1
            assert after.count('googleEnabled: dedaStep2GoogleReplacementLoginEnabled')==1
            smart_binder(project)
            final=(project/'lib/main.dart').read_text()
            assert (project/'lib/deda_step2_smart_second_stage_account_page_100439.dart').is_file()
            assert final.count('DedaSmartSecondStageAccountPage(')==1
            assert final.count('_buildExistingAccountForm(')==3
            assert final.count('verifiedGoogleLogin: (reportProgress) async {')==1
            assert final.count('if (!login.fullAccountRestored || login.originalId == null)')==1
            assert 'if (dedaSmartSecondStageAccountEnabled &&' in final
            assert final.count('await _completeVerifiedLogin(normalizedPhone);')==1
            assert "import 'deda_pin_auth.dart';" in final
            assert "import 'deda_step2_smart_second_stage_account_page_100439.dart';" in final
            assert (project/'internal-build-inputs.json').is_file()
            assert json.loads((project/'internal-build-inputs.json').read_text())['smartSecondStageAccount']['defaultOff']
          print('PASS_DISPOSABLE_GOOGLE_SETTINGS_ONE_FIELD_ABOVE_VOICE')
          PY
      - name: Resolve Google account-chooser dependency in CI checkout ONLY
        run: flutter pub add google_sign_in:6.3.0
      - name: Analyze Google settings card without building or deploying
        run: dart analyze --no-fatal-warnings lib/deda_step1_google_settings_link_100439.dart test/deda_google_settings_card_private_test.dart
      - name: Analyze replacement-phone Google no-create verifier in isolation
        run: dart analyze --no-fatal-warnings lib/deda_step2_google_replacement_login_100439.dart lib/deda_step2_existing_account_signin_page.dart lib/deda_google_recovery_progress_100439.dart lib/deda_step2_smart_second_stage_account_page_100439.dart test/deda_google_replacement_existing_uid_private_test.dart test/deda_google_replacement_page_private_test.dart test/deda_google_recovery_progress_policy_private_test.dart test/deda_smart_second_stage_account_private_test.dart
      - name: Test no-create Google preflight and original UID invariants
        run: flutter test --no-pub test/deda_google_replacement_existing_uid_private_test.dart test/deda_google_replacement_page_private_test.dart test/deda_google_recovery_progress_policy_private_test.dart test/deda_smart_second_stage_account_private_test.dart
      - name: Verify card remains hidden until approved
        run: flutter test --no-pub test/deda_google_settings_card_private_test.dart
      - name: Analyze complete wired first and smart second account screens in disposable CI checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import runpy
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path
          google_bind=runpy.run_path('tools/app_stability/app_package/bind_google_account_settings_100439.py')['bind']
          smart_bind=runpy.run_path('tools/app_stability/app_package/bind_smart_second_stage_account_100439.py')['bind']
          with tempfile.TemporaryDirectory(prefix='deda-smart-final-') as temp:
            project=Path(temp)
            (project/'lib').mkdir()
            (project/'android/app').mkdir(parents=True)
            shutil.copy2('google-services.json', project/'android/app/google-services.json')
            for name in ('lib/main.dart','lib/deda_backend.dart'):
              shutil.copy2(name, project/name)
            # pub add in CI mutated the checkout; the copy still needs the
            # exact protected no-Google baseline expected by the binder.
            (project/'pubspec.yaml').write_bytes(subprocess.check_output(
                ['git', 'show', 'HEAD:pubspec.yaml']))
            (project/'deda-stage2-core-merge-proof.json').write_text('{}')
            (project/'internal-build-inputs.json').write_text(json.dumps({
              'financialRestoreEnabled': False,
              'weekly100439AdminWinnersPrizeReport': {'singlePanelNoDuplicate': True},
              'sourceHashes': {},
            }))
            google_bind(project)
            smart_bind(project)
            final=(project/'lib/main.dart').read_text()
            assert "if (dedaSmartSecondStageAccountEnabled &&" in final
            assert "DedaExistingAccountSignInPage(" in final
            assert "verifiedGoogleLogin: (reportProgress) async {" in final
            assert "await DedaPinAuth.createAccount(" in final
            assert "if (!login.fullAccountRestored || login.originalId == null)" in final
            # The repository commit and signed 100439 are never altered:
            # only this ephemeral Actions checkout receives analysis inputs.
            shutil.copy2(project/'lib/main.dart','lib/main.dart')
            shutil.copy2(project/'lib/deda_backend.dart','lib/deda_backend.dart')
          print('PASS_DISPOSABLE_SMART_SECOND_STAGE_WIRED_SOURCE_BEFORE_ANALYZE')
          PY
          dart analyze --no-fatal-warnings lib/main.dart lib/deda_backend.dart
