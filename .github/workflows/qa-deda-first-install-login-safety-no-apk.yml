name: DEDA First Install Login No-Freeze Safety - NO APK

on:
  push:
    branches:
      - deda-next-four-items-stage0-2026-10-10
      - deda-100441-step1-legacy-google-proof-gate-isolated-no-deploy-2026-11-09
    paths:
      - 'lib/deda_pin_auth.dart'
      - 'lib/deda_backend.dart'
      - 'lib/deda_step2_google_replacement_login_100439.dart'
      - 'test/deda_google_replacement_existing_uid_private_test.dart'
      - 'functions/deda_owner_pin_verify_private_v1.js'
      - 'functions/test/deda_owner_pin_verify_private_v1.test.js'
      - 'lib/deda_100431_linked_owner_session_policy.dart'
      - 'test/deda_owner_session_compat_private_test.dart'
      - 'tools/guard_deda_login_busy_indicator_next_release.py'
      - 'tests/stage14/test_login_busy_patch.py'
      - '.github/workflows/qa-deda-first-install-login-safety-no-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-regression-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: New login progress indicator script is safe and idempotent
        run: |
          python3 -m py_compile tools/guard_deda_login_busy_indicator_next_release.py
          python3 -m unittest tests/stage14/test_login_busy_patch.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test existing server PIN verifier with linked same-UID gate
        run: |
          node --check functions/deda_owner_pin_verify_private_v1.js
          node --test functions/test/deda_owner_pin_verify_private_v1.test.js
          node --test functions/test/deda_stage2_live_gate.test.js
      - name: Protect linked-owner PIN from legacy Firestore attempt writes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('lib/deda_pin_auth.dart').read_text()
          part = src.split('static Future<Map<String, dynamic>> signIn({',1)[1]
          linked = src.split('static Future<void> _proveLinkedOwnerPin({',1)[1].split('static Future<void> _openSession',1)[0]
          assert "await _proveLinkedOwnerPin(accountKey: accountKey, pin: pin);" in part
          assert "await _provePin(accountKey: accountKey, pin: pin);" in part
          assert ".collection('deda_auth_attempts')" not in linked
          assert ".httpsCallable('dedaVerifyExistingOwnerPin')" in linked
          backend=Path('lib/deda_backend.dart').read_text()
          assert 'DedaLinkedOwnerSessionPolicy.userProviderIdentityMatches(user, cleanKey)' in backend
          assert 'DedaLinkedOwnerSessionPolicy.userProviderIdentityMatches(' in src
          assert 'current, cleanKey)' in src
          print('PASS_OPT_IN_PIN_AND_GOOGLE_SAME_UID_COMPAT_RETAINED')
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze bounded first-install Firebase Auth
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/deda_pin_auth.dart lib/deda_backend.dart
      - name: Test existing linked-owner PIN gating policy (opt-in only)
        run: flutter test test/deda_owner_session_compat_private_test.dart --reporter expanded
      - name: Prepare Google sign-in package in disposable CI workspace only
        run: |
          # Original pubspec and lock remain unchanged in GitHub; only the
          # temporary runner resolves the version already pinned by binder.
          flutter pub add google_sign_in:6.3.0
      - name: Analyze isolated Google replacement account guard
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/deda_step2_google_replacement_login_100439.dart
      - name: Test existing Google UID match and no foreign account sign-out
        run: flutter test test/deda_google_replacement_existing_uid_private_test.dart --reporter expanded
      - name: Prevent unbounded first-user Firebase wait and network bypass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('lib/deda_pin_auth.dart').read_text()
          assert src.count('auth.signInAnonymously()') == 1
          assert src.count('.timeout(const Duration(seconds: 12))') == 1
          assert '.timeout(const Duration(seconds: 8))' in src
          assert 'prefs.getBool(_knownAccountKey(phone)) == true' in src
          assert 'await _provePin(accountKey: accountKey, pin: pin);' in src
          assert 'await _openSession(accountKey);' in src
          print('PASS: 12s first-install Firebase anonymous-auth deadline, 8s account directory timeout, offline known-account shortcut, PIN still mandatory.')
          PY
      - name: Guarantee source-only changes
        run: echo 'No APK, Play Store, Cloud Functions or Firebase deployment.'
