name: DEDA Stage31 Iraq weekly freeze and top-ten congratulations NO DEPLOY
on:
  push:
    branches:
      - deda-weekly-stage31-anchored-freeze-congrats-safe-no-deploy-2026-10-28
    paths:
      - 'functions/deda_weekly_stage31_frozen_league_winner_card_NOT_EXPORTED.js'
      - 'functions/tests/deda_weekly_stage31_frozen_league_winner_card.test.js'
      - '.github/workflows/qa-deda-weekly-stage31-calendar-freeze-congrats-no-deploy.yml'
      - 'docs/DEDA_WEEKLY_STAGE31_FROZEN_RESULTS_WINNER_CARD_NO_DEPLOY_2026-10-28.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-stage31-private-weekly-contract
  cancel-in-progress: true
jobs:
  unit-and-protected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Forbid original app, server and wallet changes
        run: |
          set -euo pipefail
          git diff --quiet 6f7cc004421166cda6f6b092efd3ffb611e38cbf -- \
            functions/index.js functions/package.json \
            firebase.json firestore.rules storage.rules \
            lib/main.dart lib/deda_backend.dart lib/deda_social_service.dart \
            lib/deda_weekly_leaderboard_page.dart \
            lib/deda_weekly_private_trial_local_xp.dart \
            tools/app_stability/app_package pubspec.yaml pubspec.lock
          node --check functions/deda_weekly_stage31_frozen_league_winner_card_NOT_EXPORTED.js
          node --check functions/tests/deda_weekly_stage31_frozen_league_winner_card.test.js
          node - <<'JS'
          const fs=require("node:fs");
          const index=fs.readFileSync("functions/index.js","utf8");
          if(index.includes("deda_weekly_stage31_frozen_league_winner_card"))
            throw Error("stage31 must not be exported to live Cloud Functions");
          const module=fs.readFileSync(
            "functions/deda_weekly_stage31_frozen_league_winner_card_NOT_EXPORTED.js","utf8");
          for(const marker of ["FIRESTORE_EMULATOR_HOST","demo-deda-weekly-xp-stage9",
            "previewOnly:true","payoutEnabled:false","creditsMade:0",
            "Asia/Baghdad","مركزك النهائي"]) {
            if(!module.includes(marker))throw Error("missing safety marker: "+marker);
          }
          console.log("PASS original DEDA untouched and Stage31 private guards exist");
          JS
      - name: Test 7-day schedule, 00:00–06:00 freeze and exact ten-only welcome text
        run: |
          node --test \
            functions/tests/deda_weekly_stage31_frozen_league_winner_card.test.js \
            functions/tests/deda_weekly_stage29_task_to_rank_emulator.test.js
  firestore-emulator-idempotent-ack:
    needs: unit-and-protected-source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GCLOUD_PROJECT: demo-deda-weekly-xp-stage9
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install private emulator tools only
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase-tools@14
      - name: Test two-device concurrent welcome acknowledgement in private Firestore
        run: |
          set -euo pipefail
          functions/node_modules/.bin/firebase emulators:exec \
            --config tools/app_stability/stage30/firebase.json \
            --project demo-deda-weekly-xp-stage9 --only firestore \
            'node --test functions/tests/deda_weekly_stage31_frozen_league_winner_card.test.js'
  complete-private-stage31:
    needs: [unit-and-protected-source, firestore-emulator-idempotent-ack]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "Stage31 only: canonical 7-day calendar, frozen results, UI text and mock acknowledgment."
          echo "Stage30 original task authority remains pending. No real winners or gifts issued."
          echo "NO Firebase / Firestore rules / Cloud Function / Android APK / AAB / Play deployment."
