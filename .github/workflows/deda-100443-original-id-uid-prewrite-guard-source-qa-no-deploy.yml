name: DEDA 100443 original ID same-UID prewrite fix isolated source QA NO DEPLOY

on:
  push:
    branches:
      - deda-100441-source-audit-isolated-recovery-2026-11-12
    paths:
      - "lib/deda_backend.dart"
      - "lib/deda_100431_linked_owner_session_policy.dart"
      - "lib/deda_100430_owner_uid_continuity.dart"
      - "lib/deda_stage71_free_owned_use_profile.dart"
      - "lib/deda_verified_active_id_store.dart"
      - "test/deda_stage71_four_free_cards_dual200_widget_test.dart"
      - "test/deda_100410_unified_active_id_test.dart"
      - "lib/deda_progress_backup_coordinator.dart"
      - "lib/deda_legacy_purchase_evidence.dart"
      - "lib/deda_step2_before_uid_link_evidence_checkpoint.dart"
      - "test/deda_purchase_backup_coordinator_test.dart"
      - "test/deda_progress_backup_coordinator_test.dart"
      - "test/deda_legacy_purchase_evidence_test.dart"
      - "lib/deda_step1_google_settings_link_100439.dart"
      - "lib/deda_step2_google_replacement_login_100439.dart"
      - "test/deda_google_settings_card_private_test.dart"
      - "test/deda_google_replacement_existing_uid_private_test.dart"
      - "test/deda_session_transition_gate_test.dart"
      - "test/deda_google_original_uid_link_private_test.dart"
      - "test/deda_step2_spark_linked_uid_readonly_private_test.dart"
      - "tools/app_stability/app_package/reconcile_stage2_auth_conflicts.py"
      - "tools/app_stability/app_package/bind_google_account_settings_100439.py"
      - "test/deda_original_share_uid_prewrite_guard_100443_test.dart"
      - ".github/workflows/deda-100443-original-id-uid-prewrite-guard-source-qa-no-deploy.yml"
permissions:
  contents: read
concurrency:
  group: deda-100443-original-id-prewrite-no-deploy
  cancel-in-progress: false

jobs:
  source-only-guard-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove NO changes to prod Firebase, SDK config, Play, and user assets
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 308a846ef0c44169929a2908adb0457b4b028672 HEAD -- \
            firestore.rules storage.rules functions/index.js firebase.json .firebaserc \
            android/ assets/ pubspec.yaml pubspec.lock lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          s = Path("lib/deda_backend.dart").read_text()
          start = s.index("  static Future<Map<String, String>> ensureLocationShareIdentity({")
          end = s.index("  static Future<Map<String, dynamic>?> locationShareIdInfo(", start)
          source = s[start:end]
          assert source.index("canStageOriginalShareProjection(") < source.index("await userRef.set(")
          assert source.index("original-share-uid-conflict-recovery-required") < source.index("await userRef.set(")
          assert "dedaLinkedOwnerCompatEnabled" in source
          assert "FirebaseAuth.instance.currentUser?.uid != user.uid" in source
          assert "existing.data()?['ownerUid'] != user.uid" in source
          assert "ownerUid': user.uid" in source
          assert "set(" not in source[:source.index("canStageOriginalShareProjection(")]
          pin = Path("lib/deda_pin_auth.dart").read_text()
          pin_section = pin.split("  static Future<Map<String, dynamic>> signIn({", 1)[1]
          pin_section = pin_section.split("  static Future<void> markCurrentDeviceTrusted(", 1)[0]
          assert "final expectedUid = dedaLinkedOwnerCompatEnabled" in pin_section
          assert pin_section.index("await _verifiedExistingPinUid(accountKey)") < pin_section.index("_provePin(")
          assert pin_section.index("_provePin(") < pin_section.index("await _openSession(accountKey, expectedOriginalUid: expectedUid)")
          assert "original-pin-uid-changed-before-session-write" in pin_section
          assert "dedaLinkedOwnerCompatEnabled" in pin_section
          index = Path("functions/index.js").read_text()
          assert "deda_100441_legacy_google_oidc_verifier_PRIVATE_NOT_EXPORTED" not in index
          assert "deda_100441_canonical_uid_anti_split_preflight_PRIVATE_NOT_EXPORTED" not in index
          print("PASS_LINKED_OWNER_UID_CHECK_BEFORE_PIN_PROOF_WRITE_NO_SPLIT_RETRY")
          print("PASS_SPLIT_UID_BLOCKED_BEFORE_NEW_USER_OR_ID_PROJECTION")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: false
      - name: Flutter source analyzer and original ID guard policy unit tests
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze --no-fatal-warnings \
            lib/deda_backend.dart lib/deda_100431_linked_owner_session_policy.dart \
            lib/deda_100430_owner_uid_continuity.dart test/deda_session_transition_gate_test.dart \
            lib/deda_progress_backup_coordinator.dart \
            lib/deda_legacy_purchase_evidence.dart \
            lib/deda_step2_before_uid_link_evidence_checkpoint.dart \
            lib/deda_stage71_free_owned_use_profile.dart \
            lib/deda_verified_active_id_store.dart \
            test/deda_purchase_backup_coordinator_test.dart
          flutter test --no-pub \
            test/deda_progress_backup_coordinator_test.dart \
            test/deda_purchase_backup_coordinator_test.dart \
            test/deda_legacy_purchase_evidence_test.dart
          flutter test --no-pub --dart-define=DEDA_STEP2_LINKED_OWNER_COMPAT=true \
            test/deda_original_share_uid_prewrite_guard_100443_test.dart \
            test/deda_pin_same_uid_100441_optin_private_test.dart
          flutter test --no-pub \
            test/deda_session_transition_gate_test.dart \
            test/deda_google_original_uid_link_private_test.dart \
            test/deda_step2_spark_linked_uid_readonly_private_test.dart
          python3 - <<'PY'
          from pathlib import Path
          s=Path('lib/deda_100430_owner_uid_continuity.dart').read_text()
          section=s.split('  static Future<String> linkExistingOriginalUid({',1)[1]
          section=section.split('  static void requireSameUidGoogleLink({',1)[0]
          assert 'sparkPilotEnabled: true' in section
          assert section.index('requireEvidenceBeforeLink(') < section.index('await DedaPinAuth.signIn(')
          assert section.index('await beforeLinkedIdentityTransition(accountKey, originalUid)') < section.index('DedaAuthRuntime.controller.transition<UserCredential>(')
          assert 'live.uid == originalUid' in section
          assert 'live.kind == DedaSessionAuthKind.authenticated' in section
          assert 'DedaAuthRuntime.checkSnapshot(linkedSnapshot)' in section
          print('PASS_SAME_UID_ORIGINAL_PHONE_LINK_ARCHIVE_AND_SHARED_AUTH_LANE')
          checkpoint=Path('lib/deda_step2_before_uid_link_evidence_checkpoint.dart').read_text()
          coordinator=Path('lib/deda_progress_backup_coordinator.dart').read_text()
          purchase=Path('lib/deda_legacy_purchase_evidence.dart').read_text()
          assert 'requireNonEmptyEvidence: true' in checkpoint
          assert 'result.journalCleared' in checkpoint
          assert 'intent.purchaseCapture!.encode()' in checkpoint
          assert '!capture.hasAnyLocalRecord &&' in coordinator
          assert 'purchaseCapture?.hasAnyLocalRecord ?? false' in coordinator
          assert 'bool get hasAnyLocalRecord =>' in purchase
          print('PASS_PRELINK_TRUE_PROGRESS_OR_PURCHASE_SOURCE_AND_CLOUD_READBACK_GATE')
          id_src=Path('lib/deda_stage71_free_owned_use_profile.dart').read_text()
          assert 'final verified = await Future.wait<Object>([' in id_src
          assert 'acceptedOwnedForMyStore(original)' in id_src
          assert 'DedaStage71OwnedIdentifierService.active(original),' in id_src
          use=id_src.split('  static Future<void> use(String originalId,String identifier, {',1)[1]
          use=use.split('\n/// User',1)[0]
          assert use.index('final persisted=await active(originalId)') < use.index('DedaVerifiedActiveIdStore.confirmed(')
          assert use.index('DedaVerifiedActiveIdStore.confirmed(') < use.index('onServerConfirmed?.call()')
          assert use.index('onServerConfirmed?.call()') < use.index('publishOwnerVerified(')
          assert 'final verifiedGrant = DedaStage71OwnedIdentifier.read(' in use
          assert 'confirmedColor = verifiedGrant.baseColor' in use
          assert 'await owned(originalId)' not in use
          assert 'if (FirebaseAuth.instance.currentUser?.uid != uid)' in use
          print('PASS_ID_USE_RESPONDS_AFTER_SERVER_PROOF_BEFORE_OPTIONAL_PROJECTION_NO_EXTRA_GRANT_QUERY')
          google=s.split('  static Future<String> linkGoogleToConfirmedOriginalUid({',1)[1]
          google=google.split('  static String validatedServerProfileName(',1)[0]
          assert 'DedaAuthRuntime.controller.transition<UserCredential>(' in google
          assert 'live.uid == uid' in google
          assert 'auth.currentUser!.reload()' in google
          assert 'auth.signInWithCredential(' not in google
          card=Path('lib/deda_step1_google_settings_link_100439.dart').read_text()
          assert '_linkDetachedAnonymous' not in card
          assert 'mayOfferDetachedGoogleLink' not in card
          assert 'linkWithCredential(' not in card
          assert card.count('DedaOwnerUidContinuity.linkGoogleToConfirmedOriginalUid(')==1
          assert 'DedaLinkedOwnerSessionPolicy.verified(owner, account)' in card
          assert 'auth.currentUser?.uid != startingUid' in card
          print('PASS_GOOGLE_SETTINGS_VERIFIED_OWNER_UID_ONLY_NO_DETACHED_SESSION')
          PY
      - name: Rebuild EXACT 100441 full original assembly SOURCE ONLY without APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import os
          wf = Path(".github/workflows/deda-100441-complete-signed-session-diagnostic-no-play.yml").read_text()
          first = wf.index("      - name: Reconstruct FULL protected 100439")
          run = wf.index("        run: |\n", first) + len("        run: |\n")
          last = wf.index("      - name: Analyze entire assembled entry", run)
          source = dedent(wf[run:last].rstrip()) + "\n"
          assert "merge_stage2_into_protected_100436.py" in source
          assert "bind_session_diagnostic_readonly_100441.py" in source
          (Path(os.environ["RUNNER_TEMP"]) / "deda100443-assemble-source-only.sh").write_text(source)
          PY
          bash "$RUNNER_TEMP/deda100443-assemble-source-only.sh"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["RUNNER_TEMP"]) / "deda-100441-complete-signed-app" / "lib"
          backend = (p / "deda_backend.dart").read_text()
          assert backend.count("DedaLinkedOwnerSessionPolicy.userProviderIdentityMatches(user, cleanKey)") == 1
          assert "DedaLinkedOwnerSessionPolicy.emailMatches(user.email, cleanKey)" not in backend
          print("PASS_FULL_ASSEMBLY_REUSES_EXISTING_LINKED_UID_PROVIDER_PROOF")
          anchor = "static Future<Map<String, String>> ensureLocationShareIdentity({"
          start = backend.find(anchor)
          assert start >= 0, "full assembly missing original ID service"
          # The verified assembled 100436 backend may not include the later
          # standalone locationShareIdInfo sibling from repository source.
          end = backend.find("locationShareIdInfo(", start)
          section = backend[start:end] if end >= 0 else backend[start:]
          assembled_pin = (p / "deda_pin_auth.dart").read_text()
          signin = assembled_pin.split("  static Future<Map<String, dynamic>> signIn({", 1)[1]
          signin = signin.split("  static Future<void> markCurrentDeviceTrusted(", 1)[0]
          assert signin.index("_verifiedExistingPinUid(accountKey)") < signin.index("_provePin(")
          assert signin.index("_provePin(") < signin.index("_openSession(accountKey, expectedOriginalUid: expectedUid)")
          assert "original-pin-uid-changed-before-session-write" in signin
          print("PASS_FULL_ASSEMBLY_PIN_PROOF_NEVER_WRITES_BEFORE_VERIFIED_ORIGINAL_UID")
          assert "canStageOriginalShareProjection(" in section
          write = ("await DedaAuthRuntime.wait(() => userRef.set("
                   if "await DedaAuthRuntime.wait(() => userRef.set(" in section
                   else "await userRef.set(")
          assert write in section, "full assembly has no identifiable owner write"
          assert section.index("canStageOriginalShareProjection(") < section.index(write)
          assert "DedaGoogleSettingsLinkCard(" in (p / "main.dart").read_text()
          assert "DedaSessionDiagnosticReadOnlyTile(" in (p / "main.dart").read_text()
          print("PASS_VERIFIED_REAL_APP_FULL_ASSEMBLY_SAME_UID_GUARD_PRESENT")
          PY
          (
            cd "$RUNNER_TEMP/deda-100441-complete-signed-app"
            flutter pub get
            dart analyze --no-fatal-warnings \
              lib/main.dart lib/deda_backend.dart lib/deda_pin_auth.dart \
              lib/deda_100431_linked_owner_session_policy.dart \
              lib/deda_100430_owner_uid_continuity.dart \
              lib/deda_step1_google_settings_link_100439.dart \
              lib/deda_step2_google_replacement_login_100439.dart
            mkdir -p test
            cp "$GITHUB_WORKSPACE/test/deda_google_settings_card_private_test.dart" test/
            cp "$GITHUB_WORKSPACE/test/deda_google_original_uid_link_private_test.dart" test/
            cp "$GITHUB_WORKSPACE/test/deda_google_replacement_existing_uid_private_test.dart" test/
            cp "$GITHUB_WORKSPACE/test/deda_purchase_backup_coordinator_test.dart" test/
            cp "$GITHUB_WORKSPACE/test/deda_progress_backup_coordinator_test.dart" test/
            cp "$GITHUB_WORKSPACE/test/deda_legacy_purchase_evidence_test.dart" test/
            cp "$GITHUB_WORKSPACE/test/deda_stage71_four_free_cards_dual200_widget_test.dart" test/
            cp "$GITHUB_WORKSPACE/test/deda_100410_unified_active_id_test.dart" test/
            flutter test --no-pub \
              test/deda_google_settings_card_private_test.dart \
              test/deda_google_original_uid_link_private_test.dart \
              test/deda_google_replacement_existing_uid_private_test.dart \
              test/deda_progress_backup_coordinator_test.dart \
              test/deda_purchase_backup_coordinator_test.dart \
              test/deda_legacy_purchase_evidence_test.dart \
              test/deda_stage71_four_free_cards_dual200_widget_test.dart \
              test/deda_100410_unified_active_id_test.dart
          )
      - name: Check LIVE Firestore archive route presence with firebase.readonly (no documents, no writes)
        shell: bash
        env:
          DEDA_RULES_PRIMARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
          DEDA_RULES_SECONDARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/deda-rules-readonly"
          "$RUNNER_TEMP/deda-rules-readonly/bin/pip" --disable-pip-version-check install --quiet google-auth requests
          PYTHONPATH="tools/app_stability/rules_compat" "$RUNNER_TEMP/deda-rules-readonly/bin/python" - <<'PY'
          from read_current import snapshot, session_reader
          try:
              reader=session_reader()
              rules, metadata=snapshot(reader)
          except Exception:
              print('SAFE_HOLD_LIVE_FIRESTORE_RULES_READ_UNAVAILABLE')
          else:
              # Never log raw rules, credentials, hashes of user records,
              # UIDs, emails or production Firestore documents.
              routes={
                  'progress': 'match /deda_progress_evidence/{accountKey}/captures/{captureId}',
                  'purchase': 'match /deda_purchase_evidence/{accountKey}/captures/{captureId}',
              }
              print('LIVE_FIRESTORE_ARCHIVE_ROUTE_CHECK_READ_ONLY', {
                  name:('PRESENT_NOT_PERMISSION_PROOF' if path in rules else 'MISSING')
                  for name,path in routes.items()
              })
              print('LIVE_FIRESTORE_RULES_API_GETS',reader.gets)
              print('NO_PRODUCTION_DOCUMENT_READS_NO_FIREBASE_MUTATIONS')
              if all(path in rules for path in routes.values()):
                  import os, json
                  from pathlib import Path
                  source=Path(os.environ['RUNNER_TEMP'])/'deda-live-archive.rules'
                  if source.exists():
                      raise RuntimeError('temporary-rules-already-present')
                  source.write_text(rules,encoding='utf-8')
                  source.chmod(0o600)
                  config=Path(os.environ['RUNNER_TEMP'])/'deda-live-archive-firebase.json'
                  config.write_text(json.dumps({
                    'firestore':{'rules':source.name},
                    'emulators':{'auth':{'host':'127.0.0.1','port':9099},
                                 'firestore':{'host':'127.0.0.1','port':8098},
                                 'ui':{'enabled':False}}
                  }),encoding='utf-8')
                  print('PRIVATE_CURRENT_RULES_READY_FOR_OFFLINE_EMULATOR')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test ACTUAL live Firestore rules against isolated same-UID Auth and archive emulators (NO DEPLOY)
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "$RUNNER_TEMP/deda-live-archive.rules" ]]; then
            echo "SAFE_HOLD_EMULATOR_REQUIRES_VERIFIED_LIVE_ARCHIVE_ROUTES"
            exit 0
          fi
          node --check qa/stage2/deda_spark_prelink_evidence_rules_real_emulator_private.test.cjs
          node --check qa/stage2/deda_spark_existing_uid_auth_readonly_private.test.cjs
          mkdir -p "$RUNNER_TEMP/deda-archive-emulator-node"
          npm install --prefix "$RUNNER_TEMP/deda-archive-emulator-node" --no-save --no-audit --no-fund \
            firebase-tools@13.35.1 firebase@11.10.0 firebase-admin@12.7.0
          export NODE_PATH="$RUNNER_TEMP/deda-archive-emulator-node/node_modules"
          cli="$RUNNER_TEMP/deda-archive-emulator-node/node_modules/.bin/firebase"
          "$cli" emulators:exec --project demo-deda-100436-journal-qa \
            --config "$RUNNER_TEMP/deda-live-archive-firebase.json" \
            --only auth,firestore --non-interactive \
            'node --test qa/stage2/deda_spark_prelink_evidence_rules_real_emulator_private.test.cjs qa/stage2/deda_spark_existing_uid_auth_readonly_private.test.cjs'
          echo "PASS_SAME_UID_OLD_ANONYMOUS_PHONE_ARCHIVE_AND_TWO_NEW_PHONES_ON_ACTUAL_LIVE_RULES_EMULATOR_NO_PROD_WRITES"
      - name: Confirm NO signing, APK, Firebase write or Play deployment
        run: echo "PASS_DEDA_100443_SOURCE_ONLY_PRODUCTION_UNCHANGED"
