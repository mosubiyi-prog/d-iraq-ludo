name: DEDA QA32 Cross-device Place Owner Emulated Account Recovery NO DEPLOY
on:
  push:
    branches:
      - deda-qa-32-batch1-no-deploy-2026-10-21
    paths:
      - '.github/workflows/qa-deda-20261021-owner-place-account-recovery-no-deploy.yml'
      - 'tools/stage_deda_owner_place_cross_device_recovery_stage64.py'
      - 'test/deda_stage64_owner_place_cross_device_firestore_emulator.test.js'
      - 'docs/DEDA_STAGE64_OWNER_PLACE_CROSS_DEVICE_P0_2026-10-20.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-qa32-owner-recovery-no-deploy
  cancel-in-progress: false
jobs:
  safe-source-and-real-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce no production or user data changes
        run: |
          set -euo pipefail
          git diff --quiet c1a27b297088868d367f3babb2d9218d1b5dd14b -- \
            lib/main.dart lib/deda_backend.dart functions/index.js firestore.rules firebase.json \
            server_private/ android/ assets/ pubspec.yaml
          python3 -m py_compile tools/stage_deda_owner_place_cross_device_recovery_stage64.py
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo 'PASS: no live data/code/rules/publication changed'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Firestore emulator dependencies only
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Verify replacement UID retrieval + owner edit + stranger denial against REAL staged rules
        shell: bash
        run: |
          set -euo pipefail
          export GCLOUD_PROJECT=demo-deda-stage64-owner-place-recovery
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-stage64-owner-place-recovery --only firestore \
            'node --test test/deda_stage64_owner_place_cross_device_firestore_emulator.test.js'
          echo 'PASS real local Firestore rules. Still NOT live deployed rules.'
