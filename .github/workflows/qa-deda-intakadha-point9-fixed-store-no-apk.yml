name: DEDA «إنت كدها» Point 9 - Fixed four card ID Store - NO APK
on:
  push:
    branches:
      - deda-intakadha-ids-cards-stage1-2026-10-18
    paths:
      - '.github/workflows/qa-deda-intakadha-point9-fixed-store-no-apk.yml'
      - 'tools/stage_deda_intakadha_point9_sticky_four_card_store_2026_10_18.py'
      - 'test/test_deda_intakadha_point9_sticky_store_2026_10_18.py'
      - 'test/deda_intakadha_point9_fixed_store_widget_test.dart'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-intakadha-point9-no-apk
  cancel-in-progress: true
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert baseline 100356 is still exact and no real app files are mutated
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin backup-deda-100356-phone-ui-verified-2026-10-18
          test "$(git rev-parse origin/backup-deda-100356-phone-ui-verified-2026-10-18)" = "4373b8b30eadc5a284554ca7c021c350e0732caf"
          python3 - <<'PY'
          import subprocess,re
          paths=set(subprocess.check_output(
              ["git","diff","--name-only","4373b8b30eadc5a284554ca7c021c350e0732caf","HEAD"],
              text=True).splitlines())
          permitted=(
              r"docs/DEDA_INTAKADHA_16_POINTS_STAGE1_CHECKPOINT_2026-10-18\.md",
              r"tools/stage_deda_intakadha_point[2-9]_[a-z0-9_]+_2026_10_18\.py",
              r"test/test_deda_intakadha_point[2-9]_[a-z0-9_]+_2026_10_18\.py",
              r"test/deda_intakadha_point[5-9]_[a-z0-9_]+\.dart",
              r"\.github/workflows/qa-deda-intakadha-point[2-9]-[a-z0-9-]+\.yml",
          )
          bad=[x for x in paths if not any(re.fullmatch(p,x) for p in permitted)]
          assert not bad, f"SAFE_STOP unapproved paths changed: {bad}"
          assert not any(x.startswith(("lib/","android/","assets/","functions/")) for x in paths)
          print("PASS: original 100356 phone-proven SHA protected; no wallet/backend/Play edits")
          PY
      - name: Validate stage2 to stage9 exact generated source and ID store-only route
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/stage_deda_intakadha_point9_sticky_four_card_store_2026_10_18.py test/test_deda_intakadha_point9_sticky_store_2026_10_18.py
          for i in 2 3 4 5 6 7 8 9; do
            case "$i" in
              2) pattern=test_deda_intakadha_point2_member_caption_2026_10_18.py ;;
              3) pattern=test_deda_intakadha_point3_name_level_layout_2026_10_18.py ;;
              4) pattern=test_deda_intakadha_point4_rectangular_id_geometry_2026_10_18.py ;;
              5) pattern=test_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py ;;
              6) pattern=test_deda_intakadha_point6_profile_id_slot_2026_10_18.py ;;
              7) pattern=test_deda_intakadha_point7_four_card_management_2026_10_18.py ;;
              8) pattern=test_deda_intakadha_point8_photos_to_id_shop_2026_10_18.py ;;
              9) pattern=test_deda_intakadha_point9_sticky_store_2026_10_18.py ;;
            esac
            python3 -m unittest discover -s test -p "$pattern" -v
          done
          echo "PASS: point9 store navigation changes only ID Store tile, list is read-only"
  flutter-fixed-header-test:
    needs: source-only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Isolated real Flutter test of 4 pinned cards above list scrolling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deda-point9-store/lib" "$RUNNER_TEMP/deda-point9-store/test"
          python3 - "$RUNNER_TEMP/deda-point9-store/lib/deda_point9_fixed_store_fixture.dart" <<'PY'
          import ast,sys
          from pathlib import Path
          segments=[]
          for path,variable in (
              ("tools/stage_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py","ARTWORK"),
              ("tools/stage_deda_intakadha_point9_sticky_four_card_store_2026_10_18.py","PAGE"),
          ):
              tree=ast.parse(Path(path).read_text(encoding="utf-8"))
              values=[s.value.value for s in tree.body if isinstance(s,ast.Assign)
                      and isinstance(s.value,ast.Constant)
                      and any(isinstance(t,ast.Name) and t.id==variable for t in s.targets)]
              assert len(values)==1, "SAFE_STOP exact widget source not available"
              segments.append(values[0])
          Path(sys.argv[1]).write_text(
              "import 'package:flutter/material.dart';\n"
              "String dedaText(String ar, String en) => ar;\n"
              + "\n".join(segments),encoding="utf-8")
          print("PASS: exact four designer foils + store screen extracted, no app data used")
          PY
          cp test/deda_intakadha_point9_fixed_store_widget_test.dart "$RUNNER_TEMP/deda-point9-store/test/"
          cat > "$RUNNER_TEMP/deda-point9-store/pubspec.yaml" <<'YAML'
          name: deda_p9_fixed_header_fixture
          description: Decorative DEDA ID Store sticky header safety tests
          version: 0.0.1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
          YAML
          cd "$RUNNER_TEMP/deda-point9-store"
          dart format lib/deda_point9_fixed_store_fixture.dart test/deda_intakadha_point9_fixed_store_widget_test.dart
          flutter pub get
          flutter test test/deda_intakadha_point9_fixed_store_widget_test.dart --reporter expanded
          echo "PASS: 4 x 50dp premium ID cards pinned above independent scrolling read-only catalog"
          echo "PASS: no APK, no purchase, no Firestore operations, no Play publishing"
