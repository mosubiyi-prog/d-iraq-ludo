name: DEDA 100377 Point01 OWNER APPROVED Additive Frame Rules LIVE Guarded
on:
  push:
    branches: [deda-100377-13-points-sequential-qa-2026-10-22]
    paths:
      - '.github/workflows/deda-100377-point01-owner-approved-additive-firebase-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-100377-point01-owner-approved-live-rules
  cancel-in-progress: false
jobs:
  emulated-legacy-and-frame-compatibility-before-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      DEDA_POINT01_OWNER_APPROVAL: 2026-10-22-POINT01-LEGACY-SHOP-PRESERVE-APPROVED
      DEDA_STAGE69_PRIMARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      DEDA_STAGE69_SECONDARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Guard original app, wallet, rules, Android signing, Play, and gift balances
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet f4da0bfd52affaea8a4d45e2ac15498bc0cea280 -- \
            firestore.rules firebase.json functions/index.js storage.rules \
            android/ lib/main.dart lib/deda_backend.dart assets/ server_private/
          python3 -m py_compile \
            tools/deda_100377_point01_legacy_compatible_rules_NO_DEPLOY.py \
            tools/deda_100377_point01_owner_approved_additive_live_rules_deploy.py
          test ! -f build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Read CURRENT published rules read-only and rebuild EXACT reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 tools/deda_100377_point01_legacy_compatible_rules_NO_DEPLOY.py
          test -s /tmp/deda-point01-legacy-compatible.rules
      - name: Run 11 local checks before touching production release
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --no-save --no-audit --no-fund \
            firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
          export GCLOUD_PROJECT=demo-deda-100377-legacy-compatible
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100377-legacy-compatible --only firestore \
            'node --test test/deda_100377_point01_legacy_compatible_checkout_emulator.test.js'
          echo PASS_11_EMULATED_LEGACY_BADGE_GIFT_FRAME_BILLING_BEFORE_LIVE
      - name: Publish exact additive policy only if live source still equals 11-test fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/deda_100377_point01_owner_approved_additive_live_rules_deploy.py
      - name: Preserve private original rules backup for owner rollback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100377-POINT01-LIVE-RULES-PRIVATE-ROLLBACK
          path: /tmp/deda-point01-rollback-private/
          if-no-files-found: warn
          retention-days: 30
      - name: Confirm no APK, app stores or user wallet documents were written
        shell: bash
        run: |
          set -euo pipefail
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          echo PASS_ONLY_APPROVED_FIREBASE_RULESET_WITH_ROLLBACK_NO_APK_NO_PLAY_NO_WALLET_DOCS
