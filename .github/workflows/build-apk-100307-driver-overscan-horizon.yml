name: Build DEDA 100307 Driver Overscan Horizon

on:
  push:
    branches:
      - driver-overscan-horizon-100307-2026-10-08
    paths:
      - '.github/workflows/build-apk-100307-driver-overscan-horizon.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100307 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100307
        run: bash tools/build_100307_driver_overscan_horizon.sh

      - name: Upload APK 100307
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100307-driver-overscan-horizon-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
