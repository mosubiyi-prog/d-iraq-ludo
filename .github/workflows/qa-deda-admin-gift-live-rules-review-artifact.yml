name: DEDA LIVE Gift Rules Protected Review Backup - GET ONLY
on:
  push:
    branches:
      - deda-gift-verify-recipient-friends-safe-2026-10-10
    paths:
      - '.github/workflows/qa-deda-admin-gift-live-rules-review-artifact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-deployed-rules-without-writing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Google Firebase read-only API deps
        run: python3 -m pip install --disable-pip-version-check google-auth requests
      - name: Back up deployed Firebase Rules source in private action ARTIFACT only
        env:
          DEDA_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
          FALLBACK_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          raw=os.environ.get('DEDA_SA') or os.environ.get('FALLBACK_SA')
          if not raw: sys.exit('SAFE_STOP: no read-only credentials')
          info=json.loads(raw)
          if info.get('type')!='service_account':sys.exit('SAFE_STOP: wrong account')
          creds=service_account.Credentials.from_service_account_info(
              info,scopes=['https://www.googleapis.com/auth/cloud-platform'])
          session=AuthorizedSession(creds)
          base='https://firebaserules.googleapis.com/v1/'
          release=session.get(base+'projects/deda-25b88/releases/cloud.firestore',timeout=35)
          release.raise_for_status()
          ruleset=release.json().get('rulesetName','')
          if not ruleset.startswith('projects/deda-25b88/rulesets/'):
              sys.exit('SAFE_STOP: unexpected live ruleset')
          r=session.get(base+ruleset,timeout=35)
          r.raise_for_status()
          live='\n'.join(x.get('content','') for x in
              r.json()['source']['files'] if x.get('name','').endswith('.rules'))
          sha=hashlib.sha256(live.encode()).hexdigest()[:18]
          if sha!='c5b444a132c894e933':
              sys.exit('SAFE_STOP: LIVE RULES CHANGED - re-review before proceeding; read-only')
          if live.count('match /deda_diamond_gifts/{giftId}')!=1:
              sys.exit('SAFE_STOP: unexpected live gift layout')
          out=Path('live-rules-review')
          out.mkdir()
          (out/'firestore.ACTUAL_LIVE_DO_NOT_DEPLOY.rules').write_text(live)
          (out/'LIVE_SHA18.txt').write_text(sha+'\n')
          print('READ_ONLY_LIVE_BACKUP_SHA18:',sha)
          print('Safely captured exact published rules in short-retention review-only Actions artifact')
          print('NO GITHUB SOURCE COMMIT; NO FIREBASE RELEASE / RULESET WRITE')
          PY
      - name: Store PRIVATE repo Actions artifact for review, delete after one day
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-ACTUAL-LIVE-RULES-2026-10-10-READONLY-NO-DEPLOY
          path: live-rules-review/
          retention-days: 1
          if-no-files-found: error
      - name: Safety final
        run: echo 'No Firebase deploy, no APK, no Play release - GET-only rules review'
