name: DEDA 100438 Weekly Hadaya Recipient Claim in Firestore Emulator ONLY (NO PAYOUT)
on:
  push:
    branches:
      - deda-100438-weekly-payout-candidate-no-live-2026-11-06
    paths:
      - '.github/workflows/qa-deda-100438-weekly-hadaya-client-claim-emulator-no-live.yml'
      - 'tests/firestore-rules/weekly-prize-gift-claim-100438.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-emulator-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify no live Firebase credentials, no deployment and no APK change
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          node --check tests/firestore-rules/weekly-prize-gift-claim-100438.test.mjs
          echo 'READ_ONLY_PRODUCTION_EMULATOR_LOCAL_ONLY'
      - name: Test exact weekly_league server-seeded pending gift to هداياي and one-time wallet claim
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests/firestore-rules --no-audit --no-fund
          npm install --prefix tests/firestore-rules --no-audit --no-fund --no-save firebase-tools@14
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-weekly-claim-100438 --only firestore \
            'node --test tests/firestore-rules/weekly-prize-gift-claim-100438.test.mjs'
          echo 'PASS_WEEKLY_HADAYA_OWNER_CLAIM_EMULATOR_ONLY'
      - name: Confirm no real users received gifts from the test
        shell: bash
        run: |
          echo 'NO_PRODUCTION_GIFTS_NO_REAL_DIAMONDS_NO_PLAY_NO_SCHEDULE_ACTIVATION'
