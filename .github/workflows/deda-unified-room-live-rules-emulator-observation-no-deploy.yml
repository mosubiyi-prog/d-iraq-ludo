name: DEDA unified room current LIVE rules semantics on LOCAL emulator READONLY
on:
  push:
    branches:
      - deda-unified-room-authz-scopes-isolated-qa-2026-11-16
    paths:
      - 'qa/unified_room_private/live_rules_semantics_emulator_READONLY.test.cjs'
      - '.github/workflows/deda-unified-room-live-rules-emulator-observation-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe-live-rules-on-fake-data-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEDA_READONLY_SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}"
      DEDA_FALLBACK_SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch only live rules via GET to ephemeral emulator fixture
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import os,json,sys,hashlib,pathlib,requests
          from google.oauth2.service_account import Credentials
          from google.auth.transport.requests import Request
          raw=os.environ.get('DEDA_READONLY_SA') or os.environ.get('DEDA_FALLBACK_SA')
          if not raw:
            print('SAFE_STOP_NO_READONLY_RULES_ACCESS');sys.exit(3)
          data=json.loads(raw)
          if data.get('project_id')!='deda-25b88':
            print('SAFE_STOP_WRONG_PROJECT');sys.exit(3)
          creds=Credentials.from_service_account_info(data,scopes=[
            'https://www.googleapis.com/auth/cloud-platform'])
          creds.refresh(Request());h={'Authorization':'Bearer '+creds.token}
          def get(path):
            x=requests.get('https://firebaserules.googleapis.com/v1/'+path,
              headers=h,timeout=25)
            if x.status_code!=200:
              print('SAFE_STOP_RULES_GET_HTTP',x.status_code);sys.exit(3)
            return x.json()
          release=get('projects/deda-25b88/releases/cloud.firestore')
          name=release.get('rulesetName','')
          if not name.startswith('projects/deda-25b88/rulesets/'):
            print('SAFE_STOP_UNEXPECTED_RULESET');sys.exit(3)
          files=get(name)['source']['files']
          if len(files)!=1:
            print('SAFE_STOP_UNEXPECTED_RULES_FILES');sys.exit(3)
          content=files[0]['content']
          pathlib.Path('/tmp/deda-room-live-rules.rules').write_text(content)
          pathlib.Path('/tmp/deda-room-live-emulator.json').write_text(json.dumps({
            'firestore':{'rules':'/tmp/deda-room-live-rules.rules'},
            'emulators':{'firestore':{'host':'127.0.0.1','port':8088},
                         'ui':{'enabled':False}}
          }))
          print('PASS_PUBLISHED_RULES_GET_ONLY')
          print('LIVE_RULES_SHA256',hashlib.sha256(content.encode()).hexdigest())
          print('NO_USER_DATA_READ_NO_RULES_DEPLOY_NO_FIRESTORE_WRITES')
          PY
      - name: Test current live rule semantics on local synthetic emulator
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund --ignore-scripts --package-lock=false \
            @firebase/rules-unit-testing@4.0.0 firebase@11.10.0
          npx --yes firebase-tools@13.35.1 emulators:exec \
            --project demo-deda-room-live-rules-readonly \
            --config /tmp/deda-room-live-emulator.json \
            --only firestore --non-interactive \
            'node --test qa/unified_room_private/live_rules_semantics_emulator_READONLY.test.cjs'
      - name: Confirm no APK, no Play, no Firestore deploy
        run: echo 'QA_ONLY_READONLY_LIVE_RULES_FETCH_EMULATOR_FAKE_DATA'
