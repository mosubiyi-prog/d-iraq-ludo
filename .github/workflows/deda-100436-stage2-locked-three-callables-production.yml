name: DEDA 100436 Stage2 Three LOCKED Recovery Callables - Owner Authorized LIVE
on:
  push:
    branches:
      - deda-100436-stage2-recovery-buildable-integration-qa-2026-11-05
    paths:
      - '.github/workflows/deda-100436-stage2-locked-three-callables-production.yml'
permissions:
  contents: read
concurrency:
  group: deda-25b88-stage2-three-locked-callables-production
  cancel-in-progress: false
jobs:
  deploy-three-locked-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      DEDA_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin green recovery source and protect approved 100436
        shell: bash
        run: |
          set -euo pipefail
          tested=2d9b807b1ac9e59ac00644e0d08637d866a0e687
          git cat-file -e "$tested^{commit}"
          git diff --exit-code "$tested" HEAD -- functions/ lib/ test/ qa/ firebase.json firestore.rules storage.rules android/ pubspec.yaml
          changed="$(git diff --name-only "$tested" HEAD)"
          test "$changed" = '.github/workflows/deda-100436-stage2-locked-three-callables-production.yml'
          git diff --exit-code fea54d7db2e8a24a74267f04a14c9572bcb408ee HEAD -- \
            firebase.json firestore.rules storage.rules .firebaserc
          test ! -e functions/.env
          test ! -e functions/.env.deda-25b88
          test ! -e functions/.env.production
          test -n "${DEDA_FIREBASE_SA:-}"
          echo 'PASS_EXACT_TESTED_SOURCE_NO_CONFIG_CHANGES'
      - name: Verify callable runtime identity, App Check and production OFF gates
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/index.js
          node --check functions/deda_stage2_runtime_identity.js
          node --check functions/deda_owner_pin_verify_private_v1.js
          node --check functions/deda_linked_owner_session_grant_private_v1.js
          node --check functions/deda_recovery_journal_completion_private_v1.js
          node --test functions/test/deda_stage2_runtime_identity.test.js \
            functions/test/deda_stage2_live_gate.test.js \
            functions/test/deda_owner_pin_verify_private_v1.test.js
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const {stage2LiveGateEnabled}=require('./functions/deda_stage2_live_gate');
          for(const key of ['pinProof','deviceGrant','journal'])
            assert.equal(stage2LiveGateEnabled(key,{
              GOOGLE_CLOUD_PROJECT:'deda-25b88',
              DEDA_STAGE2_LIVE_TARGET_PROJECT:'deda-25b88',
            }),false);
          const {RUNTIME_ACCOUNT,recoveryCallableOptions}=
            require('./functions/deda_stage2_runtime_identity');
          assert.equal(RUNTIME_ACCOUNT,
            'deda-recovery-runtime@deda-25b88.iam.gserviceaccount.com');
          assert.equal(recoveryCallableOptions(30).maxInstances,2);
          assert.equal(recoveryCallableOptions(30).minInstances,0);
          console.log('PASS_NO_LIVE_ROLLOUT_AND_RESTRICTED_RUNTIME');
          NODE
      - name: Use only GitHub's previously approved DEDA service identity
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/deda-stage2-deploy-key.json"
          umask 077
          printf '%s' "$DEDA_FIREBASE_SA" > "$key"
          node - "$key" <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const obj=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          assert.equal(obj.type,'service_account');
          assert.equal(obj.project_id,'deda-25b88');
          assert.equal(obj.client_email,
            'firebase-adminsdk-fbsvc@deda-25b88.iam.gserviceaccount.com');
          console.log('PASS_DEPLOYER_IDENTITY_CORRECT_PROJECT');
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=$key" >> "$GITHUB_ENV"
      - name: Deploy EXACTLY 3 default-DENY Callables - no rules or other functions
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --no-audit --no-fund --ignore-scripts
          npx --yes firebase-tools@13.35.1 deploy \
            --only functions:dedaVerifyExistingOwnerPin,functions:dedaIssueLinkedOriginalUidDeviceGrant,functions:dedaRecoveryJournalComplete \
            --project deda-25b88 \
            --non-interactive
          echo 'PASS_ONLY_THREE_STANDBY_FUNCTIONS_DEPLOY_COMMAND'
      - name: Read back exact live function identities (no customer document reads)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import os,requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          account='deda-recovery-runtime@deda-25b88.iam.gserviceaccount.com'
          creds=service_account.Credentials.from_service_account_file(
            os.environ['GOOGLE_APPLICATION_CREDENTIALS'],
            scopes=['https://www.googleapis.com/auth/cloud-platform'])
          creds.refresh(Request())
          for name in (
              'dedaVerifyExistingOwnerPin',
              'dedaIssueLinkedOriginalUidDeviceGrant',
              'dedaRecoveryJournalComplete'):
              url=('https://cloudfunctions.googleapis.com/v2/projects/'
                'deda-25b88/locations/us-central1/functions/'+name)
              result=requests.get(url,headers={
                'Authorization':'Bearer '+creds.token},timeout=30)
              if result.status_code != 200:
                raise RuntimeError('READBACK_FAILED_'+name+'_HTTP_'+str(result.status_code))
              body=result.json()
              runtime=body.get('serviceConfig',{}).get('serviceAccountEmail')
              state=body.get('state')
              if runtime != account or state != 'ACTIVE':
                raise RuntimeError('READBACK_MISMATCH_'+name+
                  '_STATE_'+str(state)+'_RUNTIME_MATCH_'+str(runtime==account))
              print('PASS_LOCKED_RECOVERY_CALLABLE_DEPLOYED',name)
          print('PASS_THREE_TARGET_FUNCTIONS_ONLY_NO_APK_NO_RULES_NO_WALLET')
          PY
      - name: Delete temporary Google credential from CI
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/deda-stage2-deploy-key.json"
