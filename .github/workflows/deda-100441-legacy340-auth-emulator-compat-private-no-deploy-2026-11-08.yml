name: DEDA 100441 LEGACY 100340 AUTH COMPAT EMULATOR ONLY NO DEPLOY

on:
  push:
    branches:
      - deda-100441-legacy340-auth-emulator-compat-private-no-deploy-2026-11-08
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-100441-legacy340-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-100340-emulator-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-deda-100441-legacy340-anti-split
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove production sources and the protected STOP branch are unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base = "06598cf900f55c9e43b8189fab140765073e8c80"
          names = set(subprocess.check_output(
            ["git", "diff", "--name-only", base, "HEAD"], text=True
          ).splitlines())
          allowed = {
            "tests/firestore-rules/deda_100441_legacy340_auth_anti_split_compat_PRIVATE.test.mjs",
            ".github/workflows/deda-100441-legacy340-auth-emulator-compat-private-no-deploy-2026-11-08.yml",
            "docs/DEDA_100441_LEGACY340_AUTH_COMPAT_EMULATOR_QA_CHECKPOINT_2026-11-08.md",
          }
          assert names and names <= allowed, "UNEXPECTED_FILE_CHANGE:" + str(names - allowed)
          protected = {
            "firestore.rules", "firebase.json", "storage.rules",
            "functions/index.js", "lib/main.dart", "lib/deda_backend.dart",
            "lib/deda_pin_auth.dart", "lib/deda_social_service.dart",
          }
          assert not names & protected, "PRODUCTION_SOURCE_CHANGED"
          print("PASS_BASELINE_06598CF_AND_PRODUCTION_SOURCE_UNCHANGED")
          print("PASS_NO_AUTH_RULES_APP_STORE_OR_WALLET_MUTATIONS")
          PY
          git diff --quiet 3850c93b7a18e11613a951a32dc520701717a263 -- \
            lib/ firestore.rules firebase.json storage.rules functions/index.js

      - name: Verify exact shipped legacy 100340 PIN source provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/deda-100340-play-aab-owner-review-2026-10-15:refs/remotes/origin/deda-100340-play-aab-owner-review-2026-10-15'
          actual="$(git rev-parse refs/remotes/origin/deda-100340-play-aab-owner-review-2026-10-15:lib/deda_pin_auth.dart)"
          test "$actual" = '53754af4cbd6af581c6d229c99780d9481943a14'
          git show 'refs/remotes/origin/deda-100340-play-aab-owner-review-2026-10-15:lib/deda_pin_auth.dart' | python3 -c '
          import sys
          source=sys.stdin.read()
          needed=["signInAnonymously()", "deda_auth_attempts",
                  "deda_sessions", "deda_account_directory",
                  "deda_credentials", "createdUid", "static Future<Map<String, dynamic>> signIn"]
          assert all(x in source for x in needed)
          assert "signInWithEmailAndPassword(" not in source
          print("PASS_100340_REAL_PIN_SOURCE_BLOB_AND_LEGACY_AUTH_CONTRACT")
          '

      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}

      - name: Install local test dependencies only (no service accounts)
        shell: bash
        run: |
          npm install --prefix tests/firestore-rules \
            --no-save --no-audit --no-fund firebase-tools@14

      - name: Run synthetic Firestore rule transactions and anti-split checks on emulator
        shell: bash
        run: |
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100441-legacy340-anti-split \
            --only firestore \
            'node --test tests/firestore-rules/deda_100441_legacy340_auth_anti_split_compat_PRIVATE.test.mjs'

      - name: Re-run separate pure anti-split policy regression tests
        run: node --test functions/test/deda_100441_canonical_uid_anti_split_preflight_PRIVATE.test.js

      - name: Confirm no production wiring, APK or Firebase publication
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'deda_100441_canonical_uid_anti_split_preflight_PRIVATE_NOT_EXPORTED' functions/index.js
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          echo 'PASS_LOCAL_EMULATOR_ONLY_NO_APK_AAB_FIREBASE_DEPLOY_PLAY'
