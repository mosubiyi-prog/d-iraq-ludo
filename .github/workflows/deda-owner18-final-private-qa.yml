name: DEDA 100379 owner18 signed private QA NO PLAY
# Revision 2: reject conflicting original IDs even if an anonymous UID is reused.
on:
  push:
    branches: [deda-100378-owner18-fixes-2026-10-23]
    paths: ['.github/workflows/deda-owner18-final-private-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deda-owner18-final-private-qa
  cancel-in-progress: true
jobs:
  isolated-cosmetics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEDA_STAGE69_PRIMARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      DEDA_STAGE69_SECONDARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pip install google-auth requests
      - name: Prepare only cosmetic backup policy against current live source
        run: |
          python3 tools/deda_owner18_readonly_diagnostics.py
          python3 tools/deda_owner18_cosmetic_rules.py
      - run: npm install --prefix functions --no-save --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Test account isolation and no ownership loss on synthetic data only
        shell: bash
        run: |
          set -euo pipefail
          echo '{"firestore":{"rules":"/tmp/deda-owner18-cosmetics.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080}}}' > /tmp/deda-owner18-firebase.json
          export GCLOUD_PROJECT=demo-deda-owner18-cosmetics
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec --config /tmp/deda-owner18-firebase.json --project demo-deda-owner18-cosmetics --only firestore 'node --test test/deda_owner18_cosmetics_emulator.test.cjs'
      - name: Preserve only tested rule source and hash
        run: |
          mkdir owner18-policy-qa
          cp owner18-diagnostics/active.rules owner18-policy-qa/active.rules
          cp /tmp/deda-owner18-cosmetics.rules owner18-policy-qa/candidate.rules
          cp /tmp/deda-owner18-cosmetics-tests-passed owner18-policy-qa/tested-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DEDA-owner18-policy-QA
          path: owner18-policy-qa/
          retention-days: 7
  private-apk:
    needs: isolated-cosmetics
    runs-on: ubuntu-24.04
    # The EXACT baseline reconstruction validates the original signing
    # configuration even for source-only QA. No APK/AAB is produced here.
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect signing, original APK and released Spark baseline
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet d14e573d1f7f1ab67deff04222aca13c6f928553 -- \
            android/ firebase.json lib/main.dart \
            lib/deda_backend.dart lib/deda_social_service.dart \
            assets/deda_home_bg.jpg assets/deda_login_bg.jpg \
            assets/deda_royal_frames/
          python3 - <<'PY_ORIGINALS'
          import hashlib,json
          from pathlib import Path
          rows=json.loads(Path('docs/DEDA_LAB_16_VERIFIED_FRAME_CATALOG_STAGED_ONLY_2026-10-21.json').read_text())['frames']
          paid=[x for x in rows if x['initial_price_diamonds']==1000]
          assert len(paid)==13
          for item in paid:
            p=Path('assets/deda_lab_frames')/(item['id']+'.webp')
            assert p.stat().st_size==item['bytes']
            assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
          print('PASS native source 13 exact original premium LAB WebPs')
          PY_ORIGINALS
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          test -f lib/deda_qa32_spark_public_identifier_directory.dart
          test -f lib/deda_qa32_public_recipient_resolver.dart
          test -f lib/deda_stage71_free_owned_use_profile.dart
          grep -q 'DEDA_QA32_SPARK_PUBLIC_IDS_LIVE' lib/deda_qa32_spark_public_identifier_directory.dart
          grep -q 'DEDA_QA32_SHARE_TO_VERIFIED_ACTIVE_PREMIUM_ALIAS_CANONICAL_ROUTE' tools/stage_deda_100375_spark_all_routing_on_rebuilt_source.py
          grep -q 'DEDA_QA32_STAGE51_SPARK_FRIEND_INTEGRATES_IN_EXISTING_SEARCH' tools/stage_deda_100375_spark_all_routing_on_rebuilt_source.py
          echo 'PASS original signed app unmodified, owner-approved Spark-only QA'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Reconstruct EXACT approved 100359 generated app, prohibit APK compilation
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python3 -m py_compile tools/qa_reconstruct_100359_then_stage35_no_apk.py
          # Capture the EXACT already-signed 100359 build invocation before
          # the approved no-build reconstruction replaces it with an echo.
          python3 - <<'CAPTURE_SIGNED_SOURCE'
          from pathlib import Path
          p=Path('tools/qa_reconstruct_100359_then_stage35_no_apk.py')
          s=p.read_text()
          needle="    adjusted = original.replace(matches[0],"
          assert s.count(needle)==1, 'SAFE_STOP original signed command capture point moved'
          s=s.replace(needle,
             "    Path('/tmp/deda_stage71_exact_signed_100359_command.txt').write_text(matches[0]+'\\n')\n"
             +needle,1)
          p.write_text(s)
          CAPTURE_SIGNED_SOURCE
          python3 tools/qa_reconstruct_100359_then_stage35_no_apk.py
          test -s /tmp/deda_stage71_exact_signed_100359_command.txt
          bash -e /tmp/deda_100340_play_aab.sh
          grep -q "DEDA_STAGE17_STORE_CARDS_BLUE_OWNED_IDS_2026_10_19" lib/main.dart
          grep -q "DEDA_STAGE31_OWNER_QA_LAUNCH_SANDBOX_ONLY_2026_10_19" lib/main.dart
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          echo 'PASS: actual approved 100359 Flutter UI recreated with NO output APK'
