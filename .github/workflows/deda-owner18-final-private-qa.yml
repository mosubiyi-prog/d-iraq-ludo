          cmd=cmd.replace('--dart-define=DEDA_OWNER_PRIVATE_SANDBOX=true','--dart-define=DEDA_OWNER_PRIVATE_SANDBOX=false',1)
          for flag in ('DEDA_STAGE71_ADMIN200_RULES_AND_PRIVATE_CATALOG_DEPLOYED','DEDA_QA32_SPARK_PUBLIC_IDS_LIVE','DEDA_LAB_FRAME_ATOMIC_CHECKOUT_APPROVED'):
            assert '--dart-define='+flag+'=' not in cmd
            cmd+=' --dart-define='+flag+'=true'
          Path('/tmp/deda-owner18-signed-command.sh').write_text('set -euo pipefail\n'+cmd+'\n')
          print('Original signing path, 100379, manager/public-ID flags ON, fake sandbox OFF')
          PY_BUILD
          bash /tmp/deda-owner18-signed-command.sh
