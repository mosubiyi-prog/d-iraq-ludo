          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          reference=/tmp/deda-reference-100378/app-release.apk
          test -s "$apk"
          test -s "$reference"
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools_dir/apksigner" verify --verbose --print-certs "$reference" > /tmp/deda-reference-signer.txt
          "$tools_dir/apksigner" verify --verbose --print-certs "$apk" > /tmp/deda-owner18-signer.txt
          "$tools_dir/aapt" dump badging "$apk" > /tmp/deda-owner18-package.txt
          python3 - <<'PY_VERIFY'
          import re,zipfile
          from pathlib import Path
          pattern=r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)'
          old=re.search(pattern,Path('/tmp/deda-reference-signer.txt').read_text()).group(1)
          new=re.search(pattern,Path('/tmp/deda-owner18-signer.txt').read_text()).group(1)
          assert old==new,'SIGNATURE_MISMATCH_STOP'
          package=Path('/tmp/deda-owner18-package.txt').read_text()
          assert "package: name='com.diraq.ludo.d_iraq_ludo' versionCode='100379'" in package
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-release.apk') as z:
            assert z.testzip() is None
            for name in ('deda_male_royal_v2.jpg','deda_female_royal_v2.jpg','deda_couple_royal_v2.jpg'):
              assert any(x.endswith(name) for x in z.namelist()),name
          print('PASS original signer matches 100378, package and version valid, all three portraits packaged')
          PY_VERIFY
          mkdir -p owner18-private-apk
          cp "$apk" owner18-private-apk/DEDA-100379-OWNER18-PRIVATE-QA.apk
          cp /tmp/deda-owner18-signer.txt owner18-private-apk/SIGNER.txt
          cp docs/DEDA_OWNER18_CHECKPOINT_2026-10-23.md owner18-private-apk/
          git rev-parse HEAD > owner18-private-apk/source-commit.txt
          sha256sum owner18-private-apk/*.apk > owner18-private-apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DEDA-100379-OWNER18-PRIVATE-QA
          path: owner18-private-apk/
          retention-days: 30
          if-no-files-found: error
  android16-smoke:
    needs: private-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DEDA-100379-OWNER18-PRIVATE-QA
          path: /tmp/deda-owner18-new
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: mosubiyi-prog/d-iraq-ludo
          run-id: 39869442313
          name: DEDA-100378-PRIVATE-APK-UNVERIFIED-13-POINTS
          path: /tmp/deda-owner18-old
      - name: Enable KVM on isolated runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p owner18-smoke
            adb install -r /tmp/deda-owner18-old/app-release.apk
            adb shell monkey -p com.diraq.ludo.d_iraq_ludo -c android.intent.category.LAUNCHER 1
            sleep 12
            adb shell am force-stop com.diraq.ludo.d_iraq_ludo
            adb install -r /tmp/deda-owner18-new/DEDA-100379-OWNER18-PRIVATE-QA.apk
            adb logcat -c
            adb shell monkey -p com.diraq.ludo.d_iraq_ludo -c android.intent.category.LAUNCHER 1
            sleep 18
            adb shell pidof com.diraq.ludo.d_iraq_ludo > owner18-smoke/upgrade-pid.txt
            adb logcat -d > owner18-smoke/upgrade-logcat.txt
            adb exec-out screencap -p > owner18-smoke/upgrade.png
            if rg 'FATAL EXCEPTION|NoSuchMethodError|E/flutter.*Unhandled Exception' owner18-smoke/upgrade-logcat.txt; then exit 1; fi
            adb uninstall com.diraq.ludo.d_iraq_ludo
            adb install /tmp/deda-owner18-new/DEDA-100379-OWNER18-PRIVATE-QA.apk
            adb logcat -c
            adb shell monkey -p com.diraq.ludo.d_iraq_ludo -c android.intent.category.LAUNCHER 1
            sleep 18
            adb shell pidof com.diraq.ludo.d_iraq_ludo > owner18-smoke/cold-start-pid.txt
            adb logcat -d > owner18-smoke/cold-start-logcat.txt
            adb exec-out screencap -p > owner18-smoke/cold-start.png
            if rg 'FATAL EXCEPTION|NoSuchMethodError|E/flutter.*Unhandled Exception' owner18-smoke/cold-start-logcat.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEDA-owner18-Android16-coldstart-and-upgrade
          path: owner18-smoke/
          retention-days: 7
  activate-tested-cosmetic-backup:
    needs: [isolated-cosmetics, private-apk, android16-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEDA_STAGE69_PRIMARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      DEDA_STAGE69_SECONDARY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-auth requests
      - uses: actions/download-artifact@v4
        with:
          name: DEDA-owner18-policy-QA
          path: owner18-policy-qa
      - name: Enable only the tested cosmetic backup after successful signed app QA
        run: |
          set -euo pipefail
          mkdir -p owner18-diagnostics
          cp owner18-policy-qa/active.rules owner18-diagnostics/active.rules
          cp owner18-policy-qa/candidate.rules /tmp/deda-owner18-cosmetics.rules
          cp owner18-policy-qa/tested-sha256.txt /tmp/deda-owner18-cosmetics-tests-passed
          python3 tools/deda_owner18_cosmetic_rules.py --deploy
      - uses: actions/upload-artifact@v4
        with:
          name: DEDA-owner18-cosmetic-policy-rollback-reference
          path: owner18-diagnostics/cosmetic-policy-release.json
          retention-days: 30
