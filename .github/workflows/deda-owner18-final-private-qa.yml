        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: mosubiyi-prog/d-iraq-ludo
          run-id: 39869442313
          name: DEDA-100378-PRIVATE-APK-UNVERIFIED-13-POINTS
          path: /tmp/deda-reference-100378
      - name: Build 100379 using the original signing configuration and explicit feature flags
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_BUILD'
          from pathlib import Path
          source=Path('/tmp/deda_stage71_exact_signed_100359_command.txt').read_text().strip()
          assert source.startswith('flutter build apk --release --build-number=100359 ')
          cmd=source.replace('--build-number=100359','--build-number=100379',1)
          for required in ('USE_NEXT_GEN_SDK=true','DEDA_SPARK_FIRESTORE_LIVE=true','DEDA_PREMIUM_IDS_SERVER_LIVE=false','DEDA_PREMIUM_ALIAS_ROUTING_LIVE=false','DEDA_OWNER_PRIVATE_SANDBOX=true'):
