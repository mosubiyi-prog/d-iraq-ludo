name: Trigger Rescue 100281 APK

on:
  push:
    branches:
      - rescue-100281-from-100279-2026-10-06
    paths:
      - .github/workflows/rescue-100281-trigger.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing DEDA APK workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo mosubiyi-prog/d-iraq-ludo --ref rescue-100281-from-100279-2026-10-06
