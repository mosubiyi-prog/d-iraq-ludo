name: DEDA Stage03 MANUAL trusted synthetic fixture lab WIF ONLY
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type LAB_SYNTHETIC_ONLY to authorize the fixed fixture'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: deda-stage03-trusted-fixture
  cancel-in-progress: false
jobs:
  fixture:
    if: github.ref == 'refs/heads/deda-100451-owner-admin-session-safe-repair-2026-11-20' && inputs.confirmation == 'LAB_SYNTHETIC_ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test exact fixture and install Admin SDK before authentication
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/stage03-trusted-fixture"
          mkdir -p "$work"
          cp qa/stage03/uid-trusted-fixture.cjs qa/stage03/uid-trusted-fixture.test.cjs qa/stage03/uid-trusted-live-fixture.cjs qa/stage03/uid-ownership-projection.cjs tools/app_stability/progress_archive/{reconcile-core,reconcile-store,purchase-frames}.cjs functions/deda_weekly_direct_prize_plan.js "$work/"
          cd "$work"
          node --test uid-trusted-fixture.test.cjs
          npm install --no-audit --no-fund --ignore-scripts --no-package-lock firebase-admin@13.0.0
          node --check uid-trusted-live-fixture.cjs
      - name: Dedicated lab-only keyless identity
        uses: google-github-actions/auth@v2
        with:
          project_id: deda-qa-uid-lab-20261108
          workload_identity_provider: projects/180856267046/locations/global/workloadIdentityPools/deda-stage03-lab/providers/github
          service_account: deda-stage03-lab-writer@deda-qa-uid-lab-20261108.iam.gserviceaccount.com
          create_credentials_file: true
          cleanup_credentials: true
      - name: Fixed synthetic fixture transaction only, no deploy
        env:
          GCLOUD_PROJECT: deda-qa-uid-lab-20261108
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/stage03-trusted-fixture"
          node uid-trusted-live-fixture.cjs
