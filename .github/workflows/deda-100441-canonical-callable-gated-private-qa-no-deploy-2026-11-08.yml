name: DEDA 100441 PRIVATE CANONICAL UID CALLABLE GATED QA NO DEPLOY

on:
  push:
    branches:
      - deda-100441-server-canonical-callable-private-gated-no-deploy-2026-11-08
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-100441-callable-off-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-auth-review-callable-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-deda-100441-legacy340-anti-split
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Guard base and production immutability before running anything
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          stop = "3850c93b7a18e11613a951a32dc520701717a263"
          base = "5edf245ad6a5125967fffaab088c1ad0d4de2a39"
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"], text=True
          ).splitlines())
          allowed = {
              "functions/deda_100441_canonical_uid_preflight_callable_PRIVATE_NOT_EXPORTED.js",
              "functions/test/deda_100441_canonical_uid_preflight_callable_PRIVATE.test.js",
              "functions/test/deda_100441_canonical_uid_preflight_callable_EMULATOR_ONLY.test.js",
              ".github/workflows/deda-100441-canonical-callable-gated-private-qa-no-deploy-2026-11-08.yml",
              "docs/DEDA_100441_PRIVATE_CANONICAL_UID_CALLABLE_GATED_QA_CHECKPOINT_2026-11-08.md",
          }
          assert changed and changed <= allowed, "UNEXPECTED_CHANGED_FILES:" + str(changed-allowed)
          subprocess.check_call(["git","merge-base","--is-ancestor",stop,"HEAD"])
          print("PASS_ADDITIVE_ISOLATED_CALLABLE_ONLY_BASE_5EDF245")
          PY
          git diff --quiet 3850c93b7a18e11613a951a32dc520701717a263 -- \
            lib/ firestore.rules firebase.json storage.rules functions/index.js android/ assets/
          test ! -f build/app/outputs/flutter-apk/app-release.apk

      - name: Ensure zero production wiring and private factory defaults to OFF
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/deda_100441_canonical_uid_preflight_callable_PRIVATE_NOT_EXPORTED.js
          node --check functions/test/deda_100441_canonical_uid_preflight_callable_PRIVATE.test.js
          node --check functions/test/deda_100441_canonical_uid_preflight_callable_EMULATOR_ONLY.test.js
          ! grep -Fq 'deda_100441_canonical_uid_preflight_callable_PRIVATE_NOT_EXPORTED' functions/index.js
          node - <<'NODE'
          const api = require('./functions/deda_100441_canonical_uid_preflight_callable_PRIVATE_NOT_EXPORTED.js');
          const keys = Object.keys(api).sort();
          if (JSON.stringify(keys) !== JSON.stringify([
            'consumeAccountScopedLimit',
            'createPrivateCanonicalUidPreflightCallable',
          ])) throw Error('UNEXPECTED_PUBLIC_API');
          NODE
          echo PASS_NOT_EXPORTED_FROM_INDEX_NO_LIVE_CALLABLE

      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}

      - name: Check Callable gate + previous canonical UID safeguards
        shell: bash
        run: |
          set -euo pipefail
          node --test functions/test/deda_100441_canonical_uid_preflight_callable_PRIVATE.test.js
          node --test functions/test/deda_100441_server_canonical_uid_read_adapter_PRIVATE.test.js
          node --test functions/test/deda_100441_canonical_uid_anti_split_preflight_PRIVATE.test.js

      - name: Install localhost-only emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests/firestore-rules --no-save --no-audit --no-fund firebase-tools@14
          npm install --prefix functions --no-save --no-audit --no-fund firebase@12.3.0

      - name: Verify actual legacy 100340 Firestore rule compatibility again
        shell: bash
        run: |
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100441-legacy340-anti-split \
            --only firestore \
            'node --test tests/firestore-rules/deda_100441_legacy340_auth_anti_split_compat_PRIVATE.test.mjs'

      - name: Verify genuine local Auth tokens with existing server adapter
        shell: bash
        run: |
          set -euo pipefail
          export FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          export GCLOUD_PROJECT=demo-deda-100441-server-auth-read-integration
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --config firebase.100441.server-emulators.qa.json \
            --project demo-deda-100441-server-auth-read-integration \
            --only auth,firestore \
            'node --test functions/test/deda_100441_server_canonical_uid_actual_auth_firestore_EMULATOR_ONLY.test.js'

      - name: Verify new private Callable handler with real localhost Auth and Firestore
        shell: bash
        run: |
          set -euo pipefail
          export FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          export GCLOUD_PROJECT=demo-deda-100441-canonical-callable-qa
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --config firebase.100441.server-emulators.qa.json \
            --project demo-deda-100441-canonical-callable-qa \
            --only auth,firestore \
            'node --test functions/test/deda_100441_canonical_uid_preflight_callable_EMULATOR_ONLY.test.js'

      - name: Final strict NO DEPLOY and NO ACCOUNT DATA MUTATION verification
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 3850c93b7a18e11613a951a32dc520701717a263 -- \
            lib/ firestore.rules firebase.json storage.rules functions/index.js android/ assets/
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          echo PASS_NO_PRODUCTION_AUTH_RULES_WRITES_APP_RELEASE_OR_PLAY
