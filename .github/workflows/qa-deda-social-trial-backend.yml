name: DEDA Social Trial Backend - AUTH + MIDNIGHT - NO DEPLOY

on:
  push:
    branches:
      - deda-trial-live-scheduling-100326-2026-10-09
    paths:
      - '.github/workflows/qa-deda-social-trial-backend.yml'
      - 'functions/deda_social_trial_runtime.js'
      - 'functions/index.js'
      - 'functions/deda_social_task_stage2.js'
      - 'firestore.rules'
      - 'tests/stage2_social/trial_runtime.test.cjs'
      - 'tests/firestore-rules/social-trial-security.test.mjs'

permissions:
  contents: read

jobs:
  emulator-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GCLOUD_PROJECT: demo-deda-social-trial-live-rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator test dependencies
        run: |
          npm --prefix functions install --no-audit --no-fund
          npm --prefix tests/firestore-rules install --no-audit --no-fund
      - name: Static server guards
        run: |
          node --check functions/index.js
          grep -q 'actor.data.role !== "general_manager"' functions/index.js
          node --check functions/deda_social_trial_runtime.js
          node --check tests/stage2_social/trial_runtime.test.cjs
          grep -q 'rewardsEnabled: false' functions/deda_social_trial_runtime.js
          ! grep -q 'collection("users")' functions/deda_social_trial_runtime.js
          ! grep -q 'collection("admin_wallets")' functions/deda_social_trial_runtime.js
      - name: Verified server and policy unit tests
        run: |
          node --test tests/stage2_social/social_policy.test.cjs tests/stage2_social/trial_runtime.test.cjs
      - name: Firebase Firestore security emulator
        run: |
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-deda-social-trial-live-rules "node --test tests/firestore-rules/social-trial-security.test.mjs"
      - name: No user balance or production writes
        run: |
          echo 'TRIAL_CONFIG_ONLY: Firebase production, wallets and Google Play were not changed'
