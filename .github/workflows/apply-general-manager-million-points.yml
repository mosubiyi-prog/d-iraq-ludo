name: Apply general-manager million points

on:
  workflow_dispatch:
  push:
    branches:
      - next-points-map-profile-2026-09-30
    paths:
      - tools/deda_general_manager_million_points_2026_09_30.py
      - .github/workflows/apply-general-manager-million-points.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout next DEDA branch
        uses: actions/checkout@v4
        with:
          ref: next-points-map-profile-2026-09-30
          fetch-depth: 0

      - name: Apply protected manager bonus patch
        run: python3 tools/deda_general_manager_million_points_2026_09_30.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze changed Dart sources
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/main.dart lib/deda_backend.dart

      - name: Commit validated source changes
        run: |
          if git diff --quiet -- lib/main.dart lib/deda_backend.dart; then
            echo "No source changes were needed."
            exit 0
          fi
          git config user.name "DEDA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/main.dart lib/deda_backend.dart
          git commit -m "Add protected general-manager million-point bonus"
          git push origin HEAD:next-points-map-profile-2026-09-30
