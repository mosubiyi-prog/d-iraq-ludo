name: DEDA isolated app stability baseline and read pilot NO APK NO DEPLOY
on:
  push:
    branches: [deda-app-stability-isolated-2026-10-23]
    paths:
      - 'lib/deda_protected_section_entry.dart'
      - 'test/deda_protected_section_entry_test.dart'
      - 'test/deda_location_section_entry_test.dart'
      - 'lib/deda_lazy_section_stack.dart'
      - 'test/deda_lazy_section_stack_test.dart'
      - 'lib/deda_auth_session_runtime.dart'
      - 'lib/deda_published_place_recovery.dart'
      - 'test/deda_published_place_recovery_test.dart'
      - 'test/deda_auth_session_runtime_test.dart'
      - 'tools/app_stability/**'
      - 'tools/restore_deda_stability_baseline.py'
      - 'lib/deda_stability_read_scope.dart'
      - 'lib/deda_startup_measurements.dart'
      - 'lib/deda_session_transition_gate.dart'
      - 'lib/deda_session_flow_prototype.dart'
      - 'lib/deda_owner_session_firebase_port.dart'
      - 'lib/deda_admin_session_firebase_adapter.dart'
      - 'lib/deda_legacy_progress_capture.dart'
      - 'lib/deda_progress_evidence_store.dart'
      - 'lib/deda_progress_backup_coordinator.dart'
      - 'lib/deda_progress_backup_runtime.dart'
      - 'test/deda_progress_backup_runtime_test.dart'
      - 'test/deda_progress_backup_driver_test.dart'
      - 'test/deda_progress_backup_coordinator_test.dart'
      - 'test/deda_progress_evidence_store_test.dart'
      - 'test/deda_legacy_progress_capture_test.dart'
      - 'test/deda_admin_session_firebase_adapter_test.dart'
      - 'lib/deda_session_principal_tracker.dart'
      - 'test/deda_owner_session_firebase_port_test.dart'
      - 'test/deda_session_flow_prototype_test.dart'
      - 'test/deda_session_transition_gate_test.dart'
      - 'test/deda_startup_measurements_test.dart'
      - 'lib/deda_qa32_active_account_scope.dart'
      - 'test/deda_stability_read_scope_test.dart'
      - 'test/deda_stability_identity_lifecycle_test.dart'
      - '.github/workflows/deda-app-stability-source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-isolated-stability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, pilot, measured-pilot, auth-bound]
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify immutable restoration and refusal to overwrite work
        run: python3 -m unittest discover -s tools/app_stability/tests -v
      - name: Restore hash-verified source without Android or signing files
        run: |
          if [ '${{ matrix.mode }}' = auth-bound ]; then
            python3 tools/restore_deda_stability_baseline.py "$RUNNER_TEMP/deda-stability" --auth-runtime --pilot --startup-metrics --admin-firebase-adapter --progress-backup-runtime --section-entry
          elif [ '${{ matrix.mode }}' = measured-pilot ]; then
            python3 tools/restore_deda_stability_baseline.py "$RUNNER_TEMP/deda-stability" --pilot --startup-metrics --session-gate --session-flow --owner-firebase-port --admin-firebase-adapter --legacy-progress-capture --progress-evidence-store --progress-backup-coordinator --progress-backup-runtime --lazy-sections
          elif [ '${{ matrix.mode }}' = pilot ]; then
            python3 tools/restore_deda_stability_baseline.py "$RUNNER_TEMP/deda-stability" --pilot
          else
            python3 tools/restore_deda_stability_baseline.py "$RUNNER_TEMP/deda-stability"
          fi
          test ! -e "$RUNNER_TEMP/deda-stability/android"
          test ! -e "$RUNNER_TEMP/deda-stability/firebase.json"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
      - name: Resolve pinned package versions
        working-directory: ${{ runner.temp }}/deda-stability
        run: flutter pub get --enforce-lockfile
      - name: Analyze source and run preserved account, ownership and UI checks
        working-directory: ${{ runner.temp }}/deda-stability
        run: |
          set -euo pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/main.dart lib/deda_qa32_active_account_scope.dart lib/deda_six_active_identity.dart
          flutter test --no-pub --dart-define=DEDA_QA32_SPARK_PUBLIC_IDS_LIVE=true --dart-define=DEDA_STABILITY_IDENTITY_PILOT=${{ matrix.mode != 'baseline' }} --dart-define=DEDA_STABILITY_LAZY_SECTIONS=${{ matrix.mode == 'measured-pilot' }} --reporter expanded \
            test/deda_qa32_active_account_scope_test.dart \
            test/deda_six_notes_test.dart \
            test/deda_six_badge_visual_test.dart \
            test/deda_owner18_original_account_proof_test.dart \
            test/deda_owner18_level_badges_test.dart \
            test/deda_owner18_avatar_editor_test.dart \
            test/deda_sticky_edit_preview_100343_test.dart \
            test/deda_royal_avatar_choice_100341_test.dart
      - name: Verify actual auth source wiring and complete shared lanes
        timeout-minutes: 4
        if: matrix.mode == 'auth-bound'
        working-directory: ${{ runner.temp }}/deda-stability
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/main.dart lib/admin_pages.dart lib/deda_backend.dart lib/deda_pin_auth.dart
          flutter analyze --no-pub --fatal-infos lib/deda_auth_session_runtime.dart lib/deda_published_place_recovery.dart test/deda_auth_session_runtime_test.dart test/deda_published_place_recovery_test.dart
          flutter test --no-pub --timeout 20s --dart-define=DEDA_STABILITY_AUTH_RUNTIME=true --reporter expanded test/deda_auth_session_runtime_test.dart test/deda_published_place_recovery_test.dart
      - name: Verify bound social section entry, timeout and actual failed-page retry UI
        timeout-minutes: 4
        if: matrix.mode == 'auth-bound'
        working-directory: ${{ runner.temp }}/deda-stability
        run: |
          flutter analyze --no-pub --fatal-infos lib/deda_protected_section_entry.dart test/deda_protected_section_entry_test.dart
          flutter test --no-pub --timeout 20s --dart-define=DEDA_STABILITY_AUTH_RUNTIME=true --dart-define=DEDA_STABILITY_SECTION_ENTRY=true --reporter expanded test/deda_protected_section_entry_test.dart
          flutter analyze --no-pub --fatal-infos test/deda_location_section_entry_test.dart
          flutter test --no-pub --timeout 20s --reporter expanded test/deda_location_section_entry_test.dart
      - name: Exercise read coordination with delayed and failed fake requests only
        timeout-minutes: 3
        if: matrix.mode == 'pilot' || matrix.mode == 'measured-pilot'
        working-directory: ${{ runner.temp }}/deda-stability
        run: |
          flutter analyze --no-pub --fatal-infos lib/deda_stability_read_scope.dart lib/deda_qa32_active_account_scope.dart test/deda_stability_read_scope_test.dart test/deda_stability_identity_lifecycle_test.dart
          flutter test --no-pub --timeout 20s --dart-define=DEDA_STABILITY_IDENTITY_PILOT=true --reporter expanded test/deda_stability_read_scope_test.dart test/deda_stability_identity_lifecycle_test.dart
      - name: Verify lazy social tab entry and retained visited state
        timeout-minutes: 3
        if: matrix.mode == 'measured-pilot'
        working-directory: ${{ runner.temp }}/deda-stability
        run: |
          flutter analyze --no-pub --fatal-infos lib/deda_lazy_section_stack.dart test/deda_lazy_section_stack_test.dart
          flutter test --no-pub --dart-define=DEDA_STABILITY_LAZY_SECTIONS=true --reporter expanded test/deda_lazy_section_stack_test.dart
      - name: Verify bound backup runtime, account epochs and lifecycle without live Firebase
        timeout-minutes: 3
        if: matrix.mode == 'measured-pilot'
        working-directory: ${{ runner.temp }}/deda-stability
        run: |
          flutter analyze --no-pub --fatal-infos lib/deda_progress_backup_runtime.dart test/deda_progress_backup_runtime_test.dart test/deda_progress_backup_driver_test.dart
          flutter test --no-pub --timeout 20s --reporter expanded test/deda_progress_backup_runtime_test.dart test/deda_progress_backup_driver_test.dart
      - name: Verify startup measurement order, failure policy and first-frame observer
        timeout-minutes: 3
        if: matrix.mode == 'measured-pilot'
        working-directory: ${{ runner.temp }}/deda-stability
        run: |
          flutter analyze --no-pub --fatal-infos lib/deda_startup_measurements.dart test/deda_startup_measurements_test.dart
          flutter test --no-pub --timeout 20s --dart-define=DEDA_STABILITY_STARTUP_METRICS=true --reporter expanded test/deda_startup_measurements_test.dart
      - name: Verify unwired session gate with simulated SDK operations only
        timeout-minutes: 3
        if: matrix.mode == 'measured-pilot'
        working-directory: ${{ runner.temp }}/deda-stability
        run: |
          flutter analyze --no-pub --fatal-infos lib/deda_session_transition_gate.dart test/deda_session_transition_gate_test.dart
          flutter test --no-pub --timeout 20s --reporter expanded test/deda_session_transition_gate_test.dart
      - name: Verify complete owner and admin flow prototype with fake ports only
        timeout-minutes: 3
        if: matrix.mode == 'measured-pilot'
        working-directory: ${{ runner.temp }}/deda-stability
        run: |
          flutter analyze --no-pub --fatal-infos lib/deda_session_flow_prototype.dart test/deda_session_flow_prototype_test.dart
          flutter test --no-pub --timeout 20s --reporter expanded test/deda_session_flow_prototype_test.dart
      - name: Verify unwired owner Firebase adapter with fake transport and local preferences
        timeout-minutes: 3
        if: matrix.mode == 'measured-pilot'
        working-directory: ${{ runner.temp }}/deda-stability
        run: |
          flutter analyze --no-pub --fatal-infos lib/deda_session_principal_tracker.dart lib/deda_owner_session_firebase_port.dart test/deda_owner_session_firebase_port_test.dart
          flutter test --no-pub --timeout 20s --reporter expanded test/deda_owner_session_firebase_port_test.dart
      - name: Verify unwired admin login and authorization boundaries with fake IO only
        timeout-minutes: 3
        if: matrix.mode == 'measured-pilot'
        working-directory: ${{ runner.temp }}/deda-stability
        run: |
          flutter analyze --no-pub --fatal-infos lib/deda_admin_session_firebase_adapter.dart test/deda_admin_session_firebase_adapter_test.dart
          flutter test --no-pub --timeout 20s --reporter expanded test/deda_admin_session_firebase_adapter_test.dart
      - name: Verify lossless read-only legacy progress capture with isolated local preferences
        timeout-minutes: 3
        if: matrix.mode == 'measured-pilot'
        working-directory: ${{ runner.temp }}/deda-stability
        run: |
          flutter analyze --no-pub --fatal-infos lib/deda_legacy_progress_capture.dart test/deda_legacy_progress_capture_test.dart
          flutter test --no-pub --timeout 20s --reporter expanded test/deda_legacy_progress_capture_test.dart
      - name: Verify lossless purchase journals and isolated sidecar archive without live SDK effects
        timeout-minutes: 3
        if: matrix.mode == 'measured-pilot'
        working-directory: ${{ runner.temp }}/deda-stability
        run: |
          flutter analyze --no-pub --fatal-infos lib/deda_legacy_purchase_evidence.dart test/deda_legacy_purchase_evidence_test.dart
          flutter test --no-pub --timeout 20s --reporter expanded test/deda_legacy_purchase_evidence_test.dart
      - name: Verify unwired immutable evidence store with simulated server IO only
        timeout-minutes: 3
        if: matrix.mode == 'measured-pilot'
        working-directory: ${{ runner.temp }}/deda-stability
        run: |
          flutter analyze --no-pub --fatal-infos lib/deda_progress_evidence_store.dart test/deda_progress_evidence_store_test.dart
          flutter test --no-pub --timeout 20s --reporter expanded test/deda_progress_evidence_store_test.dart
      - name: Verify pending capture journal and uncertain-write recovery with simulated server IO
        timeout-minutes: 3
        if: matrix.mode == 'measured-pilot'
        working-directory: ${{ runner.temp }}/deda-stability
        run: |
          flutter analyze --no-pub --fatal-infos lib/deda_progress_backup_coordinator.dart test/deda_progress_backup_coordinator_test.dart test/deda_purchase_backup_coordinator_test.dart
          flutter test --no-pub --timeout 20s --reporter expanded test/deda_progress_backup_coordinator_test.dart test/deda_purchase_backup_coordinator_test.dart
      - name: Verify no installable application was produced
        if: always()
        run: |
          test ! -e "$RUNNER_TEMP/deda-stability/build/app/outputs/flutter-apk/app-release.apk"
          test ! -e "$RUNNER_TEMP/deda-stability/build/app/outputs/bundle/release/app-release.aab"

  progress-archive-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated pinned emulator test tools only
        run: |
          mkdir -p "$RUNNER_TEMP/progress-rules-qa"
          npm install --prefix "$RUNNER_TEMP/progress-rules-qa" --no-save --no-audit --no-fund firebase@11.10.0 @firebase/rules-unit-testing@4.0.0 firebase-tools@13.35.1 firebase-admin@13.0.0
      - name: Verify trusted reconciliation core without SDK or credentials
        run: node --test tools/app_stability/progress_archive/reconcile-core.test.cjs tools/app_stability/progress_archive/migration-gate.test.cjs tools/app_stability/progress_archive/migration-assessment.test.cjs tools/app_stability/progress_archive/baseline-review.test.cjs tools/app_stability/progress_archive/legacy-operation-review.test.cjs tools/app_stability/progress_archive/purchase-evidence.test.cjs tools/app_stability/progress_archive/point-tier-carryover.test.cjs
      - name: Verify candidate archive and reconciliation with localhost demo project only NO DEPLOY
        timeout-minutes: 8
        run: |
          export NODE_PATH="$RUNNER_TEMP/progress-rules-qa/node_modules"
          "$RUNNER_TEMP/progress-rules-qa/node_modules/.bin/firebase" emulators:exec --only auth,firestore --project demo-deda-progress-archive --config tools/app_stability/progress_archive/firebase.json 'node --test --test-concurrency=1 tools/app_stability/progress_archive/rules.test.cjs tools/app_stability/progress_archive/reconcile-emulator.test.cjs'
