name: DEDA original 100396 real account-scored owner 100397 APK private QA (NO Firebase deploy)
on:
  push:
    branches:
      - deda-100396-real-weekly-scores-owner-apk-private-qa-2026-10-30
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deda-100397-real-weekly-owner-private-qa
  cancel-in-progress: true
jobs:
  original-100396-backend-and-integrity-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify neither original sources nor wallet and server are modified
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet b180af357722a75ead6d2b1ade1bfe9189de58cb -- lib/main.dart lib/admin_pages.dart lib/deda_backend.dart lib/deda_social_service.dart lib/deda_admin_league_page.dart lib/deda_weekly_qa_full_trial.dart functions/index.js firestore.rules firebase.json pubspec.yaml pubspec.lock google-services.json
          python3 -m py_compile tools/app_stability/app_package/bind_weekly_admin_league_stage27.py
          python3 -m py_compile tools/app_stability/app_package/bind_weekly_private_trial_stage17.py
          python3 -m py_compile tools/app_stability/app_package/bind_weekly_tasks_cta_stage28.py
          python3 -m unittest discover -s tools/app_stability/tests -p 'test_weekly_stage28_tasks_cta_original_route.py' -v
          python3 -m unittest discover -s tools/app_stability/tests -p 'test_weekly_stage27_original_admin_binder.py' -v
          python3 -m unittest discover -s tools/app_stability/tests -p 'test_weekly_stage13_original_signed_candidate.py' -v
          python3 -m unittest discover -s tools/app_stability/tests -p 'test_weekly_stage18_original_full_owner_qa.py' -v
          python3 -m unittest discover -s tools/app_stability/tests -p 'test_weekly_stage19_rank_card_tap.py' -v
          node --test functions/tests/deda_weekly_monthly_top10_archive.test.js
          git diff --quiet 79b2455dd2ab6efb94219b3f4f68276c39ae139d HEAD -- lib/main.dart lib/deda_weekly_leaderboard_page.dart lib/deda_weekly_leaderboard_safe_screen.dart lib/deda_pin_auth.dart android/ assets/ firestore.rules firebase.json pubspec.yaml pubspec.lock
          node --check functions/deda_weekly_owner_live_pilot_core.js
          node --check functions/deda_weekly_owner_live_pilot.js
          node --test functions/tests/deda_weekly_owner_live_pilot_core.test.cjs
          python3 -m py_compile tools/app_stability/app_package/bind_weekly_100397_owner_real_scores.py
          echo "Original verified 100396 and all wallet/task/UI files untouched"
  owner-real-100397-signed-private-apk:
    needs: original-100396-backend-and-integrity-qa
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: mosubiyi-prog/d-iraq-ludo
          run-id: 39948539871
          name: DEDA-100379-OWNER18-PRIVATE-QA
          path: ${{ runner.temp }}/deda-original-reference
      - name: Restore original signed 100396 including validated leaderboard and task button
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.diraq.ludo --project-name d_iraq_ludo "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/prepare.py "$RUNNER_TEMP/deda-original-100396" --variant candidate
          python3 tools/app_stability/app_package/bind_weekly_stage13.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_active_id_boot_prewarm_stage14.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_active_id_measured_startup_stage16.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_private_trial_stage17.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_full_qa_stage18.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/verify_rank_card_tap_stage19.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_admin_league_stage27.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_tasks_cta_stage28.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_100397_owner_real_scores.py "$RUNNER_TEMP/deda-original-100396"
      - name: Verify genuine administration integration, full Flutter compile and lab regressions
        working-directory: ${{ runner.temp }}/deda-original-100396
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          # Catch missing transitive imports BEFORE the expensive signed APK
          # build; Stage22 competitor/tap dependencies must be present.
          test -s lib/deda_weekly_competitor_public_card.dart
          test -s lib/deda_weekly_leaderboard_tap_surface.dart
          dart analyze lib/deda_admin_league_page.dart lib/deda_weekly_leaderboard_page.dart lib/deda_weekly_leaderboard_safe_screen.dart lib/deda_weekly_competitor_public_card.dart lib/deda_weekly_leaderboard_tap_surface.dart lib/deda_weekly_snapshot_decode.dart lib/deda_weekly_account_view_gate.dart lib/deda_weekly_owner_pilot_bridge.dart
          cp "$GITHUB_WORKSPACE/test/deda_admin_league_page_stage26_test.dart" test/
          cp "$GITHUB_WORKSPACE/test/deda_weekly_qa_full_trial_test.dart" test/
          cp "$GITHUB_WORKSPACE/test/deda_weekly_stage28_tasks_cta_navigation_test.dart" test/
          flutter test test/deda_admin_league_page_stage26_test.dart --no-pub
          flutter test test/deda_weekly_qa_full_trial_test.dart --no-pub
          flutter test test/deda_weekly_stage28_tasks_cta_navigation_test.dart --no-pub
          dart run flutter_launcher_icons
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          datafile=Path('internal-build-inputs.json')
          data=json.loads(datafile.read_text())
          assert data['package']=='com.diraq.ludo.d_iraq_ludo'
          assert data['versionCode']==100397
          assert data['weeklyStage13']['realRankingsAvailable'] is False
          assert data['weeklyStage17']['realPrizesCredited'] is False
          assert data['weeklyStage18']['writesFirestore'] is False
          assert data['weeklyStage19']['walletOrXpModified'] is False
          assert data['weeklyStage27']['adminLeagueTileInOriginal'] is True
          assert data['weeklyStage27']['adminGeneralManagerOnly'] is True
          assert data['weeklyStage27']['liveLeagueControlsEnabled'] is False
          assert data['weeklyStage27']['actualPrizePayoutEnabled'] is False
          assert data['weeklyStage27']['writesRealXP'] is False
          assert data['weeklyStage27']['writesRealDiamonds'] is False
          assert data['weeklyStage29']['bothOfficialHomeLayouts'] is True
          assert data['weeklyStage29']['originalDailyTasksNavigation'] is True
          assert data['weeklyStage29']['taskClaimChanged'] is False
          assert data['weeklyStage29']['userXPChanged'] is False
          assert data['weeklyStage29']['walletChanged'] is False
          assert data['weekly100397OwnerRealScoresQA']['source100396ShaVerified'] is True
          assert data['weekly100397OwnerRealScoresQA']['twoOriginalLeaderboardRoutes']==2
          assert data['weekly100397OwnerRealScoresQA']['sameWalletAndDiamonds'] is True
          assert data['weekly100397OwnerRealScoresQA']['realPrizesEnabled'] is False
          assert data['weekly100397OwnerRealScoresQA']['sharedFirebaseScoringRequiresBackendDeployment'] is True
          assert data['completeOwnerDelivery'] is False
          assert data['financialRestoreEnabled'] is False
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          assert manifest.read_text().count('ca-app-pub-2512641627784244~4635932278')==1
          data['platformHashes'][str(manifest)]=hashlib.sha256(manifest.read_bytes()).hexdigest()
          datafile.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Restore original official signing key inside private temporary runner
        working-directory: ${{ runner.temp }}/deda-original-100396
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools/restore_signing_key_2026_10_02.py"
          keytool -list -keystore android/app/deda-release.jks -storepass "$DEDA_STORE_PASSWORD" -alias "$DEDA_KEY_ALIAS" >/dev/null
      - name: Compile signed same-package owner-only version 100397 — NEVER DEPLOY
        working-directory: ${{ runner.temp }}/deda-original-100396
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          data=json.loads(Path('internal-build-inputs.json').read_text())
          assert data['versionCode']==100397
          assert data['completeOwnerDelivery'] is False
          assert data['financialRestoreEnabled'] is False
          assert data['weeklyStage27']['privateQaOnly'] is True
          assert data['weeklyStage29']['privateQaOnly'] is True
          command=['flutter','build','apk','--release','--build-number=100397','--no-pub']
          command += ['--dart-define='+k+'='+str(v).lower() for k,v in data['flags'].items()]
          subprocess.run(command,check=True)
          PY
      - name: Verify original package identity, signer, assets and exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deda-stage29-100397-artifact"
          python3 tools/app_stability/app_package/verify.py             "$RUNNER_TEMP/deda-original-100396"             "$RUNNER_TEMP/deda-original-reference/DEDA-100379-OWNER18-PRIVATE-QA.apk"             --output "$RUNNER_TEMP/deda-stage29-100397-artifact/verification.json"
          cp "$RUNNER_TEMP/deda-original-100396/build/app/outputs/flutter-apk/app-release.apk"             "$RUNNER_TEMP/deda-stage29-100397-artifact/DEDA-100397-REAL-WEEKLY-SCORES-OWNER-PRIVATE-QA.apk"
          sha256sum "$RUNNER_TEMP/deda-stage29-100397-artifact/DEDA-100397-REAL-WEEKLY-SCORES-OWNER-PRIVATE-QA.apk"             > "$RUNNER_TEMP/deda-stage29-100397-artifact/SHA256.txt"
          printf '%s\n'             'DEDA original signed 100396 PRIVATE phone and tablet QA: weekly Continue Daily Tasks now opens original task page.'             'Retains original approved 100396 manager tile, rank visuals, both home layouts, and original task rewards.'             'Admin page rechecks original backend identity; all league control toggles disabled.'             'Fixes navigation for both home layouts, current/previous tabs. Real shared score requires separate owner-approved Firebase pilot Functions deployment and account allowlist. No real payouts.'             'No Firebase/rules/Play deployment by this workflow; no XP, wallet, user profile or prize writes.'             'Test on device and preserve rollback; never bypass Play Protect warnings.'             > "$RUNNER_TEMP/deda-stage29-100397-artifact/READ-ME.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: DEDA-100397-REAL-WEEKLY-SCORES-OWNER-PRIVATE-QA
          path: |
            ${{ runner.temp }}/deda-stage29-100397-artifact/*.apk
            ${{ runner.temp }}/deda-stage29-100397-artifact/*.json
            ${{ runner.temp }}/deda-stage29-100397-artifact/*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Delete ephemeral signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/deda-original-100396/android/app/deda-release.jks"
