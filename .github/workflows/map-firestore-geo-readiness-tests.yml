name: DEDA Firestore Geo Readiness Offline QA

on:
  push:
    branches:
      - map-firestore-geo-readiness-2026-10-08
    paths:
      - '.github/workflows/map-firestore-geo-readiness-tests.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated geospatial planning branch
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Install dependencies
        run: flutter pub get
      - name: Test exact Iraq geographic bounds and pagination without server load
        run: flutter test test/deda_geo_window_test.dart test/deda_request_coalescer_test.dart test/deda_public_provider_health_test.dart
      - name: Analyze isolated region reader and provider guards
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/deda_geo_window.dart lib/deda_geo_firestore_reader.dart lib/places_service.dart lib/deda_request_coalescer.dart lib/deda_public_provider_health.dart test/deda_geo_window_test.dart
      - name: Assert no navigation/production Firestore rule changes vs proven 100318
        run: |
          git fetch --no-tags origin backup-100318-field-tested-user-heading-camera-2026-10-08:refs/remotes/origin/backup-100318-field-tested-user-heading-camera-2026-10-08
          git diff --exit-code origin/backup-100318-field-tested-user-heading-camera-2026-10-08 -- lib/main.dart lib/deda_backend.dart lib/deda_road_class_lookup.dart pubspec.yaml firestore.rules storage.rules firebase.json
      - name: Verify no live integration or index/rule deployments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          reader=Path('lib/deda_geo_firestore_reader.dart').read_text()
          backend=Path('lib/deda_backend.dart').read_text()
          main=Path('lib/main.dart').read_text()
          plan=json.loads(Path('docs/proposed_geo_firestore_indexes_NOT_DEPLOYED.json').read_text())
          assert len(plan['indexes'])==2
          assert {i['collectionGroup'] for i in plan['indexes']}=={'road_hazards','published_places'}
          assert "DedaGeoFirestoreReader" in reader
          assert "startAfterDocument(after)" in reader
          assert "if (!region.complete) complete = false;" in reader
          assert "DedaGeoFirestoreReader" not in backend and "DedaGeoFirestoreReader" not in main
          assert Path('firebase.json').read_text().count('indexes')==0
          assert "await paged.get()" in reader
          print('PASS: regional reader is safely isolated. No production query cutover, no indexes/rules deployment.')
          PY
