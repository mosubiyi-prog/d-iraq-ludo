name: DEDA Heartbeat Firestore Emulator Security — NO APK
on:
  push:
    branches:
      - deda-heartbeat-integrated-stage-2026-10-14
    paths:
      - '.github/workflows/qa-deda-heartbeat-emulator-no-apk.yml'
      - 'functions/tests/deda_heartbeat_firestore_emulator.test.js'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: deda-heartbeat-firestore-only
  cancel-in-progress: false

jobs:
  firestore-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare private rules snapshot and emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          # This is the only staged extra rule: client cannot read/write reaction rows.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('firestore.rules')
          rules=p.read_text()
          marker='    match /admin_trash_places/{trashId} {'
          assert rules.count(marker)==1
          assert 'match /deda_place_engagement_totals/{placeId}' not in rules
          rules=rules.replace(marker,"""    match /deda_place_engagement/{placeId}/users/{accountHash} {
                allow read, write: if false;
              }
              match /deda_place_engagement_totals/{placeId} {
                allow read, write: if false;
              }

          """+marker,1)
          p.write_text(rules)
          print('PASS: explicit deny rules in synthetic emulator only')
          PY
          npm install --prefix functions --no-save --no-audit --no-fund \
            firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Firebase Emulator permission tests — NEVER production
        shell: bash
        run: |
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-heartbeat-rules --only firestore \
            'node --test functions/tests/deda_heartbeat_firestore_emulator.test.js'
      - name: Explicit no APK / no deploy evidence
        run: |
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo 'PASS: synthetic emulator rules security only; no APK/deploy.'
