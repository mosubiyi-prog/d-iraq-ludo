name: Build DEDA next-version APK

on:
  push:
    branches:
      - places-v1
    paths:
      - .github/workflows/build-deda-next-version.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout places-v1
        uses: actions/checkout@v4
        with:
          ref: places-v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Save DEDA files
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          cp deda_app_icon.png /tmp/deda_app_icon.png

      - name: Create Flutter project
        run: flutter create . --org com.diraq.ludo --project-name d_iraq_ludo

      - name: Restore DEDA files
        run: |
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/deda_app_icon.png deda_app_icon.png

      - name: Configure Android permissions and app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]
          missing = [p for p in permissions if p not in text]
          if missing:
              pos = text.find('>')
              text = text[:pos + 1] + '\n' + '\n'.join(f'    {p}' for p in missing) + '\n' + text[pos + 1:]
          text = text.replace('android:label="d_iraq_ludo"', 'android:label="DEDA"')
          path.write_text(text)
          PY

      - name: Configure DEDA launcher icon
        run: |
          flutter pub add --dev flutter_launcher_icons
          cat >> pubspec.yaml <<'YAML'

          flutter_launcher_icons:
            android: "ic_launcher"
            ios: false
            image_path: "deda_app_icon.png"
            min_sdk_android: 21
          YAML
          dart run flutter_launcher_icons

      - name: Restore permanent signing key
        env:
          DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          raw = os.environ['DEDA_KEYSTORE_BASE64'].strip()
          if raw.startswith('DEDA_KEYSTORE_BASE64='):
              raw = raw.split('=', 1)[1].strip()
          raw = ''.join(raw.split())
          data = base64.b64decode(raw, validate=True)
          output = Path('android/app/deda-release.jks')
          output.write_bytes(data)
          if output.stat().st_size == 0:
              raise SystemExit('Signing key is empty')
          PY

      - name: Validate permanent signing key
        env:
          DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
          DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
        run: |
          keytool -list -keystore android/app/deda-release.jks -storepass "$DEDA_STORE_PASSWORD" -alias "$DEDA_KEY_ALIAS" > /dev/null

      - name: Configure permanent release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          kts = Path('android/app/build.gradle.kts')
          if not kts.exists():
              raise SystemExit('android/app/build.gradle.kts not found')
          text = kts.read_text()
          marker = '    buildTypes {'
          signing = '''    signingConfigs {
              create("release") {
                  keyAlias = System.getenv("DEDA_KEY_ALIAS")
                  keyPassword = System.getenv("DEDA_KEY_PASSWORD")
                  storeFile = file("deda-release.jks")
                  storePassword = System.getenv("DEDA_STORE_PASSWORD")
              }
          }

'''
          if marker not in text:
              raise SystemExit('buildTypes not found')
          text = text.replace(marker, signing + marker, 1)
          old = 'signingConfig = signingConfigs.getByName("debug")'
          if old not in text:
              raise SystemExit('Debug signing configuration not found')
          text = text.replace(old, 'signingConfig = signingConfigs.getByName("release")', 1)
          kts.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build permanently signed APK
        env:
          DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
          DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
          DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}
        run: |
          BUILD_NUMBER=$((100000 + GITHUB_RUN_NUMBER))
          flutter build apk --release --build-number="$BUILD_NUMBER"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: d-iraq-ludo-next-version-apk
          path: build/app/outputs/flutter-apk/app-release.apk
