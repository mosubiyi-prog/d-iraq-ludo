name: DEDA 100441 STEP2 OWNER PIN verification readiness READONLY NO DEPLOY
on:
  push:
    branches:
      - deda-100440-session-rescue-isolated-owner-review-2026-11-07
    paths:
      - 'tools/deda_100441_step2_pin_proof_readiness_readonly_2026_11_08.py'
      - 'functions/test/deda_100441_step2_conflicted_uids_owner_proof.test.js'
      - '.github/workflows/deda-100441-step2-owner-pin-proof-readiness-no-deploy-2026-11-08.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-step2-owner-pin-proof-readonly
  cancel-in-progress: false

jobs:
  owner-pin-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DEDA_PRIMARY_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Protect the entire previous app and Firebase Rules
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 958ed9a3c9cce0f207e98d8956e8b659e1ff7246 HEAD -- \
            lib/main.dart lib/deda_backend.dart lib/deda_pin_auth.dart \
            firestore.rules storage.rules firebase.json .firebaserc \
            functions/index.js functions/deda_owner_pin_verify_private_v1.js \
            functions/deda_pin_manual_recovery_compat_private_v1.js \
            functions/deda_stage2_live_gate.js \
            android/ assets/ pubspec.yaml pubspec.lock
          python3 -m py_compile tools/deda_100441_step2_pin_proof_readiness_readonly_2026_11_08.py
          echo PASS_NO_PRODUCTION_SOURCE_OR_FIREBASE_MUTATION
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and pure fail-closed A B C regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/test/deda_100441_step2_conflicted_uids_owner_proof.test.js
          node --test \
            functions/test/deda_100441_step2_conflicted_uids_owner_proof.test.js \
            functions/test/deda_owner_pin_verify_private_v1.test.js \
            functions/test/deda_stage2_live_gate.test.js
          echo PASS_PURE_SECURITY_TESTS_WITH_SYNTHETIC_UIDS_ONLY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only Firebase SDK
        run: python3 -m pip install --quiet google-cloud-firestore==2.21.0
      - name: Inspect canonical PIN readiness metadata — NEVER read PIN
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/deda_100441_step2_pin_proof_readiness_readonly_2026_11_08.py
      - name: Confirm no login, PIN read, Firebase writes or APK
        run: echo PASS_NO_PIN_READ_NO_AUTH_NO_FIREBASE_WRITES_NO_APK_NO_PLAY
