name: Build DEDA 100271 Gifts Friends V1

# retry-2: friend overflow anchor normalized against proven 100270 formatting
on:
  push:
    branches:
      - gifts-friends-v1-100271-2026-10-05
    paths:
      - '.github/workflows/build-apk-100271-gifts-friends-v1.yml'

jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-100271]')
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100271 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100271
        run: bash tools/build_100271_gifts_friends_v1.sh

      - name: Upload APK 100271
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100271-gifts-friends-v1-apk
          path: build/app/outputs/flutter-apk/app-release.apk
