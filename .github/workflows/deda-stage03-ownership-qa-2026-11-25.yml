name: DEDA Stage03 protected ownership projection emulator NO DEPLOY
on:
  push:
    branches: [deda-100451-owner-admin-session-safe-repair-2026-11-20]
    paths:
      - 'qa/stage03/uid-ownership-projection.cjs'
      - 'functions/deda_weekly_direct_prize_worker.cjs'
      - 'qa/stage03/uid-ownership.test.cjs'
      - 'qa/stage03/firestore.lab-candidate.rules'
      - '.github/workflows/deda-stage03-ownership-qa-2026-11-25.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ownership:
    if: github.ref == 'refs/heads/deda-100451-owner-admin-session-safe-repair-2026-11-20'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Protected ownership and existing prize-plan regressions on demo only
        run: |
          set -euo pipefail
          node --test functions/tests/deda_weekly_direct_prize_plan.test.cjs
          work="$RUNNER_TEMP/stage03-ownership"
          mkdir -p "$work"
          cp qa/stage03/uid-ownership-projection.cjs qa/stage03/uid-ownership.test.cjs qa/stage03/uid-trusted-fixture.cjs qa/stage03/uid-spark-fixture-rules.cjs tools/app_stability/progress_archive/{reconcile-core,reconcile-store,purchase-frames}.cjs functions/deda_weekly_direct_prize_plan.js functions/deda_weekly_direct_prize_worker.cjs "$work/"
          cp qa/stage03/firestore.lab-candidate.rules "$work/firestore.rules"
          cp firestore.rules "$work/original-firestore.rules"
          cd "$work"
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false}}}' > firebase.json
          npm install --no-audit --no-fund --ignore-scripts --no-package-lock @firebase/rules-unit-testing@4.0.0 firebase@11.10.0 firebase-admin@13.0.0
          node --check uid-ownership-projection.cjs
          GCLOUD_PROJECT=demo-deda-stage03-uid npx --yes firebase-tools@13.35.1 emulators:exec --project demo-deda-stage03-uid --only firestore --config firebase.json --non-interactive 'node --test uid-ownership.test.cjs'
          sha256sum account-fixed-candidate.rules > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stage03-account-fixed-candidate-REVIEW-ONLY
          path: |
            ${{ runner.temp }}/stage03-ownership/account-fixed-candidate.rules
            ${{ runner.temp }}/stage03-ownership/SHA256SUMS.txt
          if-no-files-found: error
