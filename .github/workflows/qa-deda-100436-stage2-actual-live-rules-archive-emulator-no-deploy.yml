name: DEDA Stage2 Spark Archive Additive QA on Actual Live Firestore Rules - NO DEPLOY
on:
  push:
    branches:
      - deda-100436-stage2-recovery-buildable-integration-qa-2026-11-05
    paths:
      - '.github/workflows/qa-deda-100436-stage2-actual-live-rules-archive-emulator-no-deploy.yml'
      - 'tools/deda_stage2_preview_spark_archives_on_actual_live_rules.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  use-real-active-rules-in-throwaway-firebase-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      DEDA_PRIMARY_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      DEDA_SECONDARY_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protect version 100436 and ALL checked-in active Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code fea54d7db2e8a24a74267f04a14c9572bcb408ee HEAD -- \
            firestore.rules firebase.json .firebaserc storage.rules
          python3 -m py_compile tools/deda_stage2_preview_spark_archives_on_actual_live_rules.py
          node --check qa/stage2/deda_spark_prelink_evidence_rules_real_emulator_private.test.cjs
          node --check qa/stage2/deda_spark_existing_uid_auth_readonly_private.test.cjs
          echo 'PASS_NO_PROD_SOURCE_MUTATION'
      - name: Obtain exact live Firebase rules read-only and make isolated additive preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          export DEDA_EMULATOR_RULES_PATH="$RUNNER_TEMP/deda-stage2-actual-live.rules"
          python3 tools/deda_stage2_preview_spark_archives_on_actual_live_rules.py
          test -s "$DEDA_EMULATOR_RULES_PATH"
          echo "DEDA_EMULATOR_RULES_PATH=$DEDA_EMULATOR_RULES_PATH" >> "$GITHUB_ENV"
      - name: Prepare isolated real Auth + Firestore SDK emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deda-stage2-live-node"
          npm install --prefix "$RUNNER_TEMP/deda-stage2-live-node" \
            --no-save --no-audit --no-fund \
            firebase-tools@13.35.1 firebase@11.10.0 firebase-admin@12.7.0 \
            @firebase/rules-unit-testing@4.0.0
          echo "NODE_PATH=$RUNNER_TEMP/deda-stage2-live-node/node_modules" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          (root/'deda-stage2-live-firebase.json').write_text(json.dumps({
             'firestore':{'rules':os.environ['DEDA_EMULATOR_RULES_PATH']},
             'emulators':{'auth':{'host':'127.0.0.1','port':9099},
                          'firestore':{'host':'127.0.0.1','port':8098},
                          'ui':{'enabled':False}}
          }))
          PY
      - name: Actual LIVE rules plus additive archive candidate — three phone read-only compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/deda-stage2-live-node/node_modules/.bin/firebase"
          "$cli" emulators:exec --project demo-deda-100436-journal-qa \
            --config "$RUNNER_TEMP/deda-stage2-live-firebase.json" \
            --only auth,firestore --non-interactive \
            'node --test qa/stage2/deda_spark_existing_uid_auth_readonly_private.test.cjs qa/stage2/deda_spark_prelink_evidence_rules_real_emulator_private.test.cjs'
          echo 'PASS_LIVE_RULES_ADDITIVE_EMULATOR_NO_REAL_DEPLOY'
      - name: Confirm no checked-in source mutation and no production deploy
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- firestore.rules firebase.json .firebaserc storage.rules lib functions
          echo 'SAFE_DONE_REAL_FIREBASE_WAS_READ_ONLY_NO_PRODUCTION_WRITES'
