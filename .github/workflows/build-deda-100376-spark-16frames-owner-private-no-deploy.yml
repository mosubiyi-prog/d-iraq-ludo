name: DEDA 100376 SPARK Premium IDs + 16 ORIGINAL LAB Assets OWNER PRIVATE QA
on:
  push:
    branches:
      - deda-100376-all-qa32-frames-owner-private-2026-10-22
    paths:
      - '.github/workflows/build-deda-100376-spark-verified-owner-private-apk-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-qa32-stage82-private-owner-apk-100376-no-deploy
  cancel-in-progress: false
jobs:
  reconstruct-real-store:
    runs-on: ubuntu-24.04
    # The EXACT baseline reconstruction validates the original signing
    # configuration even for source-only QA. No APK/AAB is produced here.
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect signing, original APK and released Spark baseline
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet d14e573d1f7f1ab67deff04222aca13c6f928553 -- \
            android/ firebase.json firestore.rules lib/main.dart
          # The only 13 NEW assets allowed are authentic DEDA LAB originals.
          # Nothing can change legacy royal avatars, frames or backgrounds.
          python3 - <<'PY_FRAMES_GUARD'
          import subprocess,hashlib
          from pathlib import Path
          import json
          baseline='d14e573d1f7f1ab67deff04222aca13c6f928553'
          changed=subprocess.check_output(
            ['git','diff','--name-only',baseline,'--','assets/'],text=True)
          actual=set(changed.splitlines())
          expected={'assets/deda_lab_frames/FRAME_%02d.webp'%n
                    for n in [3,*range(5,17)]}
          if actual!=expected:
            raise SystemExit('SAFE_STOP_ASSET_SET_UNEXPECTED '+repr(sorted(actual^expected)))
          catalogue=json.loads(Path(
            'docs/DEDA_LAB_16_VERIFIED_FRAME_CATALOG_STAGED_ONLY_2026-10-21.json'
          ).read_text())
          for frame in catalogue['frames']:
            p=Path('assets/deda_lab_frames')/(frame['id']+'.webp')
            if frame['id'] in ('FRAME_01','FRAME_02','FRAME_04'):
              continue
            if not p.is_file() or p.stat().st_size!=frame['bytes']:
              raise SystemExit('SAFE_STOP_ORIGINAL_FRAME_SIZE_'+frame['id'])
            if hashlib.sha256(p.read_bytes()).hexdigest()!=frame['sha256']:
              raise SystemExit('SAFE_STOP_ORIGINAL_FRAME_HASH_'+frame['id'])
          print('PASS: 13 exact original transparent LAB WebPs and no other asset changes')
          PY_FRAMES_GUARD
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          test -f lib/deda_qa32_spark_public_identifier_directory.dart
          test -f lib/deda_qa32_public_recipient_resolver.dart
          test -f lib/deda_stage71_free_owned_use_profile.dart
          grep -q 'DEDA_QA32_SPARK_PUBLIC_IDS_LIVE' lib/deda_qa32_spark_public_identifier_directory.dart
          grep -q 'DEDA_QA32_SHARE_TO_VERIFIED_ACTIVE_PREMIUM_ALIAS_CANONICAL_ROUTE' lib/deda_backend.dart
          grep -q 'DEDA_QA32_FIND_FRIEND_BY_VERIFIED_PREMIUM_ID_TO_CANONICAL_ACCOUNT' lib/deda_social_service.dart
          echo 'PASS original signed app unmodified, owner-approved Spark-only QA'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Reconstruct EXACT approved 100359 generated app, prohibit APK compilation
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python3 -m py_compile tools/qa_reconstruct_100359_then_stage35_no_apk.py
          # Capture the EXACT already-signed 100359 build invocation before
          # the approved no-build reconstruction replaces it with an echo.
          python3 - <<'CAPTURE_SIGNED_SOURCE'
          from pathlib import Path
          p=Path('tools/qa_reconstruct_100359_then_stage35_no_apk.py')
          s=p.read_text()
          needle="    adjusted = original.replace(matches[0],"
          assert s.count(needle)==1, 'SAFE_STOP original signed command capture point moved'
          s=s.replace(needle,
             "    Path('/tmp/deda_stage71_exact_signed_100359_command.txt').write_text(matches[0]+'\\n')\n"
             +needle,1)
          p.write_text(s)
          CAPTURE_SIGNED_SOURCE
          python3 tools/qa_reconstruct_100359_then_stage35_no_apk.py
          test -s /tmp/deda_stage71_exact_signed_100359_command.txt
          bash -e /tmp/deda_100340_play_aab.sh
          grep -q "DEDA_STAGE17_STORE_CARDS_BLUE_OWNED_IDS_2026_10_19" lib/main.dart
          grep -q "DEDA_STAGE31_OWNER_QA_LAUNCH_SANDBOX_ONLY_2026_10_19" lib/main.dart
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          echo 'PASS: actual approved 100359 Flutter UI recreated with NO output APK'
