          python3 - <<'PY_ACCOUNT'
          from pathlib import Path
          src=Path('lib/main.dart').read_text()
          print('QA32_ACCOUNT_SOURCE_PROBE_START')
          for needle in ('الأصلي • فعّال','الأصلي', 'معرّفاتي',
