name: Apply DEDA next version

on:
  push:
    branches:
      - places-v1
    paths:
      - .github/workflows/apply-deda-next-version.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout places-v1
        uses: actions/checkout@v4
        with:
          ref: places-v1
          fetch-depth: 0

      - name: Rebuild and verify patch
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git hash-object lib/main.dart)
          if [ "$SOURCE_SHA" != "84de0e19ed0367f7a9d849f110a3c3136e64f232" ]; then
            echo "Unexpected lib/main.dart source SHA: $SOURCE_SHA"
            exit 1
          fi

          cat tools/deda-next-version.patch.part00 \
              tools/deda-next-version.patch.part01 \
              tools/deda-next-version.patch.part02 \
              tools/deda-next-version.patch.part03 \
              tools/deda-next-version.patch.part04 \
              tools/deda-next-version.patch.part05 > /tmp/deda-next-version.patch

          PATCH_SHA=$(sha256sum /tmp/deda-next-version.patch | awk '{print $1}')
          if [ "$PATCH_SHA" != "9d7b771fd8b61327bacfc1c074b05e0ba2aaa1b068dec6cee11faf009ec7d3e4" ]; then
            echo "Patch checksum mismatch: $PATCH_SHA"
            exit 1
          fi

          patch --dry-run -p1 < /tmp/deda-next-version.patch
          patch -p1 < /tmp/deda-next-version.patch

          TARGET_SHA=$(git hash-object lib/main.dart)
          if [ "$TARGET_SHA" != "c405662a3ab9b719cde6d147e440dd9641f3baec" ]; then
            echo "Unexpected patched lib/main.dart SHA: $TARGET_SHA"
            exit 1
          fi

      - name: Fix dependencies for verification and photo upload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pubspec.yaml')
          text = path.read_text()
          text = text.replace('    firebase_core: ^3.8.0\n', '  firebase_core: ^3.8.0\n')
          if '  image_picker:' not in text:
              marker = '  firebase_auth: ^5.3.3\n'
              if marker not in text:
                  raise SystemExit('firebase_auth dependency marker not found')
              text = text.replace(marker, marker + '  image_picker: ^1.1.2\n', 1)
          path.write_text(text)
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Commit verified next-version files
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/deda-next-version.patch.part00 \
                tools/deda-next-version.patch.part01 \
                tools/deda-next-version.patch.part02 \
                tools/deda-next-version.patch.part03 \
                tools/deda-next-version.patch.part04 \
                tools/deda-next-version.patch.part05 \
                .github/workflows/apply-deda-next-version.yml

          git config user.name "DEDA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "[skip ci] Apply DEDA next-version verification UI"
          git push origin HEAD:places-v1
