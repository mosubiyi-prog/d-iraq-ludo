name: DEDA weekly stage11 REAL Firestore emulator account XP idempotence QA NO DEPLOY
on:
  push:
    branches: [deda-weekly-stage11-real-firestore-emulator-no-deploy-2026-10-27]
    paths:
      - '.github/workflows/qa-deda-weekly-stage11-real-firestore-emulator-no-deploy.yml'
      - 'functions/tests/deda_weekly_stage11_real_firestore_emulator.test.js'
      - 'functions/deda_weekly_xp_atomic_shadow_issuer_NOT_EXPORTED.js'
      - 'docs/DEDA_WEEKLY_STAGE11_REAL_FIRESTORE_EMULATOR_CHECKPOINT_2026-10-27.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-weekly-stage11-firestore-emulator-only
  cancel-in-progress: true
jobs:
  protect-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No original signed 100387 mutation or live wallet, Firebase, Play changes
        run: |
          set -euo pipefail
          git diff --quiet a0dd340e8843162ac5fb89784cb54d0be82b23ec -- lib/main.dart lib/deda_backend.dart lib/deda_social_service.dart lib/traffic_quiz_page.dart lib/deda_migrated_progress.dart pubspec.yaml pubspec.lock google-services.json firestore.rules firebase.json functions/index.js functions/package.json tools/app_stability/app_package/prepare.py
          ! grep -q 'deda_weekly_xp_atomic_shadow_issuer_NOT_EXPORTED' functions/index.js
          node --check functions/tests/deda_weekly_stage11_real_firestore_emulator.test.js
          echo 'Original user XP, wallets, real Firebase rules and app build inputs untouched'
  real-firestore-emulator-only:
    needs: protect-original
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GCLOUD_PROJECT: demo-deda-weekly-xp-stage9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install ephemeral local Firebase emulator dependencies only
        run: |
          npm install --prefix functions --no-save --no-audit --no-fund firebase-tools@14
      - name: Execute true Firestore atomic task XP shadow transactions
        run: |
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-weekly-xp-stage9 --only firestore \
            'node --test functions/tests/deda_weekly_stage11_real_firestore_emulator.test.js'
          echo 'Firestore emulator concurrent receipts and wallet immutability PASS, not production'
  done:
    needs: [protect-original, real-firestore-emulator-only]
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'NO functions deploy, NO rule deploy, NO live customers, NO wallet/XP writes, NO APK.'
