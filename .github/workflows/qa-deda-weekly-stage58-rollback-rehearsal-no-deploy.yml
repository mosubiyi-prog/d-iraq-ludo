name: DEDA Stage58 private two-phone rollback rehearsal ORIGINAL RULES NO DEPLOY
on:
  push:
    branches:
      - deda-weekly-stage58-two-phone-rollback-rehearsal-no-deploy-2026-10-28
    paths:
      - 'tools/app_stability/stage58/private_two_phone_rehearsal.cjs'
      - 'functions/tests/deda_weekly_stage58_two_phone_rollback_rehearsal.test.js'
      - 'tests/firestore-rules/stage58_original_rules_private_migration_plan_denial.test.mjs'
      - '.github/workflows/qa-deda-weekly-stage58-rollback-rehearsal-no-deploy.yml'
      - 'docs/DEDA_WEEKLY_STAGE58_PRIVATE_TWO_PHONE_ROLLBACK_REHEARSAL_CHECKPOINT_2026-10-28.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-stage58-two-phone-rehearsal-private-no-deploy
  cancel-in-progress: true
jobs:
  protect-original-and-exact-allowlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Five Stage58 files only, preserve Stage57 successful HEAD and all real DEDA sources
        run: |
          set -euo pipefail
          BASE=1f7be682090bc9a701d372aa5ab842f50a94e607
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE" HEAD > /tmp/stage58-allowlist.txt
          cat /tmp/stage58-allowlist.txt
          while IFS= read -r file; do
            case "$file" in
              tools/app_stability/stage58/private_two_phone_rehearsal.cjs|\
              functions/tests/deda_weekly_stage58_two_phone_rollback_rehearsal.test.js|\
              tests/firestore-rules/stage58_original_rules_private_migration_plan_denial.test.mjs|\
              .github/workflows/qa-deda-weekly-stage58-rollback-rehearsal-no-deploy.yml|\
              docs/DEDA_WEEKLY_STAGE58_PRIVATE_TWO_PHONE_ROLLBACK_REHEARSAL_CHECKPOINT_2026-10-28.md) ;;
              *) echo "Unexpected stage58 file: $file"; exit 1;;
            esac
          done < /tmp/stage58-allowlist.txt
          git diff --quiet "$BASE" -- \
            lib/ android/ functions/index.js functions/package.json \
            firebase.json firestore.rules storage.rules pubspec.yaml pubspec.lock \
            tools/app_stability/progress_archive/ \
            tools/app_stability/app_package/ \
            tools/app_stability/100380-baseline.tar.gz \
            tools/app_stability/100380-baseline-manifest.json
          node --check tools/app_stability/stage58/private_two_phone_rehearsal.cjs
          node --check functions/tests/deda_weekly_stage58_two_phone_rollback_rehearsal.test.js
          node --check tests/firestore-rules/stage58_original_rules_private_migration_plan_denial.test.mjs
          node - <<'JS'
          const fs=require('node:fs');
          const app=fs.readFileSync('lib/deda_migrated_progress_firebase.dart','utf8');
          const deployed=fs.readFileSync('functions/index.js','utf8');
          const rehearsal=fs.readFileSync('tools/app_stability/stage58/private_two_phone_rehearsal.cjs','utf8');
          if(!app.includes('defaultValue: false') ||
             deployed.includes('rehearseTwoPhoneHold') ||
             deployed.includes('deda_stage58_private_cross_phone_rehearsal_plans'))
            throw Error('Stage58 must not be deployed or enabled in DEDA original app');
          for(const marker of [
             'DEDA_STAGE58_EMULATOR_ONLY',
             'STAGE56_EVIDENCE_SOURCES_CANNOT_BE_REHASHED_FROM_REPORT',
             'LEGACY_SOURCE_CHANGED_AFTER_STAGE55_HOLD',
             'ABORTED_NO_TRANSFER',
             'realWalletRollbackPerformed:false',
             'dataMoved:false',
             'canCreditDiamonds:false',
             'canTransferWallet:false',
             'tx.create(planRef,report)'
          ])if(!rehearsal.includes(marker))
            throw Error('Missing emulator-only no-credit rehearsal guard: '+marker);
          console.log('Original DEDA app/Play, Cloud Functions, Rules, accounts and wallets UNCHANGED.');
          JS
  real-original-rules-and-emulator-rehearsal:
    needs: protect-original-and-exact-allowlist
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GCLOUD_PROJECT: demo-deda-stage55-two-phone-hold
      GOOGLE_CLOUD_PROJECT: demo-deda-stage55-two-phone-hold
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      DEDA_STAGE55_EMULATOR_ONLY: 'true'
      DEDA_STAGE56_EMULATOR_ONLY: 'true'
      DEDA_STAGE58_EMULATOR_ONLY: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install disposable Firebase CLI, Admin, client dependencies
        run: |
          set -euo pipefail
          npm --prefix tests/firestore-rules install --no-audit --no-fund
          npm --prefix functions install --no-save --no-audit --no-fund firebase-tools@14
      - name: Validate private Stage55/56 -> Stage58 migration rehearsal and original REAL Firebase Rules
        run: |
          set -euo pipefail
          cat > firebase.stage58.ci.json <<'JSON'
          {
            "firestore": {"rules": "firestore.rules"},
            "emulators": {
              "auth": {"port": 9099},
              "firestore": {"port": 8080},
              "ui": {"enabled": false},
              "singleProjectMode": true
            }
          }
          JSON
          trap 'rm -f firebase.stage58.ci.json' EXIT
          node - <<'JS'
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync('firebase.stage58.ci.json'));
          const live=JSON.parse(fs.readFileSync('firebase.json'));
          if(a.firestore.rules!==live.firestore.rules ||
             a.firestore.rules!=='firestore.rules')
            throw Error('Stage58 MUST load original unchanged production Firestore Rules');
          JS
          functions/node_modules/.bin/firebase emulators:exec \
            --config firebase.stage58.ci.json \
            --project demo-deda-stage55-two-phone-hold --only auth,firestore \
            'node --test functions/tests/deda_weekly_stage58_two_phone_rollback_rehearsal.test.js && cd tests/firestore-rules && node --test stage58_original_rules_private_migration_plan_denial.test.mjs'
      - name: Remain private, no real account migration, APK, gifts or deployment
        run: |
          echo 'Stage58 terminal abort only reverts an INERT PRIVATE PLAN; real wallet rollback NOT tested.'
          echo 'No source/user wallet/premium ID/frames/XP/diamonds or gifts moved or copied.'
          echo 'Original legacy old APK not fenced; original payments and historical XP unverified.'
          echo 'Owner ALL-ADDITIONS report and sign-off mandatory before ANY APK/AAB.'
