name: DEDA Stage2 Isolated Admin Firestore Runtime QA - EMULATOR ONLY NO DEPLOY

on:
  push:
    branches:
      - deda-100451-owner-admin-session-safe-repair-2026-11-20
    paths:
      - 'qa/stage2/isolated_admin_firestore_rules_runtime_2026_11_23.test.cjs'
      - 'qa/stage2/isolated_admin_tasks_rules_runtime_2026_11_23.test.cjs'
      - 'qa/stage2/isolated_admin_users_rules_runtime_2026_11_23.test.cjs'
      - 'qa/stage2/isolated_admin_owner_place_notice_runtime_2026_11_23.test.cjs'
      - 'qa/stage2/isolated_admin_support_trash_rules_runtime_2026_11_23.test.cjs'
      - 'qa/stage2/isolated_admin_inbox_view_rules_runtime_2026_11_23.test.cjs'
      - 'qa/stage2/build_isolated_admin_gateway_anchor_candidate_2026_11_23.py'
      - 'qa/stage2/isolated_admin_invite_preflight_2026_11_23.py'
      - 'qa/stage2/isolated_admin_gateway_anchor_candidate_2026_11_23.test.cjs'
      - 'qa/stage2/isolated_admin_secondary_auth_activation_emulator_2026_11_23.test.cjs'
      - 'qa/stage2/isolated_original_user_pin_dual_sync_auth_firestore_emulator_2026_11_23.test.cjs'
      - 'functions/deda_stage2_original_owner_session_pin_preflight_private_2026_11_23.js'
      - 'functions/test/deda_stage2_original_owner_session_pin_preflight_private_2026_11_23.test.js'
      - 'functions/index.js'
      - 'functions/test/deda_stage2_existing_admin_revocation_private_2026_11_23.test.cjs'
      - 'test/deda_stage19_exclusive_fixed_color_actions.test.js'
      - 'test/deda_stage19_private100_firestore_races_emulator.test.js'
      - 'tools/deda_stage19_private_fixed_color_manager_actions_2026_10_19.js'
      - 'tools/deda_stage19_encrypted_admin100_callable_gateway_2026_10_19.js'
      - 'functions/stage19_private/stage19_owner100_readonly_NOT_EXPORTED.js'
      - 'functions/deda_weekly_direct_prize_plan.js'
      - 'functions/deda_weekly_direct_prize_worker.cjs'
      - 'functions/deda_weekly_payout_approved_runner_100438.cjs'
      - 'functions/tests/deda_weekly_direct_prize_custom_plan_100438.test.cjs'
      - 'functions/deda_pin_manual_recovery_compat_private_v1.js'
      - 'functions/deda_pin_auto_recovery_worker.js'
      - 'functions/test/deda_pin_manual_recovery_compat_private_v1.test.js'
      - 'functions/test/deda_pin_auto_recovery_compat_private_v1.test.js'
      - '.github/workflows/deda-stage2-isolated-admin-firestore-emulator-no-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-rules-runtime-synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      DEDA_EMULATOR_ONLY: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      GOOGLE_CLOUD_PROJECT: demo-deda-stage2-isolated-admin-private-qa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify no Firebase deployment, real credentials, or protected rules edits
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 39f7765ed64a559fb15706302a6801861515694c HEAD -- \
            firestore.rules firebase.json .firebaserc storage.rules \
            lib/main.dart lib/deda_backend.dart lib/admin_pages.dart
          node --check qa/stage2/isolated_admin_firestore_rules_runtime_2026_11_23.test.cjs
          node --check qa/stage2/isolated_admin_tasks_rules_runtime_2026_11_23.test.cjs
          node --check qa/stage2/isolated_admin_users_rules_runtime_2026_11_23.test.cjs
          node --check qa/stage2/isolated_admin_owner_place_notice_runtime_2026_11_23.test.cjs
          node --check qa/stage2/isolated_admin_support_trash_rules_runtime_2026_11_23.test.cjs
          node --check qa/stage2/isolated_admin_inbox_view_rules_runtime_2026_11_23.test.cjs
          test "$GOOGLE_CLOUD_PROJECT" = demo-deda-stage2-isolated-admin-private-qa
          echo 'PASS_PROTECTED_RULES_AND_BASE_APP_UNCHANGED'
      - name: Test legacy-invite preflight with fake local records, no Firebase
        run: python3 qa/stage2/isolated_admin_invite_preflight_2026_11_23.py --self-test
      - name: Verify existing UID-safe manual PIN compatibility worker without enabling it
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const dedaPinCompatPilotEnabled = false;' functions/index.js
          node --check functions/deda_pin_manual_recovery_compat_private_v1.js
          node --check functions/deda_pin_auto_recovery_worker.js
          node --test functions/test/deda_pin_manual_recovery_compat_private_v1.test.js \
            functions/test/deda_pin_auto_recovery_compat_private_v1.test.js
          echo 'PASS_EXISTING_PRIVATE_PIN_DUAL_SYNC_WORKER_TESTS_OFF_NO_DEPLOY'
      - name: Verify independent original-owner session PIN preflight is read-only and not deployed
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/deda_stage2_original_owner_session_pin_preflight_private_2026_11_23.js
          node --check functions/test/deda_stage2_original_owner_session_pin_preflight_private_2026_11_23.test.js
          node --test functions/test/deda_stage2_original_owner_session_pin_preflight_private_2026_11_23.test.js
          echo 'PASS_PRIVATE_ORIGINAL_UID_REAUTH_PREFLIGHT_NO_PIN_WRITES_NO_DEPLOY'
      - name: Test EXISTING admin session revocation callable with synthetic role/gateway/target cases
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/index.js
          node --check functions/test/deda_stage2_existing_admin_revocation_private_2026_11_23.test.cjs
          node --test functions/test/deda_stage2_existing_admin_revocation_private_2026_11_23.test.cjs
          echo 'PASS_EXISTING_ADMIN_REVOCATION_STRICT_STAGE2_GUARD_NO_DEPLOY'
      - name: Reuse existing Stage19 100-ID fixed-color tests without exporting grant callables
        shell: bash
        run: |
          set -euo pipefail
          node --check test/deda_stage19_exclusive_fixed_color_actions.test.js
          node --test test/deda_stage19_exclusive_fixed_color_actions.test.js
          node - <<'NODE'
          const s=require('fs').readFileSync('functions/index.js','utf8');
          for(const name of ['dedaStage19Exclusive100Grant',
                             'dedaStage19Exclusive100SelfUse',
                             'dedaStage19Exclusive100Read']){
            if(s.includes('exports.'+name))throw Error('STAGE19_UNAPPROVED_EXPORT');
          }
          console.log('STAGE19_PRIVATE_GRANTS_NOT_EXPORTED');
          NODE
          echo 'PASS_EXISTING_STAGE19_FIXED_COLOR_TESTS_NO_GRANT_DEPLOY'
      - name: Install throwaway emulator tooling in runner temp only
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          mkdir -p "$root"
          npm install --prefix "$root" --no-save --no-audit --no-fund \
            firebase-tools@13.35.1 firebase@11.10.0 firebase-admin@13.4.0 \
            @firebase/rules-unit-testing@4.0.0
          echo "NODE_PATH=$root/node_modules" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json,os,pathlib,shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'deda-stage2-admin-runtime'
          p=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'firestore.rules'
          assert p.exists() and p.stat().st_size>10000
          shutil.copy2(p,root/'checked-in-firestore.rules')
          assert (root/'checked-in-firestore.rules').read_bytes()==p.read_bytes()
          (root/'firebase.json').write_text(json.dumps({
              'firestore': {'rules': 'checked-in-firestore.rules'},
              'emulators': {'firestore': {'host': '127.0.0.1', 'port': 8097},
                            'ui': {'enabled': False}}
          }))
          print('PASS_USE_CHECKED_IN_RULES_LOCAL_ONLY')
          PY
      - name: Recheck ORIGINAL approved weekly prize worker and Saturday runner on throwaway Firestore
        shell: bash
        run: |
          set -euo pipefail
          # This executes the EXISTING 100438 test. No new payout writer.
          # Project/env are demo-only, and Admin SDK points at the emulator.
          export GOOGLE_CLOUD_PROJECT=demo-deda-100405-worker
          export GCLOUD_PROJECT=demo-deda-100405-worker
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          node --check functions/deda_weekly_direct_prize_plan.js
          node --check functions/deda_weekly_direct_prize_worker.cjs
          node --check functions/deda_weekly_payout_approved_runner_100438.cjs
          node --check functions/tests/deda_weekly_direct_prize_custom_plan_100438.test.cjs
          "$root/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-100405-worker \
            --config "$root/firebase.json" \
            --only firestore --non-interactive \
            'node --test functions/tests/deda_weekly_direct_prize_custom_plan_100438.test.cjs'
          echo 'PASS_ORIGINAL_APPROVED_WEEKLY_PRIZE_WORKER_EMULATOR_ONLY_NO_DEPLOY'
      - name: Test EXISTING encrypted 100-ID grant race safeguards on throwaway Firestore
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_CLOUD_PROJECT=demo-deda-stage19-owner100-races
          export GCLOUD_PROJECT=demo-deda-stage19-owner100-races
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          node --check test/deda_stage19_private100_firestore_races_emulator.test.js
          "$root/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-stage19-owner100-races \
            --config "$root/firebase.json" \
            --only firestore --non-interactive \
            'node --test test/deda_stage19_private100_firestore_races_emulator.test.js'
          echo 'PASS_STAGE19_ORIGINAL_100_ID_FIRESTORE_RACE_EMULATOR_NO_DEPLOY'
      - name: Exercise actual Firestore security rules on fake staff, invite, and recovery records
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          "$root/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-stage2-isolated-admin-private-qa \
            --config "$root/firebase.json" \
            --only firestore --non-interactive \
            'node --test qa/stage2/isolated_admin_firestore_rules_runtime_2026_11_23.test.cjs'
          echo 'PASS_EMULATOR_RUNTIME_ONLY_NO_REAL_FIREBASE_DATA'
      - name: Test original tasks and rewards rules on synthetic local emulator data
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          "$root/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-stage2-isolated-admin-private-qa \
            --config "$root/firebase.json" \
            --only firestore --non-interactive \
            'node --test qa/stage2/isolated_admin_tasks_rules_runtime_2026_11_23.test.cjs'
          echo 'PASS_STAGE2_TASKS_RUNTIME_EMULATOR_ONLY_NO_REWARD_PAYMENTS'
      - name: Exercise isolated user-directory and audited account-read rules on fake records
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          "$root/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-stage2-isolated-admin-private-qa \
            --config "$root/firebase.json" \
            --only firestore --non-interactive \
            'node --test qa/stage2/isolated_admin_users_rules_runtime_2026_11_23.test.cjs'
          echo 'PASS_USERS_DIRECTORY_AUDIT_EMULATOR_ONLY_NO_PUBLIC_USER_WRITES'
      - name: Check manual owner notice and audit against current rules in emulator only
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          "$root/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-stage2-isolated-admin-private-qa \
            --config "$root/firebase.json" \
            --only firestore --non-interactive \
            'node --test qa/stage2/isolated_admin_owner_place_notice_runtime_2026_11_23.test.cjs'
          echo 'STAGE2_OWNER_NOTICE_EMULATOR_ONLY_LEGACY_RULE_GAP_HOLD'
      - name: Check original support trash rules and reversible GM audit on fake records
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          "$root/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-stage2-isolated-admin-private-qa \
            --config "$root/firebase.json" \
            --only firestore --non-interactive \
            'node --test qa/stage2/isolated_admin_support_trash_rules_runtime_2026_11_23.test.cjs'
          echo 'SUPPORT_TRASH_EMULATOR_ONLY_LEGACY_ROLELESS_RELEASE_HOLD'
      - name: Verify first-view request audit and three-state inbox support on fake Firestore
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          "$root/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-stage2-isolated-admin-private-qa \
            --config "$root/firebase.json" \
            --only firestore --non-interactive \
            'node --test qa/stage2/isolated_admin_inbox_view_rules_runtime_2026_11_23.test.cjs'
          echo 'INBOX_FIRST_VIEW_EMULATOR_ONLY_NO_USER_MUTATIONS'
      - name: Generate rules hardening CANDIDATE into runner temp, never repository
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          export DEDA_ADMIN_CANDIDATE_RULES_PATH="$root/candidate.rules"
          python3 qa/stage2/build_isolated_admin_gateway_anchor_candidate_2026_11_23.py \
            --output "$DEDA_ADMIN_CANDIDATE_RULES_PATH"
          node --check qa/stage2/isolated_admin_gateway_anchor_candidate_2026_11_23.test.cjs
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'deda-stage2-admin-runtime'
          rules=root/'candidate.rules'
          assert rules.exists() and rules.stat().st_size>10000
          (root/'candidate-firebase.json').write_text(json.dumps({
            'firestore': {'rules': 'candidate.rules'},
            'emulators': {'auth': {'host': '127.0.0.1', 'port': 9097},
                          'firestore': {'host': '127.0.0.1', 'port': 8097},
                          'ui': {'enabled': False}}
          }))
          PY
          echo "DEDA_ADMIN_CANDIDATE_RULES_PATH=$DEDA_ADMIN_CANDIDATE_RULES_PATH" >> "$GITHUB_ENV"
      - name: Verify protected GM gateway candidate on fake local emulator only
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          "$root/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-stage2-isolated-admin-anchor-qa \
            --config "$root/candidate-firebase.json" \
            --only firestore --non-interactive \
            'node --test qa/stage2/isolated_admin_gateway_anchor_candidate_2026_11_23.test.cjs'
          echo 'PASS_LOCAL_CANDIDATE_ANCHOR_ONLY_NOT_PRODUCTION_DEPLOYED'
      - name: Verify secondary Firebase Auth and Firestore invitation lifecycle with TWO apps
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          node --check qa/stage2/isolated_admin_secondary_auth_activation_emulator_2026_11_23.test.cjs
          "$root/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-stage2-isolated-admin-anchor-qa \
            --config "$root/candidate-firebase.json" \
            --only auth,firestore --non-interactive \
            'node --test qa/stage2/isolated_admin_secondary_auth_activation_emulator_2026_11_23.test.cjs'
          echo 'PASS_TWO_FIREBASE_APPS_AUTH_EMULATOR_NO_PRODUCTION_ACCOUNT'
      - name: Test canonical manual PIN worker against REAL local Auth plus Firestore emulators
        shell: bash
        run: |
          set -euo pipefail
          # Scope the project override to this throwaway dual-emulator test.
          export GOOGLE_CLOUD_PROJECT=demo-deda-stage2-isolated-admin-anchor-qa
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          node --check qa/stage2/isolated_original_user_pin_dual_sync_auth_firestore_emulator_2026_11_23.test.cjs
          # Prior emulator steps download/cache tools before entering this
          # loopback-only namespace. Run the final identity proof with no
          # external network, no inherited credential variables, no root.
          sudo -n unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            test -z "$(ip route show default)"
            test -z "$(ip -6 route show default)"
            echo "PASS_STAGE01_IDENTITY_EMULATOR_NO_EXTERNAL_ROUTE"
            exec setpriv --reuid "$1" --regid "$2" --init-groups --no-new-privs env -i \
              HOME="$3" PATH="$4" JAVA_HOME="$5" NODE_PATH="$6/node_modules" \
              CI=true DEDA_EMULATOR_ONLY=true FIREBASE_CLI_DISABLE_UPDATE_CHECK=true \
              GOOGLE_CLOUD_PROJECT=demo-deda-stage2-isolated-admin-anchor-qa \
              GCLOUD_PROJECT=demo-deda-stage2-isolated-admin-anchor-qa \
              "$6/node_modules/.bin/firebase" emulators:exec \
              --project demo-deda-stage2-isolated-admin-anchor-qa \
              --config "$6/candidate-firebase.json" \
              --only auth,firestore --non-interactive "$7"
          ' _ "$(id -u)" "$(id -g)" "$HOME" "$PATH" "$JAVA_HOME" "$root" \
            'node --test qa/stage2/isolated_original_user_pin_dual_sync_auth_firestore_emulator_2026_11_23.test.cjs'
          echo 'PASS_CANONICAL_PIN_DUAL_SYNC_AUTH_FIRESTORE_EMULATOR_NO_DEPLOY'
      - name: Verify no writes to source, production or build outputs
        if: always()
        shell: bash
        run: |
          echo 'NO_FIREBASE_DEPLOY_NO_GOOGLE_PLAY_NO_APK_NO_USER_DATA'
          git diff --exit-code -- firestore.rules firebase.json lib/main.dart
