name: DEDA Stage2 Isolated Admin Firestore Runtime QA - EMULATOR ONLY NO DEPLOY

on:
  push:
    branches:
      - deda-100451-owner-admin-session-safe-repair-2026-11-20
    paths:
      - 'qa/stage2/isolated_admin_firestore_rules_runtime_2026_11_23.test.cjs'
      - 'qa/stage2/isolated_admin_tasks_rules_runtime_2026_11_23.test.cjs'
      - 'qa/stage2/isolated_admin_users_rules_runtime_2026_11_23.test.cjs'
      - 'qa/stage2/isolated_admin_owner_place_notice_runtime_2026_11_23.test.cjs'
      - 'qa/stage2/isolated_admin_support_trash_rules_runtime_2026_11_23.test.cjs'
      - 'qa/stage2/build_isolated_admin_gateway_anchor_candidate_2026_11_23.py'
      - 'qa/stage2/isolated_admin_invite_preflight_2026_11_23.py'
      - 'qa/stage2/isolated_admin_gateway_anchor_candidate_2026_11_23.test.cjs'
      - 'qa/stage2/isolated_admin_secondary_auth_activation_emulator_2026_11_23.test.cjs'
      - '.github/workflows/deda-stage2-isolated-admin-firestore-emulator-no-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-rules-runtime-synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      DEDA_EMULATOR_ONLY: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      GOOGLE_CLOUD_PROJECT: demo-deda-stage2-isolated-admin-private-qa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify no Firebase deployment, real credentials, or protected rules edits
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 39f7765ed64a559fb15706302a6801861515694c HEAD -- \
            firestore.rules firebase.json .firebaserc storage.rules \
            lib/main.dart lib/deda_backend.dart lib/admin_pages.dart
          node --check qa/stage2/isolated_admin_firestore_rules_runtime_2026_11_23.test.cjs
          node --check qa/stage2/isolated_admin_tasks_rules_runtime_2026_11_23.test.cjs
          node --check qa/stage2/isolated_admin_users_rules_runtime_2026_11_23.test.cjs
          node --check qa/stage2/isolated_admin_owner_place_notice_runtime_2026_11_23.test.cjs
          node --check qa/stage2/isolated_admin_support_trash_rules_runtime_2026_11_23.test.cjs
          test "$GOOGLE_CLOUD_PROJECT" = demo-deda-stage2-isolated-admin-private-qa
          echo 'PASS_PROTECTED_RULES_AND_BASE_APP_UNCHANGED'
      - name: Test legacy-invite preflight with fake local records, no Firebase
        run: python3 qa/stage2/isolated_admin_invite_preflight_2026_11_23.py --self-test
      - name: Install throwaway emulator tooling in runner temp only
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          mkdir -p "$root"
          npm install --prefix "$root" --no-save --no-audit --no-fund \
            firebase-tools@13.35.1 firebase@11.10.0 \
            @firebase/rules-unit-testing@4.0.0
          echo "NODE_PATH=$root/node_modules" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json,os,pathlib,shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'deda-stage2-admin-runtime'
          p=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'firestore.rules'
          assert p.exists() and p.stat().st_size>10000
          shutil.copy2(p,root/'checked-in-firestore.rules')
          assert (root/'checked-in-firestore.rules').read_bytes()==p.read_bytes()
          (root/'firebase.json').write_text(json.dumps({
              'firestore': {'rules': 'checked-in-firestore.rules'},
              'emulators': {'firestore': {'host': '127.0.0.1', 'port': 8097},
                            'ui': {'enabled': False}}
          }))
          print('PASS_USE_CHECKED_IN_RULES_LOCAL_ONLY')
          PY
      - name: Exercise actual Firestore security rules on fake staff, invite, and recovery records
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          "$root/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-stage2-isolated-admin-private-qa \
            --config "$root/firebase.json" \
            --only firestore --non-interactive \
            'node --test qa/stage2/isolated_admin_firestore_rules_runtime_2026_11_23.test.cjs'
          echo 'PASS_EMULATOR_RUNTIME_ONLY_NO_REAL_FIREBASE_DATA'
      - name: Test original tasks and rewards rules on synthetic local emulator data
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          "$root/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-stage2-isolated-admin-private-qa \
            --config "$root/firebase.json" \
            --only firestore --non-interactive \
            'node --test qa/stage2/isolated_admin_tasks_rules_runtime_2026_11_23.test.cjs'
          echo 'PASS_STAGE2_TASKS_RUNTIME_EMULATOR_ONLY_NO_REWARD_PAYMENTS'
      - name: Exercise isolated user-directory and audited account-read rules on fake records
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          "$root/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-stage2-isolated-admin-private-qa \
            --config "$root/firebase.json" \
            --only firestore --non-interactive \
            'node --test qa/stage2/isolated_admin_users_rules_runtime_2026_11_23.test.cjs'
          echo 'PASS_USERS_DIRECTORY_AUDIT_EMULATOR_ONLY_NO_PUBLIC_USER_WRITES'
      - name: Check manual owner notice and audit against current rules in emulator only
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          "$root/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-stage2-isolated-admin-private-qa \
            --config "$root/firebase.json" \
            --only firestore --non-interactive \
            'node --test qa/stage2/isolated_admin_owner_place_notice_runtime_2026_11_23.test.cjs'
          echo 'STAGE2_OWNER_NOTICE_EMULATOR_ONLY_LEGACY_RULE_GAP_HOLD'
      - name: Check original support trash rules and reversible GM audit on fake records
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          "$root/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-stage2-isolated-admin-private-qa \
            --config "$root/firebase.json" \
            --only firestore --non-interactive \
            'node --test qa/stage2/isolated_admin_support_trash_rules_runtime_2026_11_23.test.cjs'
          echo 'SUPPORT_TRASH_EMULATOR_ONLY_LEGACY_ROLELESS_RELEASE_HOLD'
      - name: Generate rules hardening CANDIDATE into runner temp, never repository
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          export DEDA_ADMIN_CANDIDATE_RULES_PATH="$root/candidate.rules"
          python3 qa/stage2/build_isolated_admin_gateway_anchor_candidate_2026_11_23.py \
            --output "$DEDA_ADMIN_CANDIDATE_RULES_PATH"
          node --check qa/stage2/isolated_admin_gateway_anchor_candidate_2026_11_23.test.cjs
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'deda-stage2-admin-runtime'
          rules=root/'candidate.rules'
          assert rules.exists() and rules.stat().st_size>10000
          (root/'candidate-firebase.json').write_text(json.dumps({
            'firestore': {'rules': 'candidate.rules'},
            'emulators': {'auth': {'host': '127.0.0.1', 'port': 9097},
                          'firestore': {'host': '127.0.0.1', 'port': 8097},
                          'ui': {'enabled': False}}
          }))
          PY
          echo "DEDA_ADMIN_CANDIDATE_RULES_PATH=$DEDA_ADMIN_CANDIDATE_RULES_PATH" >> "$GITHUB_ENV"
      - name: Verify protected GM gateway candidate on fake local emulator only
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          "$root/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-stage2-isolated-admin-anchor-qa \
            --config "$root/candidate-firebase.json" \
            --only firestore --non-interactive \
            'node --test qa/stage2/isolated_admin_gateway_anchor_candidate_2026_11_23.test.cjs'
          echo 'PASS_LOCAL_CANDIDATE_ANCHOR_ONLY_NOT_PRODUCTION_DEPLOYED'
      - name: Verify secondary Firebase Auth and Firestore invitation lifecycle with TWO apps
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/deda-stage2-admin-runtime"
          node --check qa/stage2/isolated_admin_secondary_auth_activation_emulator_2026_11_23.test.cjs
          "$root/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-stage2-isolated-admin-anchor-qa \
            --config "$root/candidate-firebase.json" \
            --only auth,firestore --non-interactive \
            'node --test qa/stage2/isolated_admin_secondary_auth_activation_emulator_2026_11_23.test.cjs'
          echo 'PASS_TWO_FIREBASE_APPS_AUTH_EMULATOR_NO_PRODUCTION_ACCOUNT'
      - name: Verify no writes to source, production or build outputs
        if: always()
        shell: bash
        run: |
          echo 'NO_FIREBASE_DEPLOY_NO_GOOGLE_PLAY_NO_APK_NO_USER_DATA'
          git diff --exit-code -- firestore.rules firebase.json lib/main.dart
