name: DEDA 100441 STAGE6 GOOGLE-FIRST NEW OWNER PRIVATE QA NO DEPLOY

on:
  push:
    branches:
      - deda-100441-stage6-new-owner-google-enrollment-private-no-deploy-2026-11-08
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-100441-stage6-google-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage6-server-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-deda-100441-legacy340-anti-split
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}

      - name: Prove strict source-only change scope and protected production baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base="487047610e55cf9c031b12c437874837ab6dec0d"
          stop="3850c93b7a18e11613a951a32dc520701717a263"
          names=set(subprocess.check_output(
            ["git","diff","--name-only",base,"HEAD"],text=True
          ).splitlines())
          allowed={
            "functions/deda_100441_new_owner_google_enrollment_PRIVATE_NOT_EXPORTED.js",
            "functions/test/deda_100441_new_owner_google_enrollment_PRIVATE.test.js",
            "functions/test/deda_100441_new_owner_google_enrollment_EMULATOR_ONLY.test.js",
            "lib/deda_stage6_new_account_google_handoff_PRIVATE_NOT_WIRED.dart",
            "test/deda_stage6_new_account_google_handoff_private_test.dart",
            ".github/workflows/deda-100441-stage6-new-google-owner-enrollment-private-qa-no-deploy-2026-11-08.yml",
            "docs/DEDA_100441_STAGE6_GOOGLE_FIRST_NEW_OWNER_ENROLLMENT_PRIVATE_QA_CHECKPOINT_2026-11-08.md",
          }
          assert names and names<=allowed,"UNEXPECTED_CHANGED_PATH:"+str(names-allowed)
          lib={x for x in names if x.startswith("lib/")}
          assert lib=={"lib/deda_stage6_new_account_google_handoff_PRIVATE_NOT_WIRED.dart"}
          subprocess.check_call(["git","merge-base","--is-ancestor",stop,"HEAD"])
          print("PASS_STAGE6_ONLY_ISOLATED_FILES")
          PY
          git diff --quiet 3850c93b7a18e11613a951a32dc520701717a263 -- \
            lib/main.dart lib/deda_pin_auth.dart lib/deda_backend.dart \
            lib/deda_step2_smart_second_stage_account_page_100439.dart \
            lib/deda_step1_google_settings_link_100439.dart \
            lib/deda_step2_google_replacement_login_100439.dart \
            lib/deda_100430_owner_uid_continuity.dart android/ assets/ \
            firestore.rules firebase.json storage.rules functions/index.js \
            pubspec.yaml pubspec.lock
          ! grep -Fq 'deda_100441_new_owner_google_enrollment_PRIVATE_NOT_EXPORTED' functions/index.js
          ! grep -Fq 'deda_stage6_new_account_google_handoff_PRIVATE_NOT_WIRED' lib/main.dart
          echo PASS_100340_AND_100440_100441_PRODUCTION_SOURCE_UNTOUCHED

      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}

      - name: Check private source syntax and run new enrollment attack and idempotence QA
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/deda_100441_new_owner_google_enrollment_PRIVATE_NOT_EXPORTED.js
          node --test functions/test/deda_100441_new_owner_google_enrollment_PRIVATE.test.js
          node --test functions/test/deda_100441_same_uid_recovery_readiness_PRIVATE.test.js
          node --test functions/test/deda_100441_canonical_uid_preflight_callable_PRIVATE.test.js
          node --test functions/test/deda_100441_server_canonical_uid_read_adapter_PRIVATE.test.js
          node --test functions/test/deda_100441_canonical_uid_anti_split_preflight_PRIVATE.test.js

      - name: Install disposable local Auth and Firestore emulator dependencies
        shell: bash
        run: |
          npm install --prefix tests/firestore-rules --no-save --no-audit --no-fund firebase-tools@14
          npm install --prefix functions --no-save --no-audit --no-fund firebase@12.3.0

      - name: Preserve published 100340 PIN operations on local Firestore rules
        shell: bash
        run: |
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100441-legacy340-anti-split \
            --only firestore \
            'node --test tests/firestore-rules/deda_100441_legacy340_auth_anti_split_compat_PRIVATE.test.mjs'

      - name: New enrollment must deny real unlinked password and anonymous Firebase accounts
        shell: bash
        run: |
          set -euo pipefail
          export FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          export GCLOUD_PROJECT=demo-deda-stage6-google-enroll-negative
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --config firebase.100441.server-emulators.qa.json \
            --project demo-deda-stage6-google-enroll-negative \
            --only auth,firestore \
            'node --test functions/test/deda_100441_new_owner_google_enrollment_EMULATOR_ONLY.test.js'

      - name: Retain stage5 same UID on two emulated phones
        shell: bash
        run: |
          set -euo pipefail
          export FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          export GCLOUD_PROJECT=demo-deda-100441-two-device-continuity
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --config firebase.100441.server-emulators.qa.json \
            --project demo-deda-100441-two-device-continuity \
            --only auth,firestore \
            'node --test functions/test/deda_100441_same_uid_two_device_AUTH_FIRESTORE_EMULATOR_ONLY.test.js'

      - name: Confirm no release, deployment or protected data write
        shell: bash
        run: |
          set -euo pipefail
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          git diff --quiet 3850c93b7a18e11613a951a32dc520701717a263 -- \
            lib/main.dart lib/deda_pin_auth.dart lib/deda_backend.dart \
            firestore.rules firebase.json functions/index.js android/ assets/
          echo PASS_NO_AUTH_OR_FIRESTORE_PRODUCTION_WRITE_NO_APK_NO_PLAY

  stage6-flutter-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: false

      - name: Analyze unconnected Flutter registration handoff
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze --fatal-infos \
            lib/deda_stage6_new_account_google_handoff_PRIVATE_NOT_WIRED.dart \
            test/deda_stage6_new_account_google_handoff_private_test.dart

      - name: Execute Flutter new-account safety contract
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub test/deda_stage6_new_account_google_handoff_private_test.dart
          ! grep -Fq 'deda_stage6_new_account_google_handoff_PRIVATE_NOT_WIRED' lib/main.dart
          ! grep -Fq 'DEDA_STAGE6_NEW_GOOGLE_OWNER_PRIVATE_PILOT' .github/workflows/deda-100440-full-google-smart-recovery-admin100m-signed-owner-apk-no-play.yml
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo PASS_FLUTTER_PRIVATE_HANDOFF_DEFAULT_OFF_NO_APP_INTEGRATION_NO_APK
