name: DEDA Stage33 ACTUAL deployed location-share Rules client attacks NO DEPLOY
on:
  push:
    branches:
      - deda-weekly-stage33-live-share-rules-audit-no-deploy-2026-10-28
    paths:
      - 'tests/firestore-rules/stage33_live_original_share_rules.test.mjs'
      - '.github/workflows/qa-deda-weekly-stage33-actual-live-original-share-rules-no-deploy.yml'
      - 'docs/DEDA_WEEKLY_STAGE33_ACTUAL_LIVE_SHARE_RULES_AUDIT_2026-10-28.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-stage33-live-rules-readonly-qa
  cancel-in-progress: true
jobs:
  actual-published-rules-private-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Protect live original app and backend/rules from changes
        run: |
          set -euo pipefail
          git diff --quiet 6f7cc004421166cda6f6b092efd3ffb611e38cbf -- \
            lib/main.dart lib/deda_backend.dart lib/deda_social_service.dart \
            functions/index.js firestore.rules firebase.json storage.rules \
            functions/package.json pubspec.yaml pubspec.lock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install local test dependencies (NO prod deployment)
        run: |
          set -euo pipefail
          python -m pip install --quiet google-auth requests
          npm --prefix tests/firestore-rules install --no-audit --no-fund
      - name: GET ACTUAL current deployed Firestore rules into ephemeral runner file
        env:
          FIREBASE_SERVICE_ACCOUNT_DEDA_25B88: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
          DEDA_STAGE24_LIVE_RULES_TMPFILE: ${{ runner.temp }}/deda-stage33-actual-live.rules
        run: |
          set -euo pipefail
          python tools/app_stability/deda_weekly_live_rules_emulator_fetch_stage24.py
          test -s "$DEDA_STAGE24_LIVE_RULES_TMPFILE"
      - name: Test original-share rules against legitimate writer and malicious clients in DEMO emulator
        env:
          DEDA_STAGE24_LIVE_RULES_TMPFILE: ${{ runner.temp }}/deda-stage33-actual-live.rules
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14 emulators:exec --only firestore \
            --project demo-deda-stage33-real-share-rules-audit \
            "cd tests/firestore-rules && node --test stage33_live_original_share_rules.test.mjs"
          echo "Only private LIVE RULES snapshot tested on DEMO emulator; no production writes."
      - name: Erase privately fetched production rules file
        if: always()
        env:
          DEDA_STAGE24_LIVE_RULES_TMPFILE: ${{ runner.temp }}/deda-stage33-actual-live.rules
        run: |
          rm -f "$DEDA_STAGE24_LIVE_RULES_TMPFILE"
          echo "No ruleset contents uploaded or published."
