name: DEDA second-phone canonical wallet cutover real Firestore emulator NO DEPLOY
on:
  push:
    branches:
      - deda-owner-cross-device-actual-restoration-integration-no-deploy-2026-10-29
    paths:
      - '.github/workflows/qa-deda-second-phone-cutover-wallet-real-firestore-emulator-no-deploy.yml'
      - 'tools/app_stability/progress_archive/prepare-owner-cutover-wallet-fence.cjs'
      - 'tests/firestore-rules/deda_second_phone_writer_fence_emulator.test.mjs'
      - 'firestore.rules'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-second-phone-cutover-candidate-emulator
  cancel-in-progress: true
jobs:
  candidate-firestore-emulator-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GCLOUD_PROJECT: demo-deda-second-phone-wallet-fence
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      DEDA_SECOND_PHONE_FENCE_RULES: /tmp/deda-second-phone-fence-qa.rules
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hard stop on any modification to protected original and production
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 0915c51f251c7a9e197e6e971d66fc6e1402b8b7 -- \
            firestore.rules functions/index.js firebase.json storage.rules \
            lib/main.dart lib/deda_backend.dart lib/deda_pin_auth.dart \
            android/ assets/ pubspec.yaml
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo "PASS: original app, production rules and old wallet untouched"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install temporary emulator and rules unit testing only
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests/firestore-rules --no-save --no-audit --no-fund \
            @firebase/rules-unit-testing@5 firebase@12.3.0 firebase-tools@14
      - name: Generate isolated candidate from protected original Firestore rules
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/app_stability/progress_archive/prepare-owner-cutover-wallet-fence.cjs
          node --check tests/firestore-rules/deda_second_phone_writer_fence_emulator.test.mjs
          node - <<'NODE'
          const fs=require('node:fs');
          const {prepareCutoverWalletFenceRules}=require('./tools/app_stability/progress_archive/prepare-owner-cutover-wallet-fence.cjs');
          const base=fs.readFileSync('firestore.rules','utf8');
          fs.writeFileSync(process.env.DEDA_SECOND_PHONE_FENCE_RULES,prepareCutoverWalletFenceRules(base));
          fs.writeFileSync('/tmp/deda-second-phone-fence-qa.firebase.json',JSON.stringify({
            firestore:{rules:process.env.DEDA_SECOND_PHONE_FENCE_RULES},
            emulators:{firestore:{host:'127.0.0.1',port:8080},ui:{enabled:false}}
          }));
          console.log('PASS: ephemeral candidate and local-only emulator config');
          NODE
      - name: Execute real old/new/third-phone wallet and frame scenarios
        shell: bash
        run: |
          set -euo pipefail
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --config /tmp/deda-second-phone-fence-qa.firebase.json \
            --project demo-deda-second-phone-wallet-fence --only firestore \
            'node --test tests/firestore-rules/deda_second_phone_writer_fence_emulator.test.mjs'
          echo "PASS: Firestore emulator rules tests; NO DEPLOY OR APK"
