name: DEDA جمال التطبيق المتكاملة Stage22 ECDSA SSV Staged Offline-Key Emulator NO DEPLOY

on:
  push:
    branches:
      - deda-jamal-stage22-admob-ssv-staged-ecdsa-no-deploy-2026-10-19
    paths:
      - 'tools/deda_jamal_stage22_admob_ssv_ecdsa_staged_no_deploy_2026_10_19.js'
      - 'test/deda_jamal_stage22_signed_provider_callback_firestore_emulator.test.js'
      - '.github/workflows/qa-deda-jamal-stage22-admob-ssv-ecdsa-emulator-no-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-jamal-stage22-google-shaped-ecdsa-emulator-no-deploy
  cancel-in-progress: true

jobs:
  lock-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Stage21 rollback source remains untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet ea42c66d98bf5f249665d7603200bfa8da1c384d -- \
            lib/ android/ assets/ firestore.rules firebase.json \
            functions/ pubspec.yaml pubspec.lock \
            tools/deda_jamal_stage21_reward_attestation_emulator_only_2026_10_19.js
          ! grep -q 'deda_jamal_stage22_admob_ssv' functions/index.js
          ! grep -q 'stage22_ssv' functions/index.js
          test -f tools/deda_jamal_stage22_admob_ssv_ecdsa_staged_no_deploy_2026_10_19.js
          node --check tools/deda_jamal_stage22_admob_ssv_ecdsa_staged_no_deploy_2026_10_19.js
          node --check test/deda_jamal_stage22_signed_provider_callback_firestore_emulator.test.js
          echo 'PASS no real AdMob callback endpoint, wallet deploy, APK or buy buttons'
  fake-provider-ecdsa-firestore:
    needs: lock-production
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install throwaway Firebase SDK, security rules testing, local emulator
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Pinned ephemeral ECDSA sign/verify and verified-only wallet transaction tests
        shell: bash
        run: |
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-stage22-ssv-fakeprovider --only firestore \
            'node --test test/deda_jamal_stage22_signed_provider_callback_firestore_emulator.test.js'
          echo 'PASS Stage22 OFFLINE GENERATED FAKE EC KEY ONLY; GOOGLE OFFICIAL KEYS NOT YET VERIFIED'
  no-publish:
    needs: [lock-production,fake-provider-ecdsa-firestore]
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm strict non-production
        run: |
          echo 'PASS no actual Google AdMob verification, no live paid diamonds, no Android build/deploy'
