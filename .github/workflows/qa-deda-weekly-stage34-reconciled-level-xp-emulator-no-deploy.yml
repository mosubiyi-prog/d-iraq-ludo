name: DEDA Stage34 Atomic reconciled LEVEL XP and frozen league DEMO ONLY
on:
  push:
    branches:
      - deda-weekly-stage34-canonical-level-xp-atomic-shadow-emulator-no-deploy-2026-10-28
    paths:
      - 'functions/deda_weekly_stage34_atomic_reconciled_level_xp_NOT_EXPORTED.js'
      - 'functions/tests/deda_weekly_stage34_atomic_reconciled_level_xp.test.js'
      - '.github/workflows/qa-deda-weekly-stage34-reconciled-level-xp-emulator-no-deploy.yml'
      - 'docs/DEDA_WEEKLY_STAGE34_RECONCILED_XP_ATOMIC_EMULATOR_CHECKPOINT_2026-10-28.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-weekly-stage34-level-xp-private
  cancel-in-progress: true
jobs:
  protect-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve original application, Functions, live rules, original wallet
        run: |
          set -euo pipefail
          git diff --quiet 6f7cc004421166cda6f6b092efd3ffb611e38cbf -- \
            functions/index.js functions/package.json \
            firebase.json firestore.rules storage.rules \
            lib/main.dart lib/deda_backend.dart lib/deda_social_service.dart \
            lib/deda_weekly_leaderboard_page.dart \
            tools/app_stability/app_package pubspec.yaml pubspec.lock
          node --check functions/deda_weekly_stage34_atomic_reconciled_level_xp_NOT_EXPORTED.js
          node --check functions/tests/deda_weekly_stage34_atomic_reconciled_level_xp.test.js
          node - <<'JS'
          const fs=require("node:fs");
          const live=fs.readFileSync("functions/index.js","utf8");
          if(live.includes("deda_weekly_stage34_atomic_reconciled_level_xp"))
            throw Error("Do not export a private model as a live Cloud Function");
          const source=fs.readFileSync(
            "functions/deda_weekly_stage34_atomic_reconciled_level_xp_NOT_EXPORTED.js","utf8");
          for(const key of ["FIRESTORE_EMULATOR_HOST","authoritativeBaselineVerified",
            "originalLevelXpBaseline","levelXpAlreadyApplied","levelXpAdded",
            "leagueXpAdded","local_emulator_only"]){
            if(!source.includes(key))throw Error("Missing guard: "+key);
          }
          const rules=fs.readFileSync("tools/app_stability/stage30/firestore.rules","utf8");
          if(!rules.includes("allow read, write: if false"))
            throw Error("Only deny-all local emulator may be used");
          console.log("PASS original DEDA and users' resources untouched");
          JS
      - name: Existing weekly ranking and frozen card unit regression
        run: |
          node --test \
            functions/tests/deda_weekly_stage29_task_to_rank_emulator.test.js \
            functions/tests/deda_weekly_stage31_frozen_league_winner_card.test.js
  atomic-firestore-emulator:
    needs: protect-original
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GCLOUD_PROJECT: demo-deda-weekly-xp-stage9
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install private Firebase simulator only
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase-tools@14
      - name: Verify one transaction, two-device replay, refused baseline, frozen league
        run: |
          set -euo pipefail
          functions/node_modules/.bin/firebase emulators:exec \
            --config tools/app_stability/stage30/firebase.json \
            --project demo-deda-weekly-xp-stage9 --only firestore \
            'node --test functions/tests/deda_weekly_stage34_atomic_reconciled_level_xp.test.js'
  private-success:
    needs: [protect-original,atomic-firestore-emulator]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "Private Stage34 verified transaction model only."
          echo "No trusted real account migration or original XP backend exists yet."
          echo "NO real XP, prizes, public Firebase writes, signed APK, AAB or Play rollout."
