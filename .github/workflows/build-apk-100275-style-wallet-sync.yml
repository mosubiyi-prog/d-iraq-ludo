name: Build DEDA 100275 Style Wallet Sync

on:
  push:
    branches:
      - style-wallet-sync-100275-2026-10-05
    paths:
      - '.github/workflows/build-apk-100275-style-wallet-sync.yml'

jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-100275]')
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100275 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100275
        run: bash tools/build_100275_style_wallet_sync.sh

      - name: Upload APK 100275
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100275-style-wallet-sync-apk
          path: build/app/outputs/flutter-apk/app-release.apk
