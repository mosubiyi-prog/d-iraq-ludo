name: Build DEDA 100287 Navigation Driver Mode

on:
  push:
    branches:
      - navigation-polish-driver-mode-100287-2026-10-06
    paths:
      - '.github/workflows/build-apk-100287-navigation-driver-mode.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100287 navigation branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100287
        run: bash tools/build_100287_navigation_driver_mode.sh

      - name: Upload APK 100287
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100287-navigation-driver-mode-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
