name: Deploy DEDA 100270 Social and Diamond Rules

on:
  push:
    branches:
      - social-fixes-admin-gems-100270-2026-10-04
    paths:
      - '.github/workflows/deploy-firestore-100270-social-admin-gems.yml'
      - 'tools/firestore_social_admin_diamonds_100270_2026_10_04.py'
      - 'tools/hotfix_social_first_request_get_100269_2026_10_04.py'
      - 'tools/hotfix_social_list_query_100269_2026_10_04.py'

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-100270]')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated 100270 branch
        uses: actions/checkout@v4

      - name: Reconstruct and validate Firestore rules
        run: |
          set -euo pipefail
          python3 tools/add_social_firestore_rules_100269_2026_10_04.py
          python3 tools/stabilize_social_rules_identity_100269_2026_10_04.py
          python3 tools/hotfix_social_first_request_get_100269_2026_10_04.py
          python3 tools/hotfix_social_list_query_100269_2026_10_04.py
          python3 tools/firestore_social_admin_diamonds_100270_2026_10_04.py
          grep -q "DEDA_SOCIAL_QUERY_RULES_100270" firestore.rules
          grep -q "DEDA_SOCIAL_ADMIN_DIAMONDS_100270" firestore.rules
          grep -q "deda_admin_diamond_wallets" firestore.rules
          grep -q "deda_diamond_gift_balances" firestore.rules
          grep -q "deda_diamond_gifts" firestore.rules

      - name: Select Firebase credential
        id: auth
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_DEDA_25B88: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_DEDA_25B88:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_DEDA_25B88" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "mode=service" >> "$GITHUB_OUTPUT"
            echo "path=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_OUTPUT"
          elif [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "mode=service" >> "$GITHUB_OUTPUT"
            echo "path=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_OUTPUT"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "No Firebase deployment credential is configured." >&2
            exit 2
          fi

      - name: Deploy Firestore rules with service account
        if: steps.auth.outputs.mode == 'service'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.path }}
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project deda-25b88 --non-interactive

      - name: Deploy Firestore rules with CI token
        if: steps.auth.outputs.mode == 'token'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project deda-25b88 --token "$FIREBASE_TOKEN" --non-interactive
