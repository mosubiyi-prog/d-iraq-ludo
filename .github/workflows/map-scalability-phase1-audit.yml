name: DEDA Map Scalability Phase 1 Offline Audit

on:
  push:
    branches:
      - map-scalability-readiness-phase1-2026-10-08
    paths:
      - '.github/workflows/map-scalability-phase1-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout protected DEDA 100318 lineage
        uses: actions/checkout@v4
      - name: Audit source without network load or app mutation
        run: |
          python3 tools/audit_map_scalability_phase1.py
          python3 - <<'PY'
          import json
          d=json.load(open("map_scale_phase1_audit.json"))
          assert len(d["known_risks"]) >= 5
          assert all(i["passed"] for i in d["checks"])
          print("PASS: phase 1 audit JSON and known scalability risks reviewed.")
          PY
      - name: Confirm app runtime source is identical to successful 100318 checkpoint
        run: |
          git fetch --no-tags origin backup-100318-field-tested-user-heading-camera-2026-10-08:refs/remotes/origin/backup-100318-field-tested-user-heading-camera-2026-10-08
          git diff --exit-code origin/backup-100318-field-tested-user-heading-camera-2026-10-08 -- lib/main.dart lib/places_service.dart lib/deda_backend.dart lib/deda_road_class_lookup.dart pubspec.yaml firestore.rules || {
            echo "Cannot prove no map runtime changes against checkpoint. STOP."
            exit 1
          }
      - name: Upload audit findings (not an APK)
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-map-scalability-phase1-audit
          path: map_scale_phase1_audit.json
          if-no-files-found: error
