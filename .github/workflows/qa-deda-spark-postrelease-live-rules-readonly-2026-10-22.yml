name: DEDA Spark Post-Deploy LIVE Rules Verification READONLY
on:
  push:
    branches: [deda-100374-ids-qa32-frames-deferred-2026-10-21]
    paths: ['.github/workflows/qa-deda-spark-postrelease-live-rules-readonly-2026-10-22.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-live-verified-spark:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DEDA_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      DEDA_FALLBACK_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove only Spark aliases enabled, old Firestore rules byte-preserved
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY_VERIFY'
          import hashlib,json,os,requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          raw=os.getenv('DEDA_SERVICE_ACCOUNT') or os.getenv('DEDA_FALLBACK_ACCOUNT')
          if not raw:raise SystemExit("SAFE_STOP_NO_ACCOUNT")
          info=json.loads(raw)
          if info.get('project_id')!='deda-25b88':raise SystemExit("SAFE_STOP_WRONG_PROJECT")
          cred=service_account.Credentials.from_service_account_info(info,
             scopes=['https://www.googleapis.com/auth/cloud-platform'])
          cred.refresh(Request())
          h={'Authorization':'Bearer '+cred.token}
          base='https://firebaserules.googleapis.com/v1/'
          rel=requests.get(base+'projects/deda-25b88/releases/cloud.firestore',
                           headers=h,timeout=25)
          if rel.status_code!=200:raise SystemExit('SAFE_STOP_RELEASE_NOT_READABLE')
          name=rel.json()['rulesetName']
          item=requests.get(base+name,headers=h,timeout=25)
          if item.status_code!=200:raise SystemExit('SAFE_STOP_RULESET_NOT_READABLE')
          files=item.json().get('source',{}).get('files',[])
          if len(files)!=1:raise SystemExit('SAFE_STOP_MULTIFILE_RELEASE')
          live=files[0]['content']
          sha=hashlib.sha256(live.encode()).hexdigest()
          expected='12473b12e32f588873926fba52fa3d81c2a014cb72e163d10dcc14a39f02f34e'
          if sha!=expected:raise SystemExit('SAFE_STOP_SPARK_LIVE_RULESET_DIFFERENT')
          if name!='projects/deda-25b88/rulesets/d48d7bee-f116-47a1-a807-08ec301235a4':
            raise SystemExit('SAFE_STOP_SPARK_LIVE_RELEASE_CHANGED')
          for key in ('deda_public_alias_routes','deda_public_active_aliases'):
            if live.count('match /'+key+'/')!=1:
              raise SystemExit('SAFE_STOP_PUBLIC_INDEX_RULES_NOT_EXACT')
          print('PASS_INDEPENDENT_FIREBASE_SPARK_RULES_LIVE_SHA256',sha)
          print('PASS_ONLY_TWO_OWNER_APPROVED_PUBLIC_ALIAS_MATCHES')
          print('PASS_PREVIOUS_PRODUCTION_RULES_BYTE_PRESERVED_BY_PUBLISH_GUARD')
          print('PASS_SPARK_NO_FUNCTIONS_NO_BILLING_PLAN_CHANGE')
          PY_VERIFY
