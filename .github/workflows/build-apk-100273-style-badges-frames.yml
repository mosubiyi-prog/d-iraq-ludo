name: Build DEDA 100273 Style Badges Frames

# retry-6: recover the approved JPEG from its repository chunks before cropping
on:
  push:
    branches:
      - style-badges-frames-100273-2026-10-05
    paths:
      - '.github/workflows/build-apk-100273-style-badges-frames.yml'

jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-100273]')
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100273 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100273
        run: bash tools/build_100273_style_badges_frames.sh

      - name: Upload APK 100273
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100273-style-badges-frames-apk
          path: build/app/outputs/flutter-apk/app-release.apk
