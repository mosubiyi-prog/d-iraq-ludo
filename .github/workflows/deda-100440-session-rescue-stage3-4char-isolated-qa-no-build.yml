name: DEDA 100440 Stage3 session rescue + four-char premium ID isolated QA NO BUILD
on:
  push:
    branches:
      - deda-100440-session-rescue-isolated-owner-review-2026-11-07
    paths:
      - 'lib/deda_session_recovery_coordinator.dart'
      - 'lib/deda_session_rescue_stage3_core.dart'
      - 'lib/deda_session_rescue_stage3_bridge.dart'
      - 'test/deda_session_recovery_coordinator_private_test.dart'
      - 'test/deda_session_rescue_stage3_4char_private_test.dart'
      - 'tools/app_stability/app_package/bind_session_rescue_stage3_100441.py'
      - 'tools/app_stability/app_package/bind_session_rescue_friends_retry_100441.py'
      - '.github/workflows/deda-100440-session-rescue-stage3-4char-isolated-qa-no-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-100440-stage3-four-character-owner-review
  cancel-in-progress: false

jobs:
  test-isolated-and-disposable:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove 100440 original source, wallet, rules and entry untouched
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base='958ed9a3c9cce0f207e98d8956e8b659e1ff7246'
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          permitted={
            'docs/DEDA_100440_OWNER_LOCKED_SESSION_RESCUE_PLAN_2026-11-07.md',
            'docs/DEDA_100440_SESSION_RESCUE_STAGE2_QA_STOP_2026-11-07.md',
            'docs/DEDA_100440_SESSION_RESCUE_STAGE3_4CHAR_QA_STOP_2026-11-07.md',
            'docs/DEDA_100440_STAGE4_OWNER_DIAMONDS_READONLY_AUDIT_2026-11-07.md',
            'docs/DEDA_100440_STAGE4_STEP1_SESSION_RESCUE_FINAL_COMPAT_AUDIT_2026-11-07.md',
            '.github/workflows/deda-100440-friends-retry-baseline-source-inspection-no-build.yml',
            'lib/deda_session_recovery_coordinator.dart',
            'lib/deda_session_rescue_stage3_core.dart',
            'lib/deda_session_rescue_stage3_bridge.dart',
            'test/deda_session_recovery_coordinator_private_test.dart',
            'test/deda_session_rescue_stage3_4char_private_test.dart',
            'tools/app_stability/app_package/bind_session_rescue_stage3_100441.py',
            'tools/app_stability/app_package/bind_session_rescue_friends_retry_100441.py',
            '.github/workflows/deda-100440-session-rescue-stage2-isolated-qa-no-build.yml',
            '.github/workflows/deda-100440-session-rescue-stage3-4char-isolated-qa-no-build.yml',
          }
          assert changed.issubset(permitted),(changed-permitted)
          protected={'lib/main.dart','lib/deda_backend.dart','pubspec.yaml',
                     'pubspec.lock','firestore.rules','firebase.json',
                     'google-services.json','android','assets'}
          assert not changed.intersection(protected)
          print('PASS_STAGE3_PROTECTED_100440_NO_SOURCE_OVERWRITE')
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
      - name: Install ephemeral packages
        run: flutter pub get
      - name: Format isolated Dart candidate in disposable runner only
        run: dart format lib/deda_session_recovery_coordinator.dart lib/deda_session_rescue_stage3_core.dart lib/deda_session_rescue_stage3_bridge.dart test/deda_session_recovery_coordinator_private_test.dart test/deda_session_rescue_stage3_4char_private_test.dart
      - name: Analyze coordinator, exact owner proof, four-letter alias and bridge
        run: dart analyze --no-fatal-warnings lib/deda_session_recovery_coordinator.dart lib/deda_session_rescue_stage3_core.dart lib/deda_session_rescue_stage3_bridge.dart test/deda_session_recovery_coordinator_private_test.dart test/deda_session_rescue_stage3_4char_private_test.dart
      - name: Run stage2 regressions and stage3 four-char UID security tests
        run: flutter test --no-pub --dart-define=DEDA_QA32_SPARK_PUBLIC_IDS_LIVE=true test/deda_session_recovery_coordinator_private_test.dart test/deda_session_rescue_stage3_4char_private_test.dart
      - name: Verify source-only binder on disposable clone; do not build APK
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/app_stability/app_package/bind_session_rescue_stage3_100441.py
          python3 - <<'PY'
          import json,shutil,tempfile
          from pathlib import Path
          from tools.app_stability.app_package.bind_session_rescue_stage3_100441 import bind
          with tempfile.TemporaryDirectory(prefix='deda-stage3-no-live-') as td:
              root=Path(td)
              (root/'lib').mkdir()
              for name in ['main.dart','deda_step1_google_settings_link_100439.dart']:
                  shutil.copy2(Path('lib')/name,root/'lib'/name)
              (root/'internal-build-inputs.json').write_text(json.dumps({}))
              main_before=(root/'lib/main.dart').read_bytes()
              google_before=(root/'lib/deda_step1_google_settings_link_100439.dart').read_bytes()
              bind(root)
              main=(root/'lib/main.dart').read_text()
              google=(root/'lib/deda_step1_google_settings_link_100439.dart').read_text()
              assert main.count('DedaSessionRescueStage3Bridge.runForPhone')==1 or main.count('DedaSessionRescueStage3Bridge')>=2
              assert main.count('mayRecheckAdminGateway')==1
              assert 'if (_adminEntryVisible) ...[' in main
              assert 'DedaSessionRescueStage3Bridge.updates.addListener' in google
              assert 'DedaSessionRescueStage3Bridge.updates.removeListener' in google
              assert 'linkGoogleToConfirmedOriginalUid' in google
              assert (root/'lib/deda_session_recovery_coordinator.dart').is_file()
              assert (root/'lib/deda_session_rescue_stage3_bridge.dart').is_file()
              assert (root/'lib/deda_session_rescue_stage3_core.dart').is_file()
              meta=json.loads((root/'internal-build-inputs.json').read_text())
              assert meta['sessionRescueStage3']['activePremiumIdMinLength']==4
              assert meta['sessionRescueStage3']['immutableOriginalIdLength']==6
              try:
                  bind(root)
                  raise AssertionError('duplicate binder unexpectedly passed')
              except ValueError as ex:
                  assert 'BLOCK_STAGE3_DUPLICATE_BIND' in str(ex)
              assert main_before!= (root/'lib/main.dart').read_bytes()
              assert google_before!= (root/'lib/deda_step1_google_settings_link_100439.dart').read_bytes()
          print('PASS_STAGE3_DISPOSABLE_GOOGLE_ADMIN_HOME_4CHAR_BIND')
          PY
      - name: Reassemble full 100440 source in disposable runner and analyze Stage3 without APK
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/deda-100440-stage3-disposable-full"
          flutter create --platforms=android --org com.diraq.ludo --project-name d_iraq_ludo "$project"
          python3 tools/app_stability/app_package/prepare.py "$project" --variant candidate
          for script in \
            bind_weekly_stage13.py \
            bind_active_id_boot_prewarm_stage14.py \
            bind_active_id_measured_startup_stage16.py \
            bind_weekly_private_trial_stage17.py \
            bind_weekly_full_qa_stage18.py \
            verify_rank_card_tap_stage19.py \
            bind_weekly_admin_league_stage27.py \
            bind_weekly_tasks_cta_stage28.py \
            bind_weekly_100397_owner_real_scores.py \
            bind_weekly_100398_after_level_xp.py \
            bind_weekly_100399_community_bridge.py \
            bind_weekly_100400_safe_score_retry.py \
            bind_weekly_100402_firestore_direct.py \
            bind_weekly_100403_first_open_gate.py \
            bind_weekly_100404_inline_clock_and_freeze.py \
            bind_weekly_100405_admin_live_read_only.py \
            bind_weekly_100406_league_display_fixes.py \
            bind_weekly_100407_full_avatar_shared_identity.py \
            bind_weekly_100408_seven_owner_points.py \
            bind_weekly_100409_single_verified_identity.py \
            bind_weekly_100410_unified_active_id.py \
            bind_weekly_100411_friend_copy_share.py \
            bind_weekly_100413_owner_id_admin_response.py \
            bind_weekly_100414_last_three.py \
            bind_weekly_100418_legacy340_friend_active_compat.py; do
            python3 "tools/app_stability/app_package/$script" "$project"
          done
          python3 tools/app_stability/app_package/guard_100436_parity_before_recovery.py "$project"
          shopt -s nullglob
          count=0
          for source in "$GITHUB_WORKSPACE"/lib/deda_step2_*.dart "$GITHUB_WORKSPACE"/lib/deda_100429*.dart "$GITHUB_WORKSPACE"/lib/deda_100430*.dart "$GITHUB_WORKSPACE"/lib/deda_100431*.dart "$GITHUB_WORKSPACE"/lib/deda_100432*.dart "$GITHUB_WORKSPACE"/lib/deda_100433*.dart; do
            target="$project/lib/$(basename "$source")"
            test ! -e "$target"
            cp "$source" "$target"
            count=$((count+1))
          done
          test "$count" -ge 30
          python3 tools/app_stability/app_package/guard_100436_parity_before_recovery.py "$project" --staged-recovery
          python3 tools/app_stability/app_package/merge_stage2_into_protected_100436.py "$project"
          python3 tools/app_stability/app_package/merge_stage2_into_protected_100436.py "$project" --verify-only
          python3 tools/app_stability/app_package/bind_admin_league_winners_prizes_100439.py "$project"
          python3 tools/app_stability/app_package/bind_google_account_settings_100439.py "$project"
          python3 tools/app_stability/app_package/bind_smart_second_stage_account_100439.py "$project"
          python3 tools/app_stability/app_package/bind_gm_compensation_100m_100439.py "$project"
          python3 tools/app_stability/app_package/bind_session_rescue_stage3_100441.py "$project"
          python3 tools/app_stability/app_package/bind_session_rescue_friends_retry_100441.py "$project"
          DEDA_STAGE3_PROJECT="$project" python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ['DEDA_STAGE3_PROJECT'])
          main=(p/'lib/main.dart').read_text()
          google=(p/'lib/deda_step1_google_settings_link_100439.dart').read_text()
          assert main.count('DedaSessionRescueStage3Bridge.runForPhone') >= 1
          assert main.count('mayRecheckAdminGateway')==1
          assert main.count('DedaGoogleSettingsLinkCard(')==1
          friend=main[main.index('class _DedaFriendsPageState'):main.index('class _DedaFriendCompactCard')]
          assert friend.count('DEDA_100441_FRIENDS_RETRY_FIX')==1
          assert '_onRescueReady' in friend
          assert 'DedaSessionRescueStage3Bridge.updates.addListener(_onRescueReady)' in friend
          assert 'DedaSessionRescueStage3Bridge.updates.removeListener(_onRescueReady)' in friend
          assert 'stream: _relationsStream,' in friend
          assert 'if (snapshot.hasError)' in friend
          assert 'if (!snapshot.hasData)' in friend
          assert 'onPressed: _prepare' not in friend
          assert 'DedaSocialService.watchRelations(verified.uid)' in friend
          assert 'final verifiedCount = snapshot.data!' in friend
          assert 'signInAnonymously(' not in friend and 'signOut(' not in friend
          print('PASS_FRIEND_RETRY_TOUCH_RESTART_SAME_UID_STREAM_ERROR_NOT_EMPTY')
          assert 'DedaSessionRescueStage3Bridge.updates.addListener' in google
          assert 'DedaSessionRescueStage3Bridge.updates.removeListener' in google
          assert 'linkGoogleToConfirmedOriginalUid' in google
          assert (p/'lib/deda_session_rescue_stage3_core.dart').is_file()
          assert (p/'lib/deda_session_rescue_stage3_bridge.dart').is_file()
          assert (p/'lib/deda_session_recovery_coordinator.dart').is_file()
          assert 'DedaStage71OwnedIdentifierService.active' in (
              p/'lib/deda_unified_active_id_100410.dart').read_text()
          meta=json.loads((p/'internal-build-inputs.json').read_text())
          assert meta['sessionRescueStage3']['defaultOff']
          assert meta['sessionRescueStage3']['activePremiumIdMinLength']==4
          print('PASS_FULL_100440_STAGE3_SOURCE_PARITY_GOOGLE_ADMIN_ACTIVE_ID')
          PY
          (
            cd "$project"
            flutter pub get
            dart analyze --no-fatal-warnings \
              lib/main.dart lib/deda_backend.dart \
              lib/deda_session_recovery_coordinator.dart \
              lib/deda_session_rescue_stage3_core.dart \
              lib/deda_session_rescue_stage3_bridge.dart \
              lib/deda_step1_google_settings_link_100439.dart
          )
          echo PASS_FULL_ASSEMBLED_STAGE3_DART_ANALYSIS_NO_APK_NO_DEPLOY
      - name: No production application, gifts, Firebase rules, APK, AAB or Play touched
        run: |
          echo PASS_STAGE3_ALL_ISOLATED_TESTS_NO_RUNTIME_OR_PRODUCTION_DEPLOY
          echo NO_APK_NO_AAB_NO_PLAY_NO_FIREBASE_RULES_NO_LIVE_DATA_WRITES
