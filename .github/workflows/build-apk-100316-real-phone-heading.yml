name: Build DEDA 100316 Real Phone And Reverse Arrow Heading
# Retry 100316: the GPS heading-owner patch now safely matches Dart-formatted indentation.

on:
  push:
    branches:
      - nav-arrow-real-user-orientation-100316-2026-10-08
    paths:
      - '.github/workflows/build-apk-100316-real-phone-heading.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100316 after proven 100315
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Build and validate only DEDA 100316 real phone heading
        run: bash tools/build_100316_real_phone_heading.sh
      - name: Upload signed APK DEDA 100316
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100316-real-user-arrow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
