name: DEDA 100436 Recovery Journal Real Firestore Emulator QA (NO DEPLOY)
on:
  push:
    branches:
      - deda-100436-recovery-journal-firestore-emulator-private-qa-no-deploy-2026-11-04
    paths:
      - '.github/workflows/qa-deda-100436-recovery-journal-emulator-no-deploy.yml'
      - 'qa/recovery_journal/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-100436-recovery-journal-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firebase-journal-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce exact owner-confirmed 100436 base and no application/Firebase writes
        shell: bash
        run: |
          set -euo pipefail
          BASE=40936af117d662f975a67cac4e21eab5f84e9ec2
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- \
            lib android assets pubspec.yaml pubspec.lock functions \
            firestore.rules firebase.json storage.rules \
            tools .firebaserc
          git diff --name-only "$BASE" HEAD | while read -r path; do
            case "$path" in
              qa/recovery_journal/*|.github/workflows/qa-deda-100436-recovery-journal-emulator-no-deploy.yml) ;;
              *) echo "SAFE_STOP_FILE_OUTSIDE_PRIVATE_QA_SCOPE:$path"; exit 8 ;;
            esac
          done
          test ! -e qa/recovery_journal/firebase.json
          echo PASS_EXACT_100436_BASE_NO_APP_FIREBASE_PRODUCTION_EDIT
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install temporary emulator-only node modules, no cloud account
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deda100436-journal-node"
          npm install --prefix "$RUNNER_TEMP/deda100436-journal-node" \
            --no-save --no-audit --no-fund \
            firebase-tools@13.35.1 \
            firebase@11.10.0 \
            @firebase/rules-unit-testing@4.0.0 \
            firebase-functions@6.1.0 \
            firebase-admin@12.7.0
          echo "NODE_PATH=$RUNNER_TEMP/deda100436-journal-node/node_modules" >> "$GITHUB_ENV"
      - name: Local-only original Firestore + candidate journal rules assembly
        shell: bash
        run: |
          set -euo pipefail
          export DEDA_JOURNAL_EMULATOR_RULES="$RUNNER_TEMP/deda100436-journal-emulator.rules"
          echo "DEDA_JOURNAL_EMULATOR_RULES=$DEDA_JOURNAL_EMULATOR_RULES" >> "$GITHUB_ENV"
          python3 qa/recovery_journal/assemble_emulator_rules.py
          python3 - <<'PY'
          import json,os,pathlib
          f=pathlib.Path(os.environ['RUNNER_TEMP'])/'deda100436-journal-firebase.json'
          rules=os.environ['DEDA_JOURNAL_EMULATOR_RULES']
          f.write_text(json.dumps({
            'firestore':{'rules':rules},
            'emulators':{'firestore':{'host':'127.0.0.1','port':8098},
                         'ui':{'enabled':False}}}))
          with open(os.environ['GITHUB_ENV'],'a') as e:
            e.write('DEDA_JOURNAL_FIREBASE_CONFIG='+str(f)+'\n')
          PY
      - name: Actual Node JS server completion logic — no Firebase connection
        shell: bash
        run: |
          set -euo pipefail
          node --check qa/recovery_journal/deda_recovery_journal_completion_CANDIDATE_NOT_EXPORTED.js
          node --check qa/recovery_journal/deda_recovery_journal_server_completion.test.cjs
          node --test qa/recovery_journal/deda_recovery_journal_server_completion.test.cjs
          echo PASS_DEDA_JOURNAL_SERVER_LOGIC_NO_NETWORK
      - name: ACTUAL Firestore Emulator — 100436 baseline + candidate journal isolation tests
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/deda100436-journal-node/node_modules/.bin/firebase" emulators:exec \
            --project demo-deda-100436-journal-qa \
            --config "$DEDA_JOURNAL_FIREBASE_CONFIG" \
            --only firestore --non-interactive \
            'DEDA_LINKED_OWNER_GRANT_ISSUER_ENABLED=true node --test qa/recovery_journal/deda_100436_journal_rules_emulator.test.cjs qa/recovery_journal/deda_100436_linked_session_bootstrap_emulator.test.cjs qa/recovery_journal/deda_100436_session_issuer_emulator.test.cjs'
          echo PASS_REAL_FIRESTORE_EMULATOR_JOURNAL_AND_ORIGINAL_UID_SESSION_BOOTSTRAP
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Flutter Dart guardian isolated tests, no APK
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze --no-fatal-warnings \
            qa/recovery_journal/deda_step2_recovery_journal_firestore.dart \
            qa/recovery_journal/deda_100431_linked_owner_session_policy.dart \
            qa/recovery_journal/deda_step2_recovery_guardian.dart \
            qa/recovery_journal/deda_step2_linked_owner_flutter_handoff.dart \
            qa/recovery_journal/deda_step2_linked_owner_firebase_port_CANDIDATE_NOT_WIRED.dart \
            qa/recovery_journal/deda_step2_linked_owner_flutter_handoff_test.dart
          echo PASS_JOURNAL_AND_OWNER_FLUTTER_ADAPTER_STATIC_ANALYSIS
          flutter test qa/recovery_journal/deda_step2_recovery_guardian_test.dart --no-pub
          flutter test qa/recovery_journal/deda_step2_linked_owner_flutter_handoff_test.dart --no-pub
          echo PASS_GUARDIAN_AND_OWNER_HANDOFF_TESTS_NO_APK
      - name: Three actual Auth Emulator devices, Functions callable and Firestore — local ONLY
        shell: bash
        run: |
          set -euo pipefail
          QA_ROOT="$RUNNER_TEMP/deda100436-auth-functions-local"
          FUNC="$QA_ROOT/functions"
          mkdir -p "$FUNC"
          cp qa/recovery_journal/functions_emulator/index.js "$FUNC/index.js"
          cp qa/recovery_journal/functions_emulator/package.json "$FUNC/package.json"
          cp qa/recovery_journal/deda_linked_owner_session_grant_issuer_CANDIDATE_NOT_EXPORTED.js \
            "$FUNC/deda_linked_owner_session_grant_issuer_CANDIDATE_NOT_EXPORTED.js"
          # A throwaway local functions source: NOT the repository's functions/.
          npm install --prefix "$FUNC" --no-audit --no-fund --ignore-scripts
          node --check "$FUNC/index.js"
          node --check qa/recovery_journal/deda_100436_real_auth_functions_three_devices.test.cjs
          export QA_ROOT
          python3 - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path(os.environ["QA_ROOT"])
          rules = os.environ["DEDA_JOURNAL_EMULATOR_RULES"]
          # Firebase CLI resolves a rules path RELATIVE TO config directory.
          # Copy the checked candidate into this temporary QA project.
          shutil.copyfile(rules, root/"firestore.rules")
          assert "dedaLinkedOriginalOwnerSessionBootstrap" in (
              root/"firestore.rules").read_text()
          (root/"firebase.json").write_text(json.dumps({
            "firestore": {"rules": "firestore.rules"},
            "functions": {"source": "functions"},
            "emulators": {
              "firestore": {"host": "127.0.0.1", "port": 8098},
              "auth": {"host": "127.0.0.1", "port": 9099},
              "functions": {"host": "127.0.0.1", "port": 5001},
              "ui": {"enabled": False}
            }
          }))
          PY
          # No fallback to Firestore Emulator open-rules mode is acceptable.
          test -s "$QA_ROOT/firestore.rules"
          test "$(realpath "$QA_ROOT/firestore.rules")" != "$(realpath firestore.rules)"
          # In the Functions emulator the QA wrapper requires a DEMO project,
          # real Firebase Auth ID token and local Firestore/Auth emulators.
          # Its synthetic AppCheck context is QA-only; DO NOT count this as
          # AppCheck security validation or a genuine device integration.
          DEDA_LINKED_OWNER_GRANT_ISSUER_ENABLED=true \
            "$RUNNER_TEMP/deda100436-journal-node/node_modules/.bin/firebase" \
            emulators:exec --project demo-deda-100436-journal-qa \
            --config "$QA_ROOT/firebase.json" \
            --only auth,functions,firestore --non-interactive \
            'node qa/recovery_journal/deda_100436_flutterfire_emulator_seed.cjs && flutter test --platform chrome --no-pub --dart-define=DEDA_LINKED_OWNER_HANDOFF=true --dart-define=DEDA_STABILITY_AUTH_RUNTIME=true --dart-define=DEDA_PRIVATE_FIREBASE_EMULATOR_QA=true qa/recovery_journal/deda_100436_flutterfire_real_emulator_test.dart && DEDA_LINKED_OWNER_GRANT_ISSUER_ENABLED=true node --test qa/recovery_journal/deda_100436_real_auth_functions_three_devices.test.cjs'
          echo PASS_REAL_FLUTTERFIRE_AUTH_FUNCTIONS_FIRESTORE_EMULATORS_NO_APK
      - name: Finish with no deployed resource or downloaded secrets
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          echo PASS_NO_FIREBASE_DEPLOY_NO_REAL_ACCOUNT_READ_OR_WRITE_NO_APK_NO_PLAY
