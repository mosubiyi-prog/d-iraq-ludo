name: DEDA owner19 Stage49 original QR and premium ink NO DEPLOY
on:
  push:
    branches:
      - deda-100359-19-issues-staged-private-no-deploy-2026-10-19
    paths:
      - 'tools/stage_deda_100360_share_premium_ink_after_stage48.py'
      - 'test/test_deda_owner19_stage49_original_qr_share.py'
      - 'lib/deda_stage49_verified_share_id_badge.dart'
      - 'test/deda_owner19_stage49_verified_share_ink_test.dart'
      - '.github/workflows/qa-deda-owner19-stage49-share-gate-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-owner19-stage49-share-safe
  cancel-in-progress: true
jobs:
  share-route-no-change:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No production Firebase or published app change
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 7cd0086783306bfd20daea28e0ed184308575379 -- \
            functions/index.js firestore.rules storage.rules firebase.json \
            lib/main.dart lib/deda_backend.dart lib/deda_social_service.dart \
            android/ server_private/ assets/
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo 'PASS: never touch live owners, Google Play, location share and wallet'
      - name: Exact previous QR/copy/WhatsApp semantics unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/stage_deda_100360_share_premium_ink_after_stage48.py
          python3 -m unittest discover -s test \
            -p 'test_deda_owner19_stage49_original_qr_share.py'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Test verified premium glyph sharing widget only
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/deda_stage49_verified_share_id_badge.dart \
            test/deda_owner19_stage49_verified_share_ink_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/deda_stage49_verified_share_id_badge.dart \
            test/deda_owner19_stage49_verified_share_ink_test.dart
          flutter test test/deda_owner19_stage49_verified_share_ink_test.dart
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo 'PASS: ID ink only, QR still canonical, no server deploy or APK'
