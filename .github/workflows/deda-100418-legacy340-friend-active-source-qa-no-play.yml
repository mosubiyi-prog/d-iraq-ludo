name: DEDA 100418 Legacy Play 340 Friends Active ID Guard Integrated QA (NO DEPLOY)
on:
  push:
    branches: [deda-100418-legacy340-public-active-read-candidate-no-deploy-2026-10-31]
    paths:
      - '.github/workflows/deda-100418-legacy340-friend-active-source-qa-no-play.yml'
      - 'lib/deda_weekly_prize_plan_100408.dart'
      - 'test/deda_100412_prize_response_guard_test.dart'
      - 'tools/app_stability/app_package/bind_weekly_100411_friend_copy_share.py'
      - 'tools/app_stability/app_package/bind_weekly_100413_owner_id_admin_response.py'
      - 'lib/deda_friend_id_copy_100411.dart'
      - 'lib/deda_owner_legacy_public_proof_100414.dart'
      - 'tools/app_stability/app_package/bind_weekly_100414_last_three.py'
      - 'test/deda_100414_legacy_owner_public_proof_test.dart'
      - 'test/deda_100411_friend_copy_test.dart'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  signed-owner-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: mosubiyi-prog/d-iraq-ludo
          run-id: 39948539871
          name: DEDA-100379-OWNER18-PRIVATE-QA
          path: ${{ runner.temp }}/deda-original-reference
      - name: Restore original signed 100396 including validated leaderboard and task button
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.diraq.ludo --project-name d_iraq_ludo "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/prepare.py "$RUNNER_TEMP/deda-original-100396" --variant candidate
          python3 tools/app_stability/app_package/bind_weekly_stage13.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_active_id_boot_prewarm_stage14.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_active_id_measured_startup_stage16.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_private_trial_stage17.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_full_qa_stage18.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/verify_rank_card_tap_stage19.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_admin_league_stage27.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_tasks_cta_stage28.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_100397_owner_real_scores.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_100398_after_level_xp.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_100399_community_bridge.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_100400_safe_score_retry.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_100402_firestore_direct.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_100403_first_open_gate.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_100404_inline_clock_and_freeze.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_100405_admin_live_read_only.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_100406_league_display_fixes.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_100407_full_avatar_shared_identity.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_100408_seven_owner_points.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_100409_single_verified_identity.py "$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_100410_unified_active_id.py "$RUNNER_TEMP/deda-original-100396"
      - name: Bind 100411 and 100413 after verified 100412 in isolated app (NO APK)
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_100411_friend_copy_share.py "$project"
          python3 tools/app_stability/app_package/bind_weekly_100413_owner_id_admin_response.py "$project"
          cd "$project"
          python3 - <<'PY'
          from pathlib import Path
          import json
          main=Path('lib/main.dart').read_text()
          unifier=Path('lib/deda_unified_active_id_100410.dart').read_text()
          prize=Path('lib/deda_weekly_prize_plan.dart').read_text()
          proof=json.loads(Path('internal-build-inputs.json').read_text())
          assert proof['versionCode']==100413
          assert unifier.count('ensureOwner(widget.originalId)')==0, 'no friend public private owner reads'
          assert unifier.count('publishAfterVerifiedRead(')==1, 'owner-verified normal publication'
          assert 'await DedaBackend\n                                    .currentDedaAccountCanSeeAdminEntry' not in main, 'no tap re-read'
          assert 'final gateAllowed = _adminEntryVisible &&' in main
          assert 'currentAdminSessionMatchesDedaEntry(' in main
          assert main.count('DedaFriendIdCopy100411(')>=1
          assert 'stream: _controlStream,' in prize
          assert proof['weekly100413PublicOwnerAdminResponsive']['walletAndPrizesUnchanged'] is True
          print('PASS_100413_NO_N_PRIVATE_OWNER_READS_ADMIN_ENTRY_VERIFIED')
          PY
          flutter pub get --enforce-lockfile
          dart analyze --no-fatal-warnings lib/main.dart lib/deda_unified_active_id_100410.dart lib/deda_weekly_prize_plan.dart lib/deda_friend_id_copy_100411.dart
          for t in deda_100411_friend_copy_test.dart deda_100412_prize_response_guard_test.dart deda_100410_unified_active_id_test.dart deda_100409_owner_active_id_publication_gate_test.dart deda_location_identity_entry_test.dart; do
            cp "$GITHUB_WORKSPACE/test/$t" test/
            flutter test "test/$t" --no-pub
          done
          echo 'PASS_100413_ALL_SOURCE_TESTS_NO_FIREBASE_WRITES_NO_APK_NO_PLAY'
      - name: Bind 100414 and verify canonical ID, admin login and prize regressions (NO BUILD)
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_100414_last_three.py "$project"
          cd "$project"
          python3 - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('internal-build-inputs.json').read_text())
          assert data['versionCode']==100414
          flags=data['weekly100414FinalThree']
          assert flags['adminServerProofMandatory']
          assert flags['adminGateFailClosed']
          assert flags['legacyRouteDifferentUidFailClosed']
          assert not flags['noLiveFirestoreRulesDeploy'] is False
          unifier=Path('lib/deda_unified_active_id_100410.dart').read_text()
          backend=Path('lib/deda_backend.dart').read_text()
          home=Path('lib/main.dart').read_text()
          admin=Path('lib/admin_pages.dart').read_text()
          assert 'DedaOwnerLegacyPublicProof100414.ensureAndPublish' in unifier
          assert not 'ensureOwner(widget.originalId)' in unifier
          assert '_ownerAuthReady=FirebaseAuth.instance.authStateChanges()' in home
          assert 'unawaited(_adminLoginHousekeeping100414(' in backend
          assert 'currentAdminSessionMatchesDedaEntry(' in admin
          assert 'DedaWeeklyPrizePlan' in Path('lib/deda_weekly_prize_plan.dart').read_text()
          print('PASS_100414_STRICT_SOURCE_INVARIANTS')
          PY
          flutter pub get --enforce-lockfile
          dart analyze --no-fatal-warnings lib/deda_owner_legacy_public_proof_100414.dart lib/deda_unified_active_id_100410.dart lib/deda_backend.dart lib/admin_pages.dart lib/main.dart lib/deda_weekly_prize_plan.dart
          cp "$GITHUB_WORKSPACE/test/deda_100414_legacy_owner_public_proof_test.dart" test/
          flutter test test/deda_100414_legacy_owner_public_proof_test.dart --no-pub
          for t in deda_100411_friend_copy_test.dart deda_100412_prize_response_guard_test.dart deda_100410_unified_active_id_test.dart deda_100409_owner_active_id_publication_gate_test.dart deda_location_identity_entry_test.dart; do
            flutter test "test/$t" --no-pub
          done
          echo 'PASS_100414_SOURCE_TESTS_NO_FIREBASE_WRITES_NO_APK_NO_PLAY'
      - name: Audit exact source order from signed original merged app 100417 (NO APK)
        working-directory: ${{ runner.temp }}/deda-original-100396
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('lib/deda_owner_legacy_public_proof_100414.dart').read_text()
          assert s.count('await db.runTransaction(')==2, 'one separate owner-only phase and one Stage71 phase'
          i=s.index('// PHASE ONE.')
          j=s.index('// PHASE TWO.')
          k=s.index('// The 100409 publisher')
          assert i < j < k
          phase1=s[i:j]
          phase2=s[j:k]
          assert 'tx.update(userRef' in phase1
          assert 'tx.get(activeRef)' not in phase1, 'no forbidden Stage71 read before user field commit'
          assert 'sameAuthenticatedOwner(' in phase1
          assert 'tx.get(activeRef)' in phase2 and 'sameAuthenticatedOwner(' in phase2
          assert 'activeSelectionSafe(' in phase2 and 'tx.set(activeRef' in phase2
          assert 'tx.update(userRef' not in phase2
          assert 'public-id-projection-not-confirmed' in s
          assert s.index("projection['activeId'] != activeId") < s.index('_completed.add(key)')
          assert 'on FirebaseException catch (error)' in s
          assert 'wallet' not in phase1.lower() and 'diamonds' not in phase2.lower()
          print('PASS_100417_TWO_PHASE_OWNER_PROOF_SERVER_PUBLISHED_VERIFICATION_NO_WALLET')
          PY
          echo 'PASS_100417_NO_PRODUCTION_FIREBASE_MUTATIONS_NO_APK_NO_PLAY'
      - name: Bind 100418 legacy 340 source on 100417 protected admin and prize baseline NO APK
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/deda-original-100396"
          python3 tools/app_stability/app_package/bind_weekly_100418_legacy340_friend_active_compat.py "$project"
          cd "$project"
          cp "$GITHUB_WORKSPACE/test/deda_100418_legacy340_selection_test.dart" test/
          python3 - <<'PY'
          from pathlib import Path
          import json
          m=json.loads(Path('internal-build-inputs.json').read_text())
          assert m['versionCode']==100418
          x=m['weekly100418Legacy340OwnerOnlyAuthReadCandidate']
          assert x['buildFlagDisabledWithoutReviewedLiveRules']
          assert x['neverShowsOldIdIfSelectedPremium']
          assert x['noFirebaseUserOrRuleMutation']
          assert x['adminPrizesBalancesUnchanged']
          main=Path('lib/main.dart').read_text()
          admin=Path('lib/deda_backend.dart').read_text()
          source=Path('lib/deda_unified_active_id_100410.dart').read_text()
          friend=Path('lib/deda_stage50_verified_friend_ink_badge.dart').read_text()
          assert 'unawaited(_adminLoginHousekeeping100414(' in admin
          assert 'DedaWeeklyPrizePlan' in Path('lib/deda_weekly_prize_plan.dart').read_text()
          assert 'DedaLegacy340ActiveSelection100418.selected(original)' in source
          assert 'DedaLegacy340ActiveSelection100418.watch(original)' in source
          assert 'permanentColor:proof?.fixedColor' in friend
          assert 'verifiedDisplayId: confirmed' in main
          assert 'DEDA_100418_LEGACY340_ACTIVE_READ_APPROVED' in Path('lib/deda_legacy340_active_selection_100418.dart').read_text()
          assert Path('lib/deda_owner_legacy_public_proof_100414.dart').read_text().count('await db.runTransaction(')==2
          print('PASS_100418_SOURCE_INTEGRITY_NO_UNVERIFIED_NORMAL_FALLBACK')
          PY
          flutter pub get --enforce-lockfile
          dart analyze --no-fatal-warnings lib/deda_legacy340_active_selection_100418.dart lib/deda_unified_active_id_100410.dart lib/deda_stage50_verified_friend_ink_badge.dart lib/main.dart
          flutter test test/deda_100418_legacy340_selection_test.dart --no-pub
          flutter test test/deda_100410_unified_active_id_test.dart --no-pub
          flutter test test/deda_100411_friend_copy_test.dart --no-pub
          echo 'PASS_100418_NO_APK_NO_LIVE_FIREBASE_DEPLOY_NO_PLAY'
