name: DEDA 100408 Production Prize Rules Read-Only Compatibility (NO DEPLOY)
on:
  push:
    branches: [deda-100408-seven-owner-fixes-ordered-no-play-2026-10-31]
    paths:
      - 'tools/deda_100408_live_prize_rules_readonly_preflight.py'
      - 'tests/firestore-rules/weekly-direct-manager-prizes-100408.test.mjs'
      - '.github/workflows/qa-deda-100408-live-prizes-readonly-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight-production-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRIMARY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read ACTUAL published Firestore policy and prepare safe additive merged candidate (NO WRITE)
        run: |
          set -euo pipefail
          python -m pip install --quiet google-auth requests
          python3 tools/deda_100408_live_prize_rules_readonly_preflight.py prepare
      - name: Emulator test exact combined rules against unauthorized prize edits (NO DEPLOY)
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests/firestore-rules --no-audit --no-fund --no-save firebase-tools@14
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          export DEDA_DIRECT_RULES_PATH="$RUNNER_TEMP/deda-100408-active-merged.rules"
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100408-prizes --only firestore \
            --config "$RUNNER_TEMP/deda-100408-active-merged-emulator.json" \
            'node --test tests/firestore-rules/weekly-direct-manager-prizes-100408.test.mjs'
          echo 'REAL_PRODUCTION_RULES_MERGE_COMPATIBLE_EMULATOR_PASS=TRUE'
      - name: Ensure no writes or deployments happened
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          report=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'deda-100408-prize-preflight.json').read_text())
          assert report['readOnly'] and report['noOtherPolicyModifications']
          assert not report['firebaseDeployPerformed'] and report['noXpOrDiamondsModified']
          print('100408_NO_LIVE_RULES_WRITE_NO_DIAMOND_CHANGES=VERIFIED')
          PY
      - name: Remove read-only cloud credentials from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/deda-100408-active-merged.rules" "$RUNNER_TEMP/deda-100408-active-merged-emulator.json" "$RUNNER_TEMP/deda-100408-prize-preflight.json"
