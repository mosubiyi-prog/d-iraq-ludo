name: DEDA Point1 Simplified Trusted Room Authorization (NO APK)
on:
  push:
    branches:
      - deda-point1-authz-simplify-safe-isolated-2026-11-17
    paths:
      - 'functions/deda_unified_room_session_bootstrap_private_v1.js'
      - 'functions/deda_unified_room_grant_issuer_private_v1.js'
      - 'functions/deda_unified_room_readonly_guard_v1.js'
      - 'functions/test/deda_unified_room_session_bootstrap_private_v1.test.js'
      - 'functions/test/deda_unified_room_grant_issuer_private_v1.test.js'
      - 'functions/test/deda_unified_room_readonly_guard_v1.test.js'
      - '.github/workflows/deda-point1-authz-simplify-source-only-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-room-owner-authorization:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm no production, original app, rules, UID or wallets changed
        shell: bash
        run: |
          set -euo pipefail
          base=85f5b074630d38132c027e80fed2eee6f6996c56
          git diff --exit-code "$base" HEAD -- lib/ android/ assets/ firestore.rules storage.rules firebase.json functions/index.js pubspec.yaml pubspec.lock
          python3 - <<'PY'
          import subprocess,pathlib
          base='85f5b074630d38132c027e80fed2eee6f6996c56'
          touched=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={
            'functions/deda_unified_room_session_bootstrap_private_v1.js',
            'functions/deda_unified_room_grant_issuer_private_v1.js',
            'functions/deda_unified_room_readonly_guard_v1.js',
            'functions/test/deda_unified_room_session_bootstrap_private_v1.test.js',
            'functions/test/deda_unified_room_grant_issuer_private_v1.test.js',
            'functions/test/deda_unified_room_readonly_guard_v1.test.js',
            '.github/workflows/deda-point1-authz-simplify-source-only-qa.yml',
          }
          assert touched and touched <= allowed,sorted(touched-allowed)
          index=pathlib.Path('functions/index.js').read_text()
          assert 'db:getFirestore(), auth:getAuth(), enabled:false' in index
          assert 'deda_unified_room_grant_issuer_private_v1' not in index
          assert 'deda_unified_room_session_bootstrap_private_v1' not in index
          assert "defaultValue: false" in pathlib.Path('lib/deda_unified_room_runtime_readonly.dart').read_text()
          print('PASS_NO_PRODUCTION_FIREBASE_OR_APP_MUTATION')
          PY
      - name: Verify JS syntax for all three real guard modules
        run: |
          node --check functions/deda_unified_room_readonly_guard_v1.js
          node --check functions/deda_unified_room_session_bootstrap_private_v1.js
          node --check functions/deda_unified_room_grant_issuer_private_v1.js
      - name: Complete owner, scope, expiry, replay and revocation regressions
        run: |
          node --test \
            functions/test/deda_unified_room_readonly_guard_v1.test.js \
            functions/test/deda_unified_room_session_bootstrap_private_v1.test.js \
            functions/test/deda_unified_room_grant_issuer_private_v1.test.js
      - name: Safety hold
        run: |
          echo 'NO_APK_NO_AAB_NO_FIREBASE_DEPLOY_NO_AUTH_UID_CHANGE_NO_PLAY'
          echo 'TRUSTED_REAL_OWNER_PROOF_STILL_REQUIRED_BEFORE_LIVE_ACCESS'
