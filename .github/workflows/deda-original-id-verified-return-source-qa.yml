name: DEDA original ID verified return source-only QA (NO APK NO DEPLOY)

on:
  push:
    branches:
      - deda-original-id-verified-return-source-only-2026-11-15
    paths:
      - 'lib/deda_stage71_free_owned_use_profile.dart'
      - 'test/test_deda_stage71_original_return_owner_guard.py'
      - '.github/workflows/deda-original-id-verified-return-source-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-id-verified-return:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Confirm exact source-only scope and original UID protection
        run: |
          set -euo pipefail
          python3 test/test_deda_stage71_original_return_owner_guard.py
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo "PASS: no app build, no Firebase mutation, no Play release"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
      - name: Analyze verified owner-ID service and widgets
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze --no-fatal-warnings lib/deda_stage71_free_owned_use_profile.dart
      - name: Regression — original owned identifiers, free cards and ownership
        run: |
          set -euo pipefail
          flutter test test/deda_stage71_four_free_cards_dual200_widget_test.dart
          python3 test/test_deda_stage71_original_return_owner_guard.py
