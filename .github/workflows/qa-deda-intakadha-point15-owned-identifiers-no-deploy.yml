name: DEDA Point 15 Owned Identifiers + General Manager Reserved - NO APK NO DEPLOY
on:
  push:
    branches:
      - deda-intakadha-ids-cards-stage1-2026-10-18
    paths:
      - tools/deda_intakadha_point15_identifier_ownership_admin_gifts_2026_10_19.js
      - tools/stage_deda_intakadha_point15_owned_ids_admin_grants_ui_2026_10_19.py
      - test/deda_intakadha_point15_owned_identifiers_emulator.test.js
      - test/test_deda_intakadha_point15_owned_ids_ui_stage_2026_10_19.py
      - test/deda_intakadha_point15_owned_ids_ui_widget_test.dart
      - .github/workflows/qa-deda-intakadha-point15-owned-identifiers-no-deploy.yml
      - docs/DEDA_INTAKADHA_16_POINTS_STAGE1_CHECKPOINT_2026-10-18.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-point15-owned-identifiers
  cancel-in-progress: true
jobs:
  source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Protect phone-verified 100356 and production Firestore/Functions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin backup-deda-100356-phone-ui-verified-2026-10-18
          test "$(git rev-parse origin/backup-deda-100356-phone-ui-verified-2026-10-18)" = "4373b8b30eadc5a284554ca7c021c350e0732caf"
          python3 - <<'PY'
          import subprocess,re
          paths=set(subprocess.check_output(
            ['git','diff','--name-only',
             '4373b8b30eadc5a284554ca7c021c350e0732caf','HEAD'],
            text=True).splitlines())
          patterns=[
            r'docs/DEDA_INTAKADHA_16_POINTS_STAGE1_CHECKPOINT_2026-10-18\.md',
            r'catalogs/DEDA_ID_GROUP_002_CANDIDATES_100_NO_SALES_2026-10-18\.json',
            r'tools/stage_deda_intakadha_point(?:[2-9]|1[0-5])_[a-z0-9_]+_2026_10_(?:18|19)\.py',
            r'tools/deda_intakadha_point1[345]_[a-z0-9_]+_2026_10_19\.js',
            r'test/test_deda_intakadha_point(?:[2-9]|1[0-5])_[a-z0-9_]+_2026_10_(?:18|19)\.py',
            r'test/deda_intakadha_point(?:[5-9]|1[0-5])_[a-z0-9_]+(?:_emulator\.test\.js|\.dart|\.test\.js)',
            r'\.github/workflows/qa-deda-intakadha-point(?:[2-9]|1[0-5])-[a-z0-9-]+\.yml',
          ]
          unexpected=sorted(x for x in paths if not any(re.fullmatch(p,x) for p in patterns))
          assert not unexpected, "SAFE_STOP unauthorized changed files: "+str(unexpected)
          assert not any(x.startswith(('lib/','android/','functions/','assets/','firestore')) for x in paths)
          assert not any('DEDA_RESERVED_100' in x for x in paths)
          print('PASS: protected signed 100356 source, admin wallets, live Firebase and Play unchanged')
          PY
          test ! -e catalogs/DEDA_RESERVED_100_ADMIN_ONLY_GROUP001_2026-10-19.json
          test "$(grep -c 'point15_identifier_ownership_admin_gifts' functions/index.js || true)" = 0
          node --check tools/deda_intakadha_point15_identifier_ownership_admin_gifts_2026_10_19.js
          node --check test/deda_intakadha_point15_owned_identifiers_emulator.test.js
          python3 -m py_compile tools/stage_deda_intakadha_point15_owned_ids_admin_grants_ui_2026_10_19.py
          python3 -m unittest discover -s test -p 'test_deda_intakadha_point15_owned_ids_ui_stage_2026_10_19.py' -v
  flutter-identity-ui:
    needs: source-security
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Isolated source-exact Flutter account identity UI (no APK)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p15/lib" "$RUNNER_TEMP/p15/test"
          python3 - "$RUNNER_TEMP/p15/lib/deda_point15_fixture.dart" <<'PY'
          import ast,sys,re
          from pathlib import Path
          def literal(path,name):
            tree=ast.parse(Path(path).read_text(encoding='utf8'))
            vals=[node.value.value for node in tree.body if isinstance(node,ast.Assign)
                 and any(isinstance(t,ast.Name) and t.id==name for t in node.targets)
                 and isinstance(node.value,ast.Constant)]
            assert len(vals)==1,(path,name)
            return vals[0]
          art=literal('tools/stage_deda_intakadha_point5_four_premium_id_artworks_2026_10_18.py','ARTWORK')
          color=re.search(r'enum DedaPremiumIdCardColor\s*\{[^}]+\}',art)
          assert color and all(n in color.group() for n in ('gold','diamond','royal','pink'))
          panel=literal('tools/stage_deda_intakadha_point15_owned_ids_admin_grants_ui_2026_10_19.py','WIDGET')
          Path(sys.argv[1]).write_text("import 'package:flutter/material.dart';\n"+
              "String dedaText(String ar,String en)=>ar;\n"+color.group()+"\n"+panel,encoding='utf8')
          PY
          cp test/deda_intakadha_point15_owned_ids_ui_widget_test.dart "$RUNNER_TEMP/p15/test/"
          cat > "$RUNNER_TEMP/p15/pubspec.yaml" <<'YAML'
          name: deda_point15_identifier_preview
          description: DEDA verified owned identifiers, admin-only UI tests
          version: 0.0.1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
          YAML
          cd "$RUNNER_TEMP/p15"
          dart format lib test
          flutter pub get
          flutter test --reporter expanded
  firestore-identifier-security:
    needs: source-security
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install emulator dependencies in throwaway runner
        run: |
          npm install --prefix functions --no-save --no-audit --no-fund \
            firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Firebase Emulator atomic ownership/admin/alias/rules tests
        run: |
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-point15-owned-identifiers --only firestore \
            'node --test test/deda_intakadha_point15_owned_identifiers_emulator.test.js'
  release-lock:
    needs: [source-security, flutter-identity-ui, firestore-identifier-security]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "PASS point15 stage-only. NO APK/AAB, no Google Play, no Firebase deploy, no live wallet or account changes."
