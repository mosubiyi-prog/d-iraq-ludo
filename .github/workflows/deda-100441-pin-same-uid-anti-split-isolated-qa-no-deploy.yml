name: DEDA 100441 isolated same-UID PIN session safety QA (NO DEPLOY)

on:
  push:
    branches:
      - deda-100441-source-audit-isolated-recovery-2026-11-12
    paths:
      - "lib/deda_pin_auth.dart"
      - "lib/deda_100431_linked_owner_session_policy.dart"
      - "tools/app_stability/app_package/reconcile_stage2_auth_conflicts.py"
      - "test/deda_owner_session_compat_private_test.dart"
      - ".github/workflows/deda-100441-pin-same-uid-anti-split-isolated-qa-no-deploy.yml"

permissions:
  contents: read

concurrency:
  group: deda-100441-isolated-pin-same-uid-qa
  cancel-in-progress: false

jobs:
  same-uid-auth-session-safe-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse changes to protected production/Play/Firebase app inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base = "308a846ef0c44169929a2908adb0457b4b028672"
          allowed = {
            "lib/deda_pin_auth.dart",
            "lib/deda_100431_linked_owner_session_policy.dart",
            "tools/app_stability/app_package/reconcile_stage2_auth_conflicts.py",
            "test/deda_owner_session_compat_private_test.dart",
            "test/deda_pin_same_uid_100441_optin_private_test.dart",
            ".github/workflows/deda-100441-pin-same-uid-anti-split-isolated-qa-no-deploy.yml",
            ".github/workflows/deda-100442-abc-uid-fingerprint-scoped-readonly-no-deploy.yml",
            ".github/workflows/deda-100442-signed-private-current-uid-fingerprint-no-play.yml",
            ".github/workflows/deda-100443-original-id-uid-prewrite-guard-source-qa-no-deploy.yml",
            "lib/deda_backend.dart",
            "lib/deda_session_diagnostic_readonly_100441.dart",
            "test/deda_100441_session_uid_fingerprint_readonly_private_test.dart",
            "test/deda_original_share_uid_prewrite_guard_100443_test.dart",
            "tools/deda_100442_current_uid_abc_fingerprints_readonly.py",
            "docs/DEDA_100441_OWNER_SOURCE_AND_RECOVERY_INTEGRATION_AUDIT_2026-11-12.md",
            ".github/workflows/deda-100443-owner-review-gate-one-branch-qa-no-deploy.yml",
            "functions/deda_100441_canonical_uid_anti_split_preflight_PRIVATE_NOT_EXPORTED.js",
            "functions/deda_100441_lab_to_legacy_google_proof_gate_PRIVATE_NOT_EXPORTED.js",
            "functions/deda_100441_legacy_google_oidc_verifier_PRIVATE_NOT_EXPORTED.js",
            "functions/deda_100441_owner_split_identity_challenge_review_private_v1.js",
            "functions/deda_100441_server_canonical_uid_read_adapter_PRIVATE_NOT_EXPORTED.js",
            "functions/test/deda_100441_canonical_uid_anti_split_preflight_PRIVATE.test.js",
            "functions/test/deda_100441_lab_to_legacy_google_proof_gate_PRIVATE.test.js",
            "functions/test/deda_100441_legacy_google_oidc_verifier_PRIVATE.test.js",
            "functions/test/deda_100441_owner_split_identity_challenge_review_private_v1.test.js",
            "functions/test/deda_100441_server_canonical_uid_read_adapter_PRIVATE.test.js",
            "functions/test/deda_100441_step2_conflicted_uids_owner_proof.test.js",
            "test/deda_100443_legacy_owner_review_no_grant.test.js",
          }
          modified = set(subprocess.check_output([
            "git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
          assert modified <= allowed, f"Unexpected protected file changes: {sorted(modified - allowed)}"
          policy = open("lib/deda_100431_linked_owner_session_policy.dart").read()
          pin = open("lib/deda_pin_auth.dart").read()
          assert "canOpenExistingPinSessionOnOriginalUid(" in policy
          assert pin.index("await _verifiedExistingPinUid(accountKey)") < pin.index("await _provePin(accountKey: accountKey, pin: pin)")
          assert pin.index("await _provePin(accountKey: accountKey, pin: pin)") < pin.index("await _openSession(accountKey, expectedOriginalUid: expectedUid)")
          assert "original-pin-uid-changed-before-session-write" in pin
          index = open("functions/index.js").read()
          assert "deda_100441_legacy_google_oidc_verifier_PRIVATE_NOT_EXPORTED" not in index
          assert "deda_100441_canonical_uid_anti_split_preflight_PRIVATE_NOT_EXPORTED" not in index
          assert "await _verifiedExistingPinUid(accountKey)" in pin
          assert pin.index("_verifiedExistingPinUid(accountKey)") < pin.index("_provePin(accountKey: accountKey, pin: pin)")
          assert "original-pin-uid-changed-before-session-write" in pin
          assert "await _openSession(accountKey, expectedOriginalUid: expectedUid)" in pin
          assert pin.index("await _verifiedExistingPinUid(accountKey)") < pin.index(
            "await _openSession(accountKey, expectedOriginalUid: expectedUid)")
          print("PASS_100441_ORIGINAL_UID_CHECK_BEFORE_PIN_SESSION_WRITE")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: false

      - name: Resolve dependencies and analyze original UID and PIN implementation
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze --no-fatal-warnings lib/deda_pin_auth.dart lib/deda_100431_linked_owner_session_policy.dart

      - name: Owner UID PIN, Google and session regression tests (no Firebase connection)
        run: |
          set -euo pipefail
          flutter test --no-pub \
            test/deda_owner_session_compat_private_test.dart \
            test/deda_google_original_uid_link_private_test.dart \
            test/deda_session_missing_owner_entry_100441_test.dart

      - name: PIN guard remains compatible with signed 100441 opt-in compilation
        run: |
          set -euo pipefail
          flutter test --no-pub --dart-define=DEDA_STEP2_LINKED_OWNER_COMPAT=true \
            test/deda_pin_same_uid_100441_optin_private_test.dart

      - name: Verify guard survives EXACT full signed-100441 source assembly (no APK)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import os
          wf = Path(".github/workflows/deda-100441-complete-signed-session-diagnostic-no-play.yml").read_text()
          start = wf.index("      - name: Reconstruct FULL protected 100439")
          run = wf.index("        run: |\n", start) + len("        run: |\n")
          end = wf.index("      - name: Analyze entire assembled entry", run)
          script = dedent(wf[run:end].rstrip()) + "\n"
          assert 'merge_stage2_into_protected_100436.py' in script
          assert 'bind_session_diagnostic_readonly_100441.py' in script
          target = Path(os.environ["RUNNER_TEMP"]) / "deda-100441-exact-rebuild-source.sh"
          target.write_text(script)
          print("PASS_REUSED_EXACT_SIGNED_100441_ASSEMBLY_RECIPE")
          PY
          bash "$RUNNER_TEMP/deda-100441-exact-rebuild-source.sh"
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["RUNNER_TEMP"]) / "deda-100441-complete-signed-app" / "lib"
          pin = (root / "deda_pin_auth.dart").read_text()
          policy = (root / "deda_100431_linked_owner_session_policy.dart").read_text()
          main = (root / "main.dart").read_text()
          assert "await _verifiedExistingPinUid(accountKey)" in pin
          assert pin.index("_verifiedExistingPinUid(accountKey)") < pin.index("_provePin(accountKey: accountKey, pin: pin)")
          assert "original-pin-uid-changed-before-session-write" in pin
          assert "canOpenExistingPinSessionOnOriginalUid(" in policy
          assert "DedaGoogleSettingsLinkCard(" in main
          assert "DedaSessionDiagnosticReadOnlyTile(" in main
          print("PASS_FULL_100441_ASSEMBLY_INCLUDES_SAME_UID_GUARD_GOOGLE_AND_DIAGNOSTICS")
          PY
          (
            cd "$RUNNER_TEMP/deda-100441-complete-signed-app"
            flutter pub get
            dart analyze --no-fatal-warnings \
              lib/main.dart lib/deda_backend.dart lib/deda_pin_auth.dart \
              lib/deda_100431_linked_owner_session_policy.dart \
              lib/deda_step1_google_settings_link_100439.dart \
              lib/deda_session_diagnostic_readonly_100441.dart
          )
          echo PASS_FULL_100441_ASSEMBLED_DART_ANALYSIS

      - name: No APK, Play, Firebase deploy, or user data changes
        run: echo 'PASS_PRIVATE_QA_ONLY_NO_APK_NO_FIREBASE_NO_PLAY'
