name: DEDA 100441 isolated same-UID PIN session safety QA (NO DEPLOY)

on:
  push:
    branches:
      - deda-100441-source-audit-isolated-recovery-2026-11-12
    paths:
      - "lib/deda_pin_auth.dart"
      - "lib/deda_100431_linked_owner_session_policy.dart"
      - "lib/deda_step1_google_settings_link_100439.dart"
      - "lib/deda_session_diagnostic_readonly_100441.dart"
      - "test/deda_100441_session_uid_fingerprint_readonly_private_test.dart"
      - "tools/app_stability/app_package/reconcile_stage2_auth_conflicts.py"
      - "tools/app_stability/app_package/bind_google_account_settings_100439.py"
      - "test/deda_owner_session_compat_private_test.dart"
      - ".github/workflows/deda-100441-pin-same-uid-anti-split-isolated-qa-no-deploy.yml"

permissions:
  contents: read

concurrency:
  group: deda-100441-isolated-pin-same-uid-qa
  cancel-in-progress: false

jobs:
  same-uid-auth-session-safe-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse changes to protected production/Play/Firebase app inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base = "308a846ef0c44169929a2908adb0457b4b028672"
          subprocess.run(["git", "diff", "--exit-code", base, "HEAD", "--",
            "lib/main.dart", "functions/index.js", "firebase.json",
            "firestore.rules", "storage.rules", "android/", "assets/",
            "pubspec.yaml", "pubspec.lock"], check=True)
          for removed in ("lib/deda_step1_google_settings_link_100439.dart",
            "lib/deda_step2_google_replacement_login_100439.dart",
            "lib/deda_google_recovery_progress_100439.dart"):
            assert not Path(removed).exists(), "Google module still present: " + removed
          policy = open("lib/deda_100431_linked_owner_session_policy.dart").read()
          pin = open("lib/deda_pin_auth.dart").read()
          lookup = pin.split("  static Future<bool> accountExists(String phone) async {", 1)[1]
          lookup = lookup.split("  static Future<void> _provePin(", 1)[0]
          assert "mayImplicitlyPrepareOwnerSession(" in lookup
          assert lookup.index("mayImplicitlyPrepareOwnerSession(") < lookup.index("await _ensureAnonymousSession();")
          assert "deda-explicit-auth-entry-required-no-new-uid" in lookup
          pin_signin = pin.split("  static Future<Map<String, dynamic>> signIn({", 1)[1]
          pin_signin = pin_signin.split("  static Future<void> markCurrentDeviceTrusted(", 1)[0]
          assert "canOpenExistingPinSessionOnOriginalUid(" in policy
          assert pin_signin.index("await _verifiedExistingPinUid(accountKey)") < pin_signin.index("expectedOriginalUid: expectedUid")
          assert pin_signin.index("expectedOriginalUid: expectedUid") < pin_signin.index("await _openSession(accountKey, expectedOriginalUid: expectedUid)")
          assert "original-pin-uid-changed-before-session-write" in pin_signin
          assert "original-pin-owner-changed-before-proof" in pin
          index = open("functions/index.js").read()
          assert "deda_100441_legacy_google_oidc_verifier_PRIVATE_NOT_EXPORTED" not in index
          assert "deda_100441_canonical_uid_anti_split_preflight_PRIVATE_NOT_EXPORTED" not in index
          assert "await _verifiedExistingPinUid(accountKey)" in pin_signin
          assert pin_signin.index("_verifiedExistingPinUid(accountKey)") < pin_signin.index("_provePin(")
          assert "original-pin-uid-changed-before-session-write" in pin_signin
          assert "await _openSession(accountKey, expectedOriginalUid: expectedUid)" in pin
          assert pin_signin.index("_verifiedExistingPinUid(accountKey)") < pin_signin.index("_openSession(accountKey, expectedOriginalUid: expectedUid)")
          diag = open("lib/deda_session_diagnostic_readonly_100441.dart").read()
          assert "mayOfferDetachedGoogleLink(" in diag
          assert "DedaProbeMatch.differentUid" in diag
          assert "DedaProbeKind.anonymous" in diag
          print("PASS_GOOGLE_LINK_REMOVED_PIN_GUARD_PRESERVED")
          print("PASS_100441_ORIGINAL_UID_CHECK_BEFORE_PIN_SESSION_WRITE")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: false

      - name: Resolve dependencies and analyze original UID and PIN implementation
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze --no-fatal-warnings lib/deda_pin_auth.dart lib/deda_100431_linked_owner_session_policy.dart lib/deda_session_diagnostic_readonly_100441.dart

      - name: Owner UID PIN and session regression tests (no Firebase connection)
        run: |
          set -euo pipefail
          flutter test --no-pub \
            test/deda_owner_session_compat_private_test.dart \
            test/deda_session_missing_owner_entry_100441_test.dart \
            test/deda_100441_session_uid_fingerprint_readonly_private_test.dart

      - name: PIN guard remains compatible with existing opt-in compilation
        run: |
          set -euo pipefail
          flutter test --no-pub --dart-define=DEDA_STEP2_LINKED_OWNER_COMPAT=true \
            test/deda_pin_same_uid_100441_optin_private_test.dart

      - name: Verify guard survives Google-free full source assembly (no APK)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import os
          wf = Path(".github/workflows/deda-100441-complete-signed-session-diagnostic-no-play.yml").read_text()
          start = wf.index("      - name: Reconstruct FULL protected 100439")
          run = wf.index("        run: |\n", start) + len("        run: |\n")
          end = wf.index("      - name: Analyze entire assembled entry", run)
          script = dedent(wf[run:end].rstrip()) + "\n"
          assert 'merge_stage2_into_protected_100436.py' in script
          assert 'bind_session_diagnostic_readonly_100441.py' in script
          target = Path(os.environ["RUNNER_TEMP"]) / "deda-100441-exact-rebuild-source.sh"
          target.write_text(script)
          print("PASS_REUSED_EXACT_SIGNED_100441_ASSEMBLY_RECIPE")
          PY
          bash "$RUNNER_TEMP/deda-100441-exact-rebuild-source.sh"
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["RUNNER_TEMP"]) / "deda-100446-complete-signed-app" / "lib"
          pin = (root / "deda_pin_auth.dart").read_text()
          lookup = pin.split("  static Future<bool> accountExists(String phone) async {", 1)[1]
          lookup = lookup.split("  static Future<void> _provePin(", 1)[0]
          assert "mayImplicitlyPrepareOwnerSession(" in lookup
          # Full 100441 assembly correctly wraps session preparation in the
          # original shared AuthRuntime lane; accept only that reviewed form
          # or the untouched source form, never a new Auth side effect.
          prepared = (
              "await DedaAuthRuntime.wait(() => _ensureAnonymousSession());"
              if "await DedaAuthRuntime.wait(() => _ensureAnonymousSession());" in lookup
              else "await _ensureAnonymousSession();"
          )
          assert prepared in lookup
          assert lookup.index("mayImplicitlyPrepareOwnerSession(") < lookup.index(prepared)
          assert "deda-explicit-auth-entry-required-no-new-uid" in lookup
          pin_signin = pin.split("  static Future<Map<String, dynamic>> signIn({", 1)[1]
          pin_signin = pin_signin.split("  static Future<void> markCurrentDeviceTrusted(", 1)[0]
          policy = (root / "deda_100431_linked_owner_session_policy.dart").read_text()
          backend = (root / "deda_backend.dart").read_text()
          assert backend.count("DedaLinkedOwnerSessionPolicy.userProviderIdentityMatches(user, cleanKey)") == 1
          assert "DedaLinkedOwnerSessionPolicy.emailMatches(user.email, cleanKey)" not in backend
          main = (root / "main.dart").read_text()
          assert "await _verifiedExistingPinUid(accountKey)" in pin
          assert pin_signin.index("_verifiedExistingPinUid(accountKey)") < pin_signin.index("_provePin(")
          assert "original-pin-uid-changed-before-session-write" in pin_signin
          assert "canOpenExistingPinSessionOnOriginalUid(" in policy
          assert "DedaGoogleSettingsLinkCard(" not in main
          assert "DedaSessionDiagnosticReadOnlyTile(" in main
          diag = (root / "deda_session_diagnostic_readonly_100441.dart").read_text()
          assert "mayOfferDetachedGoogleLink(" in diag
          assert "DedaProbeMatch.differentUid" in diag
          assert not (root / "deda_step1_google_settings_link_100439.dart").exists()
          print("PASS_FULL_100446_ASSEMBLY_NO_GOOGLE_PIN_AND_DIAGNOSTICS")
          PY
          (
            cd "$RUNNER_TEMP/deda-100446-complete-signed-app"
            flutter pub get
            dart analyze --no-fatal-warnings \
              lib/main.dart lib/deda_backend.dart lib/deda_pin_auth.dart \
              lib/deda_100431_linked_owner_session_policy.dart \
              lib/deda_session_diagnostic_readonly_100441.dart
          )
          echo PASS_FULL_100441_ASSEMBLED_DART_ANALYSIS

      - name: No APK, Play, Firebase deploy, or user data changes
        run: echo 'PASS_PRIVATE_QA_ONLY_NO_APK_NO_FIREBASE_NO_PLAY'
