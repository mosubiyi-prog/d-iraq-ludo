name: DEDA Admin Gift Real Recipient Session Compatibility - READ ONLY
on:
  push:
    branches:
      - deda-gift-verify-recipient-friends-safe-2026-10-10
    paths:
      - '.github/workflows/qa-deda-admin-gift-current-session-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe-existing-session-without-user-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Firestore read-only auth
        run: python3 -m pip install --disable-pip-version-check google-auth requests
      - name: Check DEDA registered-owner accountKey and current rotated UID session
        env:
          DEDA_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
          FALLBACK_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.parse,sys
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          raw=os.environ.get('DEDA_SA') or os.environ.get('FALLBACK_SA')
          if not raw:sys.exit('READ_ONLY_BLOCKED: account missing')
          cred=service_account.Credentials.from_service_account_info(json.loads(raw),
            scopes=['https://www.googleapis.com/auth/cloud-platform'])
          sess=AuthorizedSession(cred)
          root='https://firestore.googleapis.com/v1/projects/deda-25b88/databases/(default)/documents'
          def doc(c,key):
              r=sess.get(root+'/'+c+'/'+urllib.parse.quote(key,safe=''),timeout=20)
              if r.status_code==404:return None
              r.raise_for_status()
              return r.json()
          def field(record,key):
              return (record or {}).get('fields',{}).get(key,{}).get('stringValue','')
          ref='@DEDA-AQPYXJ'
          mapping=doc('deda_share_ids',ref)
          if not mapping:sys.exit('MISSING_PUBLIC_SHARE_MAPPING')
          registered=doc('users',field(mapping,'ownerUid'))
          originalKey=field(registered,'accountKey')
          if not originalKey:sys.exit('MISSING_REGISTERED_ACCOUNTKEY')
          query={
            'structuredQuery':{
              'from':[{'collectionId':'users'}],
              'where':{'fieldFilter':{
                'field':{'fieldPath':'sharePersonalId'},
                'op':'EQUAL',
                'value':{'stringValue':ref}}},
              'limit':25,
            }
          }
          # Firestore runQuery uses a read-only RPC transported over POST.
          # It DOES NOT write documents or security rules.
          r=sess.post(root+':runQuery',json=query,timeout=25)
          r.raise_for_status()
          results=r.json()
          candidates=[x['document'] for x in results if 'document' in x]
          good=0
          hasSession=0
          for candidate in candidates:
              uid=candidate.get('name','').split('/')[-1]
              userKey=field(candidate,'accountKey')
              session=doc('deda_sessions',uid) if uid else None
              if session is not None:hasSession+=1
              if session and userKey==originalKey and field(session,'accountKey')==originalKey:
                  good+=1
          print('REAL_PERSONAL_ID_MAPPING: ACTIVE')
          print('MATCHING_USER_RECORDS:',len(candidates))
          print('MATCHING_UID_HAS_A_SESSION:',hasSession>0)
          print('VERIFIED_VALID_ROTATED_SESSION_CANDIDATE:',good>0)
          print('VERIFIED_VALID_ROTATED_SESSION_COUNT:',good)
          print('No UIDs, names, phone numbers, account keys, or documents logged.')
          print('READ ONLY Firestore runQuery + GET; zero production writes.')
          PY
      - name: Never change production
        run: echo 'READ ONLY - no firebase rules deployment or user modification'
