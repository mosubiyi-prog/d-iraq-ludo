name: DEDA Jamal Stage19 Secret Manager read-only callable packaged private QA NO DEPLOY

on:
  push:
    branches:
      - deda-stage19-jamal-alttatbiq-almutakamila-private-2026-10-19
    paths:
      - 'functions/stage19_private/**'
      - 'tools/deda_stage19_pack_readonly_owner100_functions_2026_10_19.js'
      - 'test/deda_stage19_secret_manager_readonly_callable.test.js'
      - '.github/workflows/qa-deda-jamal-stage19-secretmanager-readonly-private-no-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-jamal-stage19-secretmanager-readonly-no-deploy
  cancel-in-progress: true

jobs:
  verify-readonly-secret-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SAFE STOP no live Firebase exports, secrets or owner private names
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 23f3c83da641133db3bac491e53eba9ee1b7e695 -- \
            functions/index.js firestore.rules firebase.json \
            lib/main.dart lib/deda_backend.dart android/ assets/ \
            pubspec.yaml pubspec.lock
          test ! -e functions/stage19_private/runtime
          ! grep -q 'stage19_owner100_readonly_NOT_EXPORTED' functions/index.js
          ! grep -q 'dedaStage19Exclusive100Read' functions/index.js
          ! grep -q 'DEDA_STAGE19_ADMIN100_AES_KEY_B64' functions/index.js
          ! grep -q 'DEDA_STAGE19_ADMIN100_AES_KEY_B64' lib/main.dart
          ! grep -q 'DEDA_100_IDENTIFIERS_BACKUP.json' functions/stage19_private/stage19_owner100_readonly_NOT_EXPORTED.js
          test ! -e functions/stage19_private/DEDA_100_IDENTIFIERS_BACKUP.json
          echo 'PASS: stage19 read-only factory not exported; no production APK/Firebase or key changes'
      - name: Reproduce exact encrypted 100 server bundle in disposable CI
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/stage19_private/stage19_owner100_readonly_NOT_EXPORTED.js
          node --check tools/deda_stage19_pack_readonly_owner100_functions_2026_10_19.js
          node tools/deda_stage19_pack_readonly_owner100_functions_2026_10_19.js
          test -f functions/stage19_private/runtime/catalogs/DEDA_GROUP001_ADMIN100_AES256GCM_2026-10-19.enc.json
          test ! -e functions/stage19_private/runtime/DEDA_STAGE19_ADMIN100_PRIVATE_DECRYPTION_KEY_2026-10-19.txt
          echo 'PASS: canonical encrypted source + audited reader copied into CI runtime only'
      - name: Test secret manager, strict AppCheck, manager revocation and no gift exports
        shell: bash
        run: |
          set -euo pipefail
          node --test test/deda_stage19_secret_manager_readonly_callable.test.js
          echo 'PASS: manager 100 read-only Firebase callable ready for owner review, NOT DEPLOYED'
