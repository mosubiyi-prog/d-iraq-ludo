name: Preflight DEDA 100288 Driver Perspective Only

on:
  push:
    branches:
      - driver-perspective-only-100288-2026-10-06
    paths:
      - '.github/workflows/preflight-100288-driver-perspective-only.yml'
      - 'tools/driver_perspective_only_100288.py'
      - 'tools/validate_driver_perspective_only_100288.py'
      - 'tools/build_100288_driver_perspective_only.sh'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}
    steps:
      - name: Checkout isolated 100288 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Reconstruct, apply focused perspective, validate
        run: DEDA_100288_PREFLIGHT_ONLY=1 bash tools/build_100288_driver_perspective_only.sh
