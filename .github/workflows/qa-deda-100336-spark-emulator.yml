name: DEDA 100336 Spark Firestore Security QA - EMULATOR ONLY
on:
  push:
    branches: [deda-100336-spark-firestore-safe-stage-2026-10-14]
    paths:
      - '.github/workflows/qa-deda-100336-spark-emulator.yml'
      - 'firestore.spark.qa.rules'
      - 'firebase.spark.qa.json'
      - 'functions/tests/deda_spark_firestore_emulator.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-spark-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Stop if real Firebase rules/deployment paths changed
        run: |
          set -euo pipefail
          test -f firestore.spark.qa.rules
          test -f firebase.spark.qa.json
          git diff --quiet 53447fa63593a8e7b432a4db047e90ed5b8fd267 -- firestore.rules firebase.json functions/index.js || {
            echo 'SAFE_STOP: existing live configuration was modified'
            exit 4
          }
          test ! -f build/app/outputs/flutter-apk/app-release.apk
      - name: Install emulator test dependencies
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Verify Spark Firestore transactions and existing users remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --config firebase.spark.qa.json \
            --project demo-deda-spark-100336 --only firestore \
            'node --test functions/tests/deda_spark_firestore_emulator.test.js'
      - name: No prod, no APK, no Cloud Functions check
        run: |
          echo 'SUCCESS: no production account/rule/function mutation; QA isolated.'
