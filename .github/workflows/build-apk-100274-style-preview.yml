name: Build DEDA 100274 Style Preview

on:
  push:
    branches:
      - style-preview-100274-2026-10-05
    paths:
      - '.github/workflows/build-apk-100274-style-preview.yml'

jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-100274]')
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100274 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100274
        run: bash tools/build_100274_style_preview.sh

      - name: Upload APK 100274
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100274-style-preview-apk
          path: build/app/outputs/flutter-apk/app-release.apk
