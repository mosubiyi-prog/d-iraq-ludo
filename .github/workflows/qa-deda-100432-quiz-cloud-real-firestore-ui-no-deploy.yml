name: DEDA 100432 Quiz UI Cloud Saved On Old Phone Restored On New (NO DEPLOY)
on:
  push:
    branches:
      - deda-100432-step2-quiz-cloud-save-restore-private-qa-2026-11-01
    paths:
      - 'lib/deda_100432_quiz_cloud_continuity.dart'
      - 'lib/deda_100430_quiz_ui_hydration.dart'
      - 'test/deda_100432_quiz_cloud_continuity_test.dart'
      - 'test/deda_100432_quiz_cloud_rules_live_emulator.test.cjs'
      - 'tools/deda_100432_stage_live_quiz_rules_no_deploy.py'
      - 'tools/app_stability/account_security/deda_100432_quiz_ui_snapshot.rules.fragment'
      - '.github/workflows/qa-deda-100432-quiz-cloud-real-firestore-ui-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-100432-ui-only
  cancel-in-progress: false
jobs:
  flutter-cloud-transport-and-hydration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.7',channel: stable,cache: false}
      - name: Prove NO automatic app / wallet activation and compile code
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          grep -q "'DEDA_STEP2_QUIZ_CLOUD', defaultValue: false" lib/deda_100432_quiz_cloud_continuity.dart
          ! grep -q 'deda_100432_quiz_cloud_continuity' lib/main.dart
          ! grep -q 'deda_100432_quiz_cloud_continuity' functions/index.js
          flutter pub get
          flutter test test/deda_100432_quiz_cloud_continuity_test.dart --no-pub
          flutter test test/deda_100430_quiz_ui_hydration_test.dart --no-pub
          flutter test test/deda_100431_linked_owner_session_policy_test.dart --no-pub
          dart analyze --no-fatal-warnings lib/deda_100432_quiz_cloud_continuity.dart lib/deda_100430_quiz_ui_hydration.dart
          echo 'PASS_100432_REAL_FLUTTER_CLOUD_QUIZ_IDEMPOTENT_NO_MONEY'
      - name: No release artifact
        run: |
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo 'FLUTTER_QA_ONLY_NO_APK_NO_PLAY'
  exact-live-rules-quiz-only-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEDA_SA_PRIMARY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      DEDA_SA_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GCLOUD_PROJECT: demo-deda-100432-quiz-ui-qa
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Read current published Firebase Rules GET ONLY; add one UI-only match to TEMP candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = demo-deda-100432-quiz-ui-qa
          test "$FIRESTORE_EMULATOR_HOST" = 127.0.0.1:8080
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          python3 -m pip install --quiet --disable-pip-version-check google-auth requests
          python3 tools/deda_100432_stage_live_quiz_rules_no_deploy.py
          echo "DEDA_100432_RULES_PATH=$RUNNER_TEMP/deda-100432-live-quiz-qa.rules" >> "$GITHUB_ENV"
      - name: Prove signed-in same UID can save quiz once and outsider can never steal it
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions install --no-save --no-audit --no-fund \
            firebase@11.10.0 @firebase/rules-unit-testing@4 firebase-tools@14
          env -u DEDA_SA_PRIMARY -u DEDA_SA_FALLBACK \
            functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100432-quiz-ui-qa \
            --config "$RUNNER_TEMP/deda-100432-firestore-emulator.json" --only firestore \
            'node --test test/deda_100432_quiz_cloud_rules_live_emulator.test.cjs'
          echo 'PASS_100432_ACTUAL_FIRESTORE_RULES_UI_OWNER_UID_8_CASES'
      - name: Existing 100408 weekly prizes and admin rights regression on EXACT same rules
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix tests/firestore-rules install --no-save --no-audit --no-fund \
            firebase@11.10.0 @firebase/rules-unit-testing@4
          env -u DEDA_SA_PRIMARY -u DEDA_SA_FALLBACK \
            DEDA_DIRECT_RULES_PATH="$DEDA_100432_RULES_PATH" \
            functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100432-quiz-ui-qa \
            --config "$RUNNER_TEMP/deda-100432-firestore-emulator.json" --only firestore \
            'node --test tests/firestore-rules/weekly-direct-manager-prizes-100408.test.mjs'
          echo 'PASS_100432_LEAGUE_100408_UNMODIFIED'
      - name: Explicit zero production actions
        run: |
          echo 'GET_LIVE_RULES_ONLY_NO_FIREBASE_DEPLOY_NO_FINANCIAL_RESTORE_NO_APK_NO_PLAY'
      - name: Erase temporary live Rules and emulator config
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/deda-100432-live-quiz-qa.rules" \
            "$RUNNER_TEMP/deda-100432-firestore-emulator.json"
