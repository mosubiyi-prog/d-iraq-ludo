name: Deploy DEDA Build 118 Firebase security

on:
  workflow_dispatch:
  push:
    branches:
      - build118-admin-privacy-delete-work-2026-09-24
    paths:
      - .github/workflows/deploy-build118-firebase.yml
      - firestore.rules
      - firestore.indexes.json
      - firebase.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build 118 work
        uses: actions/checkout@v4
        with:
          ref: build118-admin-privacy-delete-work-2026-09-24

      - name: Select Firebase credential
        id: auth
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_DEDA_25B88: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_DEDA_25B88:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_DEDA_25B88" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "mode=service" >> "$GITHUB_OUTPUT"
            echo "path=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_OUTPUT"
          elif [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "mode=service" >> "$GITHUB_OUTPUT"
            echo "path=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_OUTPUT"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "No Firebase deployment credential is configured in GitHub Actions." >&2
            exit 2
          fi

      - name: Validate Firestore index JSON
        run: python3 -m json.tool firestore.indexes.json > /dev/null

      - name: Deploy Firestore rules and indexes with service account
        if: steps.auth.outputs.mode == 'service'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.path }}
        run: |
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules,firestore:indexes \
            --project deda-25b88 \
            --non-interactive

      - name: Deploy Firestore rules and indexes with CI token
        if: steps.auth.outputs.mode == 'token'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project deda-25b88 \
            --token "$FIREBASE_TOKEN" \
            --non-interactive
