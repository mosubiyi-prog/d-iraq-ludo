name: Build DEDA 100279 Level Team Admin Final Fix

on:
  push:
    branches:
      - level-team-admin-final-fix-100279-2026-10-05
    paths:
      - '.github/workflows/build-apk-100279-level-team-admin-final-fix.yml'

jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-100279]')
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100279 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100279
        run: bash tools/build_100279_level_team_admin_final_fix.sh

      - name: Upload APK 100279
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100279-level-team-admin-final-fix-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
