name: Preflight DEDA 100287 Navigation Batch1

on:
  push:
    branches:
      - navigation-polish-driver-mode-100287-2026-10-06
    paths:
      - '.github/workflows/preflight-100287-navigation-batch1.yml'
      - 'tools/preflight_100287_navigation_batch1.sh'
      - 'tools/navigation_batch1_100287.py'
      - 'tools/validate_navigation_batch1_100287.py'

jobs:
  preflight:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout isolated 100287 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Reconstruct proven DEDA 100286
        run: awk '/== Flutter analyzer ==/{exit} {print}' tools/build_100286_navigation_seven_fixes.sh | bash

      - name: Validate pristine DEDA 100286
        run: python3 tools/validate_navigation_seven_fixes_100286.py

      - name: Apply DEDA 100287 navigation batch1
        run: |
          python3 tools/navigation_batch1_100287.py
          dart format lib/main.dart

      - name: Validate DEDA 100287 navigation batch1
        run: python3 tools/validate_navigation_batch1_100287.py

      - name: Flutter analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/deda_team_page.dart lib/admin_pages.dart
