name: DEDA Stage48 ACTUAL LIVE RULES private XP/gifts/phone trust client attacks NO DEPLOY
on:
  push:
    branches:
      - deda-weekly-stage48-live-rules-privileged-task-and-gifts-attack-qa-no-deploy-2026-10-28
    paths:
      - 'tools/app_stability/deda_weekly_stage48_live_rules_privileged_ledger_candidate.py'
      - 'tests/firestore-rules/stage48_live_derived_client_privileged_namespace_attacks.test.mjs'
      - '.github/workflows/qa-deda-weekly-stage48-live-derived-client-attacks-no-deploy.yml'
      - 'docs/DEDA_WEEKLY_STAGE48_LIVE_RULES_CLIENT_TRUST_ATTACKS_CHECKPOINT_2026-10-28.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-stage48-private-live-rules-read-only-attack-qa
  cancel-in-progress: true
jobs:
  actual-live-rules-client-attack-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify NOTHING modified signed original Flutter Android Rules or Cloud Functions
        run: |
          set -euo pipefail
          git diff --quiet 9242c63cf459ea41575bf9c73b718a4958229bed -- \
            lib/ android/ functions/ firestore.rules firebase.json storage.rules \
            pubspec.yaml pubspec.lock \
            tools/app_stability/progress_archive \
            tools/app_stability/100380-baseline.tar.gz \
            tools/app_stability/100380-baseline-manifest.json \
            tools/app_stability/app_package/ \
            tools/restore_deda_stability_baseline.py
          python3 -m py_compile tools/app_stability/deda_weekly_stage48_live_rules_privileged_ledger_candidate.py
          node --check tests/firestore-rules/stage48_live_derived_client_privileged_namespace_attacks.test.mjs
          echo 'Original project untouched: stage48 will READ CURRENT RULES ONLY; no deploy.'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Rules API READ-ONLY tooling and local test libraries
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          npm --prefix tests/firestore-rules install --no-audit --no-fund
      - name: Fetch ACTUALLY DEPLOYED Firebase rules READ ONLY into ephemeral runner temp
        env:
          FIREBASE_SERVICE_ACCOUNT_DEDA_25B88: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
          DEDA_STAGE24_LIVE_RULES_TMPFILE: ${{ runner.temp }}/deda-stage48-live-readonly.rules
        run: |
          set -euo pipefail
          python tools/app_stability/deda_weekly_live_rules_emulator_fetch_stage24.py
          test -s "$DEDA_STAGE24_LIVE_RULES_TMPFILE"
      - name: Build STRICT PRIVATE candidate protecting stage42-47 task proof and prize namespaces
        env:
          DEDA_STAGE48_LIVE_RULES_TMPFILE: ${{ runner.temp }}/deda-stage48-live-readonly.rules
          DEDA_STAGE48_CANDIDATE_RULES_TMPFILE: ${{ runner.temp }}/deda-stage48-candidate-only.rules
        run: |
          set -euo pipefail
          python tools/app_stability/deda_weekly_stage48_live_rules_privileged_ledger_candidate.py
          test -s "$DEDA_STAGE48_CANDIDATE_RULES_TMPFILE"
      - name: ATTACK full live-derived candidate as owner, phone2, GM, outsider, unauth and regress original sharing
        env:
          DEDA_STAGE48_CANDIDATE_RULES_TMPFILE: ${{ runner.temp }}/deda-stage48-candidate-only.rules
          DEDA_STAGE41_CANDIDATE_RULES_TMPFILE: ${{ runner.temp }}/deda-stage48-candidate-only.rules
          DEDA_STAGE24_LIVE_RULES_TMPFILE: ${{ runner.temp }}/deda-stage48-candidate-only.rules
          DEDA_STAGE33_EXPECT_CURRENT_SELF_SHARE_GAP: '0'
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14 emulators:exec --only firestore \
            --project demo-deda-stage48-live-derived-progress-locks \
            "cd tests/firestore-rules && node --test stage48_live_derived_client_privileged_namespace_attacks.test.mjs stage41_canonical_progress_cutover_rules.test.mjs stage33_live_original_share_rules.test.mjs"
          echo 'STAGE48 QA PRIVATE ONLY. New Rules not deployed. Real old APK local progress writes unaffected.'
      - name: Delete ALL retrieved live Rules and temporary candidates (even on failure)
        if: always()
        run: |
          rm -f "${{ runner.temp }}/deda-stage48-live-readonly.rules" \
            "${{ runner.temp }}/deda-stage48-candidate-only.rules"
          echo 'No retrieved Rules uploaded or published; no real user data fetched.'
