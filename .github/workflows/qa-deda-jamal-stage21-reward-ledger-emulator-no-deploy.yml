name: DEDA Jamal Stage21 Verified Reward Ledger Emulator-only NO DEPLOY

on:
  push:
    branches:
      - deda-jamal-stage21-reward-ledger-emulator-only-2026-10-19
    paths:
      - 'tools/deda_jamal_stage21_reward_attestation_emulator_only_2026_10_19.js'
      - 'test/deda_jamal_stage21_reward_ledger_firestore_emulator.test.js'
      - '.github/workflows/qa-deda-jamal-stage21-reward-ledger-emulator-no-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deda-jamal-stage21-emulator-only
  cancel-in-progress: true

jobs:
  protect-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve wallet, published source, app, signing and old phone rewards
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 376306832f9291733bdcc4dce7f46b68817c99c4 -- \
            lib/ android/ assets/ firestore.rules firebase.json \
            functions/ functions/index.js pubspec.yaml pubspec.lock \
            tools/deda_stage18_private_atomic_identifier_checkout_2026_10_19.js \
            tools/deda_intakadha_point13_atomic_id_card_checkout_2026_10_19.js
          ! grep -q 'deda_jamal_stage21_reward_attestation' functions/index.js
          ! grep -q 'dedaStage21Reward' functions/index.js
          node --check tools/deda_jamal_stage21_reward_attestation_emulator_only_2026_10_19.js
          node --check test/deda_jamal_stage21_reward_ledger_firestore_emulator.test.js
          echo 'PASS: stage21 fake HMAC only in tools/ and emulator, no prod writes or sale activation'
  firestore-emulator-verified-reward:
    needs: protect-production
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install throwaway emulator libraries
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Test atomic signed DEMO reward tickets, wallet isolation and race security
        shell: bash
        run: |
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          export GCLOUD_PROJECT=demo-deda-stage21-earned-rewards
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-stage21-earned-rewards --only firestore \
            'node --test test/deda_jamal_stage21_reward_ledger_firestore_emulator.test.js'
          echo 'PASS: no real rewards, ad verification, purchases or deployed callables'
  verified:
    needs: [protect-production, firestore-emulator-verified-reward]
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm no deployment
        run: |
          echo 'PASS Stage21 emulator-only ledger with synthetic proof; real Google AdMob SSV still pending'
