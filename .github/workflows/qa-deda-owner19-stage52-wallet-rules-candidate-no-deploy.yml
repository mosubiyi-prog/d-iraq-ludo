name: DEDA owner19 Stage52 wallet client-debit lockdown CANDIDATE NO DEPLOY
on:
  push:
    branches:
      - deda-100359-19-issues-staged-private-no-deploy-2026-10-19
    paths:
      - 'tools/deda_owner19_stage52_wallet_rules_candidate_OFFLINE_NO_DEPLOY.py'
      - 'test/test_deda_owner19_stage52_wallet_rules_candidate.py'
      - 'test/deda_owner19_stage52_wallet_candidate_firestore_emulator.test.js'
      - '.github/workflows/qa-deda-owner19-stage52-wallet-rules-candidate-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-owner19-stage52-wallet-candidate-no-deploy
  cancel-in-progress: true
jobs:
  isolated-rules-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Production app, wallet rules and source are untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 4c0c3f97ad57e4d754f97cdeec355023cfd38531 -- \
            functions/index.js firestore.rules storage.rules firebase.json \
            lib/main.dart lib/deda_backend.dart lib/deda_social_service.dart \
            tools/deda_intakadha_point13_atomic_id_card_checkout_2026_10_19.js \
            tools/deda_stage18_private_atomic_identifier_checkout_2026_10_19.js \
            android/ server_private/ assets/
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo 'PASS: no production rule, wallet, account, APK or Play changes'
      - name: Create ONLY temporary hardened Firestore candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s test -p 'test_deda_owner19_stage52_wallet_rules_candidate.py'
          python3 tools/deda_owner19_stage52_wallet_rules_candidate_OFFLINE_NO_DEPLOY.py \
            firestore.rules /tmp/deda-owner19-stage52-wallet-candidate.rules
          test -f /tmp/deda-owner19-stage52-wallet-candidate.rules
          echo 'PASS: candidate is NOT deployed or copied over firestore.rules'
  emulator-client-debit-denials:
    needs: isolated-rules-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Temporary test-only Firebase tooling
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Test candidate wallet rules in Firestore emulator ONLY
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/deda_owner19_stage52_wallet_rules_candidate_OFFLINE_NO_DEPLOY.py \
            firestore.rules /tmp/deda-owner19-stage52-wallet-candidate.rules
          export DEDA_STAGE52_RULES_CANDIDATE=/tmp/deda-owner19-stage52-wallet-candidate.rules
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-owner19-stage52-wallet-rules --only firestore \
            'node --test test/deda_owner19_stage52_wallet_candidate_firestore_emulator.test.js'
          echo 'PASS: no mobile client self-credit/debit; gift claim stays valid; NO DEPLOY'
