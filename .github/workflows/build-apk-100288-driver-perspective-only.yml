name: Build DEDA 100288 Driver Perspective Only

on:
  push:
    branches:
      - driver-perspective-only-100288-2026-10-06
    paths:
      - '.github/workflows/build-apk-100288-driver-perspective-only.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100288 perspective branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100288
        run: bash tools/build_100288_driver_perspective_only.sh

      - name: Upload APK 100288
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100288-driver-perspective-only-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
