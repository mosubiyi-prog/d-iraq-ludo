name: DEDA Step2 Profile Restore Private QA
on:
  push:
    branches: [deda-account-recovery-stage2-profile-safe-restore-no-deploy-2026-10-30]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preserve original app and first security gate
        run: git diff --quiet ecc22c7194e1d911c8297ede92cdd78681166409 HEAD -- lib/ android/ firestore.rules firebase.json pubspec.yaml functions/deda_secure_pin_gate_core.js functions/deda_secure_pin_gate.js
      - name: Syntax check
        run: |
          node --check functions/index.js
          node --check functions/deda_safe_profile_restore.js
          node --check functions/deda_safe_profile_restore_core.js
          node --check functions/tests/deda_safe_profile_restore_emulator.test.js
      - name: Baseline PIN and recovery unit tests
        run: |
          node --test tools/app_stability/account_security/secure_pin_gate.test.cjs
          node --test tools/app_stability/account_recovery/step2_safe_profile_restore.test.cjs
  firestore-qa:
    needs: unit-qa
    runs-on: ubuntu-latest
    env:
      GCLOUD_PROJECT: demo-deda-recovery-step2-private
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      DEDA_STEP2_EMULATOR_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix functions install --no-save --no-audit --no-fund firebase@12.3.0 firebase-tools@14
      - name: Local original Firestore Rules and Auth emulator
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('firebase.step2.json',JSON.stringify({firestore:{rules:'firestore.rules'},emulators:{auth:{port:9099},firestore:{port:8080},ui:{enabled:false}}}))"
          functions/node_modules/.bin/firebase emulators:exec --config firebase.step2.json --project demo-deda-recovery-step2-private --only auth,firestore 'node --test functions/tests/deda_safe_profile_restore_emulator.test.js'
