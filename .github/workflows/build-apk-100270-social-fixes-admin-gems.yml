name: Build DEDA 100270 Social Fixes and Admin Gems

on:
  push:
    branches:
      - social-fixes-admin-gems-100270-2026-10-04
    paths:
      - '.github/workflows/build-apk-100270-social-fixes-admin-gems.yml'

jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-100270]')
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100270 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100270
        run: bash tools/build_100270_social_fixes_admin_gems.sh

      - name: Upload APK 100270
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100270-social-fixes-admin-gems-apk
          path: build/app/outputs/flutter-apk/app-release.apk
