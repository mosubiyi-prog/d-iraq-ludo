name: DEDA weekly leaderboard stage6 identity and XP gate QA NO DEPLOY
on:
  push:
    branches: [deda-weekly-leaderboard-stage6-account-receipt-gate-no-deploy-2026-10-27]
    paths:
      - '.github/workflows/qa-deda-weekly-leaderboard-stage6-owner-xp-gate-no-deploy.yml'
      - 'functions/deda_weekly_owner_receipt_gate_NOT_EXPORTED.js'
      - 'functions/tests/deda_weekly_owner_receipt_gate.test.js'
      - 'docs/DEDA_WEEKLY_LEADERBOARD_STAGE6_ACCOUNT_RECEIPT_GATE_2026-10-27.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-stage6-weekly-owner-xp-readonly
  cancel-in-progress: true
jobs:
  future-server-account-and-xp-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard accepted DEDA 100387, level, wallets, rules and rollout
        run: |
          set -euo pipefail
          git diff --quiet a0dd340e8843162ac5fb89784cb54d0be82b23ec -- lib/main.dart lib/deda_backend.dart lib/deda_social_service.dart lib/traffic_quiz_page.dart lib/deda_legacy_progress_capture.dart lib/deda_migrated_progress.dart pubspec.yaml pubspec.lock google-services.json firestore.rules firebase.json functions/index.js functions/package.json tools/app_stability/app_package/prepare.py tools/restore_deda_stability_baseline.py
          python3 - <<'PY'
          from pathlib import Path
          gate=Path('functions/deda_weekly_owner_receipt_gate_NOT_EXPORTED.js').read_text()
          exported=Path('functions/index.js').read_text()
          assert 'deda_weekly_owner_receipt_gate_NOT_EXPORTED' not in exported
          for forbidden in ['runTransaction(', 'tx.set(', 'tx.create(', 'tx.update(', 'db.set(', 'db.update(', 'onCall(', 'onSchedule(', 'getAuth(', 'FieldValue.increment(', 'getFirestore(', 'firebase-admin']:
              assert forbidden not in gate, forbidden
          assert 'deda_weekly_identity_attestations/' in gate
          assert 'deda_weekly_xp_receipts/' in gate
          assert 'client_input_forbidden' in gate
          assert 'levelXpAmount !== XP' in gate
          print('Stage6 read only, no client-submitted score, no wallet/XP writes')
          PY
      - name: Test cross-phone account and server-only XP verification safe gate
        run: node --test functions/tests/deda_weekly_owner_receipt_gate.test.js
      - name: Rerun historical stage3 and stage5 prize/XP shadow regression tests
        run: |
          node --test functions/tests/deda_weekly_leaderboard_shadow_policy.test.js functions/tests/deda_weekly_level_xp_shadow_policy.test.js
      - name: No APK, no production server or Firestore rules mutation
        run: |
          echo 'STAGE6 SOURCE-ONLY CI: NO RELEASE, NO LIVE CREDIT, NO SERVER ACCOUNT MIGRATION.'
