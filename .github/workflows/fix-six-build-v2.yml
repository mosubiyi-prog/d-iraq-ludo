      - name: Verify six features before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          text = Path('lib/main.dart').read_text()
          required = [
              'class NearbyPlacesPage',
              'class DedaFullScreenMapPage',
              'class PlaceDetailsPage',
              'class DedaPlacesStore',
              'class MapReadyPage',
              'searchPlacesByName',
              'getPositionStream',
              'ابدأ الرحلة',
              'onLongPress:',
              'المفضلة',
              'الأماكن الأخيرة',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Missing required six-feature markers: ' + ', '.join(missing))
          near = text[text.index('class NearbyPlacesPage'):text.index('class DedaFullScreenMapPage')]
          forbidden = ['widget.position', 'widget.places', 'widget.categoryIcon', 'widget.initialZoom', 'widget.categoryTitle']
          bad = [item for item in forbidden if item in near]
          if bad:
              raise SystemExit('NearbyPlacesPage still contains misplaced full-screen fields: ' + ', '.join(bad))
          if 'World_Transportation' in text:
              raise SystemExit('Hybrid white-line overlay is still present')
          print('Six-feature structure check passed.')
          PY2

      - name: Commit corrected main.dart
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          if git diff --cached --quiet; then
            echo 'No repair changes to commit.'
          else
            git commit -m 'Fix six-feature map class structure'
            git push origin HEAD:places-v1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Save DEDA source files
        shell: bash
        run: |
          cp lib/main.dart /tmp/main.dart
          cp lib/places_service.dart /tmp/places_service.dart
          cp pubspec.yaml /tmp/pubspec.yaml

      - name: Create Flutter project
        run: flutter create . --org com.diraq.ludo --project-name d_iraq_ludo

      - name: Restore DEDA source files
        shell: bash
        run: |
          cp /tmp/main.dart lib/main.dart
          cp /tmp/places_service.dart lib/places_service.dart
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Add Android permissions
        shell: bash
        run: |
          python3 - <<'PY3'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]
          missing = [p for p in permissions if p not in text]
          if missing:
              pos = text.find('>')
              inserted = '\n' + '\n'.join(f'    {p}' for p in missing) + '\n'
              text = text[:pos + 1] + inserted + text[pos + 1:]
              path.write_text(text)
          PY3

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: d-iraq-ludo-six-features-fixed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
