name: Build DEDA 100283 Road Pulse v2

on:
  push:
    branches:
      - road-pulse-v2-100283-2026-10-06
    paths:
      - '.github/workflows/build-apk-100283-road-pulse-v2.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100283 Road Pulse v2 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100283 Road Pulse v2
        run: bash tools/build_100283_road_pulse_v2.sh

      - name: Upload APK 100283 Road Pulse v2
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100283-road-pulse-v2-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
