name: DEDA Stage64 Owner Place NEW PHONE Recovery REAL Firestore and Flutter NO DEPLOY
on:
  push:
    branches:
      - deda-owner-place-cross-device-recovery-stage64-2026-10-20
    paths:
      - '.github/workflows/qa-deda-stage64-owner-place-new-phone-no-deploy.yml'
      - 'tools/stage_deda_owner_place_cross_device_recovery_stage64.py'
      - 'test/deda_stage64_owner_place_cross_device_firestore_emulator.test.js'
      - 'docs/DEDA_STAGE64_OWNER_PLACE_CROSS_DEVICE_P0_2026-10-20.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-stage64-owner-new-phone-no-deploy
  cancel-in-progress: true
jobs:
  safe-source-and-real-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce no production or user data changes
        run: |
          set -euo pipefail
          git diff --quiet c1a27b297088868d367f3babb2d9218d1b5dd14b -- \
            lib/main.dart lib/deda_backend.dart functions/index.js firestore.rules firebase.json \
            server_private/ android/ assets/ pubspec.yaml
          python3 -m py_compile tools/stage_deda_owner_place_cross_device_recovery_stage64.py
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo 'PASS: no live data/code/rules/publication changed'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Firestore emulator dependencies only
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Verify replacement UID retrieval + owner edit + stranger denial against REAL staged rules
        shell: bash
        run: |
          set -euo pipefail
          export GCLOUD_PROJECT=demo-deda-stage64-owner-place-recovery
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-stage64-owner-place-recovery --only firestore \
            'node --test test/deda_stage64_owner_place_cross_device_firestore_emulator.test.js'
          echo 'PASS real local Firestore rules. Still NOT live deployed rules.'
  reconstructed-flutter-owner-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Reconstruct exact 100359 owner Flutter source without building any APK
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python3 tools/qa_reconstruct_100359_then_stage35_no_apk.py
          bash -e /tmp/deda_100340_play_aab.sh
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
      - name: Inject Stage64 real owner-page restore and check Flutter
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage_deda_owner_place_cross_device_recovery_stage64.py
          dart format lib/deda_backend.dart lib/main.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/deda_backend.dart lib/main.dart
          flutter test test/deda_makani_100337_test.dart
          python3 - <<'PY'
          from pathlib import Path
          m=Path('lib/main.dart').read_text()
          b=Path('lib/deda_backend.dart').read_text()
          s=m[m.index('class _OwnerPlacePageState extends State<OwnerPlacePage> {'):m.index('class DedaPersonalPlace')]
          assert s.count('DedaBackend.recoverPublishedPlaceForSignedInOwner(')==1
          assert s.count('await prefs.setString(_placeIdKey, recoveredId)')==1
          assert '_ownerRecoveryIssue' in s
          assert "_status = 'recovery_blocked';" in s
          assert b.count('STAGE64_CROSS_DEVICE_OWNER_RECOVERY')==1
          assert ".collection('deda_sessions')" in b
          assert "trustedKey != expected" in b
          assert ".where('accountKey', isEqualTo: trustedKey)" in b
          assert ".where('published', isEqualTo: true)" in b
          assert "owner-recovery-ambiguous" in b
          assert "FirebaseAuth.instance.currentUser?.uid != user.uid" in b
          print('PASS: actual generated owner screen recovers known place only with verified account session')
          PY
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          echo 'PASS Stage64 reconstruction only, NO APK, NO server deploy, NO Play'
