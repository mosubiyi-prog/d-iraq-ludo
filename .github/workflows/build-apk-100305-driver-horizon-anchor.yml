name: Build DEDA 100305 Driver Horizon Anchor

on:
  push:
    branches:
      - driver-horizon-anchor-100305-2026-10-07
    paths:
      - '.github/workflows/build-apk-100305-driver-horizon-anchor.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100305 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100305
        run: bash tools/build_100305_driver_horizon_anchor.sh

      - name: Upload APK 100305
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100305-driver-horizon-anchor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
