name: DEDA 100428 Step 2 Full Account Restore INVENTORY (READ ONLY / NO DEPLOY)
on:
  push:
    branches:
      - deda-100428-step2-full-account-inventory-readonly-no-deploy-2026-11-01
    paths:
      - 'functions/deda_full_restore_inventory_core_NOT_EXPORTED.js'
      - 'functions/tests/deda_full_restore_inventory_emulator.test.js'
      - 'docs/DEDA_100428_STEP2_FULL_RESTORE_INVENTORY_READONLY_2026-11-01.md'
      - '.github/workflows/qa-deda-100428-step2-full-inventory-emulator-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-100428-readonly-emulator
  cancel-in-progress: false
jobs:
  full-inventory-readonly-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      GCLOUD_PROJECT: demo-deda-100428-inventory-scan
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Ensure absolutely no production credentials or exported scanner
        shell: bash
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = demo-deda-100428-inventory-scan
          test "$FIRESTORE_EMULATOR_HOST" = 127.0.0.1:8080
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          ! grep -q 'deda_full_restore_inventory_core_NOT_EXPORTED' functions/index.js
          ! grep -q 'exports.dedaFullRestore' functions/index.js
          node --check functions/deda_full_restore_inventory_core_NOT_EXPORTED.js
          node --check functions/tests/deda_full_restore_inventory_emulator.test.js
          grep -q 'safeToRestore:false' functions/deda_full_restore_inventory_core_NOT_EXPORTED.js
          grep -q 'safeToCreditDiamonds:false' functions/deda_full_restore_inventory_core_NOT_EXPORTED.js
          grep -q 'safeToTransferPremiumId:false' functions/deda_full_restore_inventory_core_NOT_EXPORTED.js
          echo 'PASS_100428_INTERNAL_ONLY_NO_CLIENT_EXPOSURE'
      - name: Install only disposable Firebase emulators and core deps
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions install --no-save --no-audit --no-fund firebase-tools@14
          cat > "$RUNNER_TEMP/deda-100428-emulator.json" <<'JSON'
          {
            "firestore": {"rules": "firestore.rules"},
            "emulators": {
              "firestore": {"port": 8080},
              "ui": {"enabled": false},
              "singleProjectMode": true
            }
          }
          JSON
      - name: Run real Firestore original ownership and all 13-domain read-only restoration audit
        shell: bash
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = demo-deda-100428-inventory-scan
          env -u GOOGLE_APPLICATION_CREDENTIALS \
            functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100428-inventory-scan \
            --config "$RUNNER_TEMP/deda-100428-emulator.json" --only firestore \
            'node --test functions/tests/deda_full_restore_inventory_emulator.test.js'
          echo 'PASS_100428_REAL_FIRESTORE_FULL_ACCOUNT_READONLY_NO_RESTORE'
      - name: Verify historical legacy identity / PIN source remains untouched
        shell: bash
        run: |
          set -euo pipefail
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          grep -q "deda_auth_attempts" lib/deda_pin_auth.dart
          grep -q "deda_weekly_direct_weeks" lib/deda_weekly_firestore_direct_bridge_100405.dart
          echo 'NO_PRODUCTION_DOCUMENT_READ_NO_ACCOUNT_OR_WALLET_WRITE_NO_APK_NO_PLAY'
      - name: Delete emulator config
        if: always()
        run: rm -f "$RUNNER_TEMP/deda-100428-emulator.json"
