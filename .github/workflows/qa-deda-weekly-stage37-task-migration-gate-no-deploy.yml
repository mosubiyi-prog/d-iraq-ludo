name: DEDA Stage37 Original Task Reviewed Migration Gate NO DEPLOY
on:
  push:
    branches:
      - deda-weekly-stage37-original-task-migration-gate-no-deploy-2026-10-28
    paths:
      - 'functions/deda_weekly_stage37_reviewed_task_migration_gate_NOT_EXPORTED.js'
      - 'functions/tests/deda_weekly_stage37_reviewed_task_migration_gate.test.js'
      - '.github/workflows/qa-deda-weekly-stage37-task-migration-gate-no-deploy.yml'
      - 'docs/DEDA_WEEKLY_STAGE37_TASK_MIGRATION_GATE_CHECKPOINT_2026-10-28.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-stage37-original-migration-preflight-private
  cancel-in-progress: true
jobs:
  guard-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original app, Firestore, progress archive and balances are untouched
        run: |
          set -euo pipefail
          git diff --quiet 14190fa02ad1abf42746171b514a6103ce90b32f -- \
            lib/ android/ functions/index.js functions/package.json \
            firebase.json firestore.rules storage.rules \
            tools/app_stability/progress_archive pubspec.yaml pubspec.lock
          node --check functions/deda_weekly_stage37_reviewed_task_migration_gate_NOT_EXPORTED.js
          node --check functions/tests/deda_weekly_stage37_reviewed_task_migration_gate.test.js
          node - <<'JS'
          const fs=require('node:fs');
          const live=fs.readFileSync('functions/index.js','utf8');
          if(live.includes('deda_weekly_stage37_reviewed_task_migration_gate'))
            throw Error('Stage37 must NEVER become live Cloud Function');
          const code=fs.readFileSync(
            'functions/deda_weekly_stage37_reviewed_task_migration_gate_NOT_EXPORTED.js','utf8');
          for(const marker of [
            'loadMigratedContext','migration_classification_required',
            'historicallyIncluded','actualLifetimeXpAdded:0',
            'canIssueTaskReceipt:false','canGrantDiamonds:false',
            'private_emulator_only','frozen_source_requires_separate_level_only_verifier'
          ])if(!code.includes(marker))
            throw Error('Stage37 required production blocker missing: '+marker);
          console.log('Source files, original wallets and migration engine protected');
          JS
  original-firestore-and-reviewed-migration:
    needs: guard-original
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GCLOUD_PROJECT: demo-deda-weekly-xp-stage9
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install local Firebase simulator only
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase-tools@14
      - name: Audit original source plus reviewed historic balances in real Firestore Emulator
        run: |
          set -euo pipefail
          functions/node_modules/.bin/firebase emulators:exec \
            --config tools/app_stability/stage30/firebase.json \
            --project demo-deda-weekly-xp-stage9 --only firestore \
            'node --test functions/tests/deda_weekly_stage37_reviewed_task_migration_gate.test.js'
      - name: Existing original migration, receipts, and winner card regressions offline
        run: |
          set -euo pipefail
          env -u GCLOUD_PROJECT -u FIRESTORE_EMULATOR_HOST node --test \
            tools/app_stability/progress_archive/migration-gate.test.cjs \
            tools/app_stability/progress_archive/reconcile-core.test.cjs \
            functions/tests/deda_weekly_stage35_existing_progress_task_bridge.test.js \
            functions/tests/deda_weekly_stage31_frozen_league_winner_card.test.js
  private-complete:
    needs: [guard-original, original-firestore-and-reviewed-migration]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Stage37 read-only source PLUS reviewed legacy-progress cutover preflight only.'
          echo 'No real trusted server claim producer, old phone writer fence or frozen lifetime XP issuance.'
          echo 'No Firestore deploy, no live XP, no diamonds, no APK/AAB/Play.'
