name: Build DEDA 100297 Navigation Polish

on:
  push:
    branches:
      - navigation-polish-100297-2026-10-07
    paths:
      - '.github/workflows/build-apk-100297-navigation-polish.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100297 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100297
        run: bash tools/build_100297_navigation_polish.sh

      - name: Upload APK 100297
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100297-navigation-polish-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
