name: DEDA 100439 GM Winners & Gifts — exact deployed Firestore rules emulator
on:
  push:
    branches:
      - deda-100438-admin-winners-prizes-linked-no-apk-2026-11-06
    paths:
      - '.github/workflows/qa-deda-100439-admin-winners-live-rules-emulator-no-deploy.yml'
      - 'tests/firestore-rules/deda_admin_winners_receipts_100439.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-policy-readback-emulator-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READONLY_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read exact active DEDA Firestore policies to disposable runner; no writes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          obj=json.loads(os.environ['READONLY_SA'])
          assert obj.get('project_id')=='deda-25b88' and obj.get('type')=='service_account'
          credentials=service_account.Credentials.from_service_account_info(
            obj,scopes=['https://www.googleapis.com/auth/cloud-platform'])
          sess=AuthorizedSession(credentials)
          base='https://firebaserules.googleapis.com/v1/'
          release=sess.get(base+'projects/deda-25b88/releases/cloud.firestore',timeout=25)
          assert release.status_code==200,'LIVE_RULES_RELEASE_READ_FAILED'
          ruleset=release.json().get('rulesetName','')
          assert ruleset.startswith('projects/deda-25b88/rulesets/'),'WRONG_PROJECT_RULESET'
          rules=sess.get(base+ruleset,timeout=25)
          assert rules.status_code==200,'LIVE_RULES_CONTENT_READ_FAILED'
          files=rules.json().get('source',{}).get('files',[])
          assert len(files)==1,'MULTIFILE_POLICY_MANUAL_REVIEW'
          content=files[0]['content']
          for required in (
            'match /deda_diamond_gifts/{giftId}',
            'match /deda_diamond_gift_balances/{publicId}',
            'function validGiftClaim(giftId, publicId)',
            'lastClaimGiftId',
            'verifiedDiamondsPersonalOwner',
            "resource.data.status == 'pending'",
            "request.resource.data.status == 'received'",
          ):
            assert required in content,'LIVE_HADAYA_CLAIM_RULE_MISSING:'+required
          target=Path(os.environ['RUNNER_TEMP'])/'deda-weekly-active-firestore.rules'
          target.write_text(content)
          print('PASS_READ_ONLY_LIVE_GIFT_RULE_CONTENT_SHA256='+hashlib.sha256(content.encode()).hexdigest())
          print('NO_LIVE_WALLETS_OR_GIFTS_ACCESSED')
          PY
      - name: Confirm verified GM report can read ranks, frozen reviews, prizes and Hadaya receipts under deployed rules
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests/firestore-rules --no-audit --no-fund
          npm install --prefix tests/firestore-rules --no-audit --no-fund --no-save firebase-tools@14
          export DEDA_LIVE_RULES_PATH="$RUNNER_TEMP/deda-weekly-active-firestore.rules"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          config=Path(os.environ['RUNNER_TEMP'])/'deda-weekly-live-policy-emulator.json'
          config.write_text(json.dumps({'firestore':{'rules':os.environ['DEDA_LIVE_RULES_PATH']}}))
          PY
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-admin-winners-100439 --only firestore \
            --config "$RUNNER_TEMP/deda-weekly-live-policy-emulator.json" \
            'node --test tests/firestore-rules/deda_admin_winners_receipts_100439.test.mjs'
          echo 'PASS_EXACT_LIVE_ADMIN_WEEKLY_WINNERS_PRIZES_READ_ROLE_GATE_EMULATOR'
      - name: No writes anywhere in original DEDA production
        shell: bash
        run: |
          echo 'NO_FIREBASE_DEPLOY_NO_REAL_GIFTS_NO_WALLET_WRITES_NO_APK_NO_PLAY'
