name: DEDA Stage41 actual-live-derived canonical share & migration ledger RULES QA NO DEPLOY
on:
  push:
    branches:
      - deda-weekly-stage41-canonical-recipient-and-progress-rules-qa-no-deploy-2026-10-28
    paths:
      - 'tools/app_stability/deda_weekly_stage41_canonical_progress_rules_candidate.py'
      - 'tests/firestore-rules/stage41_canonical_progress_cutover_rules.test.mjs'
      - '.github/workflows/qa-deda-weekly-stage41-canonical-progress-rules-no-deploy.yml'
      - 'docs/DEDA_WEEKLY_STAGE41_CANONICAL_PROGRESS_RULES_CHECKPOINT_2026-10-28.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-stage41-original-live-rules-candidate-private
  cancel-in-progress: true
jobs:
  actual-live-canonical-client-attack-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard original DEDA, databases, backend and signed-build sources
        run: |
          set -euo pipefail
          git diff --quiet 2637a24a87fc962e936d6309e5e5a42bcdf328f0 -- \
            lib/ android/ functions/ firestore.rules firebase.json storage.rules \
            pubspec.yaml pubspec.lock \
            tools/app_stability/progress_archive \
            tools/app_stability/100380-baseline.tar.gz \
            tools/app_stability/100380-baseline-manifest.json \
            tools/app_stability/app_package/ \
            tools/restore_deda_stability_baseline.py
          python3 -m py_compile tools/app_stability/deda_weekly_stage41_canonical_progress_rules_candidate.py
          node --check tests/firestore-rules/stage41_canonical_progress_cutover_rules.test.mjs
          echo 'Verified original app and all LIVE Rules / Cloud Functions unchanged'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install read-only rules fetch and private emulator test libraries
        run: |
          set -euo pipefail
          python -m pip install --quiet google-auth requests
          npm --prefix tests/firestore-rules install --no-audit --no-fund
      - name: Fetch ACTUAL currently deployed Firebase rules, READ ONLY, no uploads
        env:
          FIREBASE_SERVICE_ACCOUNT_DEDA_25B88: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
          DEDA_STAGE24_LIVE_RULES_TMPFILE: ${{ runner.temp }}/deda-stage41-live-readonly.rules
        run: |
          set -euo pipefail
          python tools/app_stability/deda_weekly_live_rules_emulator_fetch_stage24.py
          test -s "$DEDA_STAGE24_LIVE_RULES_TMPFILE"
      - name: Create canonical distinct-account recipient and protected progress rules PRIVATE candidate
        env:
          DEDA_STAGE41_LIVE_RULES_TMPFILE: ${{ runner.temp }}/deda-stage41-live-readonly.rules
          DEDA_STAGE41_CANDIDATE_RULES_TMPFILE: ${{ runner.temp }}/deda-stage41-candidate-only.rules
        run: |
          set -euo pipefail
          python tools/app_stability/deda_weekly_stage41_canonical_progress_rules_candidate.py
          test -s "$DEDA_STAGE41_CANDIDATE_RULES_TMPFILE"
      - name: Test full LIVE-derived rules against 2 phones, 2 accounts, managers, old client attacks
        env:
          DEDA_STAGE41_CANDIDATE_RULES_TMPFILE: ${{ runner.temp }}/deda-stage41-candidate-only.rules
          DEDA_STAGE24_LIVE_RULES_TMPFILE: ${{ runner.temp }}/deda-stage41-candidate-only.rules
          DEDA_STAGE33_EXPECT_CURRENT_SELF_SHARE_GAP: '0'
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14 emulators:exec --only firestore \
            --project demo-deda-stage41-canonical-progress \
            "cd tests/firestore-rules && node --test stage41_canonical_progress_cutover_rules.test.mjs stage33_live_original_share_rules.test.mjs"
          echo 'Tested candidate, NOT DEPLOYED. Old APK local storage cannot be remotely revoked.'
      - name: Remove all ephemeral real production rules snapshots
        if: always()
        run: |
          rm -f "${{ runner.temp }}/deda-stage41-live-readonly.rules" \
            "${{ runner.temp }}/deda-stage41-candidate-only.rules"
          echo 'No production Rules snapshot published or uploaded'
