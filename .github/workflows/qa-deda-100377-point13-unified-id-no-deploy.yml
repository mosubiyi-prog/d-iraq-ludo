name: DEDA 100377 Point13 Unified ID Source QA NO DEPLOY
on:
  push:
    branches:
      - deda-100377-13-points-sequential-qa-2026-10-22
    paths:
      - '.github/workflows/qa-deda-100377-point13-unified-id-no-deploy.yml'
      - 'lib/deda_100377_point13_unified_identity_projection_staged.dart'
      - 'test/deda_100377_point13_unified_identity_source_test.dart'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-100377-point13-source-only
  cancel-in-progress: true
jobs:
  canonical-versus-active:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Verify original-ID routing and one active-display projection
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/deda_100377_point13_unified_identity_source_test.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos lib/deda_100377_point13_unified_identity_projection_staged.dart
          grep -Fq 'DEDA_100377_UNIFIED_ACTIVE_ID_LIVE' lib/deda_100377_point13_unified_identity_projection_staged.dart
          grep -Fq 'defaultValue: false' lib/deda_100377_point13_unified_identity_projection_staged.dart
          grep -Fq 'String get routeId => canonicalOriginal;' lib/deda_100377_point13_unified_identity_projection_staged.dart
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          git diff --quiet -- android/ firebase.json firestore.rules functions/index.js lib/main.dart
          echo 'PASS Point13 canonical/share ID immutable, public alias rollout OFF, no writes or build'
