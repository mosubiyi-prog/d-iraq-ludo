name: DEDA Point2 Reviewed Account Recovery Private QA (No Deploy)
on:
  push:
    branches:
      - deda-recovery-point2-trusted-progress-reader-private-qa-2026-10-30
  workflow_dispatch:
permissions:
  contents: read
jobs:
  point2-code-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Protect unchanged app and previously verified recovery steps
        run: |
          set -e
          git diff --quiet 84d222007d7336a4f5d3aac329b72436f98ba76a HEAD -- lib/ android/ firestore.rules firebase.json pubspec.yaml functions/deda_secure_pin_gate_core.js functions/deda_safe_profile_restore_core.js functions/deda_recovery_asset_escrow_core.js
      - name: Node syntax validation
        run: |
          node --check functions/deda_recovery_verified_view_core.js
          node --check functions/deda_recovery_verified_view.js
          node --check functions/tests/deda_recovery_verified_view_emulator.test.js
          node --check functions/index.js
      - name: Reviewed legacy progress and asset view regression tests
        run: node --test tools/app_stability/account_recovery/verified_recovery_view.test.cjs
      - name: Explicitly verify App Check enforcement
        run: grep -q 'enforceAppCheck: true' functions/deda_recovery_verified_view.js
  point2-firestore-emulator:
    needs: point2-code-qa
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GCLOUD_PROJECT: demo-deda-recovery-reviewed-view-private
      GOOGLE_CLOUD_PROJECT: demo-deda-recovery-reviewed-view-private
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      DEDA_REVIEWED_RECOVERY_EMULATOR_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install disposable local Firebase test packages
        run: npm --prefix functions install --no-save --no-audit --no-fund firebase@12.3.0 firebase-tools@14
      - name: Read ORIGINAL Firestore rules under local anonymous Auth emulator
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('firebase.reviewed.qa.json',JSON.stringify({firestore:{rules:'firestore.rules'},emulators:{auth:{port:9099},firestore:{port:8080},ui:{enabled:false}}}))"
          functions/node_modules/.bin/firebase emulators:exec --config firebase.reviewed.qa.json --project demo-deda-recovery-reviewed-view-private --only auth,firestore 'node --test functions/tests/deda_recovery_verified_view_emulator.test.js'
