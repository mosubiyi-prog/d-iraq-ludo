name: Enable Daily Tasks Card Sequence Build

on:
  push:
    branches:
      - fix-daily-tasks-card-sequence-2026-10-01
    paths:
      - .github/workflows/enable-daily-tasks-card-sequence-build.yml

permissions:
  contents: write

jobs:
  enable-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: fix-daily-tasks-card-sequence-2026-10-01
          fetch-depth: 0

      - name: Add branch and final-source guard to Build APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build.yml')
          s = p.read_text(encoding='utf-8')

          branch = '      - fix-daily-tasks-card-sequence-2026-10-01\n'
          anchor = '      - points-stage1-code-2026-09-30\n'
          if branch not in s:
              if s.count(anchor) != 1:
                  raise SystemExit(f'branch anchor count={s.count(anchor)}')
              s = s.replace(anchor, anchor + branch, 1)

          guard = r'''      - name: Validate DEDA daily tasks and card sequence in final source
            run: |
              python3 - <<'PY2'
              from pathlib import Path
              s = Path('lib/main.dart').read_text(encoding='utf-8')
              assert "static String currentLocalCycleId([DateTime? value]) {\n    return currentLocalDayId(value);\n  }" in s
              assert "final awardId = 'daily_login|$dayId';" in s
              assert "final awardId = 'task|$cycle|$taskId';" in s
              assert "!awards.containsKey('point_tier_claim|$previousThreshold')" in s
              assert "await _loadOpenedPointTiers();\n    if (!mounted) return;\n\n    final index = _pointTierIndex(threshold);" in s
              stale = "if (previousThreshold != null &&\n        !_claimedPointTiers.contains(previousThreshold))"
              assert stale not in s
              for pair in ('5000: 50', '10000: 100', '15000: 150', '20000: 200', '25000: 250'):
                  assert pair in s
              assert "'points': -threshold" in s
              assert "'points': threshold + bonus" in s
              print('final APK source invariants validated')
              PY2

'''
          if 'Validate DEDA daily tasks and card sequence in final source' not in s:
              marker = '      - name: Build permanently signed APK and AAB\n'
              if s.count(marker) != 1:
                  raise SystemExit(f'build marker count={s.count(marker)}')
              s = s.replace(marker, guard + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify workflow edits
        run: |
          grep -F 'fix-daily-tasks-card-sequence-2026-10-01' .github/workflows/build.yml
          grep -F 'Validate DEDA daily tasks and card sequence in final source' .github/workflows/build.yml

      - name: Commit guarded build workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build.yml
          git diff --cached --quiet && exit 0
          git commit -m "Enable guarded APK build for daily task fixes"
          git push origin HEAD:fix-daily-tasks-card-sequence-2026-10-01
