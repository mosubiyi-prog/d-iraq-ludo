name: DEDA Social Five Approved Points Stage 2 QA - NO DEPLOY

on:
  push:
    branches:
      - social-tasks-stage2-approved-five-2026-10-09
    paths:
      - 'lib/deda_social_task_preview.dart'
      - 'lib/deda_admin_social_task_preview_page.dart'
      - 'lib/deda_admin_task_management_page.dart'
      - 'lib/main.dart'
      - 'test/deda_social_task_preview_test.dart'
      - 'functions/deda_social_task_stage2.js'
      - 'tests/stage2_social/social_policy.test.cjs'
      - '.github/workflows/qa-deda-social-stage2-approved-five.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Guarantee reference app and backend are untouched
        run: |
          git fetch --no-tags origin checkpoint-stage14-general-manager-tasks-review-323-2026-10-09:refs/remotes/origin/checkpoint-stage14-general-manager-tasks-review-323-2026-10-09
          git diff --exit-code origin/checkpoint-stage14-general-manager-tasks-review-323-2026-10-09 -- lib/deda_backend.dart lib/deda_admin_task_drafts.dart lib/deda_daily_task_slots.dart lib/deda_daily_schedule_preview_service.dart functions/index.js functions/deda_daily_task_publisher.js functions/deda_daily_reward_shadow_ledger.js firestore.rules pubspec.yaml android/
          grep -q 'defaultValue: false' lib/deda_social_task_preview.dart
          grep -q 'if (DedaSocialTaskPreview.visible)' lib/main.dart
          ! grep -q 'index == 5 && DedaSocialTaskPreview.visible' lib/main.dart
          grep -q 'socialAdminPreviewOpen' lib/deda_admin_task_management_page.dart
          ! grep -q 'FirebaseFirestore.instance' lib/deda_admin_social_task_preview_page.dart
          ! grep -q 'claimTaskReward' lib/deda_social_task_preview.dart
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze new preview files strictly
        run: flutter analyze lib/deda_social_task_preview.dart lib/deda_admin_social_task_preview_page.dart test/deda_social_task_preview_test.dart
      - name: Check compatibility of historic large source files
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/main.dart lib/deda_admin_task_management_page.dart
      - name: Test preview widgets and unchanged daily slots
        run: |
          flutter test test/deda_social_task_preview_test.dart
          flutter test test/deda_daily_task_slots_test.dart test/deda_admin_task_drafts_test.dart
      - name: Test scheduled midnight, manager-only write and nonpaying reward policy
        run: |
          node --test tests/stage2_social/social_policy.test.cjs
          python3 - <<'SOCIAL_SCOPE'
          from pathlib import Path
          s=Path('lib/main.dart').read_text()
          start=s.index('_dailyLoginCard(),')
          assert s.index('if (DedaSocialTaskPreview.visible)',start) < s.index('final taskId = DedaTaskIds.weekly[index];',start)
          assert s.count('DedaSocialTaskCompactCard(')==1
          assert s.count('final taskId = DedaTaskIds.weekly[index];')==1
          policy=Path('functions/deda_social_task_stage2.js').read_text()
          assert 'live-wallet-ledger-not-ready' in policy
          assert 'rewardsEnabled: false' in policy
          assert 'NO DEPLOY' in Path('.github/workflows/qa-deda-social-stage2-approved-five.yml').read_text()
          print('SOCIAL_STAGE2_SAFE',start)
          SOCIAL_SCOPE
      - name: Assert release remains blocked
        run: |
          test -f scripts/deda_stage13_release_gate.cjs
          node scripts/deda_stage13_release_gate.cjs > /tmp/deda_social_gate.json
          node -e 'const r=require("/tmp/deda_social_gate.json");if(r.productionDeployApproved!==false || r.productionRolloutStatus!=="blocked") process.exit(1); console.log("SOCIAL_PREVIEW_ONLY_NO_DEPLOY")'
