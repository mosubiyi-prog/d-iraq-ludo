name: Build DEDA 100291 Exact 100286 Navigation Restore

on:
  push:
    branches:
      - restore-100286-camera-as-100291-2026-10-07
    paths:
      - '.github/workflows/build-apk-100291-exact-100286-navigation-restore.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout exact 100286 restore branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate exact 100286 behavior as 100291
        run: bash tools/build_100291_exact_100286_navigation_restore.sh

      - name: Upload APK 100291
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100291-exact-100286-navigation-restore-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
