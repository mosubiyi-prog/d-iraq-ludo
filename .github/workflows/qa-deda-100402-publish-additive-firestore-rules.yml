name: DEDA 100402 Deploy Only Emulator-Proven Additive Firestore League Rules
on:
  push:
    branches: [deda-100402-firestore-direct-league-first-apk-2026-10-31]
    paths: ['.github/workflows/qa-deda-100402-publish-additive-firestore-rules.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-100402-additive-firestore-rules-real-project
  cancel-in-progress: false
jobs:
  emulate-live-merged-then-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRIMARY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct only additive score rules against ACTUAL published Firestore policy
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet google-auth requests
          python3 tools/deda_100402_additive_live_rules.py prepare
      - name: Emulator-test exact production merge using two DEDA account fixtures and replay attacks
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests/firestore-rules --no-audit --no-fund --no-save firebase-tools@14
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          export DEDA_DIRECT_RULES_PATH="$RUNNER_TEMP/deda-100402-active-merged.rules"
          tests/firestore-rules/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-weekly-100402-direct --only firestore \
            --config "$RUNNER_TEMP/deda-100402-live-emulator.json" \
            'node --test tests/firestore-rules/weekly-direct-100402.test.mjs'
          echo 'MERGED_LIVE_POLICY_EMULATOR_PASS'
      - name: Confirm production release unchanged before publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/deda_100402_additive_live_rules.py predeploy
      - name: Deploy ONLY the tested additive firestore.rules to original DEDA project
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/deda-100402-sa.json
        run: |
          set -euo pipefail
          tests/firestore-rules/node_modules/.bin/firebase deploy \
            --only firestore:rules \
            --project deda-25b88 \
            --config "$RUNNER_TEMP/deda-100402-live-deploy.json" \
            --non-interactive
      - name: Verify rules actually match emulator-tested production candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/deda_100402_additive_live_rules.py verify
      - name: Destroy temporary cloud credential and policies
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/deda-100402-sa.json" \
            "$RUNNER_TEMP/deda-100402-active-merged.rules" \
            "$RUNNER_TEMP/deda-100402-live-emulator.json" \
            "$RUNNER_TEMP/deda-100402-live-deploy.json" \
            "$RUNNER_TEMP/deda-100402-original-ruleset.txt"
