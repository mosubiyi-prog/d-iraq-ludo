name: DEDA 100434 Verified Original Profile Recovery (PRIVATE QA / NO DEPLOY)
on:
  push:
    branches:
      - deda-100434-step2-verified-original-profile-private-qa-no-deploy-2026-11-01
    paths:
      - 'lib/main.dart'
      - 'lib/deda_100433_owner_confirmation_ui.dart'
      - 'lib/deda_100430_owner_uid_continuity.dart'
      - 'lib/deda_step2_before_uid_link_evidence_checkpoint.dart'
      - 'lib/deda_100431_linked_owner_session_policy.dart'
      - 'lib/deda_step2_original_backup_readback.dart'
      - 'lib/deda_progress_backup_coordinator.dart'
      - 'lib/deda_step2_visual_prefs_continuity.dart'
      - 'lib/deda_step2_assets_readback.dart'
      - 'lib/deda_step2_linked_published_place_recovery.dart'
      - 'lib/deda_step2_owner_place_local_archive.dart'
      - 'lib/deda_step2_owner_place_backup_journal.dart'
      - 'lib/deda_step2_owner_place_draft_hydration.dart'
      - 'lib/deda_step2_friendship_readback.dart'
      - 'lib/deda_step2_full_account_preflight.dart'
      - 'lib/deda_lab_frame_secure_checkout.dart'
      - 'lib/deda_owned_frame_reader.dart'
      - 'tools/app_stability/account_security/deda_step2_original_progress_evidence.rules.fragment'
      - 'tools/deda_100434_stage_live_evidence_rules_no_deploy.py'
      - 'test/deda_step2_original_evidence_rules_live_emulator.test.cjs'
      - 'test/deda_100433_owner_confirmation_ui_test.dart'
      - 'test/deda_100434_recovery_original_profile_test.dart'
      - 'test/deda_100431_linked_owner_session_policy_test.dart'
      - 'test/deda_step2_confirmed_login_downgrade_private_test.dart'
      - 'test/deda_step2_original_backup_readback_test.dart'
      - 'test/deda_step2_original_source_continuity_test.dart'
      - 'test/deda_step2_before_uid_link_evidence_checkpoint_test.dart'
      - 'test/deda_progress_backup_coordinator_test.dart'
      - 'test/deda_step2_visual_prefs_continuity_test.dart'
      - 'test/deda_step2_assets_readback_test.dart'
      - 'test/deda_step2_linked_published_place_recovery_test.dart'
      - 'test/deda_step2_owner_place_local_archive_test.dart'
      - 'test/deda_step2_owner_place_backup_journal_test.dart'
      - 'test/deda_step2_owner_place_draft_hydration_test.dart'
      - 'test/deda_step2_friendship_readback_test.dart'
      - 'test/deda_step2_full_account_preflight_test.dart'
      - 'test/deda_published_place_recovery_test.dart'
      - 'test/deda_owned_frame_reader_test.dart'
      - '.github/workflows/qa-deda-100434-original-profile-restore-private-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-100434-private
  cancel-in-progress: false
jobs:
  flutter-account-confirm-and-new-phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.7',channel: stable,cache: false}
      - name: Safety gate — this code MUST NOT run in ordinary users' APKs
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          grep -q "'DEDA_STEP2_LINKED_OWNER_COMPAT', defaultValue: false" lib/deda_100431_linked_owner_session_policy.dart
          grep -q "DedaOwnerConfirmButton(" lib/main.dart
          grep -q "onPressed: _confirmedSignInBusy" lib/main.dart
          grep -q "? null : _signInToConfirmedAccount" lib/main.dart
          grep -q "verified-original-uid-changed-before-login-commit" lib/main.dart
          grep -q "verified-owner-login-commit-not-saved" lib/main.dart
          grep -q "mayResumeLinkedLocalLogin(" lib/main.dart
          grep -q "mayUseUnverifiedLocalLogin(" lib/main.dart
          grep -q "hasProtectedTargetAccount:" lib/main.dart
          grep -q "protectedAccountKey(" lib/deda_100431_linked_owner_session_policy.dart
          grep -q "linked-owner-requires-verified-login-or-logout" lib/main.dart
          grep -q "verifiedOriginalUid: verifiedUid" lib/main.dart
          grep -q "deda_step2_linked_verified_uid_v1" lib/deda_100431_linked_owner_session_policy.dart
          grep -q "rememberConfirmedOriginalUid(" lib/deda_100433_owner_confirmation_ui.dart
          grep -q "'DEDA_STEP2_PRELINK_LEGACY_SOURCE_CHECKPOINT', defaultValue: false" lib/deda_step2_before_uid_link_evidence_checkpoint.dart
          grep -q "beforeLinkedIdentityTransition:" lib/deda_100433_owner_confirmation_ui.dart
          grep -q "original-uid-changed-before-evidence-checkpoint" lib/deda_100430_owner_uid_continuity.dart
          grep -q "requireNonEmptyEvidence: true" lib/deda_step2_before_uid_link_evidence_checkpoint.dart
          grep -q "verified-original-uid-changed-during-login-commit" lib/main.dart
          grep -q "onPressed: _logout" lib/main.dart
          grep -q "verifiedProfileForLinkedOwner" lib/main.dart
          grep -q "verifiedCanonicalProfile: verifiedName != null" lib/main.dart
          grep -q "if (!verifiedCanonicalProfile)" lib/main.dart
          grep -q "verifiedType: originalProfile.accountType" lib/main.dart
          grep -q "verifiedName: originalProfile.name" lib/main.dart
          grep -q "'DEDA_STEP2_ORIGINAL_EVIDENCE_READBACK', defaultValue: false" lib/deda_step2_original_backup_readback.dart
          grep -q "'DEDA_STEP2_EVIDENCE_CONTINUITY_PILOT', defaultValue: false" lib/deda_step2_original_source_continuity.dart
          grep -q 'requireNonEmptyEvidence: true' lib/deda_step2_original_source_continuity.dart
          grep -q 'if(requireNonEmptyEvidence && !capture.hasAnyLocalRecord)' lib/deda_progress_backup_coordinator.dart
          grep -q "'DEDA_STEP2_VISUAL_PREFS_MIGRATION', defaultValue: false" lib/deda_step2_visual_prefs_continuity.dart
          grep -q "'DEDA_STEP2_ASSETS_READBACK', defaultValue: false" lib/deda_step2_assets_readback.dart
          grep -q "'DEDA_STEP2_LINKED_PUBLISHED_PLACE', defaultValue: false" lib/deda_step2_linked_published_place_recovery.dart
          grep -q "'DEDA_STEP2_OWNER_PLACE_LOCAL_ARCHIVE', defaultValue: false" lib/deda_step2_owner_place_local_archive.dart
          grep -q 'archivePreparedOriginal(' lib/deda_step2_owner_place_local_archive.dart
          grep -q 'DedaStep2OwnerPlacePendingJournal' lib/deda_step2_owner_place_backup_journal.dart
          grep -q "'DEDA_STEP2_OWNER_PLACE_DRAFT_HYDRATION', defaultValue: false" lib/deda_step2_owner_place_draft_hydration.dart
          grep -q 'DedaStep2OwnerPlaceDurableBackup(' lib/deda_100433_owner_confirmation_ui.dart
          grep -q 'DedaStep2OwnerPlaceDraftHydration.firebase()' lib/main.dart
          grep -q "request.auth.token.firebase.sign_in_provider == 'password'" tools/app_stability/account_security/deda_step2_original_progress_evidence.rules.fragment
          python3 - <<'PY'
          from pathlib import Path
          src = Path('lib/deda_100430_owner_uid_continuity.dart').read_text()
          linked = src.split('static Future<String> loginLinkedOriginalUid({',1)[1]
          assert "collection('deda_auth_attempts')" not in linked, 'LINKED_LOGIN_MUST_NOT_STORE_RAW_PIN'
          assert 'signInWithEmailAndPassword' in linked
          assert 'original-linked-auth-proof-lost' in linked
          PY
          ! grep -q 'DEDA_STEP2_OWNER_PLACE_DRAFT_HYDRATION=true' android/app/build.gradle
          grep -q "'DEDA_STEP2_FRIENDSHIP_READBACK', defaultValue: false" lib/deda_step2_friendship_readback.dart
          grep -q "'DEDA_STEP2_FULL_ACCOUNT_PREFLIGHT', defaultValue: false" lib/deda_step2_full_account_preflight.dart
          grep -q 'bool get allowPhoneCutover => false;' lib/deda_step2_full_account_preflight.dart
          ! grep -q 'DEDA_STEP2_FULL_ACCOUNT_PREFLIGHT=true' android/app/build.gradle
          ! grep -q 'DEDA_STEP2_FRIENDSHIP_READBACK=true' android/app/build.gradle
          ! grep -q "DEDA_STEP2_OWNER_PLACE_LOCAL_ARCHIVE=true" android/app/build.gradle
          grep -q "recoverOriginalPublishedPlace(" lib/main.dart
          grep -q "_verifyPublishedPlaceBeforeOwnerControls" lib/main.dart
          test "$(grep -F -c '_verifyPublishedPlaceBeforeOwnerControls(_placeId!)' lib/main.dart)" -eq 2
          grep -q "dedaStep2LinkedPublishedPlaceEnabled && published == null" lib/main.dart
          grep -q "_status = 'recovery_blocked'" lib/main.dart
          ! grep -q "DEDA_STEP2_LINKED_PUBLISHED_PLACE=true" android/app/build.gradle
          grep -q "throw StateError('partial-or-forged-frame-ownership')" lib/deda_lab_frame_secure_checkout.dart
          ! grep -q "DEDA_STEP2_ASSETS_READBACK=true" android/app/build.gradle
          grep -q "saveOriginalPhone(" lib/deda_100433_owner_confirmation_ui.dart
          grep -q "restoreReplacementPhone(" lib/main.dart
          grep -q "DedaPinAuth.accountKeyForPhone(phone)" lib/main.dart
          ! grep -q "DEDA_STEP2_VISUAL_PREFS_MIGRATION=true" android/app/build.gradle
          ! grep -q "DEDA_STEP2_LINKED_OWNER_COMPAT=true" android/app/build.gradle
          ! grep -q "DEDA_STEP2_QUIZ_CLOUD=true" android/app/build.gradle
          echo 'NO_AUTOMATIC_USER_LINK_NO_OLD_ACCOUNT_SIGNOUT_NO_WALLET_TRANSFER'
      - name: Test actual widget, account identity, existing old phone quiz and in-app source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/deda_100433_owner_confirmation_ui_test.dart --no-pub
          flutter test test/deda_100434_recovery_original_profile_test.dart --no-pub
          flutter test test/deda_step2_original_backup_readback_test.dart --no-pub
          flutter test test/deda_step2_original_source_continuity_test.dart --no-pub
          flutter test test/deda_step2_before_uid_link_evidence_checkpoint_test.dart --no-pub
          flutter test test/deda_progress_backup_coordinator_test.dart --no-pub
          flutter test test/deda_step2_visual_prefs_continuity_test.dart --no-pub
          flutter test test/deda_step2_assets_readback_test.dart --no-pub
          flutter test test/deda_step2_linked_published_place_recovery_test.dart --no-pub
          flutter test test/deda_step2_owner_place_local_archive_test.dart --no-pub
          flutter test test/deda_step2_owner_place_backup_journal_test.dart --no-pub
          flutter test test/deda_step2_owner_place_draft_hydration_test.dart --no-pub
          flutter test test/deda_step2_friendship_readback_test.dart --no-pub
          flutter test test/deda_step2_full_account_preflight_test.dart --no-pub
          flutter test test/deda_published_place_recovery_test.dart --no-pub
          flutter test test/deda_owned_frame_reader_test.dart --no-pub
          flutter test test/deda_100377_point01_lab_frame_checkout_contract_test.dart --no-pub
          flutter test test/deda_100431_linked_owner_session_policy_test.dart --no-pub
          # In this isolated command ONLY, turn the otherwise-off private
          # gate on to prove the actual local writer cannot erase a saved UID.
          flutter test --no-pub --dart-define=DEDA_STEP2_LINKED_OWNER_COMPAT=true test/deda_step2_confirmed_login_downgrade_private_test.dart
          flutter test test/deda_100430_quiz_ui_hydration_test.dart --no-pub
          dart analyze --no-fatal-warnings lib/main.dart lib/deda_100433_owner_confirmation_ui.dart lib/deda_pin_auth.dart lib/deda_backend.dart lib/deda_step2_original_backup_readback.dart lib/deda_step2_original_source_continuity.dart lib/deda_progress_backup_coordinator.dart lib/deda_step2_visual_prefs_continuity.dart lib/deda_step2_assets_readback.dart lib/deda_lab_frame_secure_checkout.dart lib/deda_step2_linked_published_place_recovery.dart lib/deda_step2_owner_place_local_archive.dart lib/deda_step2_owner_place_backup_journal.dart lib/deda_step2_owner_place_draft_hydration.dart lib/deda_step2_friendship_readback.dart lib/deda_step2_full_account_preflight.dart
          echo 'PASS_100434_VERIFIED_ORIGINAL_PROFILE_NO_PRODUCTION_DEPLOY'
      - name: Never build a release APK or publish to Play
        run: |
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo 'NO_RELEASE_APK_NO_REAL_FIREBASE_DATA_NO_PLAY_NO_BILLING'
  real-firebase-auth-account-link-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GCLOUD_PROJECT: demo-deda-100430-uid-continuity
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Only demo Firebase Emulator
        shell: bash
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = demo-deda-100430-uid-continuity
          test "$FIREBASE_AUTH_EMULATOR_HOST" = 127.0.0.1:9099
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          npm --prefix functions install --no-save --no-audit --no-fund firebase@11.10.0 firebase-tools@14
          cat > "$RUNNER_TEMP/deda-100433-auth.json" <<'JSON'
          {"emulators":{"auth":{"port":9099},"ui":{"enabled":false},"singleProjectMode":true}}
          JSON
      - name: Preserve original UID; wrong PIN, duplicate number and premium alias fail closed
        shell: bash
        run: |
          set -euo pipefail
          functions/node_modules/.bin/firebase emulators:exec \
            --config "$RUNNER_TEMP/deda-100433-auth.json" \
            --project demo-deda-100430-uid-continuity --only auth \
            'node --test functions/tests/deda_100430_uid_auth_emulator.test.cjs'
          echo 'PASS_100433_ORIGINAL_UID_SAME_ON_NEW_PHONE_NO_CLOUD_FUNCTIONS'
      - name: Remove disposable emulator config
        if: always()
        run: rm -f "$RUNNER_TEMP/deda-100433-auth.json"

  exact-live-rules-evidence-only-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEDA_SA_PRIMARY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDA_25B88 }}
      DEDA_SA_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GCLOUD_PROJECT: demo-deda-100434-original-evidence
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Read current published Firebase Rules GET ONLY; add one UI-only match to TEMP candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = demo-deda-100434-original-evidence
          test "$FIRESTORE_EMULATOR_HOST" = 127.0.0.1:8080
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          python3 -m pip install --quiet --disable-pip-version-check google-auth requests
          python3 tools/deda_100434_stage_live_evidence_rules_no_deploy.py
          echo "DEDA_100434_RULES_PATH=$RUNNER_TEMP/deda-100434-live-evidence-qa.rules" >> "$GITHUB_ENV"
      - name: Prove signed-in same UID can save evidence once and outsider can never steal it
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions install --no-save --no-audit --no-fund \
            firebase@11.10.0 @firebase/rules-unit-testing@4 firebase-tools@14
          env -u DEDA_SA_PRIMARY -u DEDA_SA_FALLBACK \
            functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100434-original-evidence \
            --config "$RUNNER_TEMP/deda-100434-evidence-emulator.json" --only firestore \
            'node --test test/deda_step2_original_evidence_rules_live_emulator.test.cjs'
          echo 'PASS_100434_ACTUAL_FIRESTORE_RULES_UI_OWNER_UID_8_CASES'
      - name: Existing 100408 weekly prizes and admin rights regression on EXACT same rules
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix tests/firestore-rules install --no-save --no-audit --no-fund \
            firebase@11.10.0 @firebase/rules-unit-testing@4
          env -u DEDA_SA_PRIMARY -u DEDA_SA_FALLBACK \
            DEDA_DIRECT_RULES_PATH="$DEDA_100434_RULES_PATH" \
            functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-100434-original-evidence \
            --config "$RUNNER_TEMP/deda-100434-evidence-emulator.json" --only firestore \
            'node --test tests/firestore-rules/weekly-direct-manager-prizes-100408.test.mjs'
          echo 'PASS_100434_LEAGUE_100408_UNMODIFIED'
      - name: Explicit zero production actions
        run: |
          echo 'GET_LIVE_RULES_ONLY_NO_FIREBASE_DEPLOY_NO_FINANCIAL_RESTORE_NO_APK_NO_PLAY'
      - name: Erase temporary live Rules and emulator config
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/deda-100434-live-evidence-qa.rules" \
            "$RUNNER_TEMP/deda-100434-evidence-emulator.json"
