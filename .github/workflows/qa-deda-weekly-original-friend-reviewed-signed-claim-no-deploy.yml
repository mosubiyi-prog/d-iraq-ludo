name: DEDA original friend independently reviewed signed task claim LOCAL ONLY NO DEPLOY
on:
  push:
    branches:
      - deda-weekly-original-friend-reviewed-signed-claim-hold-no-deploy-2026-10-29
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-friend-reviewed-claim-qa
  cancel-in-progress: true
jobs:
  immutable-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original DEDA source and all wallet/progress modules UNCHANGED
        run: |
          set -euo pipefail
          BASE=1b5cea1b5c791de701189fa0a05678921a8c5be8
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE" HEAD >/tmp/changed
          cat /tmp/changed
          while IFS= read -r f; do
            case "$f" in
              functions/deda_weekly_original_friend_reviewed_signed_claim_NOT_EXPORTED.js|\
              functions/tests/deda_weekly_original_friend_reviewed_signed_claim.test.js|\
              .github/workflows/qa-deda-weekly-original-friend-reviewed-signed-claim-no-deploy.yml|\
              docs/DEDA_WEEKLY_ORIGINAL_FRIEND_SIGNED_REVIEW_GATE_2026-10-29.md) ;;
              *) echo "UNAUTHORIZED CHANGE: $f"; exit 1 ;;
            esac
          done </tmp/changed
          git diff --quiet "$BASE" -- lib/ android/ assets/ firestore.rules firebase.json \
            functions/index.js functions/package.json pubspec.yaml pubspec.lock \
            tools/app_stability/ tests/firestore-rules/
          node --check functions/deda_weekly_original_friend_reviewed_signed_claim_NOT_EXPORTED.js
          node --check functions/tests/deda_weekly_original_friend_reviewed_signed_claim.test.js
          ! grep -q 'deda_weekly_original_friend_reviewed_signed_claim_NOT_EXPORTED' functions/index.js
  private-firestore-transaction:
    needs: immutable-original
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GCLOUD_PROJECT: demo-deda-weekly-xp-stage9
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      DEDA_FRIEND_REVIEW_EMULATOR_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install disposable emulator (NO firebase deploy)
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase-tools@14
      - name: Original accepted relation -> server action -> reviewed original baseline -> signed HMAC, ZERO actual credits
        run: |
          set -euo pipefail
          functions/node_modules/.bin/firebase emulators:exec \
            --config tools/app_stability/stage30/firebase.json \
            --project demo-deda-weekly-xp-stage9 --only firestore \
            'node --test functions/tests/deda_weekly_original_friend_reviewed_signed_claim.test.js'
      - name: Hard stop live wallets and app
        run: |
          echo 'QA HMAC signature proves integrity of SYNTHETIC independent review, NOT live XP entitlement.'
          echo 'No real old APK cutover or production PIN ownership verification.'
          echo 'No Firebase production deploy, APK, Play, quiz, real wallet, diamonds, XP or leaderboard writes.'
