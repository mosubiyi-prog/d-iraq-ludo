name: DEDA Stage66 Spark Firestore-only CARD Atomic Purchase NO DEPLOY NO APK
on:
  push:
    branches: [deda-owner20-firestore-only-shop-stage66-no-deploy-2026-10-21]
    paths:
      - '.github/workflows/qa-deda-stage66-spark-card-safe-atomic-no-deploy.yml'
      - 'tools/deda_stage66_firestore_only_card_checkout_candidate_NO_DEPLOY.py'
      - 'test/deda_stage66_firestore_only_spark_card_checkout_emulator.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spark-atomic-card-checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove no changes to production Firestore, real app, catalog or money
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 2587f0cf260e1c9ca1768baa5ccad880fbb1d15c -- \
            functions/index.js firestore.rules firebase.json storage.rules \
            lib/main.dart lib/deda_backend.dart android/ assets/ server_private/ pubspec.yaml
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          python3 -m py_compile tools/deda_stage66_firestore_only_card_checkout_candidate_NO_DEPLOY.py
          echo 'PASS production app, live rules and source untouched'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install local Rules Emulator dependencies only
        run: npm install --prefix functions --no-save --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Build offline candidate and run fixed 5000 diamond real Firestore Rules transactions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/deda_stage66_firestore_only_card_checkout_candidate_NO_DEPLOY.py \
            firestore.rules /tmp/deda-stage66-candidate.rules
          export GCLOUD_PROJECT=demo-deda-stage66-spark-card-only
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          functions/node_modules/.bin/firebase emulators:exec \
            --project demo-deda-stage66-spark-card-only --only firestore \
            'node --test test/deda_stage66_firestore_only_spark_card_checkout_emulator.test.js'
          echo 'PASS Spark prototype ONLY: trusted synthetic gift balance and immutable card receipt; NOT actual user earned diamonds, 10k IDs, manager100 or deployed rules'
