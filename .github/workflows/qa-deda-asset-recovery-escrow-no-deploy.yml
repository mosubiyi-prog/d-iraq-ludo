name: DEDA Asset Recovery Escrow QA - No Deploy
on:
  push:
    branches: [deda-account-recovery-step1-asset-escrow-private-no-deploy-2026-10-30]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asset-escrow-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preserve original DEDA app and production rules
        run: git diff --quiet 59af6375ebec167f402a48652ef6745ab1be0488 HEAD -- lib/ android/ firestore.rules firebase.json pubspec.yaml functions/deda_secure_pin_gate_core.js functions/deda_safe_profile_restore_core.js
      - name: Verify only candidate recovery code was added
        run: |
          node --check functions/deda_recovery_asset_escrow_core.js
          node --check functions/deda_recovery_asset_escrow.js
          node --check functions/index.js
          node --check functions/tests/deda_recovery_asset_escrow_emulator.test.js
      - name: Existing PIN and profile restore regressions
        run: |
          node --test tools/app_stability/account_security/secure_pin_gate.test.cjs
          node --test tools/app_stability/account_recovery/step2_safe_profile_restore.test.cjs
      - name: Immutable escrow, zero credit, spoofing, and conflict tests
        run: node --test tools/app_stability/account_recovery/legacy_asset_escrow.test.cjs
      - name: Ensure App Check is enforced on escrow callable
        run: grep -q 'enforceAppCheck: true' functions/deda_recovery_asset_escrow.js
  real-firebase-emulator:
    needs: asset-escrow-unit
    runs-on: ubuntu-24.04
    env:
      GCLOUD_PROJECT: demo-deda-asset-escrow-private-qa
      GOOGLE_CLOUD_PROJECT: demo-deda-asset-escrow-private-qa
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      DEDA_ASSET_ESCROW_EMULATOR_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install disposable local Firebase tools
        run: npm --prefix functions install --no-save --no-audit --no-fund firebase@12.3.0 firebase-tools@14
      - name: Test real original Rules against two local anonymous phones
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('firebase.asset-qa.json',JSON.stringify({firestore:{rules:'firestore.rules'},emulators:{auth:{port:9099},firestore:{port:8080},ui:{enabled:false}}}))"
          functions/node_modules/.bin/firebase emulators:exec --config firebase.asset-qa.json --project demo-deda-asset-escrow-private-qa --only auth,firestore 'node --test functions/tests/deda_recovery_asset_escrow_emulator.test.js'
