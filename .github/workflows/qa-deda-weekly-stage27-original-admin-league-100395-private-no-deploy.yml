name: DEDA Stage27 ORIGINAL 100395 GM league admin card signed PRIVATE QA NO DEPLOY
on:
  push:
    branches:
      - deda-weekly-stage27-original-admin-league-100395-private-qa-no-deploy-2026-10-28
    paths:
      - '.github/workflows/qa-deda-weekly-stage27-original-admin-league-100395-private-no-deploy.yml'
      - 'tools/app_stability/app_package/bind_weekly_admin_league_stage27.py'
      - 'tools/app_stability/tests/test_weekly_stage27_original_admin_binder.py'
      - 'lib/deda_admin_league_page.dart'
      - 'test/deda_admin_league_page_stage26_test.dart'
      - 'docs/DEDA_WEEKLY_STAGE27_ORIGINAL_ADMIN_LEAGUE_PRIVATE_100395_2026-10-28.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deda-stage27-private-original-100395-only
  cancel-in-progress: true
jobs:
  stage27-safe-source-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify neither original sources nor wallet and server are modified
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 62cea03ba505c8a1987b077a8186e49e787e6c22 -- lib/main.dart lib/admin_pages.dart lib/deda_backend.dart lib/deda_social_service.dart lib/deda_admin_league_page.dart lib/deda_weekly_qa_full_trial.dart functions/index.js firestore.rules firebase.json pubspec.yaml pubspec.lock google-services.json
          python3 -m py_compile tools/app_stability/app_package/bind_weekly_admin_league_stage27.py
          python3 -m unittest discover -s tools/app_stability/tests -p 'test_weekly_stage27_original_admin_binder.py' -v
          python3 -m unittest discover -s tools/app_stability/tests -p 'test_weekly_stage13_original_signed_candidate.py' -v
          python3 -m unittest discover -s tools/app_stability/tests -p 'test_weekly_stage18_original_full_owner_qa.py' -v
          python3 -m unittest discover -s tools/app_stability/tests -p 'test_weekly_stage19_rank_card_tap.py' -v
          node --test functions/tests/deda_weekly_monthly_top10_archive.test.js
          echo "Only a future PRIVATE original-package QA integration, not production."
  stage27-original-signed-private-apk:
    needs: stage27-safe-source-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: mosubiyi-prog/d-iraq-ludo
          run-id: 39948539871
          name: DEDA-100379-OWNER18-PRIVATE-QA
          path: ${{ runner.temp }}/deda-original-reference
      - name: Restore original verified APK source and the complete 100394 private league
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.diraq.ludo --project-name d_iraq_ludo "$RUNNER_TEMP/deda-original-100395"
          python3 tools/app_stability/app_package/prepare.py "$RUNNER_TEMP/deda-original-100395" --variant candidate
          python3 tools/app_stability/app_package/bind_weekly_stage13.py "$RUNNER_TEMP/deda-original-100395"
          python3 tools/app_stability/app_package/bind_active_id_boot_prewarm_stage14.py "$RUNNER_TEMP/deda-original-100395"
          python3 tools/app_stability/app_package/bind_active_id_measured_startup_stage16.py "$RUNNER_TEMP/deda-original-100395"
          python3 tools/app_stability/app_package/bind_weekly_private_trial_stage17.py "$RUNNER_TEMP/deda-original-100395"
          python3 tools/app_stability/app_package/bind_weekly_full_qa_stage18.py "$RUNNER_TEMP/deda-original-100395"
          python3 tools/app_stability/app_package/verify_rank_card_tap_stage19.py "$RUNNER_TEMP/deda-original-100395"
          python3 tools/app_stability/app_package/bind_weekly_admin_league_stage27.py "$RUNNER_TEMP/deda-original-100395"
      - name: Verify genuine administration integration, full Flutter compile and lab regressions
        working-directory: ${{ runner.temp }}/deda-original-100395
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart analyze lib/deda_admin_league_page.dart
          cp "$GITHUB_WORKSPACE/test/deda_admin_league_page_stage26_test.dart" test/
          cp "$GITHUB_WORKSPACE/test/deda_weekly_qa_full_trial_test.dart" test/
          flutter test test/deda_admin_league_page_stage26_test.dart --no-pub
          flutter test test/deda_weekly_qa_full_trial_test.dart --no-pub
          dart run flutter_launcher_icons
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          datafile=Path('internal-build-inputs.json')
          data=json.loads(datafile.read_text())
          assert data['package']=='com.diraq.ludo.d_iraq_ludo'
          assert data['versionCode']==100395
          assert data['weeklyStage13']['realRankingsAvailable'] is False
          assert data['weeklyStage17']['realPrizesCredited'] is False
          assert data['weeklyStage18']['writesFirestore'] is False
          assert data['weeklyStage19']['walletOrXpModified'] is False
          assert data['weeklyStage27']['adminLeagueTileInOriginal'] is True
          assert data['weeklyStage27']['adminGeneralManagerOnly'] is True
          assert data['weeklyStage27']['liveLeagueControlsEnabled'] is False
          assert data['weeklyStage27']['actualPrizePayoutEnabled'] is False
          assert data['weeklyStage27']['writesRealXP'] is False
          assert data['weeklyStage27']['writesRealDiamonds'] is False
          assert data['completeOwnerDelivery'] is False
          assert data['financialRestoreEnabled'] is False
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          assert manifest.read_text().count('ca-app-pub-2512641627784244~4635932278')==1
          data['platformHashes'][str(manifest)]=hashlib.sha256(manifest.read_bytes()).hexdigest()
          datafile.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Restore original official signing key inside private temporary runner
        working-directory: ${{ runner.temp }}/deda-original-100395
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools/restore_signing_key_2026_10_02.py"
          keytool -list -keystore android/app/deda-release.jks -storepass "$DEDA_STORE_PASSWORD" -alias "$DEDA_KEY_ALIAS" >/dev/null
      - name: Compile signed same-package owner-only version 100395 — NEVER DEPLOY
        working-directory: ${{ runner.temp }}/deda-original-100395
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          data=json.loads(Path('internal-build-inputs.json').read_text())
          assert data['versionCode']==100395
          assert data['completeOwnerDelivery'] is False
          assert data['financialRestoreEnabled'] is False
          assert data['weeklyStage27']['privateQaOnly'] is True
          command=['flutter','build','apk','--release','--build-number=100395','--no-pub']
          command += ['--dart-define='+k+'='+str(v).lower() for k,v in data['flags'].items()]
          subprocess.run(command,check=True)
          PY
      - name: Verify original package identity, signer, assets and exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deda-stage27-100395-artifact"
          python3 tools/app_stability/app_package/verify.py             "$RUNNER_TEMP/deda-original-100395"             "$RUNNER_TEMP/deda-original-reference/DEDA-100379-OWNER18-PRIVATE-QA.apk"             --output "$RUNNER_TEMP/deda-stage27-100395-artifact/verification.json"
          cp "$RUNNER_TEMP/deda-original-100395/build/app/outputs/flutter-apk/app-release.apk"             "$RUNNER_TEMP/deda-stage27-100395-artifact/DEDA-100395-GM-LEAGUE-ADMIN-PRIVATE-QA.apk"
          sha256sum "$RUNNER_TEMP/deda-stage27-100395-artifact/DEDA-100395-GM-LEAGUE-ADMIN-PRIVATE-QA.apk"             > "$RUNNER_TEMP/deda-stage27-100395-artifact/SHA256.txt"
          printf '%s\n'             'DEDA signed original-package 100395 for PRIVATE phone and tablet QA only.'             'Adds navy league administration tile ONLY for currently active general manager.'             'Admin page rechecks original backend identity; all league control toggles disabled.'             'Existing 100394 sandbox retained; no real cross-user rankings or diamond payout.'             'No Firebase/rules/Play deployment; no original XP, wallet or user-profile mutations.'             'Test on device and preserve rollback; never bypass Play Protect warnings.'             > "$RUNNER_TEMP/deda-stage27-100395-artifact/READ-ME.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: DEDA-100395-GM-LEAGUE-ADMIN-PRIVATE-QA
          path: |
            ${{ runner.temp }}/deda-stage27-100395-artifact/*.apk
            ${{ runner.temp }}/deda-stage27-100395-artifact/*.json
            ${{ runner.temp }}/deda-stage27-100395-artifact/*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Delete ephemeral signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/deda-original-100395/android/app/deda-release.jks"
