name: DEDA owner19 Stage37 exact source with real compact foils NO APK NO DEPLOY
on:
  push:
    branches:
      - deda-100359-19-issues-staged-private-no-deploy-2026-10-19
    paths:
      - '.github/workflows/qa-deda-100359-stage37-real-source-artwork-no-apk.yml'
      - 'tools/qa_reconstruct_100359_then_stage35_no_apk.py'
      - 'tools/stage_deda_100360_compact_four_real_foils_after_100359.py'
      - 'tools/stage_deda_100360_remove_fake_store_sandbox.py'
      - 'tools/stage_deda_100360_real_admin_foils_on_reconstructed_source.py'
      - 'test/deda_100360_original_shop_and_manager_foils_integration_test.dart'
      - 'tools/stage_deda_100360_verified_group002_only_store.py'
      - 'lib/deda_stage42_verified_sale_panel.dart'
      - 'lib/deda_stage48_verified_active_profile_ink.dart'
      - 'lib/deda_verified_identifier_ink.dart'
      - 'tools/stage_deda_100360_profile_active_ink_after_100359.py'
      - 'test/test_deda_stage48_real_profile_active_ink.py'
      - 'test/deda_owner19_stage48_active_profile_ink_test.dart'
      - 'lib/deda_stage49_verified_share_id_badge.dart'
      - 'tools/stage_deda_100360_share_premium_ink_after_stage48.py'
      - 'test/test_deda_owner19_stage49_original_qr_share.py'
      - 'test/deda_owner19_stage49_verified_share_ink_test.dart'
      - 'tools/stage_deda_100360_friend_visible_ink_after_stage49.py'
      - 'test/test_deda_stage50_friend_ink_source.py'
      - 'lib/deda_stage50_verified_friend_ink_badge.dart'
      - 'test/deda_owner19_stage50_friend_ink_widget_test.dart'
      - 'tools/stage_deda_100360_friend_alias_search_after_stage50.py'
      - 'test/test_deda_stage51_friend_alias_source.py'
      - 'lib/deda_stage51_verified_friend_alias_search.dart'
      - 'test/deda_owner19_stage51_friend_alias_widget_test.dart'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deda-100359-stage37-real-source-no-build
  cancel-in-progress: true
jobs:
  reconstruct-real-store:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prevent any mutation to signed 100359 phone baseline
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet d14e573d1f7f1ab67deff04222aca13c6f928553 -- \
            functions/index.js firestore.rules firebase.json \
            lib/main.dart lib/deda_backend.dart lib/deda_social_service.dart \
            android/ assets/
          # The sole permitted change under server_private/catalogs is the
          # owner-paired ENCRYPTED manifest. Never accept a plaintext catalog,
          # added file, altered key or unexpected encrypted payload.
          manifest="server_private/catalogs/DEDA_GROUP001_ADMIN100_AES256GCM_2026-10-19.enc.json"
          changed="$(git diff --name-only d14e573d1f7f1ab67deff04222aca13c6f928553 -- server_private/catalogs/)"
          test "$changed" = "$manifest"
          test "$(git hash-object "$manifest")" = "d07198ced5c9019d0eb85e99ee94101db52921e3"
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          echo 'PASS: no user/production/app signing changes'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Reconstruct EXACT approved 100359 generated app, prohibit APK compilation
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python3 -m py_compile tools/qa_reconstruct_100359_then_stage35_no_apk.py
          python3 tools/qa_reconstruct_100359_then_stage35_no_apk.py
          bash -e /tmp/deda_100340_play_aab.sh
          grep -q "DEDA_STAGE17_STORE_CARDS_BLUE_OWNED_IDS_2026_10_19" lib/main.dart
          grep -q "DEDA_STAGE31_OWNER_QA_LAUNCH_SANDBOX_ONLY_2026_10_19" lib/main.dart
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          echo 'PASS: actual approved 100359 Flutter UI recreated with NO output APK'
      - name: Apply compact real four-foil preview to reconstructed app and check Flutter
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage_deda_100360_compact_four_real_foils_after_100359.py
          python3 tools/stage_deda_100360_remove_fake_store_sandbox.py
          python3 tools/stage_deda_100360_real_admin_foils_on_reconstructed_source.py
          python3 tools/stage_deda_100360_verified_group002_only_store.py
          python3 -m unittest discover -s test -p 'test_deda_stage48_real_profile_active_ink.py'
          python3 tools/stage_deda_100360_profile_active_ink_after_100359.py
          python3 -m unittest discover -s test -p 'test_deda_owner19_stage49_original_qr_share.py'
          python3 tools/stage_deda_100360_share_premium_ink_after_stage48.py
          python3 -m unittest discover -s test -p 'test_deda_stage50_friend_ink_source.py'
          python3 tools/stage_deda_100360_friend_visible_ink_after_stage49.py
          python3 -m unittest discover -s test -p 'test_deda_stage51_friend_alias_source.py'
          python3 tools/stage_deda_100360_friend_alias_search_after_stage50.py
          dart format lib/main.dart lib/deda_exclusive_ids_admin_page.dart \
            lib/deda_stage48_verified_active_profile_ink.dart lib/deda_verified_identifier_ink.dart \
            lib/deda_stage49_verified_share_id_badge.dart lib/deda_stage50_verified_friend_ink_badge.dart \
            lib/deda_stage51_verified_friend_alias_search.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/deda_exclusive_ids_admin_page.dart \
            lib/deda_stage42_verified_sale_panel.dart lib/deda_stage48_verified_active_profile_ink.dart \
            lib/deda_stage49_verified_share_id_badge.dart lib/deda_stage50_verified_friend_ink_badge.dart \
            lib/deda_stage51_verified_friend_alias_search.dart
          flutter test test/deda_100360_original_shop_and_manager_foils_integration_test.dart \
            test/deda_stage19_exclusive_admin_tile_test.dart \
            test/deda_owner19_stage48_active_profile_ink_test.dart \
            test/deda_owner19_stage46_verified_identifier_ink_test.dart \
            test/deda_owner19_stage49_verified_share_ink_test.dart \
            test/deda_owner19_stage50_friend_ink_widget_test.dart \
            test/deda_owner19_stage51_friend_alias_widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          src=Path('lib/main.dart').read_text()
          assert src.count('DEDA_100360_COMPACT_REAL_FOILS_MERGED_PRICE_AND_ACTION') == 1
          a=src.index('class _DedaIdentifierStorePageState extends State<DedaIdentifierStorePage> {')
          b=src.index('class _DedaProfilePhase2PageState extends State<DedaProfilePhase2Page> {',a)
          shop=src[a:b]
          assert shop.count("DedaPremiumIdCard(") == 1, "four cards must share original renderer"
          assert shop.count("DedaPoint17ShopCardAction(") == 1, "one reusable secure action in row"
          assert "for (final style in DedaPremiumIdCardColor.values)" in shop
          assert "height: 50" in shop, "original 50dp foil was changed"
          assert "DEDA_PREMIUM_IDS_SERVER_LIVE" in src, "server flag lost"
          assert src.count("DEDA_100360_SERVER_VERIFIED_GROUP002_INSTEAD_OF_MOCK_CANDIDATES")==1
          assert "DedaStage42VerifiedSalePanel(" in src
          assert src.count('DEDA_OWNER19_STAGE48_PROFILE_ACTIVE_ID_FIXED_INK_NO_DEPLOY')==1
          assert src.count('DedaStage48ActiveInkProfileSlot(')==1, 'one profile slot only'
          assert src.count('fallback: DedaPoint14VerifiedProfileSlot(')==1, 'original 100359 fallback must be retained'
          assert 'premiumFoil: (verifiedId, lockedColor, copyVerifiedId)' in src
          assert 'onTap: copyVerifiedId' in src, 'copy must follow verified active ID'
          assert src.count('DEDA_OWNER19_STAGE49_ORIGINAL_QR_PLUS_VERIFIED_PREMIUM_INK') == 1
          assert src.count('DedaStage49VerifiedShareIdBadge(') == 1
          assert src.count('DEDA_OWNER19_STAGE50_FRIEND_INK_THREE_PUBLIC_SURFACES_NO_DEPLOY') == 1
          assert src.count('DedaStage50VerifiedFriendInkBadge(') == 3
          assert 'class DedaFriendPublicProfilePage extends StatelessWidget' in src
          assert 'DedaSocialService.findByPublicId(' in src
          assert src.count('DEDA_OWNER19_STAGE51_FRIEND_SEARCH_CANONICAL_ALIAS_NO_DEPLOY') == 1
          assert src.count('DedaStage51FriendSearch.acceptsInput(id)') == 1
          assert src.count('DedaStage51FriendSearch.findByUserInput(id)') == 1
          assert 'DedaSocialService.sendFriendRequest(' in src
          assert "data: id," in src and 'onPressed: _shareDedaId' in src and 'onPressed: _copyDedaId' in src
          assert "DedaOwnerQaSandboxPage()" not in src, "fake purchase lab still reachable"
          manager=Path('lib/deda_exclusive_ids_admin_page.dart').read_text()
          assert "DEDA_100360_ADMIN_USES_ORIGINAL_FOUR_FULL_FOILS" in manager
          assert "DedaPremiumIdCard(" in manager, "GM artwork still fake border"
          print("PASS: REAL 100359 reconstructed source, all four ORIGINAL premium foils and payment gate retained")
          PY
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          test ! -f build/app/outputs/bundle/release/app-release.aab
          echo 'PASS: no signed APK, no Play, no Firebase deploy and no user balances changed'
