name: Build DEDA 100295 Navigation Core Cleanup

on:
  push:
    branches:
      - navigation-core-cleanup-100295-2026-10-07
    paths:
      - '.github/workflows/build-apk-100295-navigation-core-cleanup.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEDA_KEYSTORE_BASE64: ${{ secrets.DEDA_KEYSTORE_BASE64 }}
      DEDA_KEY_ALIAS: ${{ secrets.DEDA_KEY_ALIAS }}
      DEDA_STORE_PASSWORD: ${{ secrets.DEDA_STORE_PASSWORD }}
      DEDA_KEY_PASSWORD: ${{ secrets.DEDA_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated 100295 branch
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Build and validate DEDA 100295 navigation core
        run: bash tools/build_100295_navigation_core_cleanup.sh

      - name: Upload APK 100295
        uses: actions/upload-artifact@v4
        with:
          name: DEDA-100295-navigation-core-cleanup-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

