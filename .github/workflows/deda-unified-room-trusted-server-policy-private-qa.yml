name: DEDA unified room trusted domain planner isolated QA NO GRANTS NO DEPLOY
on:
  push:
    branches: [deda-unified-room-authz-scopes-isolated-qa-2026-11-16]
    paths:
      - 'qa/unified_room_private/trusted_room_scope_service_CANDIDATE_ONLY.cjs'
      - 'qa/unified_room_private/trusted_room_scope_service_CANDIDATE_ONLY.test.cjs'
      - '.github/workflows/deda-unified-room-trusted-server-policy-private-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-trusted-domain-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify no production application, Rules or Firebase Functions changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,pathlib,re
          base='fd8cfd590d0f6703e34d6fe8c6913b091c3468fd'
          changes=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          assert all(x.startswith('qa/unified_room_private/') or (
            x.startswith('.github/workflows/deda-unified-room-') and x.endswith('.yml')
          ) for x in changes), 'SAFETY_STOP_PROTECTED_FILE_CHANGED'
          source=pathlib.Path('qa/unified_room_private/trusted_room_scope_service_CANDIDATE_ONLY.cjs').read_text()
          exported=pathlib.Path('functions/index.js').read_text()
          assert 'trusted_room_scope_service_CANDIDATE_ONLY' not in exported
          for forbidden in (
            'firebase-admin','createCustomToken','signInWithCredential',
            '.set(','.update(','.delete(','.batch(','.runTransaction('
          ):
            assert forbidden not in source, 'SAFETY_STOP_PRIVILEGED_CALL:'+forbidden
          for phrase in ('grantIssued:false','productionAccess:false','canMutate:false','canIssueToken:false'):
            assert phrase in source,'SAFETY_STOP_UNEXPECTED_GRANT:'+phrase
          print('PASS_NO_PRODUCTION_CHANGES_NO_PUBLIC_ENTRY_NO_AUTH_GRANTS')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run trusted fake-backend and per-section negative tests
        run: |
          set -euo pipefail
          node --check qa/unified_room_private/trusted_room_scope_service_CANDIDATE_ONLY.cjs
          node --test \
            qa/unified_room_private/trusted_room_scope_service_CANDIDATE_ONLY.test.cjs \
            qa/unified_room_private/room_scope_review_PRIVATE_NO_GRANT.test.cjs
      - name: State no Firebase credentials, no project writes, no APK/Play
        run: echo "SYNTHETIC_TRUSTED_BACKEND_TEST_ONLY_NO_GRANT_NO_FIREBASE_NO_DEPLOY"
